// :rulekit — the dm.rulekit.* strongly-connected component (dsl, catalog, validate, write, lint, context,
// read, spi) + the bundled operator catalog resource. One artifact, not sub-modularized (the SCC is a
// jdeps fact, PROPOSAL §1b). Kernel-free (root `verifyKitPurity`); the R4 read seam is the
// dm.rulekit.spi.ConditionReadBack port the :adapter backend implements. Published as
// io.github.mbackschat.a12.dm:dmkits-rulekit (MIT).
plugins {
    id 'java-library'
    id 'maven-publish'
}

base { archivesName = 'dmkits-rulekit' }

repositories {
    mavenLocal()
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    // rulekit builds on dm.core and speaks core types across its public API (BoundModel returns ModelIndex,
    // carries core.Severity/Notification/ModelResolver/Verification) → `api`, so a consumer of dmkits-rulekit
    // gets dmkits-core transitively.
    api project(':core')

    // The catalog is a bundled JSON resource parsed at load time; the DSL renderer + validators read JSON.
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'

    // The shared-predicate leaf: A12 laws this kit's builders enforce and the portable checker also reports,
    // stated once. `implementation` rather than `api` on purpose — the predicates decide what a builder
    // refuses, they are not part of what a consumer of dmkits-rulekit calls, and exporting them would make a
    // deliberately tiny leaf a permanent piece of this kit's surface.
    implementation project(':predicates')
}

// Publishing (Stage 4, Package B): io.github.mbackschat.a12.dm:dmkits-rulekit — MIT, kernel-free (its POM
// depends on dmkits-core; the R4 read seam is the ConditionReadBack port a provided backend implements).
publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            artifactId = 'dmkits-rulekit'
            pom {
                name = 'dmkits-rulekit'
                description = 'a12-dmkits — dm.rulekit: the typed rule/computation DSL, EN/DE renderer, operator catalog, validators, and the ConditionReadBack read seam. MIT.'
                rootProject.dmkitsPom(delegate)
            }
        }
    }
}
