// --tests filters a Test task, never its prerequisites. Graph readiness is the last point where all
// command-line filters are known and no unrelated release/doc suite has started (2026-09-08 incident).
gradle.taskGraph.whenReady { graph ->
    // Gradle binds --tests to the task just before it, so `:test :cli:test --tests X` filters :cli:test alone
    // and runs the whole root suite beside it. That cost every filtered root run of one session the full suite,
    // unnoticed because the targeted classes passed among the rest (2026-10-20). A task its build script bounds
    // with its own filter or JUnit tags (`:adapter:perfGateTest`) is a lane meant to run whole, so only a task
    // with no bound at all is refused. A relative path resolves against the root, where `build.sh` invokes;
    // an abbreviated task name goes unmatched, which can only miss a refusal, never invent one.
    def requested = gradle.startParameter.taskRequests.collectMany { request ->
        def names = []
        request.args.eachWithIndex { arg, i ->
            if (!arg.startsWith('-') && (i == 0 || request.args[i - 1] != '--tests')) names << arg
        }
        names
    }
    def requestedTests = graph.allTasks.findAll { task ->
        task instanceof AbstractTestTask && requested.any {
            it.contains(':') ? task.path == (it.startsWith(':') ? it : ':' + it) : task.name == it
        }
    }
    def bounded = { task ->
        !task.filter.includePatterns.isEmpty() || (task instanceof Test
                && task.options instanceof org.gradle.api.tasks.testing.junitplatform.JUnitPlatformOptions
                && !task.options.includeTags.isEmpty())
    }
    def narrowed = requestedTests.findAll { !it.filter.commandLineIncludePatterns.isEmpty() }
    def whole = requestedTests.findAll { it.filter.commandLineIncludePatterns.isEmpty() && !bounded(it) }
    if (!narrowed.isEmpty() && !whole.isEmpty()) {
        throw new GradleException(
                "Gradle binds --tests to the task just before it: ${whole*.path.join(', ')} would run unfiltered " +
                "beside the filtered ${narrowed*.path.join(', ')}. Give each task its own --tests, or run the " +
                "whole suite in an invocation of its own.")
    }
    if (rootProject.hasProperty('fast') || rootProject.hasProperty('rkNativeAgent')) {
        return
    }
    def filtered = graph.allTasks.findAll { task ->
        task instanceof Test && task.name == 'test' && !task.filter.commandLineIncludePatterns.isEmpty()
    }
    if (!filtered.isEmpty()) {
        throw new GradleException(
                "Focused test selection on ${filtered*.path.join(', ')} requires -Pfast: --tests does not " +
                "filter prerequisite suites. Add -Pfast and run any required guard tasks separately by name. " +
                "Native metadata capture (-PrkNativeAgent) deliberately retains its full prerequisite surface.")
    }
}

// A filter that selects nothing must fail, on every test task. A JVM `Test` does ("No tests found for given
// includes"), but Kotlin/JS test tasks ignore `failOnNoMatchingTests`: `:consistency:jsNodeTest --tests
// '*StarBindingContainmentTest'` ran no test and reported SUCCESS, because the JS runner matches the pattern
// against class-and-method names, where the JVM lane matches the class (measured 2026-09-24). Counting the
// root suite covers both kinds of filter, the command line's and a build script's.
allprojects {
    tasks.withType(AbstractTestTask).configureEach { task ->
        def executed = 0L
        task.afterSuite { descriptor, result ->
            if (descriptor.parent == null) {
                executed += result.testCount
            }
        }
        task.doLast {
            def patterns = task.filter.commandLineIncludePatterns + task.filter.includePatterns
            if (!patterns.isEmpty() && executed == 0) {
                throw new GradleException(
                        "${task.path} selected no test for ${patterns}. A Kotlin/JS pattern is matched against " +
                        "class-and-method names, so a class pattern needs a trailing '*'.")
            }
        }
    }
}
