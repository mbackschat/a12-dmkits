        includeTestsMatching 'io.github.mbackschat.a12.dm.rulekit.validate.laws.TemporalFormatVocabularyGuardTest'
    }
    a12Guards.guardInputs(it, [
            'the derived vocabulary': file('docs/TEMPORAL-FORMAT-VOCABULARY.md'),
            // Every registered consumer is read at runtime; undeclared, dropping a format from one would leave
            // this lane UP-TO-DATE and the containment check unrun — the exact staleness the guard exists for.
            'vocabulary consumers'  : files(
                    'adapter/src/test/kotlin/io/github/mbackschat/a12/dm/adapter/laws/TemporalDeclaredFormatGateDiffTest.kt',
                    'interpreter/src/commonTest/kotlin/io/github/mbackschat/a12/dm/interpreter/TemporalDeclaredFormatFormalTest.kt',
                    'src/test/java/io/github/mbackschat/a12/dm/rulekit/validate/laws/TemporalExtractionFormatGateLawsTest.java',
                    'src/test/java/io/github/mbackschat/a12/dm/rulekit/dsl/UntypedTemporalExtractionGateTest.java',
                    'src/test/java/io/github/mbackschat/a12/dm/rulekit/dsl/TemporalFormatComponentsTest.java'),
    ])
}

// The temporal format vocabulary is DERIVED from the kernel, never authored: `dumpTemporalVocabulary` runs the
// guard with `temporalVocabulary.fix=true` so it writes docs/TEMPORAL-FORMAT-VOCABULARY.md instead of asserting
// against it — the same fixer shape as `dumpKitApi` and `:cli:dumpOperatorIndex`. It owns no class of its own.
