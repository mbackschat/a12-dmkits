plugins {
    id 'java-library'
    id 'maven-publish'
    // Pin Kotlin once at the root: Gradle reports independent loads in :adapter and :interpreter as an
    // unsupported configuration that may break the build.
    id 'org.jetbrains.kotlin.jvm' version '2.2.0' apply false
    id 'org.jetbrains.kotlin.multiplatform' version '2.2.0' apply false
}

group = 'io.github.mbackschat.a12.dm'
version = '0.12.0'

// Single-source the shared coordinates (kernel-decoupling Stage 4, PROPOSAL §3a): the published kit modules
// (core/rulekit/modelkit/edit + schemakit) inherit group + version from HERE, so bump-version.sh's
// `^version = ` edit (the line above) stays the one source of truth and every artifact shares the 0.x train.
// The kernel pin + distribution tag stay `ext` on root (the CLI bakes them into version.properties). A
// subproject may override in its own build file (e.g. :interpreter carries its own KMP/npm coordinates).
subprojects {
    group = rootProject.group
    version = rootProject.version
}

// PUBLIC + LOCAL repositories only. The A12 kernel is resolved from the local Maven
// repository (~/.m2), where the dedicated a12-kernel-bootstrap kit publishes it from
// public sources. No private registry is used. See docs/PROJECT-DESIGN.md §19.
repositories {
    mavenLocal()
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// One contract matrix locks the Java reader and portable interpreter reference scanners to the same bilingual
// language profiles. The interpreter generates common JVM/JS test data from this directory; root Java tests read
// the identical resource from their ordinary test classpath.
sourceSets.test.resources.srcDir(
        'interpreter/src/commonTest/resources/reference-remap-profile')

// Ratchet (A12K-3589 / docs/TESTING-SPEC "no deprecated-kernel-API" guardian): a kernel API MARKED FOR REMOVAL
// cannot compile in a kernel-facing compilation. Only the `removal` lint (not `deprecation`) is treated as an
// error, so a new call to a removal-scheduled kernel API fails the build while plain-@Deprecated APIs (incl.
// Jackson's) still compile. See docs/KERNEL-INTEGRATION-NOTES.md "A12K-3589 kernel-API removal surface".
//
// Kernel-decoupling Stage 4: root has NO main source anymore (the kits moved to their own modules), so the
// only kernel-facing compilation left here is compileTestJava — the cross-kit integration tests that keep
// the kernel on the classpath as the oracle (verification unchanged). The ratchet stays on JavaCompile to
// guard THAT compile. The kernel-free kit modules don't compile kernel code, so they carry no ratchet;
// :adapter + :cli keep their own (their main compiles the kernel backend).
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:removal', '-Werror']
}

// `ext` (not `def`) so subprojects can read the pin — the CLI bakes it into version.properties for
// the `--version` / `manifest.version` surface (the kernel this release was built against).
ext.kernelVersion = '30.8.1'
// The A12 Tools distribution that ships this kernel — the human-facing release tag (the kernel semver is
// the machine compatibility key; this is its "A12 Tools <quarter>" label, RELEASE-SPEC). Single source of
// truth: the CLI bakes it into the version surface, and a drift guard pins every README/plugin mention to
// it. Bump it in lockstep with `kernelVersion` (KERNEL-UPGRADE).
ext.a12Distribution = '2025.06-ext5'

dependencies {
    // Root is a PURE AGGREGATOR + the cross-kit integration-test host (kernel-decoupling Stage 4, PROPOSAL
    // §3a, Option 1). It has NO main source; its src/test holds the ~150 cross-cutting tests (they span all
    // four kits + share Fixtures/ModelDrafts), so it depends on every kit at TEST scope. The kits' MAIN is
    // kernel-free (verifyKitPurity) — the kernel lives behind the SPI ports the :adapter backend implements.
    testImplementation project(':core')
    testImplementation project(':rulekit')
    testImplementation project(':modelkit')
    testImplementation project(':edit')
    // The API-surface lock (Set S) dumps all FIVE published kits' public surface, so schemakit joins the
    // test classpath here (root is the cross-kit test host). It is the fifth kit's ONLY appearance at root
    // and stays test-scope — root publishes no jar, so this adds nothing to any consumer's classpath.
    testImplementation project(':schemakit')

    // The kernel stays the oracle in TESTS (verification unchanged). :adapter supplies the real
    // ConsistencyOracle/BackendInfo ServiceLoader providers so the kernel gate actually runs in the
    // kernel-oracle tests (BoundModel.ofJson / RuleValidator.check get KERNEL_CONFIRMED); kernel-md-facade
    // gives the 8 tests that read kernel types directly (IDocumentModel, the serializer) their imports. The
    // non-leaking pattern (PROPOSAL §3a): rootTest → adapterMain → {kit}Main is acyclic.
    testImplementation project(':adapter')
    testImplementation "com.mgmtp.a12.kernel:kernel-md-facade:${kernelVersion}"

    // A few root tests read/emit DM-JSON directly → Jackson at test scope (the kits expose it only as
    // `implementation`, so it is not on their consumers' compile classpath).
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    testImplementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.18.2'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    dependsOn 'docGuardTest'
    dependsOn 'jsonConstructionGuardTest'
    dependsOn 'apiGuardTest'
    dependsOn 'interpreterReleaseGuardTest'
    dependsOn 'catalogProseReviewGuardTest'
    dependsOn 'deliveryGuardTest'
    dependsOn 'releaseGapGuardTest'
    // Repo-file-reading guards run in input-declared dedicated tasks; keep them out of the broad suite so a
    // doc/marker/golden/script-only edit cannot leave a stale-green `test` (TESTING-SPEC "Tests that read
    // repo files at runtime"). Derived from those tasks — see `routeExclusivelyHostedTests`. `dumpKitApi` and
    // `syncDocSnippets` are regenerators over classes `apiGuardTest`/`docGuardTest` already own, and
    // `interpreterReleaseGuardTest` runs its own `releaseGuardTest` source set, so neither owns anything here.
    routeExclusivelyHostedTests(it, ['docGuardTest', 'jsonConstructionGuardTest', 'apiGuardTest',
                                     'catalogProseReviewGuardTest', 'deliveryGuardTest', 'releaseGapGuardTest'],
            ['dumpKitApi'     : 'regenerator over apiGuardTest\'s class — writes the goldens instead of asserting',
             'syncDocSnippets': 'regenerator over docGuardTest\'s class — writes the snippets instead of asserting'])
}

// A12 JSON construction is a ROLE boundary, not a module boundary (API-FINDINGS 103 / IF228): this guard reads
// every production Java/Kotlin source tree that can parse or emit DM-JSON / Document JSON and requires each
// ObjectMapper / default kotlinx Json site to carry an exact, reasoned classification. Its own task gives those
// runtime-read source trees the docGuardTest treatment: a source-only edit re-runs this one guard, not ~150 root
// integration tests, and build-cache reuse cannot leave the enumeration stale.
tasks.register('jsonConstructionGuardTest', Test) {
    description = 'Role-basis allowlist for every production ObjectMapper/default-kotlinx-Json construction.'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching 'io.github.mbackschat.a12.dm.A12JsonConstructionGuardTest'
    }
    guardInputs(it, [
            'core main sources'       : fileTree('core/src/main') { include '**/*.java', '**/*.kt' },
            'modelkit main sources'   : fileTree('modelkit/src/main') { include '**/*.java', '**/*.kt' },
            'rulekit main sources'    : fileTree('rulekit/src/main') { include '**/*.java', '**/*.kt' },
            'edit main sources'       : fileTree('edit/src/main') { include '**/*.java', '**/*.kt' },
            'schemakit main sources'  : fileTree('schemakit/src/main') { include '**/*.java', '**/*.kt' },
            'cli main sources'        : fileTree('cli/src/main') { include '**/*.java', '**/*.kt' },
            'adapter main sources'    : fileTree('adapter/src/main') { include '**/*.java', '**/*.kt' },
            'interpreter commonMain'  : fileTree('interpreter/src/commonMain') { include '**/*.java', '**/*.kt' },
            'interpreter jvmMain'     : fileTree('interpreter/src/jvmMain') { include '**/*.java', '**/*.kt' },
            'interpreter jsMain'      : fileTree('interpreter/src/jsMain') { include '**/*.java', '**/*.kt' },
    ])
}

// CatalogProseReviewGuardTest resolves authored evidence links by scanning test source files across six
// modules/source sets. Those files are not on the root test runtime classpath, so a cited test rename would
// otherwise leave the broad root test task UP-TO-DATE and preserve a false green. Keep the scan in one
// input-declared task: a test-source-only edit reruns this guard, not every root integration test.
tasks.register('catalogProseReviewGuardTest', Test) {
    description = 'Content-bound catalog prose review with every scanned evidence source declared as an input.'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching 'io.github.mbackschat.a12.dm.rulekit.catalog.CatalogProseReviewGuardTest'
    }
    guardInputs(it, [
            'root test evidence'              : fileTree('src/test') { include '**/*.java', '**/*.kt' },
            'adapter test evidence'           : fileTree('adapter/src/test') { include '**/*.java', '**/*.kt' },
            'interpreter commonTest evidence' : fileTree('interpreter/src/commonTest') { include '**/*.java', '**/*.kt' },
            'interpreter jvmTest evidence'    : fileTree('interpreter/src/jvmTest') { include '**/*.java', '**/*.kt' },
            'interpreter jsTest evidence'     : fileTree('interpreter/src/jsTest') { include '**/*.java', '**/*.kt' },
            'cli test evidence'               : fileTree('cli/src/test') { include '**/*.java', '**/*.kt' },
    ])
}

// --- Guard-input non-empty assertion (kernel-decoupling §3b #17, the silent-empty-fileTree class-fix) -----
// A guard task that READS repo files at runtime declares them as `.optional()` fileTree inputs so an edit
// re-runs only that guard. The trap: a moved/renamed folder silently EMPTIES such an input, and the guard
// then goes green while checking NOTHING (a false green that only an expensive probe would ever catch). This
// helper declares the inputs AND adds a doFirst that FAILS LOUDLY when any named tree is empty/missing — so
// every future folder move is caught by a build failure, not a silent pass. Defined on the root project's
// `ext` so `:cli`/`:adapter` reach it as `rootProject.guardInputs(...)` (root configures first). Applies to
// EVERY `.optional()`-fileTree guard (root docGuardTest, cli docGuardTest + semanticsMapGuardTest, adapter
// corpusReplayTest) — the whole class, not just this reorg's moves.
ext.guardInputs = { Test task, Map<String, ?> named ->
    task.inputs.files(named.values().toArray())
        .withPropertyName('guardReadRepoFiles')
        .withPathSensitivity(org.gradle.api.tasks.PathSensitivity.RELATIVE)
        .optional()
    task.doFirst {
        def empty = named.findAll { name, v ->
            (v instanceof File) ? !v.exists() : task.project.files(v).isEmpty()
        }
        if (empty) {
            throw new GradleException(
                "${task.name}: guarded runtime-read input(s) ${empty.keySet()} are EMPTY or MISSING — a moved " +
                "or renamed folder likely silenced this guard while it checked nothing (kernel-decoupling §3b " +
                "#17, the silent-empty-fileTree false-green class). Re-point the guard's fileTree to the moved " +
                "location; a guard must never run against an empty input.")
        }
    }
}

// `guardInputs`' exclusive-ownership counterpart. A guard owning runtime inputs the broad `test` task does not
// declare must run in a DEDICATED task AND be excluded from `test` — and those two lists were kept by hand, so
// they drifted: root's `SourceStatisticsReleaseBoundaryTest` and four cli `docGuardTest` classes were measurably
// executing in BOTH lanes. This derives `test`'s excludes FROM the owning tasks' includes, so the two can no
// longer disagree and adding a class to a guard task removes it from the broad suite in the same edit.
//
// It also closes the trap that ownership creates: `:<module>:test --tests '*AnOwnedClass'` fails as Gradle's bare
// "No tests found for given includes", which names neither the exclusion nor the task that DOES host the class
// (it cost two sessions). Same self-explaining-surface rule the CLI follows — emit the command to run instead.
//
// Only for tasks that own their classes EXCLUSIVELY. `:adapter`'s perf/capture lanes deliberately re-run classes
// the broad suite also runs (`FootprintScenarioFixtureGuardTest` is hosted by two tasks on purpose), so they are
// a different shape and keep their hand-written excludes.
ext.routeExclusivelyHostedTests = { Test broad, List<String> owningTaskNames,
                                    Map<String, String> classifiedNonOwners = [:],
                                    Map<String, String> untracedDuringCapture = [:] ->
    // Fail on an EMPTY derivation, the same silent-empty class `guardInputs` guards for on the input side. Without
    // this the helper can be gutted to yield nothing and every text-matching guard still passes while the owned
    // classes quietly re-enter the broad lane — a cold review demonstrated exactly that mutant surviving.
    def hostByClass = [:]
    owningTaskNames.each { name ->
        def patterns = broad.project.tasks.named(name, Test).get().filter.includePatterns
        if (patterns.isEmpty()) {
            throw new GradleException(
                    "'${name}' is declared an exclusive owner but its filter includes NO test class, so " +
                    "${broad.path} would silently re-run what that lane is supposed to own.")
        }
        patterns.each {
            // Refuse ambiguous ownership rather than last-wins: with two owners the corrective would name
            // whichever was configured last, which can be a REGENERATOR (it writes goldens instead of asserting).
            if (hostByClass.containsKey(it) && hostByClass[it] != name) {
                throw new GradleException(
                        "'${it}' is claimed as exclusively owned by both '${hostByClass[it]}' and '${name}'. " +
                        "Exactly one lane owns a class; classify the other as a non-owner with its reason.")
            }
            hostByClass[it] = name
        }
    }
    // Every Test task that filters classes out of the SAME compiled output must be classified — an owner, or a
    // reasoned non-owner. This is what makes "a new exclusively owning task must be added to the owners list"
    // an enforced invariant rather than a comment; an unclassified lane fails the build naming itself.
    def sharedDirs = broad.testClassesDirs.files
    broad.project.tasks.withType(Test).each { t ->
        if (t.name == broad.name || owningTaskNames.contains(t.name) || classifiedNonOwners.containsKey(t.name)) {
            return
        }
        if (t.filter.includePatterns.isEmpty()) {
            return      // runs its whole source set unfiltered, so it owns no individual class here
        }
        if (t.testClassesDirs.files.intersect(sharedDirs).isEmpty()) {
            return      // a separate source set: its classes cannot run in the broad lane at all
        }
        throw new GradleException(
                "Test task '${t.name}' filters classes out of the same compiled output as ${broad.path} but is " +
                "neither an exclusive owner nor a classified non-owner. Add it to the owners list, or classify " +
                "it with a reason (a regenerator over already-owned classes, or an additive lane the broad " +
                "suite also runs).")
    }
    // The native-image REFLECTION CAPTURE traces this lane only (`-PrkNativeAgent`), and excluding a class that
    // drives the product in-process would shrink the traced surface — the one class CLAUDE.md calls invisible to
    // both the capture and the gate's trip-wire. During a capture the exclusion is therefore not applied at all,
    // so the traced set stays a superset of what it was before this derivation existed. Capture is release-only.
    // NOTE for whoever absorbs a lane's classes here: absorbing the CLASSES without the owning task's RUNTIME
    // INPUTS is a defect, and it shipped once. `publicContractTest` supplies `-Ddmtool.executable`; during a
    // capture its four classes run in this lane, which did not, so all 13 tried to exec the module directory.
    // Two of them additionally drive the CLI IN-PROCESS, so excluding them instead would have silently shrunk
    // the captured metadata — measured: 5 committed entries lost, including the picocli field injections for
    // `rule eval` and `batch`. The traced lane must therefore SUPPLY what it absorbs (see cli/build.gradle).
    // A capture keeps owned classes IN this lane so the traced surface stays whole — but that absorption has
    // TWO failure modes, and both were shipped. Sorted by the only axis that decides them: does the class
    // exercise dmtool's RUNTIME, or build-time tooling?
    //
    //  • runtime → stays IN, and this lane must SUPPLY the owning task's runtime inputs. Omitting them made
    //    13 `publicContractTest` cases exec the module directory; excluding those classes instead loses real
    //    metadata, because two of the four also drive the CLI in-process (measured: 5 entries, among them the
    //    picocli field injections behind `rule eval` and `batch`).
    //  • build tooling → stays OUT, because its traffic is not dmtool reachability. `MutationTailSingleSourceTest`
    //    invokes javac, and tracing it leaked `jdk.compiler` resource bundles into the shipped metadata
    //    (caught by `NativeImageMetadataHygieneTest`, whose message asks for exactly this exclusion).
    //    What makes staying OUT safe is an ENUMERATION, not a metadata diff: the class's only product-facing
    //    reflection is `new CommandLine(new RootCommand())`, which ≥12 classes that remain in this lane also
    //    perform (`CliTestSupport`, `InternalErrorBoundaryTest`, `McpHttpWireTest`, …) and production `Cli`
    //    does too. Measuring "no members lost against the baseline" does NOT establish this and must not be
    //    cited for it — the baseline was itself captured with the class already excluded, so that comparison
    //    is true either way. A cold review caught exactly that non-discriminating basis (2026-08-07).
    def tracingForNativeImage = broad.project.hasProperty('rkNativeAgent')
    untracedDuringCapture.each { name, reason ->
        if (!owningTaskNames.contains(name)) {
            throw new GradleException("'${name}' is classified untraced-during-capture but owns nothing in " +
                    "${broad.path}; the two lists must agree.")
        }
    }
    def buildTooling = hostByClass.findAll { cls, owner -> untracedDuringCapture.containsKey(owner) }.keySet()
    if (tracingForNativeImage) {
        buildTooling.each { broad.filter.excludeTestsMatching(it) }
        // For every lane that stays in, assert its CONFIGURATION-TIME system properties came with it — one
        // second, instead of a 27-minute capture that dies on the first absorbed class.
        //
        // Deliberately narrow, and the narrowness is the honest part: this compares `systemProperties` KEYS
        // only. A task may classify a key in `nativeCaptureNonRuntimeSystemProperties` only when it controls
        // JUnit scheduling rather than test/product inputs. The capture intentionally re-hosts those tests
        // serially, so copying such a property would alter scheduling without adding a reachable product shape.
        // Every classification carries a reason and must name a property the owner actually declares.
        // It does NOT see a property set inside a `doFirst` (root `deliveryGuardTest` does exactly that), a
        // wrong VALUE for a key that is present, a `dependsOn` (the other half of the fix this guard was written
        // for is `dependsOn installDist`, which nothing derives), or an `inputs.file`. Widening it means resolving
        // execution-time state at configuration time, which Gradle does not offer. So: this catches the one
        // failure mode that actually occurred, and the rest of the absorption contract stays the author's job.
        (owningTaskNames - untracedDuringCapture.keySet()).each { name ->
            def owner = broad.project.tasks.named(name, Test).get()
            def classified = owner.extensions.extraProperties.has('nativeCaptureNonRuntimeSystemProperties')
                    ? owner.extensions.extraProperties.get('nativeCaptureNonRuntimeSystemProperties') : [:]
            if (!(classified instanceof Map) || classified.any { key, reason ->
                    !owner.systemProperties.containsKey(key) || !(reason instanceof String) || reason.isBlank()
            }) {
                throw new GradleException(
                        "'${name}' has an invalid nativeCaptureNonRuntimeSystemProperties classification; " +
                        'every row must name one declared system property and give a non-blank reason.')
            }
            def unsupplied = owner.systemProperties.keySet() - broad.systemProperties.keySet() - classified.keySet()
            if (!unsupplied.isEmpty()) {
                throw new GradleException(
                        "-PrkNativeAgent makes ${broad.path} run '${name}''s classes, but ${unsupplied.sort()} " +
                        "is declared on '${name}' and not here. Supply it on the traced lane; do NOT exclude " +
                        "the classes unless they are build tooling — a lane can drive the product in-process " +
                        "as well, and dropping it shrinks the captured metadata silently.")
            }
            if (!classified.isEmpty()) {
                logger.lifecycle("${broad.path}: '${name}' capture re-host omits scheduler-only properties " +
                        "${classified.keySet().sort()} (${classified.values().join('; ')})")
            }
        }
        broad.doFirst {
            logger.lifecycle("${broad.path}: -PrkNativeAgent set — ${hostByClass.size() - buildTooling.size()} " +
                    "exclusively-owned classes stay IN to keep the capture's surface complete; " +
                    "${buildTooling.size()} stay out as build tooling (${untracedDuringCapture.keySet().sort()}).")
        }
    } else {
        hostByClass.keySet().each { broad.filter.excludeTestsMatching(it) }
        // The EFFECT assertion, not a restatement of the wiring: if an owned class actually executes in the broad
        // lane — by any mutation of the derivation above, however written — the lane fails naming the leak. That is
        // what the text-matching guards could not see, and what let five classes double-run unnoticed.
        def leaked = [] as Set
        broad.afterTest { desc, result ->
            if (hostByClass.containsKey(desc.className)) {
                leaked << desc.className
            }
        }
        broad.doLast {
            if (!leaked.isEmpty()) {
                throw new GradleException(
                        "${broad.path} executed ${leaked.size()} class(es) a dedicated lane owns exclusively: " +
                        "${leaked.sort()}. Their runtime inputs are declared on the owning task, not here, so " +
                        "running them in this lane can go up-to-date into a false green.")
            }
        }
    }
    // The root project's path is already ':', so only a subproject needs the separator appended.
    def taskPathPrefix = broad.project.path == ':' ? ':' : broad.project.path + ':'
    // Gradle's `--tests` accepts a trailing `.method`, so probe the pattern with that segment dropped too.
    def matches = { String pattern, String fqcn ->
        def hit = { String p -> fqcn ==~ ('\\Q' + p.replace('*', '\\E.*\\Q') + '\\E') }
        hit(pattern) || (pattern.contains('.') && hit(pattern.substring(0, pattern.lastIndexOf('.'))))
    }
    broad.doFirst {
        if (tracingForNativeImage) {
            return      // nothing was excluded, so there is nothing to reroute
        }
        def patterns = []
        try {
            patterns = new ArrayList(broad.filter.commandLineIncludePatterns)
        } catch (Throwable ignored) {
            return      // internal accessor gone: fall back to Gradle's own message, never break the build
        }
        def misrouted = patterns.isEmpty() ? [:]
                : hostByClass.findAll { fqcn, owner -> patterns.any { matches(it, fqcn) } }
        if (misrouted.isEmpty()) {
            return
        }
        // Stay silent when the patterns still reach something this task can run, so a broad pattern spanning
        // both lanes behaves exactly as before.
        def stillReachable = false
        broad.testClassesDirs.files.findAll { it.isDirectory() }.each { dir ->
            dir.traverse(type: groovy.io.FileType.FILES) { file ->
                if (!file.name.endsWith('.class') || file.name.contains('$')) {
                    return
                }
                def rel = dir.toPath().relativize(file.toPath()).toString().replace(File.separator, '.')
                def fqcn = rel.substring(0, rel.length() - '.class'.length())
                if (!hostByClass.containsKey(fqcn) && patterns.any { matches(it, fqcn) }) {
                    stillReachable = true
                }
            }
        }
        if (!stillReachable) {
            throw new GradleException(
                    "--tests ${patterns} matches only classes ${taskPathPrefix}test deliberately excludes, " +
                    "because a dedicated task owns their runtime inputs. Run that task instead:\n" +
                    misrouted.collect { fqcn, owner ->
                        // Echo the patterns the caller actually typed, so a `.method` selector survives; and no
                        // `-Pfast`, which is only implemented for the adapter lanes.
                        "  ${fqcn}\n      ./build.sh ${taskPathPrefix}${owner} " +
                        patterns.findAll { matches(it, fqcn) }.collect { "--tests '${it}'" }.join(' ')
                    }.join('\n'))
        }
    }
}

tasks.register('deliveryGuardTest', Test) {
    description = 'Input-declared behavioral guards for binary delivery, native independence, and activation.'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching 'io.github.mbackschat.a12.dm.EnsureDmtoolCacheTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.DmtoolLauncherTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.NativeNoJavaSmokeTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.CodexPluginActivationEvidenceTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.SourceStatisticsReleaseBoundaryTest'
    }
    guardInputs(it, [
            'plugin installer'        : file('scripts/ensure-dmtool.sh'),
            'installer self-test'     : file('scripts/selftest-ensure-dmtool.sh'),
            'dmtool launcher'         : file('bin/dmtool'),
            'launcher self-test'      : file('scripts/selftest-dmtool-launcher.sh'),
            'native build contract'   : file('cli/build.gradle'),
            'native no-Java smoke'    : file('scripts/native-no-java-smoke.sh'),
            'Codex activation smoke'  : file('scripts/codex-plugin-activation-smoke.sh'),
            'Codex evidence schema'   : file('scripts/codex-plugin-activation.schema.json'),
            'source statistics'       : file('scripts/update-code-statistics.sh'),
            'dmtool publisher'        : file('scripts/publish-release.sh'),
            'interpreter publisher'   : file('scripts/interpreter-release-publisher-core.sh'),
            'dmtool assembler'        : file('scripts/assemble-release-repo.sh'),
            'interpreter assembler'   : file('scripts/assemble-interpreter-release-repo.sh'),
            'release asset manifest'  : file('scripts/release-assets.sh'),
    ])
    def nativeOutputRelative = providers.provider {
        relativePath(project(':cli').tasks.named('nativeCompile').get().outputFile.get().asFile)
    }
    inputs.property('nativeCompile output path', nativeOutputRelative)
    doFirst {
        systemProperty 'dmtool.nativeOutputRelative', nativeOutputRelative.get()
    }
}

tasks.register('releaseGapGuardTest', Test) {
    description = 'Release blocker proving every derived gap ledger has a drained open section.'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching 'io.github.mbackschat.a12.dm.ReleaseGapBlockerTest'
    }
    guardInputs(it, [
            'release gap checker': file('scripts/check-release-gaps.sh'),
            'gap ledgers'        : fileTree('docs') { include '*-GAPS.md' },
    ])
}

// Root-project guards below read REPO FILES at RUNTIME that Gradle can't infer as test inputs:
// DocSnippetFreshnessTest reads docs/API-GUIDE.md plus raw tagged test sources; a tag-only edit compiles to
// IDENTICAL bytecode, so the live repo test-source denominator is a direct input. DslCatalogBridgeTest reads
// the dsl package's `catalog:<Id>` Javadoc markers, which have the same bytecode-invisible property. Without
// those inputs the plain `test` task can stay up-to-date and skip the very guard the edit needs (the false-green
// trap). BuildPerformancePolicyTest locks the repo-level Gradle cache
// and compiler-memory policies; GateTierWiringTest locks the push/nightly workflow split, persistent Gradle
// cache, and non-cacheable isolated perf launcher chain.
// They run HERE with those files declared as THIS task's inputs; `test` dependsOn this, so CI and a plain
// `:test` always drive all four.
tasks.register('docGuardTest', Test) {
    description = 'Freshness/bridge guards that read repo docs + dsl sources at runtime (split out so such an edit re-runs only these).'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching 'io.github.mbackschat.a12.dm.ApiFindingsNumberingGuardTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.DocSnippetFreshnessTest'
        // ...but not its in-place fixer, which is a TOOL and not a check: `@EnabledIfSystemProperty` makes it
        // report as skipped on every verification run, and a lane carrying a permanent benign skip cannot use
        // `skipped=0` as evidence — a real skip would hide against that baseline. `syncDocSnippets` selects it.
        excludeTestsMatching 'io.github.mbackschat.a12.dm.DocSnippetFreshnessTest.regenerateLockedDocSnippetsFromTheirRunTests'
        includeTestsMatching 'io.github.mbackschat.a12.dm.BuildPerformancePolicyTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.GateTierWiringTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.VersionMentionFreshnessTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.rulekit.catalog.DslCatalogBridgeTest'
    }
    guardInputs(it, [
            'docs/API-GUIDE.md': file('docs/API-GUIDE.md'),
            // Derive from the conventional live test-source layout rather than duplicating the Lock registry's
            // file list. A future module/source lock is covered automatically; linked worktrees and generated
            // outputs are anchored exclusions.
            'canonical snippet test sources': fileTree('.') {
                include '**/src/test/**/*.java', '**/src/test/**/*.kt'
                exclude '.claude/**', '**/build/**'
            },
            // ApiFindingsNumberingGuardTest reads the findings list at runtime: the ordinals are public
            // anchors ("finding N", cited from production sources), so a prose-only edit must re-run it.
            'docs/API-FINDINGS.md': file('docs/API-FINDINGS.md'),
            // VersionMentionFreshnessTest reads each of these at runtime; undeclared, a prose-only edit left
            // the broad `test` task UP-TO-DATE and the drift guard silently unrun.
            'version mentions' : files(
                    'README.md',
                    'plugin/README.md',
                    'plugin/CHANGELOG.md',
                    'plugin/.claude-plugin/plugin.json',
                    'plugin-codex/.codex-plugin/plugin.json',
                    'interpreter/public-release/README.md'),
            'root build'       : file('build.gradle'),
            'cli build'        : file('cli/build.gradle'),
            'Gradle environment': file('scripts/gradle-environment.sh'),
            'gradle.properties': file('gradle.properties'),
            'cache smoke'      : file('scripts/verify-build-cache.sh'),
            'demo verifier'    : file('scripts/verify-demos.sh'),
            'CI workflow'      : file('.github/workflows/ci.yml'),
            'nightly workflow' : file('.github/workflows/nightly-performance.yml'),
            'perf launcher'    : file('scripts/perf.sh'),
            'adapter build'    : file('adapter/build.gradle'),
            'interpreter build': file('interpreter/build.gradle'),
            'native capture'   : file('scripts/capture-native-config.sh'),
            // dsl sources + the operator catalog moved to :rulekit in the Stage-4 module cut.
            'dsl sources'      : fileTree('rulekit/src/main/java/io/github/mbackschat/a12/dm/rulekit/dsl') { include '**/*.java' },
            'operator catalog' : fileTree('rulekit/src/main/resources/catalog')])
}

// --- The public-API surface lock (Set S; RELEASE-SPEC §11, TESTING-SPEC "structural-law guardians") ------
// PublicApiGuardTest reads the committed goldens under `api/` at runtime — Gradle can't infer them as inputs,
// so it runs HERE with `api/` declared as THIS task's inputs (the docGuardTest lane). A golden edit re-runs
// ONLY this guard (never the ~150-test suite) and can't restore from the build cache into a false green; a
// kit's public API changing invalidates the task via the kit classes already on `sourceSets.test.runtimeClasspath`.
// `test` dependsOn this (below), so CI + a plain `:test` always drive it. `guardInputs` (root ext, §3b #17)
// also fails LOUDLY if `api/` goes empty/missing — a moved golden dir can't silence the guard.
tasks.register('apiGuardTest', Test) {
    description = 'Golden-diff visibility lock for the five published kits\' public API (split out so a golden edit re-runs only this).'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching 'io.github.mbackschat.a12.dm.api.PublicApiGuardTest'
    }
    guardInputs(it, ['api goldens': fileTree('api') { include '**/*.api' }])
}

// Its own source set, following the `noBackendTest` precedent above, because these two classes were the
// dominant cost of the whole root lane: 73 s of its 79 s of guard time (11 tests, 2 classes) against 14 s for
// the 1588-test suite they hung off. The cost was pure COUPLING, not work — sharing `sourceSets.test` made
// the compiled root test output (222 classes) their input, so every TDD edit anywhere in root's test tree
// re-ran them, and each run also had to load the kernel-laden test runtime classpath to select 11 tests.
// Both classes are genuinely standalone (JUnit + JDK only, zero project imports), which is what makes the
// split safe; their sibling guards are NOT (`CatalogProseReviewGuardTest` reads `OperatorCatalog`), so this
// is deliberately not applied estate-wide. The declared `guardInputs` below are unchanged and remain the
// real trigger.
sourceSets {
    releaseGuardTest
}
dependencies {
    releaseGuardTestImplementation platform('org.junit:junit-bom:5.11.4')
    releaseGuardTestImplementation 'org.junit.jupiter:junit-jupiter'
    releaseGuardTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
