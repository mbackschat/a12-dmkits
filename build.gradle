plugins {
    id 'java-library'
}

group = 'io.github.mbackschat.a12.dm'
version = '0.8.2'

// PUBLIC + LOCAL repositories only. The A12 kernel is resolved from the local Maven
// repository (~/.m2), where the dedicated a12-kernel-bootstrap kit publishes it from
// public sources. No private registry is used. See docs/PROJECT-DESIGN.md §19.
repositories {
    mavenLocal()
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Ratchet (A12K-3589 / docs/TESTING-SPEC "no deprecated-kernel-API" guardian): a kernel API MARKED FOR REMOVAL
// cannot compile in a kernel-facing compilation. Only the `removal` lint (not `deprecation`) is treated as an
// error, so a new call to a removal-scheduled kernel API fails the build while plain-@Deprecated APIs (incl.
// Jackson's) still compile. See docs/KERNEL-INTEGRATION-NOTES.md "A12K-3589 kernel-API removal surface".
//
// Kernel-decoupling stage 3: the KITS' MAIN source is now kernel-free (zero com.mgmtp — held by
// verifyKitPurity), so compileJava faces no kernel API and the ratchet is a no-op there. It still guards
// compileTestJava, where the kernel-oracle tests keep the kernel on the classpath (the kernel stays the
// oracle in every test — verification unchanged). Left on withType(JavaCompile) so that test coverage holds.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:removal', '-Werror']
}

// `ext` (not `def`) so subprojects can read the pin — the CLI bakes it into version.properties for
// the `--version` / `manifest.version` surface (the kernel this release was built against).
ext.kernelVersion = '30.8.1'
// The A12 Tools distribution that ships this kernel — the human-facing release tag (the kernel semver is
// the machine compatibility key; this is its "A12 Tools <quarter>" label, RELEASE-SPEC). Single source of
// truth: the CLI bakes it into the version surface, and a drift guard pins every README/plugin mention to
// it. Bump it in lockstep with `kernelVersion` (KERNEL-UPGRADE).
ext.a12Distribution = '2025.06-ext5'

dependencies {
    // Kernel-decoupling stage 3 (the decisive cut): the kits' MAIN source imports ZERO com.mgmtp — the
    // kernel lives behind narrow SPI ports (dm.core.spi.*, dm.rulekit.spi.*) that the :adapter backend
    // implements + registers via ServiceLoader. So there is NO kernel dependency in the kits' compile
    // classpath anymore; the old `api kernel-md-facade` edge is deleted. This is what unblocks the
    // Maven-Central publish (RELEASE-SPEC §8/§11). verifyKitPurity fails the build on any kernel import.

    // The operator catalog (PROJECT-DESIGN §9) is a bundled JSON resource parsed at load time.
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    // YAML reader for the workspace `roles.yaml` access-control config (FEATURE-GAPS R3). Parsed as a
    // Jackson tree (no reflective POJO binding), the same tree-walking style as ModelDocument's DM-JSON read.
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.18.2'

    // modelkit (the structure builder) now lives in this module's `dm.modelkit` package (folded in
    // 2026-06-09 — D10 superseded). Its dogfood fixtures (ModelDrafts) + tests are in this project's
    // test set; the `dm.modelkit ⊥ dm.rulekit` boundary is held by `SiblingBoundaryTest`.

    // The kernel stays the oracle in TESTS (kernel-decoupling: verification unchanged). Test scope only —
    // MAIN is kernel-free. :adapter supplies the real ConsistencyOracle/BackendInfo ServiceLoader providers
    // (so the kernel gate actually runs in kernel-oracle tests: BoundModel.ofJson / RuleValidator.check /
    // the include/typedef constraint tests all get KERNEL_CONFIRMED); kernel-md-facade gives those tests the
    // kernel types they read directly (IDocumentModel, the serializer). This is the sanctioned non-leaking
    // pattern (KERNEL-DECOUPLING-PROPOSAL §3a: rootTest → adapterMain → rootMain is acyclic).
    testImplementation project(':adapter')
    testImplementation "com.mgmtp.a12.kernel:kernel-md-facade:${kernelVersion}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    dependsOn 'docGuardTest'
    // The repo-file-reading guards run in docGuardTest (with those files as its inputs); keep them out of
    // the broad suite so a doc/marker-only edit can't leave a stale-green `test` (TESTING-SPEC "Tests that
    // read repo files at runtime").
    filter {
        excludeTestsMatching 'io.github.mbackschat.a12.dm.DocSnippetFreshnessTest'
        excludeTestsMatching 'io.github.mbackschat.a12.dm.rulekit.catalog.DslCatalogBridgeTest'
    }
}

// --- Guard-input non-empty assertion (kernel-decoupling §3b #17, the silent-empty-fileTree class-fix) -----
// A guard task that READS repo files at runtime declares them as `.optional()` fileTree inputs so an edit
// re-runs only that guard. The trap: a moved/renamed folder silently EMPTIES such an input, and the guard
// then goes green while checking NOTHING (a false green that only an expensive probe would ever catch). This
// helper declares the inputs AND adds a doFirst that FAILS LOUDLY when any named tree is empty/missing — so
// every future folder move is caught by a build failure, not a silent pass. Defined on the root project's
// `ext` so `:cli`/`:adapter` reach it as `rootProject.guardInputs(...)` (root configures first). Applies to
// EVERY `.optional()`-fileTree guard (root docGuardTest, cli docGuardTest + semanticsMapGuardTest, adapter
// corpusReplayTest) — the whole class, not just this reorg's moves.
ext.guardInputs = { Test task, Map<String, ?> named ->
    task.inputs.files(named.values().toArray())
        .withPropertyName('guardReadRepoFiles')
        .withPathSensitivity(org.gradle.api.tasks.PathSensitivity.RELATIVE)
        .optional()
    task.doFirst {
        def empty = named.findAll { name, v ->
            (v instanceof File) ? !v.exists() : task.project.files(v).isEmpty()
        }
        if (empty) {
            throw new GradleException(
                "${task.name}: guarded runtime-read input(s) ${empty.keySet()} are EMPTY or MISSING — a moved " +
                "or renamed folder likely silenced this guard while it checked nothing (kernel-decoupling §3b " +
                "#17, the silent-empty-fileTree false-green class). Re-point the guard's fileTree to the moved " +
                "location; a guard must never run against an empty input.")
        }
    }
}

// Two root-project guards read REPO FILES at RUNTIME that Gradle can't infer as test inputs:
// DocSnippetFreshnessTest reads docs/API-GUIDE.md (its test-source side is covered — a region edit changes
// bytecode), and DslCatalogBridgeTest reads the dsl package's `catalog:<Id>` Javadoc markers — which compile
// to IDENTICAL bytecode, so a marker-only edit would leave the plain `test` task up-to-date and skip the very
// guard the edit needs (the false-green trap). They run HERE with those files declared as THIS task's inputs;
// `test` dependsOn this, so CI and a plain `:test` always drive both.
tasks.register('docGuardTest', Test) {
    description = 'Freshness/bridge guards that read repo docs + dsl sources at runtime (split out so such an edit re-runs only these).'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching 'io.github.mbackschat.a12.dm.DocSnippetFreshnessTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.rulekit.catalog.DslCatalogBridgeTest'
    }
    guardInputs(it, [
            'docs/API-GUIDE.md': file('docs/API-GUIDE.md'),
            'dsl sources'      : fileTree('src/main/java/io/github/mbackschat/a12/dm/rulekit/dsl') { include '**/*.java' },
            'operator catalog' : fileTree('src/main/resources/catalog')])
}

// Autonomous doc-snippet sync: rewrites every locked ```java fence in the docs from its canonical test
// region (see DocSnippetFreshnessTest / docs/TESTING.md "Locked doc snippets"). One command, no hand-copy.
// The default `test` run stays assert-only (CI catches a forgotten sync); only this task flips to the fixer.
tasks.register('syncDocSnippets', Test) {
    group = 'documentation'
    description = 'Regenerate locked doc snippets from their canonical test regions (autonomous, in place).'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperty 'snippets.fix', 'true'
    filter {
        includeTestsMatching 'io.github.mbackschat.a12.dm.DocSnippetFreshnessTest'
    }
    outputs.upToDateWhen { false }
}

// --- Kit purity, locked (kernel-decoupling stage 3; mirrors :interpreter's verifyInterpreterPurity) ------
// After stage 3 the kits (dm.core / dm.rulekit.* / dm.modelkit / dm.edit) import ZERO kernel types — the
// kernel lives behind the SPI ports (dm.core.spi.* / dm.rulekit.spi.*) that :adapter implements. This guard
// is the decoupling's regression net: it fails the build if any kit `src/main` file names a `com.mgmtp.*`
// type in CODE (imports OR fully-qualified references — the FQ form is what an import-only sweep missed for
// BoundModel before). Javadoc/line comments are stripped first, so the prose that legitimately mentions
// `com.mgmtp.a12.kernel.*` (to explain the boundary) is not a violation. Test scope is out of scope on
// purpose — the kernel stays the oracle in tests.
def verifyKitPurity = tasks.register('verifyKitPurity') {
    group = 'verification'
    description = 'Fail if any kit src/main file imports or references com.mgmtp.* (the decoupling regression net).'
    def mainSrc = file('src/main/java')
    inputs.dir(mainSrc)
    doLast {
        def violations = []
        if (mainSrc.exists()) {
            mainSrc.eachFileRecurse { f ->
                if (!f.name.endsWith('.java')) return
                // Strip block comments (incl. Javadoc) then line comments; any surviving com.mgmtp is real code.
                def code = f.text.replaceAll(/(?s)\/\*.*?\*\//, '').replaceAll(/(?m)\/\/.*$/, '')
                (code =~ /com\.mgmtp\.[\w.]+/).each { hit ->
                    violations << "src/main/java/…/${f.name}: ${hit}".toString()
                }
            }
        }
        if (violations) {
            throw new GradleException(
                "kit purity violated — the kits (core/rulekit/modelkit/edit) MAIN source must name no kernel\n" +
                "type; the kernel lives behind the SPI ports :adapter implements (kernel-decoupling stage 3).\n" +
                "Offending com.mgmtp references:\n  " + violations.join('\n  '))
        }
    }
}
tasks.named('check') { dependsOn verifyKitPurity }

// --- The no-backend lane (kernel-decoupling §2c; the Stage-3 acceptance bar) -----------------------------
// Run the kits with NO backend on the classpath — a Maven-Central consumer's posture — and prove the §2c
// degraded contract row by row (STRUCTURAL_ONLY, RK_NO_KERNEL_BACKEND, NO fake green, read-back fails fast).
// Wiring (the design fork the master ruled): a DEDICATED source set + Test task whose classpath is kit main
// + jackson + junit, and deliberately NOT :adapter / kernel-md-facade — chosen over a classloader-hiding
// test because it reproduces the real absent-backend classpath structurally (ServiceLoader finds no provider),
// with no fragile jar-path filtering. `noBackendTestImplementation extendsFrom implementation` pulls main's
// own deps (Jackson) but NOT testImplementation (which carries the backend), so the backend is unrepresentable.
sourceSets {
    noBackendTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    noBackendTestImplementation.extendsFrom implementation
    noBackendTestRuntimeOnly.extendsFrom runtimeOnly
}
dependencies {
    noBackendTestImplementation platform('org.junit:junit-bom:5.11.4')
    noBackendTestImplementation 'org.junit.jupiter:junit-jupiter'
    noBackendTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.register('noBackendTest', Test) {
    group = 'verification'
    description = 'The §2c degraded-mode acceptance lane: the kits with NO kernel backend on the classpath.'
    testClassesDirs = sourceSets.noBackendTest.output.classesDirs
    classpath = sourceSets.noBackendTest.runtimeClasspath
    useJUnitPlatform()
}
tasks.named('check') { dependsOn 'noBackendTest' }
