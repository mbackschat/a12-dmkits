plugins {
    id 'java-library'
}

group = 'io.github.mbackschat.a12.dm'
version = '0.8.2'

// PUBLIC + LOCAL repositories only. The A12 kernel is resolved from the local Maven
// repository (~/.m2), where the dedicated a12-kernel-bootstrap kit publishes it from
// public sources. No private registry is used. See docs/PROJECT-DESIGN.md §19.
repositories {
    mavenLocal()
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Ratchet (A12K-3589 / docs/TESTING-SPEC "no deprecated-kernel-API" guardian): a kernel API MARKED FOR REMOVAL
// cannot compile in this kernel-facing module. Only the `removal` lint (not `deprecation`) is treated as an
// error, so a new call to a removal-scheduled kernel API fails the build while plain-@Deprecated APIs (incl.
// Jackson's) still compile. See docs/KERNEL-INTEGRATION-NOTES.md "A12K-3589 kernel-API removal surface".
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:removal', '-Werror']
}

// `ext` (not `def`) so subprojects can read the pin — the CLI bakes it into version.properties for
// the `--version` / `manifest.version` surface (the kernel this release was built against).
ext.kernelVersion = '30.8.1'
// The A12 Tools distribution that ships this kernel — the human-facing release tag (the kernel semver is
// the machine compatibility key; this is its "A12 Tools <quarter>" label, RELEASE-SPEC). Single source of
// truth: the CLI bakes it into the version surface, and a drift guard pins every README/plugin mention to
// it. Bump it in lockstep with `kernelVersion` (KERNEL-UPGRADE).
ext.a12Distribution = '2025.06-ext5'

dependencies {
    // Public consumer surface only (D9 / N8). The facade transitively provides the public
    // IDocumentModel, IDocumentModelService (expand / checkConsistency — the §11 validate seam),
    // and the DM-JSON serializer. Kernel types appear in rulekit's own public API, hence `api`.
    // Deliberately NOT kernel-md-model / kernel-md-a12internal: those carry the internal-tier
    // `betterbuilders` the proposal excludes.
    api "com.mgmtp.a12.kernel:kernel-md-facade:${kernelVersion}"

    // The operator catalog (PROJECT-DESIGN §9) is a bundled JSON resource parsed at load time.
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    // YAML reader for the workspace `roles.yaml` access-control config (FEATURE-GAPS R3). Parsed as a
    // Jackson tree (no reflective POJO binding), the same tree-walking style as ModelDocument's DM-JSON read.
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.18.2'

    // modelkit (the structure builder) now lives in this module's `dm.modelkit` package (folded in
    // 2026-06-09 — D10 superseded). Its dogfood fixtures (ModelDrafts) + tests are in this project's
    // test set; the `dm.modelkit ⊥ dm.rulekit` boundary is held by `SiblingBoundaryTest`.

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    dependsOn 'docGuardTest'
    // The repo-file-reading guards run in docGuardTest (with those files as its inputs); keep them out of
    // the broad suite so a doc/marker-only edit can't leave a stale-green `test` (TESTING-SPEC "Tests that
    // read repo files at runtime").
    filter {
        excludeTestsMatching 'io.github.mbackschat.a12.dm.DocSnippetFreshnessTest'
        excludeTestsMatching 'io.github.mbackschat.a12.dm.rulekit.catalog.DslCatalogBridgeTest'
    }
}

// Two root-project guards read REPO FILES at RUNTIME that Gradle can't infer as test inputs:
// DocSnippetFreshnessTest reads docs/API-GUIDE.md (its test-source side is covered — a region edit changes
// bytecode), and DslCatalogBridgeTest reads the dsl package's `catalog:<Id>` Javadoc markers — which compile
// to IDENTICAL bytecode, so a marker-only edit would leave the plain `test` task up-to-date and skip the very
// guard the edit needs (the false-green trap). They run HERE with those files declared as THIS task's inputs;
// `test` dependsOn this, so CI and a plain `:test` always drive both.
tasks.register('docGuardTest', Test) {
    description = 'Freshness/bridge guards that read repo docs + dsl sources at runtime (split out so such an edit re-runs only these).'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching 'io.github.mbackschat.a12.dm.DocSnippetFreshnessTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.rulekit.catalog.DslCatalogBridgeTest'
    }
    inputs.files(
            file('docs/API-GUIDE.md'),
            fileTree('src/main/java/io/github/mbackschat/a12/dm/rulekit/dsl') { include '**/*.java' },
            fileTree('src/main/resources/catalog'))
        .withPropertyName('guardReadRepoFiles')
        .withPathSensitivity(org.gradle.api.tasks.PathSensitivity.RELATIVE)
}

// Autonomous doc-snippet sync: rewrites every locked ```java fence in the docs from its canonical test
// region (see DocSnippetFreshnessTest / docs/TESTING.md "Locked doc snippets"). One command, no hand-copy.
// The default `test` run stays assert-only (CI catches a forgotten sync); only this task flips to the fixer.
tasks.register('syncDocSnippets', Test) {
    group = 'documentation'
    description = 'Regenerate locked doc snippets from their canonical test regions (autonomous, in place).'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperty 'snippets.fix', 'true'
    filter {
        includeTestsMatching 'io.github.mbackschat.a12.dm.DocSnippetFreshnessTest'
    }
    outputs.upToDateWhen { false }
}
