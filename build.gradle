// A compiled dependency edge is the purity boundary. Source regexes cannot model Java text blocks, Kotlin raw
// strings/templates, or Kotlin's nested comments; a delimiter inside a literal once hid later code from a guard.
// jdeps reads class dependencies instead, so comments and string constants are irrelevant by construction.
ext.verifyCompiledPurity = { String guardName, Collection<File> classRoots, Collection<String> forbidden,
        String positiveControl ->
    def existingRoots = classRoots.findAll { it.exists() }
    def classCount = existingRoots.sum(0) { root ->
        fileTree(root).matching { include '**/*.class' }.files.size()
    }
    if (classCount == 0) {
        throw new GradleException("${guardName} scanned ZERO class files — the compiled source roots moved or emptied")
    }

    def launcher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }.get()
    def executableName = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('win') ? 'jdeps.exe' : 'jdeps'
    def jdeps = new File(launcher.executablePath.asFile.parentFile, executableName)
    if (!jdeps.isFile()) {
        throw new GradleException("${guardName} cannot find jdeps beside ${launcher.executablePath.asFile}")
    }

    def execution = providers.exec {
        commandLine([jdeps.absolutePath, '-verbose:class', '--ignore-missing-deps'] + existingRoots*.absolutePath)
        ignoreExitValue = true
    }
    def result = execution.result.get()
    def output = execution.standardOutput.asText.get()
    if (result.exitValue != 0) {
        throw new GradleException("${guardName} could not inspect compiled dependencies:\n${output}")
    }

    def dependencies = output.readLines().collect { line ->
        def edge = line =~ /^\s*\S+\s+->\s+(\S+)/
        edge.find() ? edge.group(1) : null
    }.findAll()
    if (!dependencies.any { it.startsWith(positiveControl) }) {
        throw new GradleException("${guardName} did not see its compiled-reference positive control ${positiveControl}")
    }
    def violations = dependencies.findAll { dependency -> forbidden.any { dependency.startsWith(it) } }.unique().sort()
    if (violations) {
        throw new GradleException("${guardName} violated; forbidden compiled dependencies:\n  " + violations.join('\n  '))
    }
}

// What a CONSUMER receives is decided by RESOLVED dependencies, never by our imports. A compiled-purity guard
// proves our own classes do not LINK the kernel; it is blind to a kernel jar a published module merely CARRIES
// — declared, unused, and on every consumer's classpath the moment they add the artifact, because a dependency
// reaches a POM by being declared and not by being imported. So this asks the configurations `from
// components.java` generates the POM from. The positive control runs the SAME group-prefix predicate against a
// group known to be present, so a matcher that silently stopped matching cannot pass as "nothing forbidden".
// `allowedGroups`, when given, is the stronger form of the same question: instead of naming the groups that
// must be absent, it names the ONLY groups that may be present, so a newly declared third-party dependency
// fails on arrival rather than on someone thinking to forbid it. Groups match EXACTLY — `org.jetbrains` does
// not admit `org.jetbrains.kotlinx` — because a prefix allowlist quietly widens as an ecosystem grows.
ext.verifyKernelFreeClasspath = { String guardName, Collection<Configuration> configurations,
        Collection<String> forbiddenGroups, String positiveControlGroup, Collection<String> allowedGroups = [],
        Collection<String> allowedProjects = null ->
    def components = configurations.collectMany { configuration ->
        configuration.incoming.resolutionResult.allComponents.collect { it.id }
                .collect { [configuration: configuration.name, id: it] }
    }
    def modules = components.findAll {
        it.id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier
    }
    if (modules.isEmpty()) {
        throw new GradleException("${guardName} resolved ZERO external modules — the configurations moved or emptied")
    }
    if (!modules.any { it.id.group.startsWith(positiveControlGroup) }) {
        throw new GradleException("${guardName} did not see its resolution positive control ${positiveControlGroup}")
    }
    def violations = modules
            .findAll { entry -> forbiddenGroups.any { entry.id.group.startsWith(it) } }
            .collect { "${it.configuration}: ${it.id.displayName}".toString() }
            .unique().sort()
    if (violations) {
        throw new GradleException(
            "${guardName} violated — a consumer of the published artifact would receive raw kernel jars:\n  "
            + violations.join('\n  '))
    }
    // An INTRA-REPO edge is a `ProjectComponentIdentifier`, which every filter above is blind to — and that
    // blindness was measured, not supposed (2026-09-17): with `implementation project(':interpreter')` planted
    // on `:consistency`'s `jsMain`, the interpreter resolved onto `jsRuntimeClasspath` and this guard and
    // `verifyConsistencyPurity` both reported clean, while the checker's build file claimed the opposite in as
    // many words. A group allowlist cannot cover it either: every module here publishes under ONE group, so
    // admitting `:predicates` by group would admit the interpreter too.
    //
    // It runs BEFORE the module allowlist, and the ordering is what keeps it reachable: a project edge
    // drags its own transitive modules in, so an allowlist that did not happen to admit them would throw
    // first and report the fallout instead of the edge. `:consistency`'s allowlist admits them today,
    // which made the control pass by luck rather than by design — the same ordering defect measured in
    // `verifyPredicatesPurity` on 2026-09-17, where it did fire.
    //
    // Opt-in, because a caller whose claim is about EXTERNAL jars has nothing to state here: a project edge
    // onto a kernel-carrying module still drags the kernel in as a module, which the forbidden-group arm
    // already catches. `null` means "this guard makes no claim about intra-repo edges"; a list means the claim
    // is CLOSED over them.
    //
    // The list is fully explicit, INCLUDING the caller's own path, and that is not ceremony: this closure is
    // declared on the root project, so a `project.path` default here resolves to `:` rather than to the
    // module that called it — which is exactly what the first version did, and it refused `:consistency`'s own
    // root on its own classpath.
    if (allowedProjects != null) {
        def permitted = allowedProjects as Set
        def undeclaredProjects = components
                .findAll { it.id instanceof org.gradle.api.artifacts.component.ProjectComponentIdentifier }
                .findAll { !permitted.contains(it.id.projectPath) }
                .collect { "${it.configuration}: ${it.id.displayName}".toString() }
                .unique().sort()
        if (undeclaredProjects) {
            throw new GradleException(
                "${guardName} resolved intra-repo project edge(s) outside its declared allowlist "
                + "${permitted.toSorted()}:\n  " + undeclaredProjects.join('\n  '))
        }
    }
    if (allowedGroups) {
        def undeclared = modules
                .findAll { entry -> !allowedGroups.contains(entry.id.group) }
                .collect { "${it.configuration}: ${it.id.displayName}".toString() }
                .unique().sort()
        if (undeclared) {
            throw new GradleException(
                "${guardName} resolved module(s) outside its declared allowlist ${allowedGroups.toSorted()}:\n  "
                + undeclared.join('\n  '))
        }
    }
}

// --- Kit purity, locked (kernel-decoupling stage 3; mirrors :interpreter's verifyInterpreterPurity) ------
// The kits (dm.core / dm.rulekit.* / dm.modelkit / dm.edit) import ZERO kernel types — the kernel lives
// behind the SPI ports (dm.core.spi.* / dm.rulekit.spi.*) that :adapter implements. This guard is the
// decoupling's regression net: jdeps fails the build if any compiled kit main class links a `com.mgmtp.*`
// type. Comments and string constants are irrelevant by construction, and the compiled positive control plus
// non-empty class denominator keep an empty scan from passing. Test scope is out of scope on purpose — the
// kernel stays the oracle in tests. Stage 4: the kits are now their own modules, so this single root guard
// inspects all four modules' main-class outputs (one place, covers the whole class).
def verifyKitPurity = tasks.register('verifyKitPurity') {
    group = 'verification'
    description = 'Fail if any kit main class has a compiled com.mgmtp.* dependency.'
    def kitProjects = ['core', 'rulekit', 'modelkit', 'edit']
    dependsOn kitProjects.collect { ":${it}:classes" }
    def classRoots = providers.provider {
        kitProjects.collectMany { project(":${it}").sourceSets.main.output.classesDirs.files }
    }
    inputs.files(classRoots)
    doLast {
        verifyCompiledPurity(
            'kit purity — core/rulekit/modelkit/edit main',
            classRoots.get(),
            ['com.mgmtp.'],
            'java.lang.Object')
    }
}
tasks.named('check') { dependsOn verifyKitPurity }

// --- What the published POMs hand a consumer, locked (DEV-API-GAPS DG45) ---------------------------------
// Every artifact below advertises a kernel-free consumer classpath — the kits behind their SPI ports,
// dmkits-schemakit "never the raw kernel jars directly" (SCHEMAKIT-SPEC §1), dmkits-interpreter-bridge as the
// no-kernel provider of ConditionReadBack, dmkits-consistency-gate and dmkits-interpreter-preflight as the
// façades whose whole purpose is a verdict reached with no kernel present. Until this guard the whole class advertised that with only a
// compiled-linkage lint behind it, which cannot see a declared-but-unimported dependency, so the guarantee a
// consumer actually cares about was the one nothing checked. Six modules rather than the one gap that named
// it: the claim, the POM mechanism and the blind spot are identical across them.
//
// The published MULTIPLATFORM artifacts are deliberately absent, and not by oversight: `dm-interpreter`,
// `a12-consistency` and `dm-predicates` register no `compileClasspath`/`runtimeClasspath` to hand this guard,
// and each is already held to a STRICTER bar by its own lint — `verifyInterpreterPurity` holds commonMain to
// an import allowlist, `verifyConsistencyPurity` reads compiled edges with `verifyConsistencyDependencies`
// allowlisting what each target may resolve, and `verifyPredicatesPurity` fails on any resolved dependency at
// all. Adding one here would weaken its claim, not widen the net.
def verifyPublishedClasspathsAreKernelFree = tasks.register('verifyPublishedClasspathsAreKernelFree') {
    group = 'verification'
    description = 'Fail if a published kernel-free artifact resolves a raw kernel module onto a consumer classpath.'
    // Keyed by the module's own POSITIVE CONTROL — a group its classpath really resolves — because the
    // control is what separates "no kernel here" from "this guard read nothing". A shared Jackson control was
    // right while every published artifact was a Java kit and became wrong the moment one sat on top of the
    // multiplatform modules, which carry kotlinx and no Jackson at all: the guard then failed a module it had
    // nothing to say about, which reads as a finding (measured 2026-09-16, adding dmkits-interpreter-preflight).
    def kernelFreePublications = [
            'core'                 : 'com.fasterxml.jackson.',
            'rulekit'              : 'com.fasterxml.jackson.',
            'modelkit'             : 'com.fasterxml.jackson.',
            'edit'                 : 'com.fasterxml.jackson.',
            'schemakit'            : 'com.fasterxml.jackson.',
            'interpreter-bridge'   : 'com.fasterxml.jackson.',
            'consistency-gate'     : 'com.fasterxml.jackson.',
            'interpreter-preflight': 'org.jetbrains.kotlinx',
    ]
    doLast {
        kernelFreePublications.each { name, positiveControl ->
            def published = project(":${name}")
            verifyKernelFreeClasspath(
                "published classpath — dmkits-${name}",
                [published.configurations.compileClasspath, published.configurations.runtimeClasspath],
                ['com.mgmtp.'],
                positiveControl)
        }
    }
}
tasks.named('check') { dependsOn verifyPublishedClasspathsAreKernelFree }

// --- A `publishing` block without `maven-publish` silently configures ROOT (measured 2026-09-13) ----------
// Groovy's DSL resolves an unknown method against the parent project rather than failing, so a subproject
// that writes `publishing { }` without applying the plugin configures the ROOT extension. It is invisible:
// the build stays green, the subproject's own publications are never created, and root's are silently
// rewritten. Measured when `:predicates` was added — its `publications.withType(...).configureEach` renamed
// root's `dmkits` aggregator to `dm-predicates-aggregator` and gave it the leaf's description, while
// `:rulekit`'s POM pointed at a `predicates` coordinate nothing published. Only reading the POMs showed it,
// which is why this is a build guard and not a convention.
def verifyPublishingIsDeclaredLocally = tasks.register('verifyPublishingIsDeclaredLocally') {
    group = 'verification'
    description = 'Fail if a subproject configures publishing without applying maven-publish to itself.'
    def buildFiles = subprojects.collectEntries { [(it.path): it.buildFile] }
    inputs.files(buildFiles.values().findAll { it.isFile() })
    doLast {
        def offenders = buildFiles.findAll { path, buildFile ->
            if (!buildFile.isFile()) {
                return false
            }
            def text = buildFile.text
            // The application, never the bare string: this read `!(text =~ /maven-publish/)` until
            // 2026-09-17, when a COMMENT in `:consistency` explaining that the module had no maven-publish
            // block satisfied it — the block bound to root, the publications were never created, and this
            // guard reported clean. A guard whose subject is a plugin must look for the plugin being applied.
            text =~ /(?m)^\s*publishing\s*\{/ &&
                    !(text =~ /(?m)^\s*(id\s+['"]maven-publish['"]|apply\s+plugin:\s*['"]maven-publish['"])/)
        }
        if (offenders) {
            throw new GradleException(
                    "these projects configure `publishing { }` without applying `maven-publish`, so the block " +
                    "binds to the ROOT project's extension and their own publications are never created: " +
                    "${offenders.keySet().toSorted()}")
        }
        // Non-vacuity: the estate does publish, so finding no `publishing` block at all means the scan broke.
        def declaring = buildFiles.values().findAll { it.isFile() && it.text =~ /(?m)^\s*publishing\s*\{/ }
        if (declaring.size() < 3) {
            throw new GradleException("found only ${declaring.size()} subprojects declaring publishing, so " +
                    'the scan broke and a green result here proves nothing')
        }
    }
}

// --- Every coordinate a shipped POM names must be one this build PUBLISHES --------------------------------
//
// The defect this catches shipped twice and was invisible both times, because a POM is generated output that
// no test read. Measured 2026-09-17: `dmkits-consistency-gate` and `dmkits-interpreter-preflight` both
// declared `io.github.mbackschat.a12.dm:consistency-jvm:0.13.0` at COMPILE scope, and `:consistency` had no
// `maven-publish` block at all — so a Maven consumer of either façade could not resolve the very types their
// public API returns. `:predicates` had met the identical constraint earlier and its build file records it
// ("published so `:rulekit` can depend on it without an unresolvable coordinate in a shipped POM"), which is
// what makes this a guard rather than a one-off fix: the rule was known and nothing enforced it.
//
// It reads the GENERATED POMs, not the build scripts. A declaration's coordinate is decided by the target
// project's publication — Gradle rewrites a project dependency into whatever artifactId that project
// publishes — so the build script says nothing about what a consumer will be asked to resolve.
def verifyPublishedPomsResolveInRepoCoordinates = tasks.register('verifyPublishedPomsResolveInRepoCoordinates') {
    group = 'verification'
    description = 'Fail if a shipped POM names an in-repo coordinate this build does not publish.'
    dependsOn subprojects.collect { sub -> sub.tasks.matching { it.name.startsWith('generatePomFileFor') } }
    outputs.upToDateWhen { false }
    doLast {
        def ownGroup = rootProject.group.toString()
        def published = [] as Set
        def pomFiles = []
        subprojects.each { sub ->
            if (!sub.plugins.hasPlugin('maven-publish')) {
                return
            }
            sub.extensions.getByType(PublishingExtension).publications
                    .withType(MavenPublication).each { publication ->
                published += "${publication.groupId}:${publication.artifactId}".toString()
            }
            sub.tasks.matching { it.name.startsWith('generatePomFileFor') }.each { task ->
                pomFiles << task.destination
            }
        }
        // Two non-vacuity conjuncts, because each failure mode reports clean on its own: no POMs at all means
        // the task wiring moved, and no published coordinates means the extension lookup did.
        def existing = pomFiles.findAll { it.isFile() }
        if (existing.isEmpty()) {
            throw new GradleException('found no generated POMs, so this guard read nothing; the ' +
                    'generatePomFileFor* wiring moved')
        }
        if (published.isEmpty()) {
            throw new GradleException('found no published Maven coordinates, so every absence below would ' +
                    'be vacuous')
        }
        def seenInRepoDependency = false
        def violations = []
        existing.each { pom ->
            def project = new groovy.xml.XmlSlurper().parse(pom)
            project.dependencies.dependency.each { dependency ->
                def group = dependency.groupId.text()
                if (!group.startsWith(ownGroup)) {
                    return
                }
                seenInRepoDependency = true
                def coordinate = "${group}:${dependency.artifactId.text()}".toString()
                if (!published.contains(coordinate)) {
                    violations << ("${pom.parentFile.parentFile.parentFile.name}: names ${coordinate} " +
                            "(${dependency.scope.text() ?: 'compile'}), which nothing publishes").toString()
                }
            }
        }
        if (!seenInRepoDependency) {
            throw new GradleException('no shipped POM declared an in-repo dependency, so this guard cannot ' +
                    'have compared anything; the group or the POM shape changed')
        }
        if (violations) {
            throw new GradleException('a shipped POM names an in-repo coordinate nothing publishes, so a ' +
                    "consumer cannot resolve it:\n  " + violations.toSorted().join('\n  ') +
                    "\n  published: ${published.toSorted()}")
        }
        logger.lifecycle("[pom-closure] ${existing.size()} POM(s) against ${published.size()} published " +
                'coordinate(s)')
    }
}
tasks.named('check') { dependsOn verifyPublishedPomsResolveInRepoCoordinates }
tasks.named('check') { dependsOn verifyPublishingIsDeclaredLocally }

// --- The no-backend lane (kernel-decoupling §2c; the Stage-3 acceptance bar) -----------------------------
// Run the kits with NO backend on the classpath — a Maven-Central consumer's posture — and prove the §2c
// degraded contract row by row (STRUCTURAL_ONLY, RK_NO_KERNEL_BACKEND, NO fake green, read-back fails fast).
// Wiring (the design fork the master ruled): a DEDICATED source set + Test task whose classpath is the
// kernel-free KIT modules (+ their transitive Jackson at runtime) + junit, and deliberately NOT :adapter /
// kernel-md-facade — chosen over a classloader-hiding test because it reproduces the real absent-backend
// classpath STRUCTURALLY (ServiceLoader finds no ConsistencyOracle/ReadBack provider), with no fragile
// jar-path filtering. Stage 4: it depends on the kit PROJECTS (root has no main source anymore); it does
// NOT extend testImplementation, so the backend it carries stays unrepresentable here.
sourceSets {
    noBackendTest
}
dependencies {
    noBackendTestImplementation project(':core')
    noBackendTestImplementation project(':rulekit')
    noBackendTestImplementation project(':modelkit')
    noBackendTestImplementation platform('org.junit:junit-bom:5.11.4')
    noBackendTestImplementation 'org.junit.jupiter:junit-jupiter'
    noBackendTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.register('noBackendTest', Test) {
    group = 'verification'
    description = 'The kernel-decoupling §2c degraded-mode acceptance lane: the kits with NO kernel backend on the classpath.'
    testClassesDirs = sourceSets.noBackendTest.output.classesDirs
    classpath = sourceSets.noBackendTest.runtimeClasspath
    useJUnitPlatform()
}
tasks.named('check') { dependsOn 'noBackendTest' }

// --- Publishing (kernel-decoupling Stage 4, Package B; RELEASE-SPEC §8/§11) ------------------------------
// The five Java kits publish to Maven under io.github.mbackschat.a12.dm:dmkits-<name> on the shared 0.x
// version, as does the :interpreter-bridge provider (its own module declares that publication).
// train (single-sourced above); each kit's own build file declares its MavenPublication + coordinates.
// Here at root we (1) share the common POM metadata (MIT — the kits are kernel-free since Stage 3, so no
// EUPL rider and no kernel dep to block Central), and (2) publish the AGGREGATOR POM `dmkits` (POM-only,
// no jar) that depends on the five kit artifacts — preserving the coordinate RELEASE-SPEC §8 documents and
// letting a consumer pull the whole set with one dependency. :adapter stays UNPUBLISHED (the kernel
// backend, owner ruling 2); :cli is binary-only. Verifiable bar: `publishToMavenLocal` → inspect the POMs.
ext.dmkitsPom = { pom ->
    pom.url = 'https://github.com/mbackschat/a12-dmtool-releases'
    pom.licenses {
        license {
            name = 'MIT License'
            url = 'https://opensource.org/licenses/MIT'
            distribution = 'repo'
        }
    }
    pom.developers {
        developer {
            id = 'mbackschat'
            name = 'Martin Backschat'
        }
    }
    pom.scm {
        url = 'https://github.com/mbackschat/a12-dmtool-releases'
        connection = 'scm:git:https://github.com/mbackschat/a12-dmtool-releases.git'
    }
}

publishing {
    publications {
        // POM-only aggregator (no `from components` → no jar): the `dmkits` umbrella that depends on the
        // five kit artifacts. Hand-built <dependencies> since root has no component to derive them from.
        aggregator(MavenPublication) {
            artifactId = 'dmkits'
            pom {
                name = 'dmkits'
                description = 'a12-dmkits — aggregator POM depending on the dm kits (core/rulekit/modelkit/edit/schemakit). MIT.'
                packaging = 'pom'
                dmkitsPom(delegate)
                withXml {
                    def deps = asNode().appendNode('dependencies')
                    ['dmkits-core', 'dmkits-rulekit', 'dmkits-modelkit', 'dmkits-edit', 'dmkits-schemakit'].each { a ->
                        def d = deps.appendNode('dependency')
                        d.appendNode('groupId', project.group)
                        d.appendNode('artifactId', a)
                        d.appendNode('version', project.version)
                    }
                }
            }
        }
    }
}
