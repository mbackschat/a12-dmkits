    guardInputs(it, [
            'assembler'         : file('scripts/assemble-interpreter-release-repo.sh'),
            'source statistics' : file('scripts/update-code-statistics.sh'),
            'mirror checker'    : file('scripts/check-interpreter-release-repo.sh'),
            'asset names'       : file('scripts/interpreter-release-assets.sh'),
            'mirror helpers'    : file('scripts/release-mirror-common.sh'),
            'release identity'  : file('scripts/release-git-identity.sh'),
            'publisher'         : file('scripts/publish-interpreter-release.sh'),
            'publisher core'    : file('scripts/interpreter-release-publisher-core.sh'),
            'GitHub backend'    : file('scripts/interpreter-release-github.sh'),
            'public smoke'      : file('scripts/smoke-interpreter-public-release.sh'),
            'Gradle environment': file('scripts/gradle-environment.sh'),
            'rehearsal'         : file('scripts/rehearse-interpreter-release.sh'),
            'rehearsal backend' : file('scripts/interpreter-release-rehearsal-host.sh'),
            'dmtool publisher'  : file('scripts/publish-release.sh'),
            'release gap checker': file('scripts/check-release-gaps.sh'),
            'gap ledgers'       : fileTree('docs') { include '*-GAPS.md' },
            'consumer programs' : fileTree('interpreter/consumer-tests') {
                include 'kotlin-jvm/**/*'
                include 'typescript/**/*'
            },
            'interpreter build'  : file('interpreter/build.gradle'),
            'release changelog' : file('interpreter/CHANGELOG.md'),
            'public documents'  : files(
                    fileTree('interpreter/public-release') { include '**/*' },
                    file('interpreter/README.md')),
            'public workflows'  : fileTree('.github/interpreter-mirror-workflows') { include '*.yml' },
            'release license'   : file('LICENSE'),
