// A PARTIAL compile output is a false green Gradle's own task line does not report. Observed 2026-09-03:
// `:adapter:compileJava` reported UP-TO-DATE while its output held 11 of 135 class files, and the first
// symptom was root `:test` failing with "package io.github.mbackschat.a12.dm.adapter does not exist" — a
// compilation error in an unrelated module, which reads as anything but a build-state problem. The build
// cache entry was intact and a verified clean restored all 135, so the trigger is upstream of the cache
// (Gradle logged an OPERATING_SYSTEM file-watching overflow in the same runs) and is NOT established.
//
// The invariant is drift-free rather than a pinned count: javac emits one class file per source type plus
// one per nested/anonymous type, so a main source set can never yield FEWER class files than `.java` files.
// Measured across the estate at the time of writing — adapter 135/43, rulekit 290/195, cli 258/169, and
// `edit` exactly 9/9, which is why the comparison is `<` and not a ratio.
def javaMainModules = ['core', 'rulekit', 'modelkit', 'edit', 'adapter', 'cli', 'schemakit']
def compileCompletenessInputs = javaMainModules.collectEntries { module ->
    [(module): [sources: file("${module}/src/main/java"), classes: file("${module}/build/classes/java/main")]]
}
def verifyCompileCompleteness = tasks.register('verifyCompileCompleteness') {
    description = 'Refuse a main source set whose compiled output holds fewer class files than it has sources.'
    group = 'verification'
    dependsOn javaMainModules.collect { ":${it}:classes" }
    outputs.upToDateWhen { false }
    doLast {
        def short_ = []
        compileCompletenessInputs.each { module, dirs ->
            if (!dirs.sources.isDirectory()) {
                return
            }
            // `package-info.java` carries no type, so javac emits NO class for it unless it declares an
            // annotation. Counting it makes the invariant false, and `edit` sits at exactly 9 classes for 9
            // sources — one unannotated package-info there would be a permanent false red no rebuild clears.
            int sources = 0
            dirs.sources.eachFileRecurse {
                if (it.isFile() && it.name.endsWith('.java') && it.name != 'package-info.java') { sources++ }
            }
            int classes = 0
            if (dirs.classes.isDirectory()) {
                dirs.classes.eachFileRecurse { if (it.isFile() && it.name.endsWith('.class')) { classes++ } }
            }
            if (classes < sources) {
                short_ << "${module}: ${classes} class file(s) for ${sources} source(s) in ${dirs.classes}"
            }
        }
        if (short_) {
            throw new GradleException("a main source set compiled INCOMPLETELY, which Gradle reports as a "
                    + "normal task outcome and which surfaces downstream as 'package ... does not exist' in "
                    + "an unrelated module:\n  " + short_.join('\n  ')
                    + "\nRe-run `./build.sh :<module>:clean` and then the build, and CHECK THE ARTIFACT "
                    + "rather than the task line — the output directory, not `UP-TO-DATE`/`FROM-CACHE`.")
        }
    }
}
// On `test`, not `check`: CI runs `… test :adapter:test :cli:test …` and never the root `check`, and `check`
// depends on `test` rather than the reverse — so a guard hung off `check` would not run in CI at all, which
// is the shape it exists to prevent. The symptom it explains is root `:test` failing, so that is its lane.
tasks.named('test') { dependsOn verifyCompileCompleteness }

// --- Kit purity, locked (kernel-decoupling stage 3; mirrors :interpreter's verifyInterpreterPurity) ------
// The kits (dm.core / dm.rulekit.* / dm.modelkit / dm.edit) import ZERO kernel types — the kernel lives
// behind the SPI ports (dm.core.spi.* / dm.rulekit.spi.*) that :adapter implements. This guard is the
// decoupling's regression net: jdeps fails the build if any compiled kit main class links a `com.mgmtp.*`
// type. Comments and string constants are irrelevant by construction, and the compiled positive control plus
// non-empty class denominator keep an empty scan from passing. Test scope is out of scope on purpose — the
// kernel stays the oracle in tests. Stage 4: the kits are now their own modules, so this single root guard
// inspects all four modules' main-class outputs (one place, covers the whole class).
def kitProjects = ['core', 'rulekit', 'modelkit', 'edit']
def verifyKitPurity = tasks.register('verifyKitPurity',
        io.github.mbackschat.a12.dm.buildlogic.VerifyCompiledPurityTask) {
    group = 'verification'
    description = 'Fail if any kit main class has a compiled com.mgmtp.* dependency.'
    dependsOn kitProjects.collect { ":${it}:classes" }
    guardName = 'kit purity — core/rulekit/modelkit/edit main'
    classRoots.from(kitProjects.collect { project(":${it}").sourceSets.main.output.classesDirs })
    forbidden = ['com.mgmtp.']
    positiveControl = 'java.lang.Object'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    stamp = layout.buildDirectory.file('guards/kit-purity.txt')
}
tasks.named('check') { dependsOn verifyKitPurity }

// The included build holds this repository's shared build code, and its own tests are the only thing that
// can see a mutation in it: a text-matching guard over a build script passes on a gutted derivation. The
// fast unit lane rides `test` so CI and the inner loop both carry it for ~1 s; the TestKit lane, which
// spawns real Gradle builds at ~16 s, rides `check` and is named explicitly in CI.
tasks.named('test') { dependsOn gradle.includedBuild('build-logic').task(':test') }
tasks.named('check') { dependsOn gradle.includedBuild('build-logic').task(':check') }

// --- The no-backend lane (kernel-decoupling §2c; the Stage-3 acceptance bar) -----------------------------
// Run the kits with NO backend on the classpath — a Maven-Central consumer's posture — and prove the §2c
// degraded contract row by row (STRUCTURAL_ONLY, RK_NO_KERNEL_BACKEND, NO fake green, read-back fails fast).
// Wiring (the design fork the master ruled): a DEDICATED source set + Test task whose classpath is the
// kernel-free KIT modules (+ their transitive Jackson at runtime) + junit, and deliberately NOT :adapter /
// kernel-md-facade — chosen over a classloader-hiding test because it reproduces the real absent-backend
// classpath STRUCTURALLY (ServiceLoader finds no ConsistencyOracle/ReadBack provider), with no fragile
// jar-path filtering. Stage 4: it depends on the kit PROJECTS (root has no main source anymore); it does
// NOT extend testImplementation, so the backend it carries stays unrepresentable here.
sourceSets {
    noBackendTest
}
dependencies {
    noBackendTestImplementation project(':core')
    noBackendTestImplementation project(':rulekit')
    noBackendTestImplementation project(':modelkit')
    noBackendTestImplementation platform('org.junit:junit-bom:5.11.4')
    noBackendTestImplementation 'org.junit.jupiter:junit-jupiter'
    noBackendTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.register('noBackendTest', Test) {
    group = 'verification'
    description = 'The kernel-decoupling §2c degraded-mode acceptance lane: the kits with NO kernel backend on the classpath.'
    testClassesDirs = sourceSets.noBackendTest.output.classesDirs
    classpath = sourceSets.noBackendTest.runtimeClasspath
    useJUnitPlatform()
}
tasks.named('check') { dependsOn 'noBackendTest' }

// --- Publishing (kernel-decoupling Stage 4, Package B; RELEASE-SPEC §8/§11) ------------------------------
// The five Java kits publish to Maven under io.github.mbackschat.a12.dm:dmkits-<name> on the shared 0.x
// version, as does the :interpreter-bridge provider (its own module declares that publication).
// train (single-sourced above); each kit's own build file declares its MavenPublication + coordinates.
// Here at root we (1) share the common POM metadata (MIT — the kits are kernel-free since Stage 3, so no
// EUPL rider and no kernel dep to block Central), and (2) publish the AGGREGATOR POM `dmkits` (POM-only,
// no jar) that depends on the five kit artifacts — preserving the coordinate RELEASE-SPEC §8 documents and
// letting a consumer pull the whole set with one dependency. :adapter stays UNPUBLISHED (the kernel
// backend, owner ruling 2); :cli is binary-only. Verifiable bar: `publishToMavenLocal` → inspect the POMs.
publishing {
    publications {
        // POM-only aggregator (no `from components` → no jar): the `dmkits` umbrella that depends on the
        // five kit artifacts. Hand-built <dependencies> since root has no component to derive them from.
        aggregator(MavenPublication) {
            artifactId = 'dmkits'
            pom {
                name = 'dmkits'
                description = 'a12-dmkits — aggregator POM depending on the dm kits (core/rulekit/modelkit/edit/schemakit). MIT.'
                packaging = 'pom'
                a12Guards.dmkitsPom(delegate)
                withXml {
                    def deps = asNode().appendNode('dependencies')
                    ['dmkits-core', 'dmkits-rulekit', 'dmkits-modelkit', 'dmkits-edit', 'dmkits-schemakit'].each { a ->
                        def d = deps.appendNode('dependency')
                        d.appendNode('groupId', project.group)
                        d.appendNode('artifactId', a)
                        d.appendNode('version', project.version)
                    }
                }
            }
        }
    }
}
