plugins {
    id 'java-library'
    id 'a12.build-guards'
    id 'maven-publish'
    // Pin Kotlin once at the root: Gradle reports independent loads in :adapter and :interpreter as an
    // unsupported configuration that may break the build.
    id 'org.jetbrains.kotlin.jvm' version '2.4.0' apply false
    id 'org.jetbrains.kotlin.multiplatform' version '2.4.0' apply false
}

group = 'io.github.mbackschat.a12.dm'
version = '0.13.0'

// Single-source the shared coordinates (kernel-decoupling Stage 4, PROPOSAL §3a): the published kit modules
// (core/rulekit/modelkit/edit + schemakit) inherit group + version from HERE, so bump-version.sh's
// `^version = ` edit (the line above) stays the one source of truth and every artifact shares the 0.x train.
// The kernel pin + distribution tag stay `ext` on root (the CLI bakes them into version.properties). A
// subproject may override in its own build file (e.g. :interpreter carries its own KMP/npm coordinates).
subprojects {
    group = rootProject.group
    version = rootProject.version
}

// A failing test must say WHY in the build log, on every project and every Test task.
//
// Without this, Gradle logs only `AssertionFailedError at SomeTest.java:41` — the assertion MESSAGE, which is
// where this project puts its evidence (a spawned script's whole output, a kernel diagnostic, an engine
// disagreement), goes only to an HTML report. On CI that report is not uploaded, so a red run was a diagnosis
// dead end: the 2026-08-22 `deliveryGuardTest` failure could not be read at all, and it fails only on Linux, so
// re-running locally reveals nothing. Cheap, and it turns every future CI red into something readable.
allprojects {
    tasks.withType(Test).configureEach {
        testLogging {
            exceptionFormat = 'full'
            showStackTraces = true
            events 'failed'
        }
    }
}

// PUBLIC + LOCAL repositories only. The A12 kernel is resolved from the local Maven
// repository (~/.m2), where the dedicated a12-kernel-bootstrap kit publishes it from
// public sources. No private registry is used. See docs/PROJECT-DESIGN.md §19.
repositories {
    mavenLocal()
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// One contract matrix locks the Java reader and portable interpreter reference scanners to the same bilingual
// language profiles. The interpreter generates common JVM/JS test data from this directory; root Java tests read
// the identical resource from their ordinary test classpath.
sourceSets.test.resources.srcDir(
        'interpreter/src/commonTest/resources/reference-remap-profile')

// Ratchet (A12K-3589 / docs/KERNEL-INTEGRATION-NOTES "A12K-3589 kernel-API removal surface"): a kernel API MARKED FOR REMOVAL
// cannot compile in a kernel-facing compilation. Only the `removal` lint (not `deprecation`) is treated as an
// error, so a new call to a removal-scheduled kernel API fails the build while plain-@Deprecated APIs (incl.
// Jackson's) still compile. See docs/KERNEL-INTEGRATION-NOTES.md "A12K-3589 kernel-API removal surface".
//
// Kernel-decoupling Stage 4: root has NO main source anymore (the kits moved to their own modules), so the
// only kernel-facing compilation left here is compileTestJava — the cross-kit integration tests that keep
// the kernel on the classpath as the oracle (verification unchanged). The ratchet stays on JavaCompile to
// guard THAT compile. The kernel-free kit modules don't compile kernel code, so they carry no ratchet;
// :adapter + :cli keep their own (their main compiles the kernel backend).
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:removal', '-Werror']
}

// `ext` (not `def`) so subprojects can read the pin — the CLI bakes it into version.properties for
// the `--version` / `manifest.version` surface (the kernel this release was built against).
ext.kernelVersion = '30.8.1'
// The A12 Tools distribution that ships this kernel — the human-facing release tag (the kernel semver is
// the machine compatibility key; this is its "A12 Tools <quarter>" label, RELEASE-SPEC). Single source of
// truth: the CLI bakes it into the version surface, and a drift guard pins every README/plugin mention to
// it. Bump it in lockstep with `kernelVersion` (KERNEL-UPGRADE).
ext.a12Distribution = '2025.06-ext5'

dependencies {
    // Root is a PURE AGGREGATOR + the cross-kit integration-test host (kernel-decoupling Stage 4, PROPOSAL
    // kernel-decoupling §3a, Option 1). It has NO main source; its src/test holds the ~150 cross-cutting tests (they span all
    // four kits + share Fixtures/ModelDrafts), so it depends on every kit at TEST scope. The kits' MAIN is
    // kernel-free (verifyKitPurity) — the kernel lives behind the SPI ports the :adapter backend implements.
    testImplementation project(':core')
    testImplementation project(':rulekit')
    testImplementation project(':modelkit')
    testImplementation project(':edit')
    // The API-surface lock (Set S) dumps all FIVE published kits' public surface, so schemakit joins the
    // test classpath here (root is the cross-kit test host). It is the fifth kit's ONLY appearance at root
    // and stays test-scope — root publishes no jar, so this adds nothing to any consumer's classpath.
    testImplementation project(':schemakit')

    // The kernel stays the oracle in TESTS (verification unchanged). :adapter supplies the real
    // ConsistencyOracle/BackendInfo ServiceLoader providers so the kernel gate actually runs in the
    // kernel-oracle tests (BoundModel.ofJson / RuleValidator.check get KERNEL_CONFIRMED); kernel-md-facade
    // gives the 8 tests that read kernel types directly (IDocumentModel, the serializer) their imports. The
    // non-leaking pattern (PROPOSAL §3a): rootTest → adapterMain → {kit}Main is acyclic.
    testImplementation project(':adapter')
    testImplementation "com.mgmtp.a12.kernel:kernel-md-facade:${kernelVersion}"

    // A few root tests read/emit DM-JSON directly → Jackson at test scope (the kits expose it only as
    // `implementation`, so it is not on their consumers' compile classpath).
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    testImplementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.18.2'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // `-Pfast` drops the EXPENSIVE guard prerequisites for the dev inner loop, because `--tests` filters only
    // the test task and NOT its dependencies, so a single law-test run otherwise paid for every guard.
    //
    // A GUARD CHEAP ENOUGH THAT DROPPING IT SAVES NOTHING IS NEVER DROPPABLE. Measured on this machine
    // (2026-08-15, first green non-fast root run, per-task test time from the result XMLs):
    //
    //   interpreterReleaseGuardTest 77.2s | docGuardTest 51.2s | deliveryGuardTest 8.8s   <- droppable, 137.2s
    //   leakGuardTest 3.6s | catalogProseReviewGuardTest 1.5s | jsonConstructionGuardTest 0.4s
    //   apiGuardTest 0.2s | releaseGapGuardTest 0.1s                                       <- always on, 5.8s
    //
    // for reference the 1794-test suite itself is 17.0s. Dropping the always-on five saves 4% of guard time
    // and costs the whole false-green class: each of them binds a COMMITTED ARTIFACT to the source it must
    // mirror (API goldens, catalog prose-review digests, the JSON-construction classification, the release-gap
    // ledger), so when one is skipped nothing else notices the artifact went stale. They also declare their
    // inputs, so in the common inner-loop case (editing a test) they are UP-TO-DATE and cost nothing; they run
    // exactly when the thing they mirror could have moved.
    //
    // This split is not decoration: `-Pfast` silently removed `apiGuardTest` from the graph across the whole
    // DG37 landing, so `EntityPath`/`HasEntityPath` and the `FieldRef`/`GroupRef` component change shipped
    // against stale goldens and the catalog prose-review digest went stale beside them. Both were invisible
    // to every run made that day. Locked by GateTierWiringTest.theCheapGuardsAreNotBehindTheFastLever;
    // measurements + the retired remembering-rule it replaces: docs/TESTING-SPEC.md "Test tiers".
    dependsOn 'jsonConstructionGuardTest'
    dependsOn 'apiGuardTest'
    dependsOn 'catalogProseReviewGuardTest'
    dependsOn 'releaseGapGuardTest'
    dependsOn 'leakGuardTest'
    dependsOn 'gateWiringGuardTest'
    // Same tier and for the stated reason: it binds docs/TEMPORAL-FORMAT-VOCABULARY.md to the kernel that
    // decides it, declares its inputs, and costs ~3 s. It first hung off `check` alone, which CI does not run
    // (`ci.yml` names `test`), so the guard would have been unreachable exactly where it matters.
    dependsOn 'vocabularyGuardTest'
    if (!project.hasProperty('fast')) {
        dependsOn 'docGuardTest'
        dependsOn 'interpreterReleaseGuardTest'
        dependsOn 'deliveryGuardTest'
    } else {
        doFirst {
            logger.lifecycle('-Pfast: SKIPPING docGuardTest, interpreterReleaseGuardTest, deliveryGuardTest '
                    + '— this run is NOT the estate. Re-run without -Pfast before treating green as a checkpoint.')
        }
    }
    // Repo-file-reading guards run in input-declared dedicated tasks; keep them out of the broad suite so a
    // doc/marker/golden/script-only edit cannot leave a stale-green `test` (TESTING-SPEC "Tests that read
    // repo files at runtime"). Derived from those tasks — see `routeExclusivelyHostedTests`. `dumpKitApi` and
    // `syncDocSnippets` are regenerators over classes `apiGuardTest`/`docGuardTest` already own, and
    // `interpreterReleaseGuardTest` runs its own `releaseGuardTest` source set, so neither owns anything here.
    a12Guards.routeExclusivelyHostedTests(it, ['docGuardTest', 'jsonConstructionGuardTest', 'apiGuardTest',
                                     'catalogProseReviewGuardTest', 'deliveryGuardTest', 'releaseGapGuardTest',
                                     'leakGuardTest', 'vocabularyGuardTest', 'gateWiringGuardTest'],
            ['dumpKitApi'             : 'regenerator over apiGuardTest\'s class — writes the goldens instead of asserting',
             'syncDocSnippets'        : 'regenerator over docGuardTest\'s class — writes the snippets instead of asserting',
             'dumpTemporalVocabulary' : 'regenerator over vocabularyGuardTest\'s class — writes the derived '
                     + 'vocabulary instead of asserting against it'])
}

// A12 JSON construction is a ROLE boundary, not a module boundary (API-FINDINGS 103 / IF228): this guard reads
// every production Java/Kotlin source tree that can parse or emit DM-JSON / Document JSON and requires each
// ObjectMapper / default kotlinx Json site to carry an exact, reasoned classification. Its own task gives those
// runtime-read source trees the docGuardTest treatment: a source-only edit re-runs this one guard, not ~150 root
// integration tests, and build-cache reuse cannot leave the enumeration stale.
tasks.register('jsonConstructionGuardTest', Test) {
    description = 'Role-basis allowlist for every production ObjectMapper/default-kotlinx-Json construction.'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching 'io.github.mbackschat.a12.dm.A12JsonConstructionGuardTest'
    }
    a12Guards.guardInputs(it, [
            'core main sources'       : fileTree('core/src/main') { include '**/*.java', '**/*.kt' },
            'modelkit main sources'   : fileTree('modelkit/src/main') { include '**/*.java', '**/*.kt' },
            'rulekit main sources'    : fileTree('rulekit/src/main') { include '**/*.java', '**/*.kt' },
            'edit main sources'       : fileTree('edit/src/main') { include '**/*.java', '**/*.kt' },
            'schemakit main sources'  : fileTree('schemakit/src/main') { include '**/*.java', '**/*.kt' },
            'cli main sources'        : fileTree('cli/src/main') { include '**/*.java', '**/*.kt' },
            'adapter main sources'    : fileTree('adapter/src/main') { include '**/*.java', '**/*.kt' },
            'interpreter commonMain'  : fileTree('interpreter/src/commonMain') { include '**/*.java', '**/*.kt' },
            'interpreter jvmMain'     : fileTree('interpreter/src/jvmMain') { include '**/*.java', '**/*.kt' },
            'interpreter jsMain'      : fileTree('interpreter/src/jsMain') { include '**/*.java', '**/*.kt' },
            'bridge main sources'     : fileTree('interpreter-bridge/src/main') { include '**/*.java', '**/*.kt' },
    ])
}

// A promoted pre-check that nothing calls is not a pre-check, and every artifact still reads as done: its lock
// passes by invoking the gate directly, and the ledger row cites that lock. Only the CALL SITE distinguishes a
// wired gate from an unwired one, so this guard derives the refusing gates from source and requires each to be
// reached by the condition-text consumer. Its own task for the reason jsonConstructionGuardTest has one: the
// source trees it reads at runtime must be declared inputs, or a wiring-only edit leaves a stale-green `test`
// — measured, by planting an unwiring mutant and watching the broad suite report UP-TO-DATE.
tasks.register('gateWiringGuardTest', Test) {
    description = 'Every refusing BoundModel gate is reached by the condition-text consumer.'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching 'io.github.mbackschat.a12.dm.rulekit.dsl.PromotedGateIsReachedGuardTest'
    }
    a12Guards.guardInputs(it, [
            'rulekit main sources' : fileTree('rulekit/src/main') { include '**/*.java' },
            'bridge main sources'  : fileTree('interpreter-bridge/src/main') { include '**/*.java', '**/*.kt' },
    ])
}

// PrivateMarkerLeakGuardTest scans every git-tracked file. A fileTree cannot express that set — a newly
// tracked file under any excluded directory would leave the task UP-TO-DATE and the scan silently unrun — and
// a leak guard that can be stale is worse than no leak guard, so this one always runs: a few hundred text
// files, costing about as much as the fork that hosts it.
//
// A ValueSource CAN express it, measured: `providers.of(<git ls-files>)` mapped to a FileCollection goes
// UP-TO-DATE on no change, re-runs on a tracked file's content change, ignores an untracked file, and re-runs
// when one is `git add`ed — the case this comment's first sentence used to call impossible — all of it
// configuration-cache correct, with `git ls-files` costing 7 ms on this repository. Adopting it here trades a
// guarantee that cannot go stale for one that depends on the value source being re-evaluated, which is a
// deliberate call rather than a cleanup; see docs/GUARD-INPUT-PROPOSAL.md.
tasks.register('leakGuardTest', Test) {
    description = 'Repository-wide scan: no tracked file may publish a private registry, access token, or key.'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    outputs.upToDateWhen { false }
    // Both halves, matching what GateTierWiringTest already asserts for perfGateTest: without cacheIf the
    // task stores an entry on every build and "always runs" rests on undocumented restore behaviour.
    outputs.cacheIf { false }
    filter {
        includeTestsMatching 'io.github.mbackschat.a12.dm.PrivateMarkerLeakGuardTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.TrackedOutputGuardTest'
        // Derived denominator, so it belongs in the always-run task: an authored list of pin consumers can
        // only ever check the files someone remembered, which is how the committed .envrc re-encoded the pin
        // unnoticed while a six-entry list read as a complete guard.
        includeTestsMatching 'io.github.mbackschat.a12.dm.JdkPinSingleSourceGuardTest'
        // Same derived-denominator reason: a shell script added tomorrow must be scanned without anyone
        // declaring it, and a one-dialect `stat` spelling is invisible on this platform by construction
        // (docs/BUILD-ENVIRONMENT.md "`stat` has two dialects").
        includeTestsMatching 'io.github.mbackschat.a12.dm.ShellPortabilityGuardTest'
        // A copied mirror workflow is as executable as a live workflow once published. Derive this denominator
        // from Git as well, so neither tree can silently reintroduce a moving hosted-runner label.
        includeTestsMatching 'io.github.mbackschat.a12.dm.RunnerImagePinGuardTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.NodeRuntimePinGuardTest'
    }
}

// CatalogProseReviewGuardTest resolves authored evidence links by scanning test source files across six
// modules/source sets. Those files are not on the root test runtime classpath, so a cited test rename would
// otherwise leave the broad root test task UP-TO-DATE and preserve a false green. Keep the scan in one
// input-declared task: a test-source-only edit reruns this guard, not every root integration test.
tasks.register('catalogProseReviewGuardTest', Test) {
    description = 'Content-bound catalog prose review with every scanned evidence source declared as an input.'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching 'io.github.mbackschat.a12.dm.rulekit.catalog.CatalogProseReviewGuardTest'
    }
    a12Guards.guardInputs(it, [
            'root test evidence'              : fileTree('src/test') { include '**/*.java', '**/*.kt' },
            'adapter test evidence'           : fileTree('adapter/src/test') { include '**/*.java', '**/*.kt' },
            'interpreter commonTest evidence' : fileTree('interpreter/src/commonTest') { include '**/*.java', '**/*.kt' },
            'interpreter jvmTest evidence'    : fileTree('interpreter/src/jvmTest') { include '**/*.java', '**/*.kt' },
            'interpreter jsTest evidence'     : fileTree('interpreter/src/jsTest') { include '**/*.java', '**/*.kt' },
            'cli test evidence'               : fileTree('cli/src/test') { include '**/*.java', '**/*.kt' },
    ])
}

tasks.register('deliveryGuardTest', Test) {
    description = 'Input-declared behavioral guards for release preconditions, binary delivery, native independence, and activation.'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching 'io.github.mbackschat.a12.dm.EnsureDmtoolCacheTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.DmtoolLauncherTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.NativeNoJavaSmokeTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.CodexPluginActivationEvidenceTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.SourceStatisticsReleaseBoundaryTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.ReleasePerfGateRefusalTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.JdkPinScriptTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.BashHookScriptTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.TestEvidenceScriptTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.InfographicFreshnessLocaleTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.TypeScriptRuntimeLauncherTest'
    }
    a12Guards.guardInputs(it, [
            'release perf gate'       : file('scripts/release-perf-gate.sh'),
            'release perf self-test'  : file('scripts/selftest-release-perf-gate.sh'),
            'plugin installer'        : file('scripts/ensure-dmtool.sh'),
            'installer self-test'     : file('scripts/selftest-ensure-dmtool.sh'),
            'dmtool launcher'         : file('bin/dmtool'),
            'launcher self-test'      : file('scripts/selftest-dmtool-launcher.sh'),
            'source preparation'      : file('scripts/prepare-dmtool-source.sh'),
            'source prep self-test'   : file('scripts/selftest-prepare-dmtool-source.sh'),
            // DmtoolLauncherTest executes this selftest, which copies .githooks/pre-commit into fabricated
            // repos — so BOTH are runtime inputs (same pairing as `obligations` in the docGuardTest lane).
            // Undeclared, this lane sat UP-TO-DATE after either file changed: the 2026-08-22 CI red was first
            // "verified" locally against a task that had not run, and only reading the task state caught it.
            'pre-commit hook'         : file('.githooks/pre-commit'),
            'doc-guard hook self-test': file('scripts/selftest-precommit-doc-guards.sh'),
            // BashHookScriptTest executes this selftest, which drives the hook itself — BOTH are runtime
            // inputs, and the settings file is read to assert the hook is still wired at all.
            'bash hook'               : file('.claude/hooks/guard-long-run-antipatterns.sh'),
            'bash hook self-test'     : file('scripts/selftest-bash-hook.sh'),
            'claude settings'         : file('.claude/settings.json'),
            'pre-push hook'           : file('.githooks/pre-push'),
            'pre-push hook self-test' : file('scripts/selftest-prepush-ci.sh'),
            'infographic preflight'   : file('scripts/check-infographic-freshness.sh'),
            'infographic implementation': file('scripts/typescript/check-infographic-freshness.ts'),
            'TypeScript launcher'     : file('scripts/run-typescript.sh'),
            'TypeScript runtime consumers': files(
                    'scripts/doctor.sh',
                    'scripts/gen-scenarios.sh',
                    'scripts/sync-plugin-assets.sh',
                    'scripts/verify-demos.sh',
                    'scripts/native-gate.sh',
                    'cli/src/main/java/io/github/mbackschat/a12/dm/cli/interp/CustomJsWorker.java'),
            'infographic live documents': files(
                    'README.md',
                    'docs/INFOGRAPHICS.md',
                    'interpreter/public-release/PERFORMANCE.md',
                    'plugin/README.md',
                    'interpreter/public-release/README.md',
                    '.github/workflows/ci.yml'),
            'infographic live assets': fileTree('.') {
                include 'assets/infographics/*.png'
                include 'plugin/assets/infographics/*.png'
                include 'interpreter/public-release/assets/infographics/*.png'
            },
            'Gradle environment'      : file('scripts/gradle-environment.sh'),
            // JdkPinScriptTest executes this selftest, which sources gradle-environment.sh and invokes the
            // GraalVM verifier — so all three are runtime inputs, the same pairing as the doc-guard hook above.
            'JDK pin self-test'       : file('scripts/selftest-jdk-pin.sh'),
            'GraalVM native verifier': file('scripts/verify-graalvm-native.sh'),
            'GraalVM native identity': file('gradle/graalvm-native.properties'),
            // TestEvidenceScriptTest executes this selftest, which copies the shell command, shared Node gate,
            // and TypeScript implementation into fabricated repos — all are runtime inputs. This tool's output
            // is read AS evidence, so a silent break in it is believed rather than noticed.
            'evidence reporter'       : file('scripts/test-evidence.sh'),
            'evidence implementation': file('scripts/typescript/test-evidence.ts'),
            'evidence self-test'      : file('scripts/selftest-test-evidence.sh'),
            'native build contract'   : file('cli/build.gradle'),
            'native no-Java smoke'    : file('scripts/native-no-java-smoke.sh'),
            'Codex activation smoke'  : file('scripts/codex-plugin-activation-smoke.sh'),
            'Codex evidence schema'   : file('scripts/codex-plugin-activation.schema.json'),
            'source statistics'       : file('scripts/update-code-statistics.sh'),
            'dmtool publisher'        : file('scripts/publish-release.sh'),
            'interpreter publisher'   : file('scripts/interpreter-release-publisher-core.sh'),
            'dmtool assembler'        : file('scripts/assemble-release-repo.sh'),
            'interpreter assembler'   : file('scripts/assemble-interpreter-release-repo.sh'),
            'release asset manifest'  : file('scripts/release-assets.sh'),
    ])
    def nativeOutputRelative = providers.provider {
        relativePath(project(':cli').tasks.named('nativeCompile').get().outputFile.get().asFile)
    }
    inputs.property('nativeCompile output path', nativeOutputRelative)
    doFirst {
        systemProperty 'dmtool.nativeOutputRelative', nativeOutputRelative.get()
    }
}

tasks.register('releaseGapGuardTest', Test) {
    description = 'Release blocker proving every derived gap ledger has a drained open section.'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching 'io.github.mbackschat.a12.dm.ReleaseGapBlockerTest'
    }
    a12Guards.guardInputs(it, [
            'release gap checker': file('scripts/check-release-gaps.sh'),
            'gap ledgers'        : fileTree('docs') { include '*-GAPS.md' },
    ])
}

// Root-project guards below read REPO FILES at RUNTIME that Gradle can't infer as test inputs:
// DocSnippetFreshnessTest reads docs/API-GUIDE.md plus raw tagged test sources; a tag-only edit compiles to
// IDENTICAL bytecode, so the live repo test-source denominator is a direct input. DslCatalogBridgeTest reads
// the dsl package's `catalog:<Id>` Javadoc markers, which have the same bytecode-invisible property. Without
// those inputs the plain `test` task can stay up-to-date and skip the very guard the edit needs (the false-green
// trap). BuildPerformancePolicyTest locks the repo-level Gradle cache
// and compiler-memory policies; GateTierWiringTest locks the push/nightly workflow split, persistent Gradle
// cache, and non-cacheable isolated perf launcher chain.
// They run HERE with those files declared as THIS task's inputs; `test` dependsOn this, so CI and a plain
// `:test` always drive all four.
tasks.register('docGuardTest', Test) {
    description = 'Freshness/bridge guards that read repo docs + dsl sources at runtime (split out so such an edit re-runs only these).'
    group = 'verification'
    // THE DOC GUARDS ARE SPLIT ACROSS MODULES, so this name has to mean ALL of them (2026-08-12). This task owns
    // the root-module readers; the ledger-shape, CLI-contract and index readers live in `:cli` under the SAME task
    // name plus `:cli:staleGapGuardTest`. "Run the doc guards" is the scoping decision a docs-only change actually
    // makes, and with two same-named tasks it silently selected the wrong half: a malformed `IG126` ledger row
    // shipped in 53326fa0 and survived because the row's grammar is asserted in `:cli:staleGapGuardTest`, while the
    // docs-only checkpoint ran this task. Aggregating is preferred over asserting the ledger grammar twice — one
    // regex in two modules is the duplication-that-must-stay-in-sync smell. These are cross-module TASK edges (not
    // project edges) and both targets declare their inputs, so they cost nothing when no doc input changed.
    dependsOn ':cli:docGuardTest', ':cli:staleGapGuardTest', ':cli:referentGuardTest'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching 'io.github.mbackschat.a12.dm.ApiFindingsNumberingGuardTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.MvkLedgerTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.KernelCodeLiteralRatchetTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.DocSnippetFreshnessTest'
        // ...but not its in-place fixer, which is a TOOL and not a check: `@EnabledIfSystemProperty` makes it
        // report as skipped on every verification run, and a lane carrying a permanent benign skip cannot use
        // `skipped=0` as evidence — a real skip would hide against that baseline. `syncDocSnippets` selects it.
        excludeTestsMatching 'io.github.mbackschat.a12.dm.DocSnippetFreshnessTest.regenerateLockedDocSnippetsFromTheirRunTests'
        includeTestsMatching 'io.github.mbackschat.a12.dm.BuildPerformancePolicyTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.AttributionDisclaimerLockTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.DoctorScriptTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.ObligationsScriptTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.GateTierWiringTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.LockCitationResolvesTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.PerfAnchorCoverageGuardTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.PerfTestClassificationTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.RawClockCensusTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.PerformanceRecordShapeGuardTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.KernelParityCoverageGuardTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.SurvivingDataNotInBuildGuardTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.AdmissionClaimIsAssertedGuardTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.VersionMentionFreshnessTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.rulekit.catalog.DslCatalogBridgeTest'
    }
    a12Guards.guardInputs(it, [
            'docs/API-GUIDE.md': file('docs/API-GUIDE.md'),
            // Derive from the conventional live test-source layout rather than duplicating the Lock registry's
            // file list. A future module/source lock is covered automatically; linked worktrees and generated
            // outputs are anchored exclusions.
            'canonical snippet test sources': fileTree('.') {
                include '**/src/test/**/*.java', '**/src/test/**/*.kt'
                exclude '.claude/**', '**/build/**'
            },
            // SurvivingDataNotInBuildGuardTest scans EVERY tracked .kt/.java, not just the src/test tree the
            // entry above covers: main sources, the KMP source sets (commonMain, jsTest, …), the dedicated
            // src/<lane>Test trees and loose script sources all scan. Undeclared, any of those could introduce a
            // build/ write site while this lane stayed UP-TO-DATE and the guard unrun. Its denominator is
            // Checkout.sources() — the git-tracked set — and this tree is a deliberate SUPERSET of it. A
            // ValueSource over `git ls-files` would declare that set exactly (7 ms, configuration-cache
            // correct); adopting it is an open decision, not a missing capability. docs/GUARD-INPUT-PROPOSAL.md.
            'build-path scan sources': fileTree('.') {
                include '**/*.java', '**/*.kt'
                exclude '.claude/**', '**/build/**', '.git/**', '**/.gradle/**'
            },
            // ApiFindingsNumberingGuardTest reads the findings list at runtime: the ordinals are public
            // anchors ("finding N", cited from production sources), so a prose-only edit must re-run it.
            'docs/API-FINDINGS.md': file('docs/API-FINDINGS.md'),
            // MvkLedgerTest reads the ledger's rows and bucket column at runtime. It used to run in the
            // broad `test` lane, which declares no markdown, so an edit to the ledger alone left that lane
            // UP-TO-DATE and the ledger's own guard silently did not run — measured by mutating a bucket and
            // watching `> Task :test UP-TO-DATE` report green.
            // LockCitationResolvesTest resolves every test class cited as a lock in these.
            'lock citation docs' : files(
                    'docs/KERNEL-FINDINGS.md',
                    'docs/INTERPRETER-FINDINGS.md',
                    'docs/MVK-LEDGER.md',
                    'docs/KERNEL-SEMANTICS.md',
                    'docs/INTERPRETER-PERFORMANCE.md',
                    'docs/INTERPRETER-PERFORMANCE-RESULTS.md'),
            // PerfAnchorCoverageGuardTest reads the committed absolute-time anchor beside PerfGateTest's source
            // (already covered above) to check that every growth lane is anchored at both scales — IF280.
            'perf anchors': file('adapter/src/test/resources/perf/anchors.json'),
            // PerformanceRecordShapeGuardTest reads every committed run at runtime. Undeclared, committing a
            // malformed record would leave this lane UP-TO-DATE and the shape unchecked — and the record is
            // exactly the artifact whose readability nothing else verifies.
            'performance record': fileTree('perf-results') { include '**/*.jsonl' },
            // VersionMentionFreshnessTest reads each of these at runtime; undeclared, a prose-only edit left
            // the broad `test` task UP-TO-DATE and the drift guard silently unrun.
            'version mentions' : files(
                    'README.md',
                    'plugin/README.md',
                    'plugin/CHANGELOG.md',
                    'plugin/.claude-plugin/plugin.json',
                    'plugin-codex/.codex-plugin/plugin.json',
                    'interpreter/public-release/README.md'),
            // AttributionDisclaimerLockTest reads each attribution surface at runtime. These are legal
            // statements: undeclared, deleting one would leave this lane UP-TO-DATE and the guard unrun.
            'attribution surfaces': files(
                    'README.md',
                    'core/src/main/java/io/github/mbackschat/a12/dm/package-info.java',
                    'docs/PROJECT-DESIGN.md',
                    'docs/INTERPRETER-RELEASE-SPEC.md',
                    'interpreter/public-release/DISCLAIMER.md',
                    'interpreter/public-release/README.md',
                    'interpreter/public-release/index.html',
                    'interpreter/consumer-tests/browser/index.html',
                    'plugin/README.md',
                    'plugin-codex/AGENTS.md',
                    'scripts/assemble-release-repo.sh'),
            'root build'       : file('build.gradle'),
            // BuildPerformancePolicyTest reads both at runtime: the repository declaration order and the
            // public-only marker. Undeclared, removing either would leave this lane UP-TO-DATE and unrun.
            'root settings'    : file('settings.gradle'),
            // The repository declaration is single-sourced and applied by BOTH settings files, so all three
            // are read at runtime and all three are declared. Undeclared, moving a repository out of the
            // shared file would leave this lane UP-TO-DATE and the single-sourcing assertion unrun.
            'shared repositories': file('gradle/public-repositories.gradle'),
            'build-logic settings': file('build-logic/settings.gradle'),
            // The observed-reads wire's producing half. It crosses a build boundary, so nothing but a text
            // match holds the two property names equal; undeclared, renaming one would leave this lane
            // UP-TO-DATE and the equality unchecked.
            'guard extension source': file(
                    'build-logic/src/main/kotlin/io/github/mbackschat/a12/dm/buildlogic/BuildGuardsExtension.kt'),
            // The two .no-global-gradle-repos markers are declared BELOW rather than here: deleting one is
            // the sanctioned way to build through a private registry, and guardInputs would report that as
            // an empty input — infrastructure breakage, which is the wrong diagnostic. They still have to be
            // declared somewhere, or deleting one leaves this lane UP-TO-DATE and the assertion that they
            // exist never runs.
            'cli build'        : file('cli/build.gradle'),
            // BuildPerformancePolicyTest has read build.sh at runtime since it was written, and reads the
            // preparation script since the JDK-pin single-sourcing check joined it. Undeclared, re-encoding the
            // pin in build.sh left this lane UP-TO-DATE and the guard unrun — found by mutating build.sh and
            // watching the mutant survive, which is the same class as the selftest's undeclared helper.
            'build wrapper'    : file('build.sh'),
            'source preparation': file('scripts/prepare-dmtool-source.sh'),
            'Gradle environment': file('scripts/gradle-environment.sh'),
            'gradle.properties': file('gradle.properties'),
            'cache smoke'      : file('scripts/verify-build-cache.sh'),
            'demo verifier'    : file('scripts/verify-demos.sh'),
            'demo verifier implementation': file('scripts/typescript/verify-demos.ts'),
            'CI workflow'      : file('.github/workflows/ci.yml'),
            'infographic specification': file('docs/INFOGRAPHICS.md'),
            'nightly workflow' : file('.github/workflows/nightly-performance.yml'),
            'perf launcher'    : file('scripts/perf.sh'),
            'perf anchor script': file('scripts/perf-anchor.sh'),
            // Both joined the JDK-pin denominator when they stopped re-encoding `java_home -v 21`. The JS one
            // is not a shell script but emits one, which is the same policy decision in a different language.
            'perf key profiler': file('scripts/perf-keys.sh'),
            'benchmark workflow': file('eval/benchmark.workflow.js'),
            'adapter build'    : file('adapter/build.gradle'),
            'interpreter build': file('interpreter/build.gradle'),
            'native capture'   : file('scripts/capture-native-config.sh'),
            // BuildPerformancePolicyTest reads the removal classifier at runtime too; undeclared since it was
            // added, so a script-only edit could leave this lane UP-TO-DATE and the assertion unrun.
            'native removals'  : file('scripts/check-native-metadata-removals.sh'),
            // DoctorScriptTest executes the public wrapper and typed implementation against fabricated machines;
            // undeclared, editing either would leave the lane UP-TO-DATE with its verdicts unchecked — which is
            // how the doctor's first version shipped with two wrong ones. The source-adjacent test is an input too
            // so a test-only edit cannot restore stale doc-guard evidence while CI owns its wildcard execution.
            'doctor'           : file('scripts/doctor.sh'),
            'doctor implementation': file('scripts/typescript/doctor.ts'),
            'doctor implementation tests': file('scripts/typescript/doctor.test.ts'),
            'TypeScript runtime gate': file('scripts/run-typescript.sh'),
            // ObligationsScriptTest executes the selftest, which copies obligations.sh into fabricated repos —
            // so BOTH are runtime inputs. Declared together: with only the selftest declared, editing the rule
            // it checks would leave this lane UP-TO-DATE and the new behaviour unverified.
            'obligations'      : file('scripts/obligations.sh'),
            'obligations tests': file('scripts/selftest-obligations.sh'),
            // dsl sources + the operator catalog moved to :rulekit in the Stage-4 module cut.
            'dsl sources'      : fileTree('rulekit/src/main/java/io/github/mbackschat/a12/dm/rulekit/dsl') { include '**/*.java' },
            'operator catalog' : fileTree('rulekit/src/main/resources/catalog')])

    // The two public-only markers, declared OUTSIDE guardInputs on purpose. They are read at runtime — the
    // policy test asserts each build root carries one — so undeclared, deleting one leaves this lane
    // UP-TO-DATE and that assertion never runs. They cannot ride guardInputs: a deliberate deletion is the
    // sanctioned way to build through a private registry, and the emptiness refusal would report it as a
    // moved folder. `.optional()` is what lets a declared file legally not exist.
    inputs.files(files('.no-global-gradle-repos', 'build-logic/.no-global-gradle-repos'))
            .withPropertyName('publicOnlyMarkers')
            .withPathSensitivity(org.gradle.api.tasks.PathSensitivity.RELATIVE)
            .optional()
}

// --- The public-API surface lock (Set S; RELEASE-SPEC §11, TESTING-SPEC "structural-law guardians") ------
// PublicApiGuardTest reads the committed goldens under `api/` at runtime — Gradle can't infer them as inputs,
// so it runs HERE with `api/` declared as THIS task's inputs (the docGuardTest lane). A golden edit re-runs
// ONLY this guard (never the ~150-test suite) and can't restore from the build cache into a false green; a
// kit's public API changing invalidates the task via the kit classes already on `sourceSets.test.runtimeClasspath`.
// `test` dependsOn this (below), so CI + a plain `:test` always drive it. `guardInputs` (the a12Guards extension)
// also fails LOUDLY if `api/` goes empty/missing — a moved golden dir can't silence the guard.
tasks.register('apiGuardTest', Test) {
    description = 'Golden-diff visibility lock for the published artifacts\' public API (split out so a golden edit re-runs only this).'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    // :interpreter-bridge is dumped but is NOT a dependency of this source set — a second ConditionReadBack
    // provider beside :adapter's makes the port ambiguous, and read-back REFUSES an ambiguous classpath, so
    // every kernel-oracle test here would fail on resolution. Its classes are built for the dump to read and
    // loaded by the guard itself.
    dependsOn ':interpreter-bridge:classes'
    filter {
        includeTestsMatching 'io.github.mbackschat.a12.dm.api.PublicApiGuardTest'
    }
    a12Guards.guardInputs(it, [
            'api goldens'              : fileTree('api') { include '**/*.api' },
            'bridge main sources'      : fileTree('interpreter-bridge/src/main') { include '**/*.kt', '**/*.java' },
    ])
}

// Its own source set, following the `noBackendTest` precedent above, because these two classes were the
// dominant cost of the whole root lane: 73 s of its 79 s of guard time (11 tests, 2 classes) against 14 s for
// the 1588-test suite they hung off. The cost was pure COUPLING, not work — sharing `sourceSets.test` made
// the compiled root test output (222 classes) their input, so every TDD edit anywhere in root's test tree
// re-ran them, and each run also had to load the kernel-laden test runtime classpath to select 11 tests.
// Both classes are genuinely standalone (JUnit + JDK only, zero project imports), which is what makes the
// split safe; their sibling guards are NOT (`CatalogProseReviewGuardTest` reads `OperatorCatalog`), so this
// is deliberately not applied estate-wide. The declared `guardInputs` below are unchanged and remain the
// real trigger.
sourceSets {
    releaseGuardTest
}
dependencies {
    releaseGuardTestImplementation platform('org.junit:junit-bom:5.11.4')
    releaseGuardTestImplementation 'org.junit.jupiter:junit-jupiter'
    releaseGuardTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.register('interpreterReleaseGuardTest', Test) {
    description = 'Synthetic interpreter mirror and staged-publisher laws with every runtime-read release input declared.'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.releaseGuardTest.output.classesDirs
    classpath = sourceSets.releaseGuardTest.runtimeClasspath
    a12Guards.guardInputs(it, [
            'assembler'         : file('scripts/assemble-interpreter-release-repo.sh'),
            'source statistics' : file('scripts/update-code-statistics.sh'),
            'mirror checker'    : file('scripts/check-interpreter-release-repo.sh'),
            'asset names'       : file('scripts/interpreter-release-assets.sh'),
            'mirror helpers'    : file('scripts/release-mirror-common.sh'),
            'release identity'  : file('scripts/release-git-identity.sh'),
            'publisher'         : file('scripts/publish-interpreter-release.sh'),
            'publisher core'    : file('scripts/interpreter-release-publisher-core.sh'),
            'GitHub backend'    : file('scripts/interpreter-release-github.sh'),
            'public smoke'      : file('scripts/smoke-interpreter-public-release.sh'),
            'Gradle environment': file('scripts/gradle-environment.sh'),
            'rehearsal'         : file('scripts/rehearse-interpreter-release.sh'),
            'rehearsal backend' : file('scripts/interpreter-release-rehearsal-host.sh'),
            'dmtool publisher'  : file('scripts/publish-release.sh'),
            'release gap checker': file('scripts/check-release-gaps.sh'),
            'gap ledgers'       : fileTree('docs') { include '*-GAPS.md' },
            'consumer programs' : fileTree('interpreter/consumer-tests') {
                include 'kotlin-jvm/**/*'
                include 'typescript/**/*'
            },
            'interpreter build'  : file('interpreter/build.gradle'),
            'release changelog' : file('interpreter/CHANGELOG.md'),
            'public documents'  : files(
                    fileTree('interpreter/public-release') { include '**/*' },
                    file('interpreter/README.md')),
            'public workflows'  : fileTree('.github/interpreter-mirror-workflows') { include '*.yml' },
            'release license'   : file('LICENSE'),
    ])
}

// The fixer: regenerate the five kit goldens in place from the live dump. One command, no hand-copy. The
// default run stays assert-only (CI catches a forgotten regenerate); only this task flips to the writer.
// The vocabulary guard probes the KERNEL (a few hundred consistency checks, ~4 s) and reads the derived artifact
// plus every consumer that claims to enumerate the admitted set. Its own task for the usual two reasons: an edit
// to one of those consumers re-runs this guard alone rather than the broad root suite, and the inputs are
// declared so a cached green cannot leave a consumer's enumeration unchecked.
tasks.register('vocabularyGuardTest', Test) {
    description = 'The admitted temporal format vocabulary is derived from the kernel, and every consumer that claims it agrees.'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
