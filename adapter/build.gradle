// H5-b: the checker's COLD first result, one fresh JVM per observation. It records and prints; it asserts no
// budget, because H5 requires ratification before the implementation it gates is measured and no checker number
// is ratified (docs/archived/PORTABLE-CONSISTENCY-IMPLEMENTATION-PLAN.md#h5-ordering). Deliberately NOT wired into any
// automated lane for the same reason — a schedule implies a bar.
tasks.register('checkerColdStartPerfTest', Test) {
    description = 'Measure the Kernel-free checker\'s cold first result over independent fresh processes.'
    group = 'measurement'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    // Single-fork because the observations are wall-clock, and the child processes are launched serially for the
    // same reason: this lane needs the machine, and parallelism inside it would measure contention.
    maxParallelForks = 1
    failFast = true
    systemProperty 'perf.checker.cold', 'true'
    // The path the CHILD gets: the checker's own resolved closure, plus this module's test output for the entry
    // point alone. That one entry is a directory rather than an artifact, so it adds no jar the child can load
    // past `CheckerColdStartMain` and what the checker itself pulls in.
    systemProperty 'perf.checker.cold.classpath',
        (checkerColdClasspath.files + sourceSets.test.output.classesDirs.files).join(File.pathSeparator)
    // 51, not 50: each process is one member of an interleaved N/4N pair, and the ratified estimator medians
    // the within-pair ratios — an odd count makes that median an observed ratio instead of the midpoint of two.
    // It also keeps the run at or above H5-b's own floor of 50 observations per scale.
    systemProperty 'perf.checker.cold.processes',
        providers.gradleProperty('checkerColdProcesses').getOrElse('51')
    systemProperty 'perf.checker.cold.n', providers.gradleProperty('checkerColdN').getOrElse('200')
    // Unset by default so the observation is of a plain standalone JVM; -PcheckerColdHeap=2g re-measures one
    // scale under a fixed heap, which is how a super-linear curve is told apart from memory pressure.
    if (providers.gradleProperty('checkerColdHeap').isPresent()) {
        systemProperty 'perf.checker.cold.heap', providers.gradleProperty('checkerColdHeap').get()
    }
    // -PcheckerColdJfr=<dir> attaches a flight recorder to every child and drops the sample floor, because a
    // recorded run is a DIAGNOSTIC and its durations are no longer observations. It is how the locus of the
    // super-linear curve this lane measured gets named, in the lane that raised the question.
    if (providers.gradleProperty('checkerColdJfr').isPresent()) {
        systemProperty 'perf.checker.cold.jfr', file(providers.gradleProperty('checkerColdJfr').get()).absolutePath
    }
    filter {
        includeTestsMatching 'io.github.mbackschat.a12.dm.adapter.perf.CheckerColdStartPerfTest'
    }
    // Measurements are observations, never reusable task outputs.
    outputs.upToDateWhen { false }
    outputs.cacheIf { false }
}

