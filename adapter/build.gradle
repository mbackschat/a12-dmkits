plugins {
    id 'java-library'
    id 'java-test-fixtures'
    // Kotlin JVM — for the interpreter↔kernel differential tests (laws/*DiffTest.kt) + the KernelCustomConditions
    // bridge in main; consumes :interpreter. See docs/INTERPRETER-ARCHITECTURE.md (the kernel-as-oracle approach).
    id 'org.jetbrains.kotlin.jvm'
}

// The kernel-adapter (PROJECT-DESIGN D15 / N8 tier 3): an OPT-IN, Java-only boundary around unstable
// `a12internal` services. Kernel types never escape its public signatures; the version is pinned and canary-tested;
// unsupported conversion fails loud. Most paths only parse/format/read. ReferenceRewriter is the deliberate narrow
// exception: it mutates one deserialized internal model behind a JSON-in/JSON-out boundary. This module is not part
// of the shipped, polyglot core.
// Node discovery for this module's two JS perf lanes — H5-f's cold-Node children and H5-g's browser sampler.
// Both use the PINNED form, which is the whole reason the resolver is shared rather than duplicated
// (gradle/node-tools.gradle carries the reasoning).
apply from: rootProject.file('gradle/node-tools.gradle')

repositories {
    mavenLocal()
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Ratchet (A12K-3589 / docs/KERNEL-INTEGRATION-NOTES "A12K-3589 kernel-API removal surface"): a kernel API MARKED FOR REMOVAL
// cannot compile in this kernel-facing module. We enable ONLY the `removal` lint (not `deprecation`) and treat
// it as an error, so a NEW call to a removal-scheduled kernel API (e.g. validateFull(IDocument, Locale),
// CustomFieldTypeService) fails the build — while the deliberately-retained plain-@Deprecated V1 document
// construction (its V2-native-builder migration is separate) still compiles. Covers compileJava + compileTestJava
// (the RuntimeLaws oracle is in test). Kotlin diff tests reach the kernel only through RuntimeLaws (Java), so the
// Java ratchet covers them. See docs/KERNEL-INTEGRATION-NOTES.md "A12K-3589 kernel-API removal surface".
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:removal', '-Werror']
}

def kernelVersion = '30.8.1'

def kernelClosureConsumerCompile = configurations.create('kernelClosureConsumerCompileDeps') {
    canBeConsumed = false
    canBeResolved = true
    description = 'Exactly the compile dependencies used by the fresh kernel validation consumer.'
}
def kernelClosureConsumerRuntime = configurations.create('kernelClosureConsumerRuntimeDeps') {
    canBeConsumed = false
    canBeResolved = true
    extendsFrom kernelClosureConsumerCompile
    description = 'Exactly the runtime dependencies used by the fresh kernel validation consumer.'
}
def checkerColdClasspath = configurations.create('checkerColdClasspath') {
    canBeConsumed = false
    canBeResolved = true
    description = 'Exactly what a standalone Kernel-free checker process resolves — the H5-b cold lane.'
}

sourceSets {
    kernelClosureConsumer {
        java.srcDir 'src/kernelClosureConsumer/java'
        compileClasspath = kernelClosureConsumerCompile
        runtimeClasspath = output + kernelClosureConsumerRuntime
    }
}

dependencies {
    // The kernel is a Lombok codebase, and Lombok's `@NonNull` is CLASS-retention — so it is baked into the
    // published kernel bytecode (107 `Llombok/NonNull;` descriptors in kernel-md-a12internal-30.8.1.jar alone)
    // while the kernel POMs never declare it. javac ignores an unresolvable CLASS-retention annotation; Kotlin
    // 2.4 does not, and refuses a type it infers from such a signature. Measured on the 2.2 → 2.4 bump
    // (2026-09-20), which is the only variable that moved — the kernel pin is unchanged:
    //   CorpusModelPreparer.kt:56:33 Type annotation class 'lombok.NonNull' of the inferred type is inaccessible.
    // `testCompileOnly` is the exact scope: adapter/src/main holds no Kotlin at all, and this is an annotation
    // the compiler must resolve, never something this module ships or runs against.
    testCompileOnly 'org.projectlombok:lombok:1.18.42'
    // The kernel-free kits — BoundModel/Rule/Dsl + ReferenceResolvers + the SPI ports this backend implements.
    // Stage-4 module cut: the single root project split into per-kit modules, so `api project(':')` becomes an
    // `api` edge to each kit (re-exported to consumers — :cli/:schemakit — exactly as `project(':')` was).
    // Kernel-decoupling stage 3: the kits are kernel-free, so the kernel-md-facade this module needs
    // (DocumentModelServiceFactory, IDocumentModel, IDocumentModelService = expand/checkConsistency, the
    // DM-JSON serializer, and the a12-base model-consistency Notification/Severity types it brings
    // transitively) is declared HERE, not inherited. This module IS the kernel backend (it implements the SPI
    // ports), so kernel types are expected — the N8 boundary keeps them off public signatures.
    api project(':core')
    api project(':rulekit')
    api project(':modelkit')
    api project(':edit')
    implementation "com.mgmtp.a12.kernel:kernel-md-facade:${kernelVersion}"

    // The a12internal *read* tier — adapter-only (core must never depend on these per N8/D15):
    implementation "com.mgmtp.a12.kernel:kernel-core-tool-api:${kernelVersion}"      // IMVK_Service, IRuleParser, IConditionFormatter, IRuleMetaInformation, ado.IRule/IEntity/IEC, IProblemReporter
    implementation "com.mgmtp.a12.kernel:kernel-core-parsetree-api:${kernelVersion}" // ICondition (the transport AST)
    implementation "com.mgmtp.a12.kernel:kernel-md-model:${kernelVersion}"           // DocumentModelService.getMvkServiceForModel, ElementContainer
    implementation "com.mgmtp.a12.kernel:kernel-md-serializer:${kernelVersion}"      // ExternalDocumentModelSerializerService.getInternDocumentModel
    implementation "com.mgmtp.a12.kernel:kernel-md-a12internal:${kernelVersion}"     // internal DocumentModel
    implementation "com.mgmtp.a12.kernel:kernel-core-facade:${kernelVersion}"        // ServiceFactory.getCalculationService — the read surface for COMPUTATIONS (ICalculationService.extractCalculationInfo)
    implementation "com.mgmtp.a12.kernel:kernel-core-calc:${kernelVersion}"          // IWithComparisonOperation.getOriginalOperation — unwrap a computation alternative's value-expression from its assignment wrapper

    // The runtime *evaluation* tier — build a document instance and run the kernel's runtime validation
    // to observe which rules actually FIRE on data. Promoted from test-only to MAIN (2026-06-08) for the
    // public `KernelAdapter.evaluate` seam (the `eval-doc` verb / judge-verifies-against-kernel); the
    // F-LAW behavioral-law oracle (`laws/RuntimeLaws`) rides the same tier. Boundary still holds — these
    // kernel runtime types never escape a public adapter signature (evaluate takes a Map, returns EvalResult).
    implementation "com.mgmtp.a12.kernel:kernel-md-runtime-api:${kernelVersion}"   // IDocumentRtService, IDocumentValidationResult, IMessage
    implementation "com.mgmtp.a12.kernel:kernel-md-document-api:${kernelVersion}"  // IDocument, IDocumentFactory, IEntityInstance
    runtimeOnly "com.mgmtp.a12.kernel:kernel-md-runtime-service:${kernelVersion}"  // DocumentDynamicRtService impl behind the facade

    // The fresh comparator derives its graph from the executable consumer source set: facade at compile time,
    // the dynamic runtime implementation at runtime. Their metadata supplies every needed API/transitive edge.
    add('kernelClosureConsumerCompileDeps', "com.mgmtp.a12.kernel:kernel-md-facade:${kernelVersion}")
    add('kernelClosureConsumerRuntimeDeps', "com.mgmtp.a12.kernel:kernel-md-runtime-service:${kernelVersion}")

    // CORE custom-condition SPI (the IData-based contract the kernel's own conditions + JS/TS codegen use) —
    // for KernelCustomConditions, the JVM bridge that runs a project's EXISTING kernel ICustomCondition on the
    // interpreter. core-runtime-api resolves to 32.3.4 in the 30.8.1 distribution (already on the runtime
    // classpath via md-runtime-service; promoted to compile here). The bridge provides its OWN IData/IIdentifier
    // (the kernel documents the caller does so) — it constructs no kernel `…Impl` (N8/D15 guardrail).
    implementation "com.mgmtp.a12.kernel:kernel-core-runtime-api:32.3.4"           // ICustomCondition (core), IData, IIdentifier

    // The model-performance profile is a standalone JSON artifact consumed by both the adapter facade
    // and the CLI. Its package-private codec validates the current profile shape before synthesis.
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'

    // modelkit (structure builder) folded into the root project (2026-06-09) — its classes arrive via
    // `api project(':')`, so a read round-trip's test can author a model with it without a separate dep.

    // The kernel-free interpreter (docs/INTERPRETER-ARCHITECTURE.md). Its JVM target is consumed here for two
    // reasons: (1) MAIN — KernelCustomConditions bridges a kernel core ICustomCondition onto the interpreter's
    // CustomCondition SPI; (2) TEST — the kernel oracle (RuntimeLaws) runs the differential comparison.
    implementation project(':interpreter')
    testFixturesImplementation project(':interpreter')

    // The kernel-free ConditionReadBack provider — TEST-ONLY, and the ONLY place both providers of that port
    // are on one classpath, which is what makes the parity differential (ConditionReadBackParityTest)
    // expressible. Test scope keeps :interpreter-bridge off :adapter's own consumers.
    testImplementation project(':interpreter-bridge')

    // The classpath a COLD checker process gets, and it is a configuration rather than a filter over this
    // module's test runtime on purpose: H5-b measures standalone checking, so a kernel or Java-kit artifact on
    // that path would make every number an answer to a different question. Resolving `:consistency` alone means
    // the path is whatever the checker DECLARES it needs — it cannot drift as this module's test dependencies
    // grow. CheckerColdStartPerfTest additionally refuses a foreign artifact at run time, because a
    // configuration can still be wired to the wrong task.
    add('checkerColdClasspath', project(':consistency'))

    // The Kernel-free consistency checker — TEST-ONLY, and only so its condition parser can be swept over the
    // same real corpora the interpreter's is (ParserCorpusSweepTest). Those corpora are external siblings
    // discovered from this module's tests; the checker must not depend on them, and a second harvest here
    // would be a second population that could drift from the first. The edge is deliberately test-scoped:
    // :consistency is a standalone module and nothing shipping depends on it.
    testImplementation project(':consistency')

    // Custom-field-type SPI (predefined types) — TEST-ONLY: lets the differential register a project type
    // (e.g. a pattern-based "EMail") in the kernel oracle, so `Valid(field, "EMail")` does a REAL check (the
    // bare kernel ships none → degenerate no-op). The impl 30.8.1 depends on this api 28.2.0 (ABI-consistent).
    testImplementation "com.mgmtp.a12.kernel:kernel-core-customfieldtype-api:28.2.0"

    // The kernel-probe artifact's published schema is checked against real output, the way :cli's schemas are —
    // an unchecked schema drifts, and this one is what an external consumer reads the artifact through.
    testImplementation 'com.networknt:json-schema-validator:1.5.7'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-launcher'
}

def kernelClosureConsumerJar = tasks.register('kernelClosureConsumerJar', Jar) {
    archiveBaseName = 'kernel-closure-consumer'
    archiveVersion = ''
    from sourceSets.kernelClosureConsumer.output
    dependsOn tasks.named('kernelClosureConsumerClasses')
}

def kernelClosureConsumerRun = tasks.register('kernelClosureConsumerRun', JavaExec) {
    group = 'verification'
    description = 'Execute the fresh kernel validation consumer before measuring its runtime closure.'
    dependsOn kernelClosureConsumerJar
    classpath = files(kernelClosureConsumerJar.flatMap { it.archiveFile }) + kernelClosureConsumerRuntime
    mainClass = 'io.github.mbackschat.a12.dm.adapter.closure.KernelValidationConsumer'
}

def kernelRuntimeClosureReport = tasks.register('kernelRuntimeClosureReport') {
    group = 'verification'
    description = 'Write the informative fresh-consumer kernel runtime closure; this task promotes no NFR number.'
    def reportFile = layout.buildDirectory.file('reports/interpreter-closure/kernel-runtime-closure.txt')
    inputs.files(kernelClosureConsumerRuntime)
    inputs.files(kernelClosureConsumerJar.flatMap { it.archiveFile })
    outputs.file(reportFile)
    dependsOn kernelClosureConsumerRun
    doLast {
        def runtime = kernelClosureConsumerRuntime
        def files = runtime.files.collectEntries { [(it.canonicalPath): it] }
        def artifacts = runtime.incoming.artifactView {}.artifacts.artifacts
        def byPath = artifacts.groupBy { it.file.canonicalPath }
        def errors = []
        files.each { path, file ->
            def matches = byPath[path] ?: []
            if (matches.size() != 1) {
                errors << "${path} maps to ${matches.size()} resolved artifacts instead of exactly one".toString()
            }
        }
        byPath.keySet().findAll { !files.containsKey(it) }.each {
            errors << "${it} is a resolved artifact absent from runtime files".toString()
        }
        if (errors) {
            throw new GradleException("kernel closure comparator reconciliation failed:\n  " + errors.join('\n  '))
        }
        def own = kernelClosureConsumerJar.get().archiveFile.get().asFile
        def fileEntries = files.keySet().sort().collect { path ->
            def artifact = byPath[path][0]
            def component = artifact.id.componentIdentifier
            def identity = component instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier
                ? "${component.group}:${component.module}:${component.version}".toString()
                : component.displayName
            [identity: identity, bytes: files[path].length()]
        }
        def artifactComponents = artifacts*.id*.componentIdentifier.toSet()
        def graphOnly = runtime.incoming.resolutionResult.allComponents.findAll { component ->
            def ownRoot = component.id instanceof org.gradle.api.artifacts.component.ProjectComponentIdentifier &&
                component.id.projectPath == project.path
            !ownRoot && !artifactComponents.contains(component.id)
        }.collect { component ->
            [identity: component.id.displayName]
        }
        def entries = fileEntries + graphOnly
        long total = own.length() + (fileEntries.sum { it.bytes as long } ?: 0L)
        def report = reportFile.get().asFile
        report.parentFile.mkdirs()
        report.text = "kernel fresh-consumer JVM runtime closure — INFORMATIVE ONLY; no threshold promoted\n" +
            "reconciled-files=${fileEntries.size()} graph-only=${graphOnly.size()} entries=${entries.size() + 1} bytes=${total}\n" +
            "  ${own.length()} bytes  ${own.name} (fresh validation consumer)\n" +
            entries.sort { it.identity }.collect {
                "  ${it.bytes == null ? 'graph-only' : "${it.bytes} bytes"}  ${it.identity}"
            }.join('\n') + '\n'
        println "[closure] informative kernel comparator: ${total} bytes across ${entries.size() + 1} entries → ${report}"
    }
}
tasks.named('check') { dependsOn kernelRuntimeClosureReport }

tasks.withType(Test).configureEach {
    // RuntimeLaws shares exact-model KernelEngine instances inside each test fork. Concurrent service use has
    // not been measured, and the kernel serializes same-header-id code generation across engine-local caches.
    // Keep methods serial and scale through isolated Gradle forks; GateTierWiringTest pins this boundary.
    systemProperty 'junit.jupiter.execution.parallel.enabled', 'false'
    // The per-pair parity trace is a pure diagnostic (asserts nothing, prints when on) and its question — where
    // does THIS row's noise come from — is asked of whichever lane produced the suspect number, so it is forwarded
    // to every Test task rather than to `test` alone. The isolated `perfGateTest` is the lane it is usually run in.
    if (System.getProperty('perf.trace') != null) systemProperty 'perf.trace', System.getProperty('perf.trace')
}

tasks.named('test') {
    systemProperty 'perf.results.dir', rootProject.file('perf-results')
    // Gate tiering (docs/TESTING-SPEC "Test tiers"): the performance tests (@Tag 'perf' routine tier + @Tag
    // 'perf-bench' checkpoint tier) and the differential fuzzers (@Tag 'fuzz') are EXCLUDED from the default local
    // run. Opt in with -PrunPerf / -PrunFuzz (or -PallTests for all three). CI runs fuzz on every push and the
    // isolated perfGateTest nightly.
    //
    // NO bar on interpreter performance may run here, in either tier: 2-4 parallel forks are the configuration
    // CLAUDE.md forbids for a timed task ("a task carrying a timing assertion gets the machine to itself") and
    // which manufactured a false 10.24x growth failure once. -PrunPerf is a deliberate local override for a drill,
    // not a lane anything automated uses.
    //
    // ONE clock-reading assertion stays here on purpose, and a review found it before this comment named it:
    // PerfGrowthEstimatorTest.currentThreadCpuExcludesBlockedWallTime. It protects the contract every growth floor
    // rests on — that measureCurrentThreadCpu excludes blocked time — so it must be answered on every push rather
    // than only in a 4m44s gate. It is safe because its sensitivity runs the protective way: contention only ADDS
    // wall time and leaves CPU-during-sleep near zero, so load pushes both of its assertions further into passing.
    // That reasoning is specific to its shape, not a general licence, and nothing mechanical stops a NEW
    // clock-reading assertion from landing in this lane — PerfTestClassificationTest is syntactic (IG131).
    // Reuse the kernel's GENERATED code across runs (KernelModelCodeCache) — the kernel still evaluates every
    // document live, so this lane stays an oracle; only the ~77% of per-model cost that is code GENERATION is
    // skipped. Opted in here and nowhere else: every perf/measurement lane must generate what it times, and the
    // cache defaults off so a new timing lane cannot inherit it by omission. A perf run through THIS task opts
    // back out, because -PrunPerf pulls the timing bars into a lane that is otherwise cached.
    if (!project.hasProperty('runPerf') && !project.hasProperty('allTests')) {
        systemProperty 'rk.kernelCodeCache', 'true'
    }
    useJUnitPlatform {
        def all = project.hasProperty('allTests')
        if (!all && !project.hasProperty('runPerf')) { excludeTags 'perf'; excludeTags 'perf-bench' }
        if (!all && !project.hasProperty('runFuzz')) excludeTags 'fuzz'
        // The corpus generator mutates the working tree (writes corpus/cases/**); opt in with -PrunCorpusCapture.
        // The everyday guard is CorpusReplayTest, which replays the committed files (no exclusion).
        if (!project.hasProperty('runCorpusCapture')) excludeTags 'corpus-capture'
        // The real-corpus sweep reads the EUPL/proprietary corpora in place (nothing persisted) and is
        // slow (per-model kernel codegen); it skips when absent but is excluded from the default/CI run — opt in
        // with -PrunCorpusSweep (+ ../a12-kernel-mm present and/or -Da12.corpus1.dir=<workspaces>).
        if (!project.hasProperty('runCorpusSweep')) excludeTags 'corpus-sweep'
        // Kernel MEASUREMENT probes (@Tag 'kernel-probe'): footprint/attribution reports whose kernel-side result
        // changes only on a kernel upgrade, never on our own commits. They assert nothing beyond their own validity
        // and are not regression gates, so they are excluded even under -PallTests and -PrunPerf (a perf checkpoint
        // has no reason to re-run kernel probes). Opt in with -PrunKernelProbe; refresh them on a kernel bump
        // (docs/KERNEL-UPGRADE.md).
        if (!project.hasProperty('runKernelProbe')) excludeTags 'kernel-probe'
    }
    // Fork the kernel-heavy suite across JVMs — distributes test CLASSES over N forks so the differential
    // + fuzz classes run in parallel (the kernel oracle does Groovy codegen per rule). Each fork is an isolated
    // JVM+kernel, so there's no shared state to race. Cores are capped because every fork loads the memory-heavy
    // kernel; heap stays at the default because forks run subsets, so a fixed cap would only risk OOM. Override
    // with -PtestForks=N. No maxParallelForks=1
    // guard is needed here — the native-agent reflection capture runs :cli:test, not :adapter.
    maxParallelForks = (project.findProperty('testForks') ?: Math.max(2, Math.min(4, Runtime.runtime.availableProcessors()))) as int
    // Forward opt-in harness locations (read-only corpora) AND the opt-in perf knobs from the Gradle CLI to the
    // test JVM, e.g. -Da12.kernel.mm.dir=… / -Dperf.profile=true / -Dperf.edge=true — harnesses skip (or gate)
    // when their property is unset.
    ['a12.kernel.mm.dir', 'a12.corpus1.dir', 'corpus.sweep.java', 'ig44.model', 'ig44.seed', 'ig44.dump',
     'ig44.vcv', 'ig47.kernel', 'ig47.interp', 'ig47.model', 'ig47.seed', 'ig47.dump',
     'atom.kernel', 'atom.interp', 'atom.model', 'atom.seed', 'atom.dump', 'atom.valuediff',
     'vf.model', 'vf.seed', 'vf.side', 'vf.sig', 'vf.kernelmm', 'vf.dump',
     'replay.model', 'replay.op', 'corpus.hostile',
     'perf.profile', 'perf.n', 'perf.rules', 'perf.edge', 'perf.edge.n', 'perf.edge.counts', 'perf.scaling', 'perf.scaling.n',
     'perf.synthesized', 'perf.synth.model', 'perf.synth.leaf', 'perf.synth.seed', 'perf.synth.op',
     'perf.synth.pairs', 'perf.synth.warmup', 'perf.synth.iters', 'perf.synth.complexity',
     'perf.scenario',
     'a12.engine.footprint', 'a12.engine.footprint.hold', 'a12.engine.footprint.models',
     'a12.java.histogram', 'a12.java.histogram.hold', 'a12.java.histogram.model', 'a12.java.histogram.strategy',
     'rp.perf'].each { k ->
        if (System.getProperty(k) != null) systemProperty k, System.getProperty(k)
    }
    def synthesizedModel = System.getProperty('perf.synth.model')
    if (System.getProperty('perf.synthesized') == 'true' && synthesizedModel != null) {
        inputs.file(synthesizedModel).withPropertyName('synthesizedPerformanceModel')
    }
    // Opt-in JFR sampling: -Dperf.jfr=<file.jfr> records the (profile-config) flight recorder on the test JVM
    // and dumps on exit — feed a tight validateFull loop (a perf.profile test) and `jfr print` the hot methods.
    def jfr = System.getProperty('perf.jfr')
    if (jfr != null) jvmArgs "-XX:StartFlightRecording=settings=profile,filename=${jfr},dumponexit=true"
    // `-Pfast` drops the heavyweight guard prerequisites for the dev inner loop: a targeted differential run is
    // ~8 s instead of ~1m40s (measured 2026-07-24). These guards re-execute on every :interpreter change
    // (corpusReplayTest replays the whole committed corpus THROUGH the interpreter; the fixture guards fork
    // kernel-heavy JVMs) and `--tests` filters only the test task, NOT its dependencies. A full run (no -Pfast)
    // still drives them — the checkpoint gate and CI are unchanged.
    //
    // …but only the HEAVYWEIGHT ones: a guard cheap enough that dropping it saves nothing is never droppable
    // (the root module's rule, applied here — TESTING-SPEC "Test tiers"). Measured per task from a green run's
    // result XMLs, 2026-08-15: profileFixtureGuardTest 73.1s and corpusReplayTest 9.6s against
    // workspacePreparationFixtureGuardTest 3.9s, footprintFixtureGuardTest 1.0s,
    // retainedComputationFixtureGuardTest 0.9s and performanceFixtureGuardTest 0.8s. Dropping the four
    // FIXTURE guards buys 6.6s of the ~89s and costs the class where a committed fixture silently stops
    // matching what the code produces — the same class that let the API goldens ship stale under the root
    // lever. They stay unconditional; the two broad ones remain the checkpoint's job.
    dependsOn 'footprintFixtureGuardTest'
    dependsOn 'performanceFixtureGuardTest'
    dependsOn 'retainedComputationFixtureGuardTest'
    dependsOn 'workspacePreparationFixtureGuardTest'
    dependsOn 'checkerSilenceGuardTest'
    if (!project.hasProperty('fast')) {
        dependsOn 'corpusReplayTest'
        dependsOn 'profileFixtureGuardTest'
    } else {
        doFirst {
            logger.lifecycle('-Pfast: SKIPPING corpusReplayTest, profileFixtureGuardTest — this run is NOT the '
                    + 'estate. Re-run without -Pfast before treating green as a checkpoint.')
        }
    }
    dependsOn 'perfScriptGuardTest'
    // Millisecond filename lint — runs in the -Pfast inner loop too (unlike the heavyweight guards above).
    dependsOn 'verifySemanticsMapRegistration'
    // The corpus guards read corpus/cases/** at runtime; they live in corpusReplayTest (with those files declared
    // as its inputs) so a case edit re-runs ONLY them (not the whole kernel-heavy suite) and can't go up-to-date /
    // restore from the build cache into a FALSE GREEN. `test` dependsOn it, so CI + local always drive it.
    filter {
        excludeTestsMatching 'io.github.mbackschat.a12.dm.adapter.laws.CheckerSilenceOnMutatedModelsTest'
        excludeTestsMatching 'io.github.mbackschat.a12.dm.adapter.laws.CheckerClassAgreementTest'
        excludeTestsMatching 'io.github.mbackschat.a12.dm.adapter.laws.CheckerPathGridAgreementTest'
        excludeTestsMatching 'io.github.mbackschat.a12.dm.adapter.laws.CheckerKeyedOperandAgreementTest'
        excludeTestsMatching 'io.github.mbackschat.a12.dm.adapter.laws.CheckerIndexKeyConstantAgreementTest'
        excludeTestsMatching 'io.github.mbackschat.a12.dm.adapter.laws.CheckerFieldValueReadCarrierAgreementTest'
        excludeTestsMatching 'io.github.mbackschat.a12.dm.adapter.laws.CheckerEntityListCategoryAgreementTest'
        excludeTestsMatching 'io.github.mbackschat.a12.dm.adapter.laws.CheckerComputationJoinedConditionAgreementTest'
        excludeTestsMatching 'io.github.mbackschat.a12.dm.adapter.laws.CheckerComparisonConstantAgreementTest'
        excludeTestsMatching 'io.github.mbackschat.a12.dm.adapter.laws.CheckerFilterBodyAgreementTest'
        excludeTestsMatching 'io.github.mbackschat.a12.dm.adapter.laws.CheckerRuleReferenceSetAgreementTest'
        excludeTestsMatching 'io.github.mbackschat.a12.dm.adapter.laws.CheckerRepetitionNotUniqueGateAgreementTest'
        excludeTestsMatching 'io.github.mbackschat.a12.dm.adapter.laws.CheckerRepetitionNotUniquePairedGateAgreementTest'
        excludeTestsMatching 'io.github.mbackschat.a12.dm.adapter.laws.CheckerFirstFilledValueTypeAgreementTest'
        excludeTestsMatching 'io.github.mbackschat.a12.dm.adapter.laws.CheckerNearMissSweepTest'
        excludeTestsMatching 'io.github.mbackschat.a12.dm.adapter.laws.CorpusReplayTest'
        excludeTestsMatching 'io.github.mbackschat.a12.dm.adapter.laws.CorpusSchemaGuardTest'
        excludeTestsMatching 'io.github.mbackschat.a12.dm.adapter.perf.FootprintScenarioFixtureGuardTest'
        excludeTestsMatching 'io.github.mbackschat.a12.dm.adapter.perf.PerformanceScenarioFixtureGuardTest'
        excludeTestsMatching 'io.github.mbackschat.a12.dm.adapter.perf.PerfScriptContractTest'
        excludeTestsMatching 'io.github.mbackschat.a12.dm.adapter.perf.PerfAnchorScriptTest'
        excludeTestsMatching 'io.github.mbackschat.a12.dm.adapter.perf.PerfKeysScriptTest'
        excludeTestsMatching 'io.github.mbackschat.a12.dm.adapter.perf.PerfTrendScriptTest'
        excludeTestsMatching 'io.github.mbackschat.a12.dm.adapter.perf.PerfHistoryScriptTest'
        excludeTestsMatching 'io.github.mbackschat.a12.dm.adapter.perf.PerfReportScriptTest'
