plugins {
    id 'java-library'
    // Kotlin JVM — for the interpreter↔kernel differential tests (laws/*DiffTest.kt) + the KernelCustomConditions
    // bridge in main; consumes :interpreter. See docs/INTERPRETER-ARCHITECTURE.md (the kernel-as-oracle approach).
    id 'org.jetbrains.kotlin.jvm' version '2.2.0'
}

// The kernel-adapter (PROJECT-DESIGN D15 / N8 tier 3): an OPT-IN, Java-only module that consumes the
// kernel's `a12internal` *read* surface (parser / formatter / referenced-entities) under the four
// guardrails — boundary conversion (kernel types never escape a public signature), read-only (never
// construct/mutate kernel `…Impl`), pin + canary (pinned version + a CI canary failing loudly on an
// upgrade break), fail-fast coverage. This is deliberately NOT part of the shipped, polyglot core.
repositories {
    mavenLocal()
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Ratchet (A12K-3589 / docs/TESTING-SPEC "no deprecated-kernel-API" guardian): a kernel API MARKED FOR REMOVAL
// cannot compile in this kernel-facing module. We enable ONLY the `removal` lint (not `deprecation`) and treat
// it as an error, so a NEW call to a removal-scheduled kernel API (e.g. validateFull(IDocument, Locale),
// CustomFieldTypeService) fails the build — while the deliberately-retained plain-@Deprecated V1 document
// construction (its V2-native-builder migration is separate) still compiles. Covers compileJava + compileTestJava
// (the RuntimeLaws oracle is in test). Kotlin diff tests reach the kernel only through RuntimeLaws (Java), so the
// Java ratchet covers them. See docs/KERNEL-INTEGRATION-NOTES.md "A12K-3589 kernel-API removal surface".
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:removal', '-Werror']
}

def kernelVersion = '30.8.1'

// The internal CAPTURE source set — the portable evidence-capture boundary (CONFORMANCE-CORPUS-SPEC §15,
// the adopted A12-DMKITS-CAPTURE-PROPOSAL). Adapter-internal developer tooling, Gradle-invoked: NOT a
// published component, NOT a dmtool verb, NOT on the interpreter's dependency surface — :cli/:interpreter
// never see it (only :adapter's own tests consume its output). It inherits main's dependency set (the
// kernel routes + the kits + the interpreter) because the two kernel route mappers live here; the neutral
// DTO/schema packages inside it are held kernel-free by `verifyCapturePurity` below.
sourceSets {
    capture {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    // The consumer-facing authoring example (`capture-examples/scenario-example/` — a complete, runnable
    // scenario root) doubles as the tests' canonical valid fixture: exposing the directory as a test
    // resource root keeps ONE source (no drift between the published example and the executed fixture).
    test {
        resources.srcDir 'capture-examples'
    }
}
configurations {
    captureImplementation.extendsFrom implementation
    captureRuntimeOnly.extendsFrom runtimeOnly
}

// Separation by linting (the verifyInterpreterPurity / verifyKitPurity pattern): kernel types terminate
// inside the two kernel route mappers (`capture.runner.kernel`), interpreter types inside the interpreter
// runner (`capture.runner.interpreter`), and the NEUTRAL zone (dto/schema/json/packet/…) references
// neither engine. Comments AND string literals are stripped first, so only a real compile-time type
// reference fails — the LeakGuard legitimately NAMES the forbidden prefix as scan vocabulary in a string.
def verifyCapturePurity = tasks.register('verifyCapturePurity') {
    group = 'verification'
    description = 'Fail when a kernel/interpreter type crosses the capture DTO boundary (CONFORMANCE-CORPUS-SPEC §15).'
    def srcRoot = file('src/capture')
    inputs.dir(srcRoot)
    doLast {
        def kernelPrefixes = ['com.mgmtp.', 'groovy.']
        def interpreterPrefix = 'io.github.mbackschat.a12.dm.interpreter.'
        def violations = []
        def scanned = 0
        srcRoot.eachFileRecurse(groovy.io.FileType.FILES) { f ->
            if (!f.name.endsWith('.java')) {
                return
            }
            scanned++
            def rel = srcRoot.toPath().relativize(f.toPath()).toString()
            def forbidden
            if (rel.contains('capture/runner/kernel/')) {
                forbidden = [interpreterPrefix]                     // kernel allowed; the interpreter may not leak in
            } else if (rel.contains('capture/runner/interpreter/')) {
                forbidden = kernelPrefixes                          // interpreter allowed; the kernel may not leak in
            } else {
                forbidden = kernelPrefixes + [interpreterPrefix]    // the neutral zone: neither engine
            }
            def code = f.text.replaceAll('(?s)/\\*.*?\\*/', '')
                    .replaceAll('//[^\\n]*', '')
                    .replaceAll('"(?:\\\\.|[^"\\\\])*"', '""')
            forbidden.each { prefix ->
                if (code.contains(prefix)) {
                    violations << "${rel}: references forbidden prefix '${prefix}'"
                }
            }
        }
        if (violations) {
            throw new GradleException("capture DTO-boundary purity violated — kernel/interpreter types must " +
                    "terminate in their route mapper packages (CONFORMANCE-CORPUS-SPEC §15):\n  " +
                    violations.join('\n  '))
        }
        // The #17 silent-empty-scan defense: a moved/renamed source root must fail LOUDLY, never pass vacuously.
        if (scanned == 0) {
            throw new GradleException("verifyCapturePurity scanned ZERO .java files under ${srcRoot} — " +
                    "the source root moved or emptied; a vacuous pass is a false green (the #17 guardInputs class).")
        }
    }
}
tasks.named('check') { dependsOn verifyCapturePurity }

// The capture COMMAND surface (CONFORMANCE-CORPUS-SPEC §15d): Gradle is only the launcher — every task
// drives the one real entry (cli.CaptureTool), the same entry the self-tests and the mutation suite call.
// Options arrive as -Pcapture.* properties (documented in each task's description + corpus/README.md).
def captureToolTask = { String taskName, String taskDescription, Closure<List<String>> buildArgs ->
    tasks.register(taskName, JavaExec) {
        group = 'capture'
        description = taskDescription
        classpath = sourceSets.capture.runtimeClasspath
        mainClass = 'io.github.mbackschat.a12.dm.adapter.capture.cli.CaptureTool'
        systemProperty 'capture.repoRoot', rootProject.projectDir.absolutePath
        doFirst { args = buildArgs() }
    }
}
def requireProperty = { String name ->
    def value = project.findProperty(name)
    if (value == null) {
        throw new GradleException("missing -P${name} (see the task description)")
    }
    value.toString()
}
captureToolTask('captureCapabilities',
        'Print the machine-readable capture capability output (a12-dmkits-capture-capabilities-v1).',
        { -> ['capabilities'] })
captureToolTask('captureValidateScenarios',
        'Structurally validate a capture-scenario-set-v1 file (no engine, nothing written): -Pcapture.scenarios=<file>.',
        { -> ['validate-scenarios', '--scenarios', requireProperty('capture.scenarios')] })
captureToolTask('capture',
        'Capture an evidence packet: -Pcapture.scenarios=<file> -Pcapture.output=<new-or-empty-dir> [-Pcapture.development].',
        { ->
            def args = ['capture']
            if (project.hasProperty('capture.development')) {
                args << '--development'
            }
            args + ['--scenarios', requireProperty('capture.scenarios'),
                    '--output', requireProperty('capture.output')]
        })
captureToolTask('captureVerify',
        'Apply a named qualification policy to an immutable packet (writes a digest-bound report dir): ' +
                '-Pcapture.packet=<dir> -Pcapture.packetReceiptSha256=<hex> -Pcapture.policy=<id> -Pcapture.output=<new-dir>.',
        { ->
            ['verify', '--packet', requireProperty('capture.packet'),
             '--packet-receipt-sha256', requireProperty('capture.packetReceiptSha256'),
             '--policy', requireProperty('capture.policy'),
             '--output', requireProperty('capture.output')]
        })
captureToolTask('captureDiffPackets',
        'Structural packet diff (input/provenance vs per-runner observation drift): ' +
                '-Pcapture.before=<dir> -Pcapture.after=<dir> -Pcapture.projection=<id> -Pcapture.output=<new-dir>.',
        { ->
            ['diff-packets', '--before', requireProperty('capture.before'),
             '--after', requireProperty('capture.after'),
             '--projection', requireProperty('capture.projection'),
             '--output', requireProperty('capture.output')]
        })
captureToolTask('captureDiffReports',
        'Structural report diff (policy/profile/verifier vs qualification-result drift): ' +
                '-Pcapture.before=<dir> -Pcapture.after=<dir> -Pcapture.output=<new-dir>.',
        { ->
            ['diff-reports', '--before', requireProperty('capture.before'),
             '--after', requireProperty('capture.after'),
             '--output', requireProperty('capture.output')]
        })

// The compact semantic-observation exporter (CONFORMANCE-CORPUS-SPEC §15h) — post-capture, one family,
// additive beside the frozen V1 surface: a SEPARATE entry (never CaptureTool, never in capabilities).
// Its path properties are REPO-ROOT-resolved (absolute paths recommended and stay as given).
tasks.register('exportSemanticObservations', JavaExec) {
    group = 'capture'
    description = 'Export the compact semantic-observation bundle from the retained qualified ' +
            'string-direct-cascade-v1 evidence unit: -PsemanticEvidence.packet=<dir> ' +
            '-PsemanticEvidence.packetReceiptSha256=<hex> -PsemanticEvidence.qualification=<dir> ' +
            '-PsemanticEvidence.qualificationReceiptSha256=<hex> -PsemanticEvidence.output=<new-or-empty-dir>.'
    classpath = sourceSets.capture.runtimeClasspath
    mainClass = 'io.github.mbackschat.a12.dm.adapter.capture.export.CompactObservationTool'
    systemProperty 'capture.repoRoot', rootProject.projectDir.absolutePath
    doFirst {
        args = ['--packet', rootProject.file(requireProperty('semanticEvidence.packet')).absolutePath,
                '--packet-receipt-sha256', requireProperty('semanticEvidence.packetReceiptSha256'),
                '--qualification', rootProject.file(requireProperty('semanticEvidence.qualification')).absolutePath,
                '--qualification-receipt-sha256', requireProperty('semanticEvidence.qualificationReceiptSha256'),
                '--output', rootProject.file(requireProperty('semanticEvidence.output')).absolutePath]
    }
}

dependencies {
    // The repo-standard JSON parser (already implementation-scoped in core/rulekit/modelkit/cli at this
    // exact pin) — the capture decoder parses scenario/packet JSON with it; the canonical packet WRITER is
    // the capture code's own (byte-level determinism is a schema contract, not a library default). No new
    // artifact enters the repository and no published component changes.
    captureImplementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    // The capture self-tests live in the regular test source set and drive the real command entry.
    testImplementation sourceSets.capture.output
}

dependencies {
    // The kernel-free kits — BoundModel/Rule/Dsl + ReferenceResolvers + the SPI ports this backend implements.
    // Stage-4 module cut: the single root project split into per-kit modules, so `api project(':')` becomes an
    // `api` edge to each kit (re-exported to consumers — :cli/:schemakit — exactly as `project(':')` was).
    // Kernel-decoupling stage 3: the kits are kernel-free, so the kernel-md-facade this module needs
    // (DocumentModelServiceFactory, IDocumentModel, IDocumentModelService = expand/checkConsistency, the
    // DM-JSON serializer, and the a12-base model-consistency Notification/Severity types it brings
    // transitively) is declared HERE, not inherited. This module IS the kernel backend (it implements the SPI
    // ports), so kernel types are expected — the N8 boundary keeps them off public signatures.
    api project(':core')
    api project(':rulekit')
    api project(':modelkit')
    api project(':edit')
    implementation "com.mgmtp.a12.kernel:kernel-md-facade:${kernelVersion}"

    // The a12internal *read* tier — adapter-only (core must never depend on these per N8/D15):
    implementation "com.mgmtp.a12.kernel:kernel-core-tool-api:${kernelVersion}"      // IMVK_Service, IRuleParser, IConditionFormatter, IRuleMetaInformation, ado.IRule/IEntity/IEC, IProblemReporter
    implementation "com.mgmtp.a12.kernel:kernel-core-parsetree-api:${kernelVersion}" // ICondition (the transport AST)
    implementation "com.mgmtp.a12.kernel:kernel-md-model:${kernelVersion}"           // DocumentModelService.getMvkServiceForModel, ElementContainer
    implementation "com.mgmtp.a12.kernel:kernel-md-serializer:${kernelVersion}"      // ExternalDocumentModelSerializerService.getInternDocumentModel
    implementation "com.mgmtp.a12.kernel:kernel-md-a12internal:${kernelVersion}"     // internal DocumentModel
    implementation "com.mgmtp.a12.kernel:kernel-core-facade:${kernelVersion}"        // ServiceFactory.getCalculationService — the read surface for COMPUTATIONS (ICalculationService.extractCalculationInfo)
    implementation "com.mgmtp.a12.kernel:kernel-core-calc:${kernelVersion}"          // IWithComparisonOperation.getOriginalOperation — unwrap a computation alternative's value-expression from its assignment wrapper

    // The runtime *evaluation* tier — build a document instance and run the kernel's runtime validation
    // to observe which rules actually FIRE on data. Promoted from test-only to MAIN (2026-06-08) for the
    // public `KernelAdapter.evaluate` seam (the `eval-doc` verb / judge-verifies-against-kernel); the
    // F-LAW behavioral-law oracle (`laws/RuntimeLaws`) rides the same tier. Boundary still holds — these
    // kernel runtime types never escape a public adapter signature (evaluate takes a Map, returns EvalResult).
    implementation "com.mgmtp.a12.kernel:kernel-md-runtime-api:${kernelVersion}"   // IDocumentRtService, IDocumentValidationResult, IMessage
    implementation "com.mgmtp.a12.kernel:kernel-md-document-api:${kernelVersion}"  // IDocument, IDocumentFactory, IEntityInstance
    runtimeOnly "com.mgmtp.a12.kernel:kernel-md-runtime-service:${kernelVersion}"  // DocumentDynamicRtService impl behind the facade

    // CORE custom-condition SPI (the IData-based contract the kernel's own conditions + JS/TS codegen use) —
    // for KernelCustomConditions, the JVM bridge that runs a project's EXISTING kernel ICustomCondition on the
    // interpreter. core-runtime-api resolves to 32.3.4 in the 30.8.1 distribution (already on the runtime
    // classpath via md-runtime-service; promoted to compile here). The bridge provides its OWN IData/IIdentifier
    // (the kernel documents the caller does so) — it constructs no kernel `…Impl` (N8/D15 guardrail).
    implementation "com.mgmtp.a12.kernel:kernel-core-runtime-api:32.3.4"           // ICustomCondition (core), IData, IIdentifier

    // modelkit (structure builder) folded into the root project (2026-06-09) — its classes arrive via
    // `api project(':')`, so a read round-trip's test can author a model with it without a separate dep.

    // The kernel-free interpreter (docs/INTERPRETER-ARCHITECTURE.md). Its JVM target is consumed here for two
    // reasons: (1) MAIN — KernelCustomConditions bridges a kernel core ICustomCondition onto the interpreter's
    // CustomCondition SPI; (2) TEST — the kernel oracle (RuntimeLaws) runs the differential comparison.
    implementation project(':interpreter')

    // Custom-field-type SPI (predefined types) — TEST-ONLY: lets the differential register a project type
    // (e.g. a pattern-based "EMail") in the kernel oracle, so `Valid(field, "EMail")` does a REAL check (the
    // bare kernel ships none → degenerate no-op). The impl 30.8.1 depends on this api 28.2.0 (ABI-consistent).
    testImplementation "com.mgmtp.a12.kernel:kernel-core-customfieldtype-api:28.2.0"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    // Gate tiering (docs/TESTING-SPEC "Test tiers"): the 8-min perf benchmark (@Tag 'perf') + the differential
    // fuzzers (@Tag 'fuzz') are EXCLUDED from the default local run, so it stays ~2-3 min instead of ~12. Opt in
    // with -PrunPerf / -PrunFuzz (or -PallTests for both). CI runs fuzz on every push (-PrunFuzz) and perf nightly.
    useJUnitPlatform {
        def all = project.hasProperty('allTests')
        if (!all && !project.hasProperty('runPerf')) excludeTags 'perf'
        if (!all && !project.hasProperty('runFuzz')) excludeTags 'fuzz'
        // The corpus generator mutates the working tree (writes corpus/cases/**); opt in with -PrunCorpusCapture.
        // The everyday guard is CorpusReplayTest, which replays the committed files (no exclusion).
        if (!project.hasProperty('runCorpusCapture')) excludeTags 'corpus-capture'
        // The WI-7 real-corpus sweep reads the EUPL/proprietary corpora in place (nothing persisted) and is
        // slow (per-model kernel codegen); it skips when absent but is excluded from the default/CI run — opt in
        // with -PrunCorpusSweep (+ ../a12-kernel-mm present and/or -Da12.corpus1.dir=<workspaces>).
        if (!project.hasProperty('runCorpusSweep')) excludeTags 'corpus-sweep'
    }
    // Fork the kernel-heavy suite across JVMs — distributes test CLASSES over N forks so the differential
    // + fuzz classes run in parallel (:adapter:test is the ~8-min CI hog: the kernel oracle does Groovy
    // codegen per rule). Fork-based = each fork is an isolated JVM+kernel, so there's no shared state to
    // race. Cores-capped (each fork loads its own kernel ⇒ memory-bound); heap left at the default (forks
    // run SUBSETS, so a fixed cap would only risk OOM). Override with -PtestForks=N. No maxParallelForks=1
    // guard is needed here — the native-agent reflection capture runs :cli:test, not :adapter.
    maxParallelForks = (project.findProperty('testForks') ?: Math.max(2, Math.min(4, Runtime.runtime.availableProcessors()))) as int
    // Forward opt-in harness locations (read-only corpora) AND the opt-in perf knobs from the Gradle CLI to the
    // test JVM, e.g. -Da12.kernel.mm.dir=… / -Dperf.profile=true / -Dperf.edge=true — harnesses skip (or gate)
    // when their property is unset.
    ['a12.kernel.mm.dir', 'a12.corpus1.dir', 'corpus.sweep.java', 'ig44.model', 'ig44.seed', 'ig44.dump',
     'ig44.vcv', 'ig47.kernel', 'ig47.interp', 'ig47.model', 'ig47.seed', 'ig47.dump',
     'atom.kernel', 'atom.interp', 'atom.model', 'atom.seed', 'atom.dump', 'atom.valuediff',
     'vf.model', 'vf.seed', 'vf.side', 'vf.sig', 'vf.kernelmm', 'vf.dump',
     'replay.model', 'replay.op', 'corpus.hostile', 'capture.golden.fix',
     'perf.profile', 'perf.n', 'perf.edge', 'perf.edge.n', 'perf.edge.counts', 'perf.scaling', 'perf.scaling.n',
     'rp.perf'].each { k ->
        if (System.getProperty(k) != null) systemProperty k, System.getProperty(k)
    }
    // Opt-in JFR sampling: -Dperf.jfr=<file.jfr> records the (profile-config) flight recorder on the test JVM
    // and dumps on exit — feed a tight validateFull loop (a perf.profile test) and `jfr print` the hot methods.
    def jfr = System.getProperty('perf.jfr')
    if (jfr != null) jvmArgs "-XX:StartFlightRecording=settings=profile,filename=${jfr},dumponexit=true"
    dependsOn 'corpusReplayTest'
    // The corpus guards read corpus/cases/** at runtime; they live in corpusReplayTest (with those files declared
    // as its inputs) so a case edit re-runs ONLY them (not the whole kernel-heavy suite) and can't go up-to-date /
    // restore from the build cache into a FALSE GREEN. `test` dependsOn it, so CI + local always drive it.
    filter {
        excludeTestsMatching 'io.github.mbackschat.a12.dm.adapter.laws.CorpusReplayTest'
        excludeTestsMatching 'io.github.mbackschat.a12.dm.adapter.laws.CorpusSchemaGuardTest'
    }
}

// The conformance-corpus guards read the committed corpus tree (cases/** + shared models/**) at runtime — a
// dedicated Test task with those files as ITS declared inputs (the docGuardTest pattern, docs/TESTING-SPEC) so a
// case OR model edit re-runs ONLY them. Replays each case three ways (interpreter, groovy-dynamic, java-static) +
// the schema/id/model guard; the groovy leg re-runs the kernel, so a kernel bump that changes a committed
// expectation fails here (the KERNEL-UPGRADE re-capture signal).
tasks.register('corpusReplayTest', Test) {
    description = 'Replays the committed conformance corpus three ways + schema/id guard (corpus files declared as inputs).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'io.github.mbackschat.a12.dm.adapter.laws.CorpusReplayTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.adapter.laws.CorpusSchemaGuardTest'
    }
    // guardInputs (root ext, kernel-decoupling §3b #17): the committed corpus is this guard's runtime input —
    // declare it AND fail loudly if it goes empty, so a moved corpus tree can't silence the replay guard.
    rootProject.guardInputs(it, ['conformance corpus': rootProject.fileTree('corpus') { include '**/*.json' }])
}
