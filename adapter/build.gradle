            project(':consistency').layout.buildDirectory.dir('consumer-tests/browser').get().asFile.absolutePath
        // pnpm drives the project's own build scripts; node runs the compiled sampler. Both come from the
        // shared resolver, and both are pinned — but NOT for H5-f's reason. The runtime under observation here
        // is Chrome; this node only launches it and prints what it reports, so a V8 change in it moves nothing
        // in the tables. It is pinned so the bundle and the driver are reproducible, which is a build-hygiene
        // reason rather than a measurement one, and `CheckerColdBrowserPerfTest`'s class doc says the same.
        systemProperty 'perf.checker.coldbrowser.pnpm', resolveNodeTool('pnpm').absolutePath
        systemProperty 'perf.checker.coldbrowser.node',
            resolveNodeTool('node', checkerNodeMajor).absolutePath
    }
    // 51 for the cold boundary's floor of 50 observations per scale, and odd so the paired median names a ratio
    // actually observed.
    systemProperty 'perf.checker.coldbrowser.pairs',
        providers.gradleProperty('checkerColdBrowserPairs').getOrElse('51')
    systemProperty 'perf.checker.coldbrowser.n',
        providers.gradleProperty('checkerColdBrowserN').getOrElse('200')
    filter {
        includeTestsMatching 'io.github.mbackschat.a12.dm.adapter.perf.CheckerColdBrowserPerfTest'
    }
    // Measurements are observations, never reusable task outputs.
    outputs.upToDateWhen { false }
    outputs.cacheIf { false }
}

