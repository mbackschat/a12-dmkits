// The INNER-LOOP twin of :cli's SemanticsMapResolveTest lock-class check: a new lock class must be placed in
// docs/SEMANTICS-MAP.md, but that thorough resolver runs only at the checkpoint (:cli:semanticsMapGuardTest) —
// this millisecond filename lint fails the `-Pfast` loop too, so an unplaced class can't ride to the session
// end (the 2026-07-24 G2 cost: 5 unplaced classes surfaced only at the full run and forced a commit re-split).
// Same lock sources as the resolver; containment of the backticked class name is its citation format.
tasks.register('verifySemanticsMapRegistration') {
    def lockSources = [
            rootProject.fileTree('src/test/java/io/github/mbackschat/a12/dm/rulekit/validate/laws') {
                include '**/*Test.java', '**/*Test.kt'
            },
            project.fileTree('src/test/java/io/github/mbackschat/a12/dm/adapter/laws') {
                include '**/*Test.java', '**/*Test.kt'
            },
            project.fileTree('src/test/kotlin/io/github/mbackschat/a12/dm/adapter/laws') {
                include '**/*Test.java', '**/*Test.kt'
            },
            project.fileTree('src/test/java/io/github/mbackschat/a12/dm/adapter') {
                include '**/Workspace*Test.java'
            },
            rootProject.fileTree('interpreter/src/commonTest') {
                include '**/*Test.java', '**/*Test.kt'
            },
    ]
    def map = rootProject.file('docs/SEMANTICS-MAP.md')
    lockSources.each { inputs.files(it) }
    inputs.file(map)
    doLast {
        def mapText = map.text
        def unplaced = []
        lockSources.each { source ->
            source.files.each { f ->
                def cls = f.name.substring(0, f.name.lastIndexOf('.'))
                if (!mapText.contains('`' + cls + '`')) unplaced << cls
            }
        }
        if (!unplaced.isEmpty()) {
            throw new GradleException("lock class(es) not placed in docs/SEMANTICS-MAP.md: " +
                    "${unplaced.sort().unique()} — add each to its § row (or the outside-the-taxonomy " +
                    "table); :cli:semanticsMapGuardTest remains the thorough resolver.")
        }
    }
}

tasks.register('perfScriptGuardTest', Test) {
    description = 'Verify the performance launcher routes the routine gate, that the anchor refresh refuses to ' +
            'take a bar away, and that every perf number is printed in one locale.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    def script = rootProject.file('scripts/perf.sh')
    def anchorScript = rootProject.file('scripts/perf-anchor.sh')
    def keysScript = rootProject.file('scripts/perf-keys.sh')
    def trendScript = rootProject.file('scripts/perf-trend.sh')
    def historyScript = rootProject.file('scripts/perf-history.sh')
    def reportScript = rootProject.file('scripts/perf-report.sh')
    systemProperty 'perf.script', script.absolutePath
    // PerfAnchorScriptTest EXECUTES this one against a temporary anchor (ANCHOR_FILE), which is a far stronger
    // oracle than reading its text — its refusals are what keep a partial run from silently unarming a lane.
    systemProperty 'perf.anchor.script', anchorScript.absolutePath
    // Also EXECUTED. The instrument IF285 cites must never report an empty profile as success: its analyzer reads
    // the recording from stdin, so the embedded-heredoc form every sibling script uses would take stdin over and
    // silently measure nothing — which is exactly what the first version did.
    systemProperty 'perf.keys.script', keysScript.absolutePath
    // Also EXECUTED, against synthetic records (PERF_RESULTS_DIR). It is the prerequisite piece 1 sizes its band
    // from, so a wrong noise figure here would propagate into a gate — and its load-bearing case is the one
    // asserting a stable series reports NOTHING.
    systemProperty 'perf.trend.script', trendScript.absolutePath
    systemProperty 'perf.history.script', historyScript.absolutePath
    // Also EXECUTED, against synthetic records. It COMPOSES the three readers above, and a composition fails
    // silently — a dropped delegation only makes the report shorter, which reads as "nothing to report".
    systemProperty 'perf.report.script', reportScript.absolutePath
    filter {
        includeTestsMatching 'io.github.mbackschat.a12.dm.adapter.perf.PerfScriptContractTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.adapter.perf.PerfAnchorScriptTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.adapter.perf.PerfKeysScriptTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.adapter.perf.PerfTrendScriptTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.adapter.perf.PerfHistoryScriptTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.adapter.perf.PerfReportScriptTest'
        // Reads the perf sources as TEXT, so it belongs on a task that declares them (TESTING-SPEC, "Tests that
        // read repo files at runtime") rather than on :adapter:test, where the declaration would re-run the whole
        // suite on any perf edit — and omitting it would let the guard go up-to-date into a false green.
        includeTestsMatching 'io.github.mbackschat.a12.dm.adapter.perf.PerfNumberLocaleContractTest'
    }
    inputs.file(script)
    inputs.file(anchorScript)
    inputs.file(keysScript)
    // perf-keys.sh SOURCES the shared Gradle environment helper at runtime, and PerfKeysScriptTest executes
    // the branch that reaches it. Undeclared, editing the helper would leave this guard UP-TO-DATE with that
    // branch unrun — the same class as every other entry in this list.
    inputs.file(rootProject.file('scripts/gradle-environment.sh'))
    inputs.file(trendScript)
    inputs.file(historyScript)
    inputs.file(reportScript)
    inputs.dir(file('src/test/kotlin/io/github/mbackschat/a12/dm/adapter/perf'))
        .withPropertyName('perfSources')
}

// NFR #1's standing anchor: hold a measured run against the byte rows captured at the restart baseline.
//
// A SEPARATE invocation from the lane that produces the numbers, on purpose. The footprint forks and the release
// assembly each take minutes and are opt-in, so folding the comparison into them would tie the bar's fate to
// whether someone remembered to run a long lane; as its own task it can also be pointed at records captured
// earlier, which is how the baseline's own raws were used to prove the collector reproduces the anchor's keying.
//
// It FAILS without -Pnfr1Collectors rather than judging nothing: this task exists only to assert, so an
// invocation that names no collector is a mistake, not a no-op. (The same test class is harmless on :adapter:test,
// where the absent selection means "not the gate lane" and it says so.)
tasks.register('verifyNfr1StandingAnchor', Test) {
    description = "Hold measured footprint and delivered-size rows against NFR #1's standing anchor."
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'io.github.mbackschat.a12.dm.adapter.perf.Nfr1StandingAnchorGateTest'
    }
    // Forwarded EXPLICITLY rather than inherited from the daemon. A Test task does inherit the daemon's
    // environment, but which daemon serves an invocation is not the caller's to decide, so a bar that depended on
    // that would be a bar that sometimes measures nothing.
    def collectors = providers.gradleProperty('nfr1Collectors')
    def footprintRawDir = providers.gradleProperty('nfr1FootprintRawDir')
    def deliveredSizeDir = providers.gradleProperty('nfr1DeliveredSizeDir')
    doFirst {
        if (!collectors.isPresent() || collectors.get().isBlank()) {
            throw new GradleException(
                'verifyNfr1StandingAnchor requires -Pnfr1Collectors=<comma-separated ids>, plus ' +
                    '-Pnfr1FootprintRawDir=<dir> and/or -Pnfr1DeliveredSizeDir=<dir> for the ids named')
        }
    }
    environment 'NFR1_COLLECTORS', collectors.getOrElse('')
    environment 'NFR1_FOOTPRINT_RAW_DIR', footprintRawDir.getOrElse('')
    environment 'NFR1_DELIVERED_SIZE_DIR', deliveredSizeDir.getOrElse('')
    // Defaulted from the project rather than demanded from the caller: the delivered-size rows address their
    // asset by placeholder so that a version bump is not a regression, and the version that expands it is a fact
    // the build already holds. -Pnfr1DeliveredVersion overrides it, which is what judging an assembled mirror
    // from another version needs.
    environment 'NFR1_DELIVERED_VERSION',
        providers.gradleProperty('nfr1DeliveredVersion').getOrElse(project.version.toString())
    // The measured inputs live outside the project and change on every run; an up-to-date check on them would let
    // a second invocation report the first run's verdict.
    outputs.upToDateWhen { false }
    outputs.cacheIf { false }
}

tasks.register('perfGateTest', Test) {
    description = 'Run the isolated routine interpreter performance gate.'
    group = 'verification'
    dependsOn 'perfScriptGuardTest'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    // Selected BY TAG, never by a class list (owner policy, 2026-08-13: performance is priority #1, a release is
    // blocked on regressions with full coverage, and the nightly carries that coverage for ordinary pushes). The
    // enumerated list this replaced named exactly two classes, so the routine gate ran 2 of the 9 routine-tier
    // timing bars and the other 7 — Charset, CustomType, GroupScopedFill, OuterCorrelation, Pattern, EntryPoint,
    // PartialSumOfProducts — executed in NO automated lane at all. Selecting by tag makes the coverage claim
    // structural: a new @Tag('perf') class joins this lane by existing, and the classification guard
    // (PerfTestClassificationTest) fails a timing bar that carries no tag.
    //
    // 'perf' is the routine tier. The checkpoint tier is @Tag('perf-bench') — PerfBenchTest's per-scenario kernel
    // codegen, the GC-sensitive RetainedHeapProbeTest, and the three externally-parameterized canaries that own
    // dedicated `measurement` tasks — and it is excluded here rather than reported as skipped, so a green gate
    // never counts a bar that did not run.
    useJUnitPlatform { includeTags 'perf' }
    maxParallelForks = 1
    // NOT failFast: this lane exists to MEASURE, and one breach used to discard every later lane's numbers —
    // the 2026-08-11 nightly reported 21 of 26 rows and hid the five behind the one that tripped. A breach now
    // pays for the full run (each growth floor re-measures up to GROWTH_RETRY_ATTEMPTS times), which is minutes
    // against the workflow's 60-minute timeout and buys the complete picture the diagnosis needs.
    failFast = false
    // An observation this runner class has not committed a number for is a failure rather than a note — otherwise
    // adding a lane, or changing a scenario's content so its fingerprint (and with it its anchor key) moves, would
    // silently switch off the only bar that can see a uniform regression. A runner class with no block at all stays
    // the bootstrap case and passes; the distinction lives in PerfAnchors, not here.
    //
    // Unconditional, deliberately: this used to be `CI != null || -PperfAnchorRequired`, which put the failure on
    // the one runner nobody watches interactively. A fingerprint change keeps the observation COUNT intact, so
    // PerfAnchorCoverageGuardTest cannot see it either — the local gate printing a note while the nightly went red
    // was a defect, not a courtesy. Whoever changes a scenario is the one who can refresh the anchor.
    systemProperty 'perf.anchor.required', 'true'
    // Marks this as the ISOLATED lane — the first of the two axes in TimingEnforcement. A self-referential timing
    // bar (the anchor's absolute time, the growth floors' constant) may only be judged where the measurement is
    // valid: this task, single-fork. A broad `:adapter:test -PrunPerf` also runs PerfGateTest, under up to four
    // parallel forks — the configuration TESTING-SPEC warns "can manufacture a false growth failure" — so there
    // the lanes record their observations and claim nothing. The second axis is the MACHINE: on a hosted runner
    // these same bars report instead of failing, because contention there cannot be told apart from a regression.
    // Neither axis touches the cross-engine bars, which gate everywhere.
    systemProperty 'perf.anchor.lane', 'true'
    // The measurement RECORD is committed data, never build output (CLAUDE.md; SurvivingDataNotInBuildGuardTest).
    systemProperty 'perf.results.dir', rootProject.file('perf-results')
    // Measurements are observations, never reusable task outputs. Persist compilation/dependencies, not results.
    outputs.upToDateWhen { false }
    outputs.cacheIf { false }
}

// The checker's standing over-rejection control reads the three committed model trees as FILES, so they are
// this task's inputs and it is scoped to that one class — never to `test`, whose perf lanes want the machine
// to itself and whose ~900 tests would re-run on any fixture edit.
tasks.register('checkerSilenceGuardTest', Test) {
    description = 'Verify the Kernel-free checker agrees with the Kernel on the committed models, on ' +
            'mechanical perturbations of them, and on models synthesized far past their size.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    // The first three read the model trees below at RUNTIME, so they belong to the task that declares those
    // files as inputs. Left in the broad lane they would go up-to-date or restore from the build cache after a
    // model edit — a false green of exactly the kind the input declaration exists to prevent. The synthesized
    // population reads no repo file; it joins them because it is the same claim about the same checker at a
    // size the committed trees cannot reach, and its own inputs are test sources this task already declares.
    // The path grid joins on the same footing: its disagreement ledger is a test RESOURCE, so the task's runtime
    // classpath already carries it as an input and a ledger edit re-runs it.
    // The near-miss sweep joins on both grounds: it reads the committed model trees at runtime and keeps its
    // cluster ledger as a resource.
    // The keyed-operand, constant-index-key, field-value-read carrier, entity-list category, computation
    // comparison, comparison-constant, filter-body, rule-reference-set, RepetitionNotUnique gate and paired-gate,
    // and FirstFilledValue type grids join
    // beside it: the same both-engine claim over spellings of one construct, and none of them reads a repo file.
    filter {
        includeTestsMatching(
            'io.github.mbackschat.a12.dm.adapter.laws.CheckerSilenceOnCleanModelsTest')
        includeTestsMatching(
            'io.github.mbackschat.a12.dm.adapter.laws.CheckerSilenceOnMutatedModelsTest')
        includeTestsMatching(
            'io.github.mbackschat.a12.dm.adapter.laws.CheckerClassAgreementTest')
        includeTestsMatching(
            'io.github.mbackschat.a12.dm.adapter.laws.CheckerPathGridAgreementTest')
        includeTestsMatching(
            'io.github.mbackschat.a12.dm.adapter.laws.CheckerKeyedOperandAgreementTest')
        includeTestsMatching(
            'io.github.mbackschat.a12.dm.adapter.laws.CheckerIndexKeyConstantAgreementTest')
        includeTestsMatching(
            'io.github.mbackschat.a12.dm.adapter.laws.CheckerFieldValueReadCarrierAgreementTest')
        includeTestsMatching(
            'io.github.mbackschat.a12.dm.adapter.laws.CheckerEntityListCategoryAgreementTest')
        includeTestsMatching(
            'io.github.mbackschat.a12.dm.adapter.laws.CheckerComputationJoinedConditionAgreementTest')
        includeTestsMatching(
            'io.github.mbackschat.a12.dm.adapter.laws.CheckerComparisonConstantAgreementTest')
        includeTestsMatching(
            'io.github.mbackschat.a12.dm.adapter.laws.CheckerFilterBodyAgreementTest')
        includeTestsMatching(
            'io.github.mbackschat.a12.dm.adapter.laws.CheckerRuleReferenceSetAgreementTest')
        includeTestsMatching(
            'io.github.mbackschat.a12.dm.adapter.laws.CheckerRepetitionNotUniqueGateAgreementTest')
        includeTestsMatching(
            'io.github.mbackschat.a12.dm.adapter.laws.CheckerRepetitionNotUniquePairedGateAgreementTest')
        includeTestsMatching(
            'io.github.mbackschat.a12.dm.adapter.laws.CheckerFirstFilledValueTypeAgreementTest')
        includeTestsMatching(
            'io.github.mbackschat.a12.dm.adapter.laws.CheckerNearMissSweepTest')
        includeTestsMatching(
            'io.github.mbackschat.a12.dm.adapter.laws.CheckerSilenceOnSynthesizedModelsTest')
    }
    rootProject.guardInputs(it, [
        'conformance corpus models': rootProject.fileTree('corpus/models') { include '**/*.json' },
        'cli fixture models'       : rootProject.fileTree('cli/src/test/resources/models') { include '**/*.json' },
        'kit fixture models'       : rootProject.fileTree('src/test/resources/models') { include '**/*.json' }])
}

