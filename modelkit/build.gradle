// :modelkit — dm.modelkit, the document-model STRUCTURE builder (DocumentModelDraft/ModelDocument/FieldKind)
// that emits DM-JSON the kernel accepts. Sibling of :rulekit over the shared :core substrate — it does NOT
// depend on rulekit (the boundary is now a build-graph fact, PROPOSAL §3a). Kernel-free (root
// `verifyKitPurity`). Published as io.github.mbackschat.a12.dm:dmkits-modelkit (MIT).
plugins {
    id 'java-library'
    id 'maven-publish'
}

base { archivesName = 'dmkits-modelkit' }

repositories {
    mavenLocal()
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    // modelkit builds on dm.core and exposes core types → `api` (dmkits-modelkit's POM depends on dmkits-core).
    api project(':core')

    // DM-JSON emit/read via Jackson; the YAML reader backs YAML-flavoured model input (same tree-walking style).
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.18.2'

    // The shared-predicate leaf: the Number bound law `NumberSpec` refuses is the one the portable checker
    // reports, stated once. `implementation` for core's reason: no predicate type crosses a published signature.
    implementation project(':predicates')
}

// Publishing (Stage 4, Package B): io.github.mbackschat.a12.dm:dmkits-modelkit — MIT (POM depends on dmkits-core).
publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            artifactId = 'dmkits-modelkit'
            pom {
                name = 'dmkits-modelkit'
                description = 'a12-dmkits — dm.modelkit: the document-model structure builder that emits kernel-accepted DM-JSON. MIT.'
                rootProject.dmkitsPom(delegate)
            }
        }
    }
}
