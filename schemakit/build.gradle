// :schemakit (docs/SCHEMAKIT-SPEC.md) — JSON Schema ⇄ Document Model import/export.
// JVM with Java implementation and Kotlin tests, native-safe (NOT Kotlin Multiplatform — proposal §10). It authors through dmkits' typed
// surface (the dogfood rule): import builds via modelkit DocumentModelDraft + rulekit Dsl/DslRenderer;
// export reads via modelkit ModelDocument. The structural validity oracle is the kernel, reached ONLY
// through the public facade (ModelLoader).
//
// THE boundary (owner constraint 2026-06-28; refined — :adapter IS permitted, SCHEMAKIT-SPEC §1): schemakit
// reaches the kernel ONLY through the project's own mediated modules — root `:` (kernel via kernel-md-facade),
// :adapter (the N8 type-converting internal-read boundary), and the kernel-free :interpreter — never the RAW
// kernel jars directly (held by the root `verifyPublishedClasspathsAreKernelFree`, over what a consumer of the
// published POM resolves), and never linking com.mgmtp.* from its own classes (held by `verifySchemakitPurity`).
// Reuse-first: do not rebuild capability that already exists in those modules; surface gaps for the owner.
plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm'
    id 'maven-publish'
}

base { archivesName = 'dmkits-schemakit' }

repositories {
    mavenLocal()
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    // The engine: dm.core (ModelLoader), modelkit (DocumentModelDraft/ModelDocument), rulekit
    // (Dsl/DslRenderer/RuleValidator). Stage-4 module cut: the single root project split into per-kit
    // modules — schemakit authors through core + modelkit + rulekit (it does not touch edit). :adapter
    // (typed rule read for Tier-A projection) and :interpreter (evaluation, two-tier) are PERMITTED and
    // join as those increments land — never a DIRECT dep on the raw internal kernel jars.
    implementation project(':core')
    implementation project(':modelkit')
    implementation project(':rulekit')

    // The MEDIATED kernel boundary (N8): Tier-A projection reaches the parse through the kernel-free
    // `dm.rulekit.spi.ConditionReadBack` port (Stage 3) — schemakit's MAIN imports NO adapter type. So the
    // backend that PROVIDES that port (:adapter) is a TEST-scope dependency here, not a compile/publish one:
    // the published dmkits-schemakit POM stays kernel-free (no :adapter, no com.mgmtp — Stage-4 Package B
    // requirement), and a consumer supplies a ConditionReadBack backend at runtime just like for the other
    // kits. dmtool is unaffected — :cli depends on :adapter directly, so the provider is on its classpath.
    testImplementation project(':adapter')

    // The Kernel-free gate (PORTABLE-CONSISTENCY-PROPOSAL §7 F3-b), TEST scope for the same reason :adapter is:
    // it arms the differential, never the published artifact. Every model this suite imports is put through
    // BOTH oracles by `SchemaTestSupport.assertKernelAccepts`, so a model A12 accepts and the portable checker
    // refuses fails here — an over-rejection, which is the one direction neither product may drift in. The
    // published dmkits-schemakit POM is unchanged, and `verifySchemakitPurity` reads main classes only.
    testImplementation project(':consistency-gate')

    // JSON Schema parse/emit — Jackson tree (the same tree-walking style as modelkit's DM-JSON read).
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'

    // YAML input — most OpenAPI documents are YAML. The importer tries JSON first, then YAML (a JSON superset).
    // Already used in the project (RolesFile/UsersFile), so an established dep. Native-image: a re-capture
    // trigger (SnakeYAML reflection) — NATIVE-IMAGE-GRAALVM §5.1; no effect on the JVM/dev build.
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.18.2'

    // (Joins when live Tier-2 lands: implementation project(':interpreter') — the kernel-free evaluator for
    //  the two-tier validation coupling. Deferred on consumer-exists, SCHEMAKIT-GAPS §3.)

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // A STOCK JSON-Schema validator (Draft 2020-12) — the field-local tier of the two-tier validation
    // demo (shape 5): proves the exported native keywords validate with any off-the-shelf validator, and
    // that it cannot catch the cross-field rules (which are carried for the interpreter). Test-only.
    testImplementation 'com.networknt:json-schema-validator:1.5.7'
}

tasks.named('test') {
    useJUnitPlatform()
}

// --- The boundary, locked (SCHEMAKIT-SPEC §1; mirrors :interpreter's verifyInterpreterPurity) ----------
// schemakit's own main classes must stay free of RAW kernel/groovy types and emit plain data ("data out, never
// kernel objects"). It reaches the kernel only through the project's mediated modules (root `:`, :adapter,
// :interpreter), which return dmkits types — so a compiled `com.mgmtp.*`/`groovy.*` dependency edge out of
// src/main is a forbidden raw-kernel coupling, regardless of which modules sit on the classpath.
//
// Compiled edges rather than the `import` regex this used to be: the regex read only `.java` files and only
// lines beginning with `import`, so a fully-qualified use, a Kotlin source, or a name inside a text block was
// invisible to it, and its non-empty denominator was the file tree rather than anything compiled. That is one
// half of DEV-API-GAPS DG45; the other half — a kernel jar DECLARED but never imported, which no source or
// linkage guard can see — is the root `verifyPublishedClasspathsAreKernelFree`. Test scope stays out on
// purpose: :adapter is a test dependency here precisely so the kernel can be the oracle.
def verifySchemakitPurity = tasks.register('verifySchemakitPurity') {
    group = 'verification'
    description = 'Fail on a compiled com.mgmtp/groovy edge so schemakit uses only dmkits-typed surfaces.'
    dependsOn tasks.named('classes')
    def classRoots = providers.provider { sourceSets.main.output.classesDirs.files }
    inputs.files(classRoots)
    doLast {
        rootProject.verifyCompiledPurity(
            'schemakit purity — main (reach the kernel via root \':\', :adapter or :interpreter, SCHEMAKIT-SPEC §1)',
            classRoots.get(),
            ['com.mgmtp.', 'groovy.'],
            'java.lang.Object')
    }
}
tasks.named('check') { dependsOn verifySchemakitPurity }

// Publishing (Stage 4, Package B): io.github.mbackschat.a12.dm:dmkits-schemakit — MIT. Its POM depends on
// the kernel-free kits (dmkits-core/-modelkit/-rulekit) only; :adapter is test-scope, so no backend/kernel
// leaks into the published POM — the claim the root `verifyPublishedClasspathsAreKernelFree` resolves.
publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            artifactId = 'dmkits-schemakit'
            pom {
                name = 'dmkits-schemakit'
                description = 'a12-dmkits — dm.schemakit: JSON Schema ⇄ Document Model import/export, authored through the dmkits typed surface. MIT.'
                rootProject.dmkitsPom(delegate)
            }
        }
    }
}
