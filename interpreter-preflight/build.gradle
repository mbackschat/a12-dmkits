// :interpreter-preflight — the F3-c integration façade (PORTABLE-CONSISTENCY-PROPOSAL §7): an interpreter
// consumer's honest static precondition, answered by the Kernel-free checker.
//
// Its own module rather than a class in :consistency-gate, because the dependency sets do not overlap: a
// dmkits caller reaching for that gate would otherwise carry the whole interpreter, and an interpreter
// consumer reaching for this would carry rulekit and modelkit. Each artifact's POM says what its own consumer
// actually needs. Beside both products and inside neither, which is §1's rule for exactly this façade.
plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm'
    id 'maven-publish'
}

base { archivesName = 'dmkits-interpreter-preflight' }

repositories {
    mavenLocal()
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    // The consumer's own source vocabulary — this façade takes exactly what they already hand
    // `ModelWorkspace.fromSources`, so asking the second question costs them no second representation.
    api project(':interpreter')
    // The checker, and the report this façade returns.
    api project(':consistency')

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Kernel-freedom over COMPILED dependencies, in test scope too: both products it joins are Kernel-free by
// their own lints, and an integration that reached a kernel would undo both claims at once.
def verifyInterpreterPreflightPurity = tasks.register('verifyInterpreterPreflightPurity') {
    group = 'verification'
    description = 'Fail if any interpreter-preflight main or test class depends on com.mgmtp.*/groovy.*.'
    dependsOn tasks.named('classes'), tasks.named('testClasses')
    def classRoots = providers.provider {
        sourceSets.main.output.classesDirs.files + sourceSets.test.output.classesDirs.files
    }
    inputs.files(classRoots)
    doLast {
        rootProject.verifyCompiledPurity(
            'interpreter-preflight purity — main and test',
            classRoots.get(),
            ['com.mgmtp.', 'groovy.'],
            'java.util.List')
    }
}
tasks.named('check') { dependsOn verifyInterpreterPreflightPurity }

// Publishing: io.github.mbackschat.a12.dm:dmkits-interpreter-preflight — MIT, Kernel-free by the lint above.
publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            artifactId = 'dmkits-interpreter-preflight'
            pom {
                name = 'dmkits-interpreter-preflight'
                description = 'a12-dmkits — the static consistency precondition for interpreter consumers: '\
                        + 'hand it the sources you would hand ModelWorkspace.fromSources and it answers '\
                        + 'whether A12 rejects the model, which is a DIFFERENT question from whether the '\
                        + 'interpreter can prepare it or supports every rule. It builds no prepared graph and '\
                        + 'changes no evaluator admission. The checker cannot report VALID, so its best answer '\
                        + 'is NO_REJECTION, never a pass. MIT.'
                rootProject.dmkitsPom(delegate)
            }
        }
    }
}
