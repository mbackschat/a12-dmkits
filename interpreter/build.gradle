// The dm-interpreter (docs/INTERPRETER-SPEC.md; impl in docs/INTERPRETER-ARCHITECTURE.md) — a Kotlin Multiplatform, native-safe runtime
// evaluator for conditions + computations. ONE common engine, two targets (JVM + JS), so it runs
// in a GraalVM native image (no Groovy) and as a Node/browser JS library. Portable semantics and workspace
// preparation and the ratified first-answer bar are qualified in real Chrome (IF224/IF225).
// This is a publication-eligible standalone module:
// it carries NO kernel/dmtool dependency — the kernel DIFFERENTIAL tests live in :adapter, not here, so
// this module stays kernel-free even in test scope. That separation is enforced by `verifyInterpreterPurity`
// below (proposal §8 — "separation by convention + linting, not a repo wall").
plugins {
    id 'org.jetbrains.kotlin.multiplatform'
    id 'maven-publish'
    id 'org.jetbrains.dokka' version '2.2.0'
}

def legacyInterpreterVersionFile = file('VERSION')
group = 'io.github.mbackschat.a12.dm'
version = rootProject.version

def verifyInterpreterVersionAlignment = tasks.register('verifyInterpreterVersionAlignment') {
    group = 'verification'
    description = 'Require every interpreter artifact to use the main repository release version.'
    inputs.property('mainRepositoryVersion', provider { rootProject.version.toString() })
    inputs.property('interpreterVersion', provider { project.version.toString() })
    inputs.property(
        'legacyInterpreterVersionFileExists',
        provider { legacyInterpreterVersionFile.exists() },
    )
    doLast {
        if (project.version.toString() != rootProject.version.toString()) {
            throw new GradleException(
                "interpreter version ${project.version} must equal main repository version ${rootProject.version}",
            )
        }
        if (legacyInterpreterVersionFile.exists()) {
            throw new GradleException(
                'interpreter/VERSION must not exist; the main repository version is the single source',
            )
        }
    }
}

base {
    archivesName = 'dm-interpreter'
}

repositories {
    mavenCentral()
}

kotlin {
    jvmToolchain(21)

    jvm()
    js {
        outputModuleName = 'a12-interpreter-core'
        nodejs {
            testTask {
                useMocha {
                    // Hostile workspace-boundary cases intentionally build large inputs; Mocha's 2s default
                    // is below their verified Node runtime and turns a semantic guard into a host-speed probe.
                    timeout = '10s'
                }
            }
        }
        browser()
        useEsModules()
        binaries.library()
        generateTypeScriptDefinitions()
        compilerOptions {
            target.set('es2015')
            sourceMap.set(true)
        }
    }

    sourceSets {
        commonMain {
            dependencies {
                // DM-JSON → ModelDef loader (proposal §6.2 / §11 fork F1): the TREE API only
                // (Json.parseToJsonElement + a hand-written mapper) — the runtime library alone, NO compiler
                // plugin, NO @Serializable. The ONE common third-party dep; whitelisted in verifyInterpreterPurity
                // below so it stays a deliberate boundary.
                implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0'
            }
        }
        jsMain {
            dependencies {
                // Arbitrary-precision decimal backend for JS. The isolated constructor plus the bounded
                // arithmetic/rendering layer reproduce the JVM MathContext(50)/plain-render contract (IF163).
                // (behind an expect/actual shim).
                implementation npm('big.js', '6.2.2')
            }
        }
        commonTest {
            dependencies {
                implementation kotlin('test')
            }
        }
    }
}

tasks.named('jsBrowserTest') {
    // commonTest intentionally runs under Node and contains host probes that import node:* modules.
    // Browser assurance comes from the packed-package Vite/Chrome consumer wired into check below.
    enabled = false
}

// Kotlin 2.2 installs ABI validation as a nested extension of the multiplatform DSL. Configure that public
// extension directly because Groovy cannot call the Kotlin-only `abiValidation {}` shortcut.
def interpreterAbiValidation = kotlin.extensions
    .getByType(org.jetbrains.kotlin.gradle.dsl.abi.AbiValidationMultiplatformExtension)
interpreterAbiValidation.enabled.set(true)
interpreterAbiValidation.filters {
    included {
        // The release contract is the package-root façade. Engine implementation packages remain public only
        // where another module still consumes them during the pre-1.0 migration; publishing must not freeze them.
        byNames.add('io.github.mbackschat.a12.dm.interpreter.*')
    }
    excluded {
        // These root-package declarations predate the model-owned façade and expose engine storage/arithmetic
        // types. They remain callable by in-repo migration consumers but are not part of the published contract.
        byNames.addAll([
            'io.github.mbackschat.a12.dm.interpreter.Big',
            'io.github.mbackschat.a12.dm.interpreter.Dec',
            'io.github.mbackschat.a12.dm.interpreter.Dec_jvmKt',
            'io.github.mbackschat.a12.dm.interpreter.DEC_ZERO',
            'io.github.mbackschat.a12.dm.interpreter.DmInterpreter',
            'io.github.mbackschat.a12.dm.interpreter.InvalidModelTimeZoneException',
            'io.github.mbackschat.a12.dm.interpreter.RoundMode',
            'io.github.mbackschat.a12.dm.interpreter.UnsupportedConstructException',
            'io.github.mbackschat.a12.dm.interpreter.UnsupportedModelTimeZoneException',
            'io.github.mbackschat.a12.dm.interpreter.dec',
            'io.github.mbackschat.a12.dm.interpreter.decOrNull',
        ])
    }
}

