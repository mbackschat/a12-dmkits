    }
    names
}
def renderInterpreterLlmReference = {
    def section = { String title, File source, boolean fenced ->
        def body = source.getText('UTF-8').stripTrailing()
        if (fenced) {
            return "## ${title}\n\n```text\n${body}\n```"
        }
        "## ${title}\n\n${body}"
    }
    [
        "# A12 Interpreter API ${project.version}",
        '',
        '> Public signatures and examples for the version-matched interpreter release.',
        '',
        section('Tested developer guide', interpreterApiGuide, false),
        '',
        section('TypeScript public ABI', committedTypeScriptApi, true),
        '',
        '## Kotlin common public types',
        '',
        publicKlibTypeNames().toList().sort().collect { "- `${it}`" }.join('\n'),
        '',
        '## JVM-only public types',
        '',
        (publicJvmTypeNames() - publicKlibTypeNames())
            .toList()
            .sort()
            .collect { "- `${it}`" }
            .join('\n'),
        '',
    ].join('\n')
}

