def externalBrowserConsumerCorpusDir = rootProject.file('corpus')
def externalBrowserConsumerCorpusFiles = rootProject.fileTree(externalBrowserConsumerCorpusDir) {
    include 'cases/**/*.json'
    include 'models/*.json'
}
def externalBrowserConsumerPerformanceModel = file(
    'src/commonTest/resources/performance/b1.dm.json',
)
def prepareExternalInterpreterBrowserConsumer = tasks.register(
    'prepareExternalInterpreterBrowserConsumer',
    Sync,
) {
    group = 'verification'
    description = 'Create a fresh repository-relative browser consumer for the packed interpreter tarball.'
    from(externalBrowserConsumerSourceDir)
    from(externalBrowserConsumerModel) {
        into('public/models')
    }
    from(externalBrowserConsumerWorkspaceDir) {
        include externalBrowserConsumerWorkspaceFiles.collect {
            externalBrowserConsumerWorkspaceDir.toPath().relativize(it.toPath()).toString()
        }
        into('public/workspace')
    }
    from(externalBrowserConsumerCorpusDir) {
        include 'cases/**/*.json'
        include 'models/*.json'
        into('public/corpus')
    }
    from(externalBrowserConsumerPerformanceModel) {
        into('public/performance')
    }
    into(externalBrowserConsumerBuildDir)
    inputs.file(externalBrowserConsumerModel)
        .withPropertyName('typedAuthoredBrowserConsumerModel')
        .withPathSensitivity(org.gradle.api.tasks.PathSensitivity.RELATIVE)
    inputs.files(externalBrowserConsumerWorkspaceFiles)
        .withPropertyName('rawWorkspaceBrowserQualificationModels')
        .withPathSensitivity(org.gradle.api.tasks.PathSensitivity.RELATIVE)
    inputs.files(externalBrowserConsumerCorpusFiles)
        .withPropertyName('portableBrowserCorpus')
        .withPathSensitivity(org.gradle.api.tasks.PathSensitivity.RELATIVE)
    inputs.file(externalBrowserConsumerPerformanceModel)
        .withPropertyName('typedAuthoredBrowserPerformanceModel')
        .withPathSensitivity(org.gradle.api.tasks.PathSensitivity.RELATIVE)
    outputs.upToDateWhen { false }
    doFirst {
        project.delete(externalBrowserConsumerBuildDir)
    }
    doLast {
        def casesDir = new File(externalBrowserConsumerCorpusDir, 'cases')
        def casePaths = rootProject.fileTree(casesDir) {
            include '**/*.json'
        }.files.collect {
            casesDir.toPath().relativize(it.toPath()).toString().replace(File.separatorChar, '/' as char)
        }.sort()
        def manifest = new File(destinationDir, 'public/corpus/cases.json')
        manifest.parentFile.mkdirs()
        manifest.setText(groovy.json.JsonOutput.toJson(casePaths) + '\n', 'UTF-8')
        def releaseIdentity = new File(destinationDir, 'public/release.json')
        releaseIdentity.setText(groovy.json.JsonOutput.toJson([
            package: '@mbackschat/a12-interpreter',
            version: project.version.toString(),
        ]) + '\n', 'UTF-8')
        def digestHex = { byte[] value ->
            java.security.MessageDigest.getInstance('SHA-256')
                .digest(value)
                .collect { String.format('%02x', it & 0xff) }
                .join()
        }
        def manifestSources = [[
            source: externalBrowserConsumerModel,
            path: "models/${externalBrowserConsumerModel.name}",
        ]] + externalBrowserConsumerWorkspaceFiles.files.collect { source ->
            def relative = externalBrowserConsumerWorkspaceDir.toPath()
                .relativize(source.toPath())
                .toString()
                .replace(File.separatorChar, '/' as char)
            [source: source, path: "workspace/${relative}"]
        }
        def manifestModels = manifestSources.collect { item ->
            def json = new groovy.json.JsonSlurper().parse(item.source)
            [
                modelId: json.header.id,
                path: item.path,
                sha256: digestHex(item.source.bytes),
            ]
        }.sort { left, right -> left.modelId <=> right.modelId }
        def revisionInput = manifestModels.collect {
            "${it.modelId}\u0000${it.path}\u0000${it.sha256}\n"
        }.join().getBytes('UTF-8')
        def showcaseManifest = new File(
            destinationDir,
            'public/showcase-manifest.json',
        )
        showcaseManifest.setText(groovy.json.JsonOutput.toJson([
            schemaVersion: 1,
            revision: digestHex(revisionInput),
            models: manifestModels,
        ]) + '\n', 'UTF-8')
    }
}
