// The dm-interpreter (docs/INTERPRETER-SPEC.md; impl in docs/INTERPRETER-ARCHITECTURE.md) — a Kotlin Multiplatform, native-safe runtime
// evaluator for conditions + computations. ONE common engine, two targets (JVM + JS/Node), so it runs
// in a GraalVM native image (no Groovy) and as a Node-hosted JS library — Node is the SUPPORTED JS runtime;
// a browser host is an unverified, deferred capability (INTERPRETER-FINDINGS IF138). It is a publication-eligible standalone module:
// it carries NO kernel/dmtool dependency — the kernel DIFFERENTIAL tests live in :adapter, not here, so
// this module stays kernel-free even in test scope. That separation is enforced by `verifyInterpreterPurity`
// below (proposal §8 — "separation by convention + linting, not a repo wall").
plugins {
    id 'org.jetbrains.kotlin.multiplatform' version '2.2.0'
}

repositories {
    mavenCentral()
}

kotlin {
    jvmToolchain(21)

    jvm()
    js {
        nodejs()
    }

    sourceSets {
        commonMain {
            dependencies {
                // DM-JSON → ModelDef loader (proposal §6.2 / §11 fork F1): the TREE API only
                // (Json.parseToJsonElement + a hand-written mapper) — the runtime library alone, NO compiler
                // plugin, NO @Serializable. The ONE common third-party dep; whitelisted in verifyInterpreterPurity
                // below so it stays a deliberate boundary.
                implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0'
            }
        }
        jsMain {
            dependencies {
                // Arbitrary-precision decimal backend for JS. The isolated constructor plus the bounded
                // arithmetic/rendering layer reproduce the JVM MathContext(50)/plain-render contract (IF163).
                // (behind an expect/actual shim).
                implementation npm('big.js', '6.2.2')
            }
        }
        commonTest {
            dependencies {
                implementation kotlin('test')
            }
        }
    }
}

