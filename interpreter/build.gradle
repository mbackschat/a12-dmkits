    inputs.dir(externalBrowserConsumerSourceDir)
        .withPropertyName('browserConsumerSources')
        .withPathSensitivity(org.gradle.api.tasks.PathSensitivity.RELATIVE)
    doLast {
        def authoredJavaScript = fileTree(externalBrowserConsumerSourceDir) {
            include '**/*.js'
            include '**/*.mjs'
        }.files.sort { left, right -> left.path <=> right.path }
        if (!authoredJavaScript.isEmpty()) {
            def relativePaths = authoredJavaScript.collect {
                externalBrowserConsumerSourceDir.toPath().relativize(it.toPath())
            }.join(', ')
            throw new GradleException(
                "browser consumer executable sources must be TypeScript: ${relativePaths}")
        }
    }
}
def externalBrowserConsumerBuildDir = rootProject.layout.buildDirectory.dir(
    'interpreter-release/consumer/browser',
)
def externalBrowserConsumerStoreDir = rootProject.layout.buildDirectory.dir(
    'interpreter-release/consumer-browser-pnpm-store',
)
def externalBrowserConsumerModel = file(
    'src/commonTest/resources/workspace-preparation/self-contained/permit-basic.dm.json',
)
def externalBrowserConsumerWorkspaceDir = file(
    'src/commonTest/resources/workspace-preparation',
)
def externalBrowserConsumerWorkspaceFiles = fileTree(externalBrowserConsumerWorkspaceDir) {
    include 'entries/permit-single.dm.json'
    include 'shared/permit-section.dm.json'
    include 'shared/inspection-checks.dm.json'
    include 'shared/permit-types.dm.json'
