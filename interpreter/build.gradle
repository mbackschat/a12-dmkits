// The dm-interpreter (docs/INTERPRETER-SPEC.md; impl in docs/INTERPRETER-ARCHITECTURE.md) — a Kotlin Multiplatform, native-safe runtime
// evaluator for conditions + computations. ONE common engine, two targets (JVM + JS/Node), so it runs
// in a GraalVM native image (no Groovy) and as a Node-hosted JS library — Node is the SUPPORTED JS runtime;
// a browser host is an unverified, deferred capability (INTERPRETER-FINDINGS IF138). It is a publication-eligible standalone module:
// it carries NO kernel/dmtool dependency — the kernel DIFFERENTIAL tests live in :adapter, not here, so
// this module stays kernel-free even in test scope. That separation is enforced by `verifyInterpreterPurity`
// below (proposal §8 — "separation by convention + linting, not a repo wall").
plugins {
    id 'org.jetbrains.kotlin.multiplatform' version '2.2.0'
}

repositories {
    mavenCentral()
}

kotlin {
    jvmToolchain(21)

    jvm()
    js {
        nodejs()
    }

    sourceSets {
        commonMain {
            dependencies {
                // DM-JSON → ModelDef loader (proposal §6.2 / §11 fork F1): the TREE API only
                // (Json.parseToJsonElement + a hand-written mapper) — the runtime library alone, NO compiler
                // plugin, NO @Serializable. The ONE common third-party dep; whitelisted in verifyInterpreterPurity
                // below so it stays a deliberate boundary.
                implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0'
            }
        }
        jsMain {
            dependencies {
                // Arbitrary-precision decimal backend for JS. Exact small arithmetic is covered; full JVM
                // MathContext(50) and plain-render parity remains IG89. The ONE JS-platform dependency
                // (behind an expect/actual shim).
                implementation npm('big.js', '6.2.2')
            }
        }
        commonTest {
            dependencies {
                implementation kotlin('test')
            }
        }
    }
}

// --- Separation by linting (proposal §8) ------------------------------------------------------------
// The engine must never couple to the kernel or dmtool. A forbidden import fails the build, so the
// kernel-free / native-safe / publication-eligible standalone boundary can't silently erode as the engine grows.
def verifyInterpreterPurity = tasks.register('verifyInterpreterPurity') {
    group = 'verification'
    description = 'Fail on a forbidden import so the kernel-free engine cannot couple to the kernel/dmtool/JVM.'
    def srcRoot = file('src')
    inputs.dir(srcRoot)
    doLast {
        // commonMain (the code that compiles to JS + native) is held to an ALLOWLIST, not just a blacklist:
        // every third-party dependency must be a DELIBERATE, reviewed boundary (proposal §11 fork F1). A new
        // external import fails the build until it is declared here on purpose — it can never slip in silently.
        // Allowed in commonMain = the Kotlin stdlib, the module's own packages, and these named third parties:
        def commonAllowedThirdParty = [
            'kotlinx.serialization.',   // F1: DM-JSON loader — TREE API only (Json.parseToJsonElement + hand mapper)
        ]
        def commonAllowedPrefixes = ['kotlin.', 'io.github.mbackschat.a12.dm.interpreter.'] + commonAllowedThirdParty

        // sourceSet -> forbidden import prefixes (+ why). commonMain must be pure common Kotlin (it compiles
        // to JS); the JVM shim may touch java.* but never the kernel; the JS shim is pure Kotlin/JS + externals.
        def rules = [
            commonMain: [forbidden: ['java.', 'javax.', 'com.mgmtp.', 'groovy.'], allowed: commonAllowedPrefixes,
                         why: 'must be pure common Kotlin (compiles to JS) — no JVM/kernel/groovy types'],
            jvmMain   : [forbidden: ['com.mgmtp.', 'groovy.'],
                         why: 'the JVM shim may use java.* but never the kernel/groovy (no runtime kernel dep)'],
            jsMain    : [forbidden: ['java.', 'javax.', 'com.mgmtp.', 'groovy.'],
                         why: 'the JS shim is pure Kotlin/JS + JS externals'],
            commonTest: [forbidden: ['com.mgmtp.', 'groovy.'],
                         why: 'the kernel differential tests live in :adapter, not here — keep this module kernel-free'],
        ]
        def violations = []
        rules.each { sourceSet, rule ->
            def dir = new File(srcRoot, sourceSet)
            if (!dir.exists()) return
            dir.eachFileRecurse { f ->
                if (!f.name.endsWith('.kt')) return
                f.eachLine { line, n ->
                    def m = (line =~ /^\s*import\s+([\w.]+)/)
                    if (m) {
                        def imp = m.group(1)
                        rule.forbidden.each { bad ->
                            if (imp.startsWith(bad)) {
                                violations << "${sourceSet}/${f.name}:${n}: import ${imp}  (${rule.why})".toString()
                            }
                        }
                        if (rule.allowed && !rule.allowed.any { imp.startsWith(it) }) {
                            violations << ("${sourceSet}/${f.name}:${n}: import ${imp}  (undeclared third-party — commonMain " +
                                "allows only the Kotlin stdlib, the interpreter's own packages, and declared deps; add it to " +
                                "commonAllowedThirdParty citing proposal §11 F1 if deliberate)").toString()
                        }
                    }
                }
            }
        }
        if (violations) {
            throw new GradleException(
                "interpreter purity violated — separation by linting (proposal §8):\n  " + violations.join('\n  '))
        }
    }
}
tasks.named('check') { dependsOn verifyInterpreterPurity }

// --- Conformance corpus replay (WI-6) --------------------------------------------------------------
// CorpusReplayCommonTest replays the committed corpus/cases tree through the interpreter on BOTH targets
// (jvm + js). It locates the corpus via CORPUS_DIR (the robust Gradle-provided path — never a fragile
// relative guess from the Node/JVM working dir; CONFORMANCE-CORPUS-SPEC) — a case's modelRef resolves
// against the corpus root (CORPUS_DIR's parent). The whole corpus tree (cases + shared models/*.json) is
// declared inputs of both test tasks, so a case OR model edit re-runs the replay and a no-change run stays
// cached (the declared-inputs discipline, docs/TESTING-SPEC.md). jsNodeTest is the first kernel-grounded JS oracle.
def corpusCasesDir = rootProject.file('corpus/cases')
def corpusFiles = rootProject.fileTree('corpus') { include '**/*.json' }
['jvmTest', 'jsNodeTest'].each { taskName ->
    tasks.named(taskName) {
        environment 'CORPUS_DIR', corpusCasesDir.absolutePath
        inputs.files(corpusFiles).withPropertyName('conformanceCorpus').optional()
    }
}
