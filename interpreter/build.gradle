def normalizeMavenPackagePath = { String path ->
    def normalized = path.replace(project.version.toString(), '<version>')
    if (project.version.toString().endsWith('-SNAPSHOT')) {
        def baseVersion = project.version.toString() - '-SNAPSHOT'
        normalized = normalized.replaceAll(
            java.util.regex.Pattern.quote(baseVersion) + /-\d{8}\.\d{6}-\d+/,
            '<snapshot-build>',
        )
    }
    normalized
}
def packageManifestText = { Collection<String> entries ->
    entries.toSet().toList().sort().join('\n') + '\n'
}
def generateInterpreterPackageManifests = tasks.register(
    'generateInterpreterPackageManifests',
) {
    group = 'build'
    description = 'Render exact npm and normalized Maven staged-file manifests.'
    dependsOn packInterpreterNpmPackage
    dependsOn publishInterpreterToStaging
    inputs.file(interpreterNpmTarball)
    inputs.dir(interpreterStagingMavenDir)
    outputs.file(generatedNpmPackageManifest)
    outputs.file(generatedMavenPackageManifest)
    doLast {
        def npmEntries = []
        tarTree(interpreterNpmTarball.get().asFile).visit { details ->
            if (!details.directory) {
                npmEntries += details.relativePath.pathString
            }
        }
        def mavenRoot = interpreterStagingMavenDir.get().asFile
        def mavenEntries = fileTree(mavenRoot).files.collect { published ->
            normalizeMavenPackagePath(
                mavenRoot.toPath().relativize(published.toPath()).toString().replace('\\', '/'),
            )
        }
        if (!npmEntries || !mavenEntries) {
            throw new GradleException('interpreter package manifests cannot be empty')
        }
        def npmManifestFile = generatedNpmPackageManifest.get().asFile
        def mavenManifestFile = generatedMavenPackageManifest.get().asFile
        npmManifestFile.parentFile.mkdirs()
        npmManifestFile.setText(packageManifestText(npmEntries), 'UTF-8')
        mavenManifestFile.setText(packageManifestText(mavenEntries), 'UTF-8')
    }
}

def assertReleaseContract = { String label, File committed, File generated ->
    if (!committed.isFile()) {
        throw new GradleException(
            "missing reviewed ${label} ${committed}; run :interpreter:updateInterpreterReleaseContracts",
        )
    }
    if (committed.getText('UTF-8') != generated.getText('UTF-8')) {
        throw new GradleException(
            "${label} drifted from ${committed}; run :interpreter:updateInterpreterReleaseContracts " +
                'and review the diff',
        )
    }
}
def collectCoordinates
collectCoordinates = { value, Set<String> sink ->
    if (value instanceof Map) {
        if (value.group instanceof String && value.module instanceof String) {
            sink.add("${value.group}:${value.module}")
        }
        value.values().each { child -> collectCoordinates(child, sink) }
    } else if (value instanceof Collection) {
        value.each { child -> collectCoordinates(child, sink) }
    }
}
def releaseSecretPatterns = [
    [
        name: 'corporate email/domain',
        pattern: java.util.regex.Pattern.compile('(?i)mgm-tp\\.com'),
    ],
    [
        name: 'machine-local Unix path',
        pattern: java.util.regex.Pattern.compile('(?:/Users/|/home/[^/\\s]+/)'),
    ],
    [
        name: 'machine-local Windows path',
        pattern: java.util.regex.Pattern.compile('(?i)[A-Z]:\\\\Users\\\\'),
    ],
    [
        name: 'machine-local file URL',
        pattern: java.util.regex.Pattern.compile('(?i)file:(?://)?(?:/Users/|/home/|[A-Z]:)'),
    ],
    [
        name: 'private repository URL',
        pattern: java.util.regex.Pattern.compile(
            '(?i)https?://[^\\s"<>]*(?:artifactory|nexus|mgmtp)',
        ),
    ],
    [
        name: 'GitHub/npm token',
        pattern: java.util.regex.Pattern.compile(
            '(?i)(?:gh[pousr]|github_pat|npm)_[A-Za-z0-9_]{20,}',
        ),
    ],
    [
        name: 'private key',
        pattern: java.util.regex.Pattern.compile(
            '-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----',
        ),
    ],
]
def scanReleaseText = { String label, String text, List<String> violations ->
    releaseSecretPatterns.each { rule ->
        if (rule.pattern.matcher(text).find()) {
            violations += "${label}: ${rule.name}"
        }
    }
}

