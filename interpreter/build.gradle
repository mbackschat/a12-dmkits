def interpreterRuntimeClosurePolicyTest = tasks.register('interpreterRuntimeClosurePolicyTest') {
    group = 'verification'
    description = 'Exercise the NFR-F1 collector and policy against live-graph and synthetic does-fire fixtures.'
    inputs.files(projectRuntimeGraphFixture)
    inputs.files(moduleRuntimeGraphFixture)
    doLast {
        def fixtures = [
            [kind: RuntimeClosureEntryKind.PROJECT, identity: 'project :rulekit'],
            [kind: RuntimeClosureEntryKind.MODULE, identity: 'io.github.mbackschat.a12.dm:dmkits-core:0.8.2',
             group: 'io.github.mbackschat.a12.dm', name: 'dmkits-core'],
            [kind: RuntimeClosureEntryKind.MODULE, identity: 'com.mgmtp.a12.kernel:kernel-md-runtime:30.8.1',
             group: 'com.mgmtp.a12.kernel', name: 'kernel-md-runtime'],
            [kind: RuntimeClosureEntryKind.MODULE, identity: 'org.apache.groovy:groovy:4.0.0',
             group: 'org.apache.groovy', name: 'groovy'],
            [kind: RuntimeClosureEntryKind.OPAQUE_FILE, identity: '/tmp/opaque-runtime.jar'],
            [kind: RuntimeClosureEntryKind.NPM_PACKAGE, identity: '@a12/dmtool@0.8.2',
             name: '@a12/dmtool'],
            [kind: RuntimeClosureEntryKind.NPM_PACKAGE, identity: '@a12/adapter@0.8.2',
             name: '@a12/adapter'],
            [kind: RuntimeClosureEntryKind.NPM_PACKAGE, identity: '@a12/kernel@30.8.1',
             name: '@a12/kernel'],
        ]
        def missed = fixtures.findAll { RuntimeClosurePolicy.violation(it) == null }
        if (missed) {
            throw new GradleException("runtime-closure policy failed to reject fixtures: " +
                missed.collect { it.identity }.join(', '))
        }

        def fixtureDir = temporaryDir
        def first = new File(fixtureDir, 'first.jar').tap { text = 'first' }
        def second = new File(fixtureDir, 'second.jar').tap { text = 'second' }
        def reconciled = RuntimeClosureReconciler.reconcile([first, second], [
            [file: first, entry: [kind: RuntimeClosureEntryKind.MODULE, identity: 'org.example:first:1',
                                  key: 'module:org.example:first:1', group: 'org.example', name: 'first']],
            [file: second, entry: [kind: RuntimeClosureEntryKind.MODULE, identity: 'org.example:second:1',
                                   key: 'module:org.example:second:1', group: 'org.example', name: 'second']],
        ])
        if (reconciled.errors || reconciled.entries*.file*.canonicalPath.toSet() != [first, second]*.canonicalPath.toSet()) {
            throw new GradleException("runtime-file reconciliation did not account for every canonical file exactly once")
        }
        def duplicate = RuntimeClosureReconciler.reconcile([first], [
            [file: first, entry: fixtures[1]],
            [file: first, entry: fixtures[2]],
        ])
        if (!duplicate.errors.any { it.contains('exactly one') }) {
            throw new GradleException("duplicate artifact ownership fixture did not fail reconciliation")
        }
        def opaqueFile = new File(fixtureDir, 'unmatched.jar').tap { text = 'opaque' }
        def opaqueDir = new File(fixtureDir, 'unmatched-dir').tap { mkdirs() }
        def opaque = RuntimeClosureReconciler.reconcile([opaqueFile, opaqueDir], [])
        if (opaque.entries.size() != 2 ||
            opaque.entries.any { it.kind != RuntimeClosureEntryKind.OPAQUE_FILE ||
                RuntimeClosurePolicy.violation(it) == null }) {
            throw new GradleException("unmatched runtime file/directory fixtures did not become rejected opaque entries")
        }

        def projectIds = projectRuntimeGraphFixture.incoming.artifactView {}.artifacts.artifacts*.id*.componentIdentifier
        def projectClosure = collectClosure(projectRuntimeGraphFixture)
        if (!projectIds.any { it instanceof org.gradle.api.artifacts.component.ProjectComponentIdentifier } ||
            projectClosure.errors ||
            !(projectClosure.entries + projectClosure.graphOnly).any {
                it.kind == RuntimeClosureEntryKind.PROJECT && RuntimeClosurePolicy.violation(it) != null
            }) {
            throw new GradleException("live project graph did not flow through runtimeEntry → reconcile → policy rejection")
        }
        def moduleIds = moduleRuntimeGraphFixture.incoming.artifactView {}.artifacts.artifacts*.id*.componentIdentifier
        def moduleClosure = collectClosure(moduleRuntimeGraphFixture)
        def annotations = (moduleClosure.entries + moduleClosure.graphOnly).find {
            it.kind == RuntimeClosureEntryKind.MODULE &&
                it.group == 'org.jetbrains' &&
                it.name == 'annotations'
        }
        if (!moduleIds.any { it instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier } ||
            moduleClosure.errors ||
            annotations == null ||
            RuntimeClosurePolicy.violation(annotations) != null) {
            throw new GradleException("live module graph did not flow through runtimeEntry → reconcile → safe policy result")
        }
        opaqueGraphFile.parentFile.mkdirs()
        opaqueGraphFile.text = 'opaque-file'
        opaqueGraphDir.mkdirs()
        new File(opaqueGraphDir, 'payload').text = 'opaque-directory'
        def opaqueGraphClosure = collectClosure(opaqueRuntimeGraphFixture)
        if (opaqueGraphClosure.errors ||
            opaqueGraphClosure.entries.size() != 2 ||
            opaqueGraphClosure.entries.any {
                it.kind != RuntimeClosureEntryKind.OPAQUE_FILE || RuntimeClosurePolicy.violation(it) == null
            }) {
            throw new GradleException("live file-dependency graph did not flow through runtimeEntry → reconcile → policy rejection")
        }

        def npmRoot = new File(fixtureDir, 'node_modules')
        def safe = new File(npmRoot, 'safe-parent').tap { mkdirs() }
        new File(fixtureDir, 'package.json').text = '{"dependencies":{"safe-parent":"1.0.0"}}'
        new File(safe, 'package.json').text =
            '{"name":"safe-parent","version":"1.0.0","dependencies":{' +
            '"@a12/dmtool":"0.8.2","nested-carrier":"1.0.0","shadowed":"1.0.0"},' +
            '"optionalDependencies":{"@a12/kernel":"30.8.1","shadowed":"2.0.0"},' +
            '"peerDependencies":{"@a12/adapter":"0.8.2"},' +
            '"peerDependenciesMeta":{"@a12/adapter":{"optional":true}}}'
        def forbiddenNpm = new File(npmRoot, '@a12/dmtool').tap { mkdirs() }
        new File(forbiddenNpm, 'package.json').text = '{"name":"@a12/dmtool","version":"0.8.2"}'
        def hoistedCarrier = new File(npmRoot, 'nested-carrier').tap { mkdirs() }
        new File(hoistedCarrier, 'package.json').text =
            '{"name":"nested-carrier","version":"1.0.0","dependencies":{}}'
        def nestedCarrier = new File(safe, 'node_modules/nested-carrier').tap { mkdirs() }
        new File(nestedCarrier, 'package.json').text =
            '{"name":"nested-carrier","version":"2.0.0",' +
            '"optionalDependencies":{"@a12/dmtool-nested":"0.8.2"}}'
        def npm = NpmProductionClosure.resolve(new File(fixtureDir, 'package.json'), npmRoot)
        def rejectedNpm = npm.entries.findAll { RuntimeClosurePolicy.violation(it)?.contains('forbidden') }*.name.toSet()
        if (npm.errors ||
            !rejectedNpm.containsAll(['@a12/dmtool', '@a12/dmtool-nested', '@a12/kernel', '@a12/adapter'])) {
            throw new GradleException("recursive production npm fixture missed forbidden dependency/optional/peer declarations: " +
                "${rejectedNpm}")
        }

        def outsidePackage = new File(fixtureDir, 'outside-package/package.json').tap {
            parentFile.mkdirs()
            text = '{"dependencies":{"root-only":"1.0.0"}}'
        }
        def separateModules = new File(fixtureDir, 'separate-workspace/node_modules')
        def rootOnly = new File(separateModules, 'root-only').tap { mkdirs() }
        new File(rootOnly, 'package.json').text = '{"name":"root-only","version":"1.0.0"}'
        def outside = NpmProductionClosure.resolve(outsidePackage, separateModules)
        if (outside.errors || outside.entries*.name != ['root-only']) {
            throw new GradleException("package outside the npm workspace did not use the explicit root node_modules fallback")
        }
    }
}
tasks.named('check') { dependsOn interpreterRuntimeClosurePolicyTest }

// `verifyInterpreterPurity` guards the IMPORT boundary; this guards the RESOLVED DEPENDENCY graph. NFR-F1's
// hard-zero is absolute — the interpreter carries NO runtime edge to the kernel (com.mgmtp), Groovy, dmtool, or
// any other intra-repo kit — so a forbidden RESOLVED artifact fails the build (a structural invariant, not a
// candidate number). The JVM and Node-production graphs have separate deterministic reports; each runtime file
// is reconciled exactly once with its resolution result, and production npm dependency, optional-dependency, and
// peer-dependency declarations are walked recursively.

def writeClosureReport = { File report, String host, List ownEntries, Map closure, List extraEntries ->
    def allEntries = ownEntries + closure.entries + closure.graphOnly + extraEntries
    def violations = new ArrayList(closure.errors)
    allEntries.each { entry ->
        def violation = entry.kind == null ? null : RuntimeClosurePolicy.violation(entry)
        if (violation) violations << violation
    }
    long total = allEntries.sum { (it.bytes ?: 0L) as long } ?: 0L
    def lines = allEntries.sort { a, b -> a.identity <=> b.identity }.collect { entry ->
        def disposition = entry.bytes == null ? 'graph-only' : "${entry.bytes} bytes"
        "  ${disposition}  ${entry.identity}".toString()
    }
    report.parentFile.mkdirs()
    report.text = "interpreter ${host} production runtime closure (NFR-F1)\n" +
        "reconciled-files=${closure.entries.size()} graph-only=${closure.graphOnly.size()} " +
        "entries=${allEntries.size()} bytes=${total}\n" + lines.join('\n') + '\n'
    [entries: allEntries, total: total, violations: violations]
}

def interpreterRuntimeClosure = tasks.register('interpreterRuntimeClosure') {
    group = 'verification'
    description = 'Reconcile every JVM runtime file, enforce the NFR-F1 hard-zero, and write the JVM closure report.'
    def runtime = configurations.named('jvmRuntimeClasspath')
    def jarFile = tasks.named('jvmJar').flatMap { it.archiveFile }
    def reportFile = layout.buildDirectory.file('reports/interpreter-closure/jvm-runtime-closure.txt')
    inputs.files(runtime)
    inputs.files(jarFile)
    outputs.file(reportFile)
    doLast {
        def jar = jarFile.get().asFile
        def closure = collectClosure(runtime.get())
        def result = writeClosureReport(reportFile.get().asFile, 'JVM', [
            [identity: "${jar.name} (the interpreter's own artifact)", bytes: jar.length()],
        ], closure, [])
        println "[closure] interpreter JVM closure: ${result.total} bytes across ${result.entries.size()} entries → ${reportFile.get().asFile}"
        if (result.violations) {
            throw new GradleException("interpreter JVM runtime closure violates the NFR-F1 hard-zero:\n  " +
                result.violations.join('\n  '))
        }
    }
}

def interpreterJsRuntimeClosure = tasks.register('interpreterJsRuntimeClosure') {
    group = 'verification'
    description = 'Reconcile the JS runtime graph and recursive production npm closure, enforce the hard-zero, and write the JS report.'
    def runtime = configurations.named('jsRuntimeClasspath')
    def publicPackageTask = tasks.named('jsPublicPackageJson')
    def ownJar = tasks.named('jsJar').flatMap { it.archiveFile }
    def reportFile = layout.buildDirectory.file('reports/interpreter-closure/js-runtime-closure.txt')
    dependsOn publicPackageTask
    dependsOn rootProject.tasks.named('kotlinNpmInstall')
    dependsOn ownJar
    inputs.files(runtime)
    inputs.files(publicPackageTask.map { it.packageJsonFile })
    inputs.files(ownJar)
    inputs.file(rootProject.layout.buildDirectory.file('js/yarn.lock'))
    outputs.file(reportFile)
    doLast {
        def publicPackage = publicPackageTask.get().packageJsonFile as File
        def nodeModules = rootProject.layout.buildDirectory.dir('js/node_modules').get().asFile
        def npm = NpmProductionClosure.resolve(publicPackage, nodeModules)
        def closure = collectClosure(runtime.get())
        closure.errors.addAll(npm.errors)
        def jar = ownJar.get().asFile
        def result = writeClosureReport(reportFile.get().asFile, 'JS/Node', [
            [identity: "${jar.name} (the interpreter's own JS artifact)", bytes: jar.length()],
        ], closure, npm.entries)
        println "[closure] interpreter JS/Node closure: ${result.total} bytes across ${result.entries.size()} entries → ${reportFile.get().asFile}"
        if (result.violations) {
            throw new GradleException("interpreter JS/Node runtime closure violates the NFR-F1 hard-zero:\n  " +
                result.violations.join('\n  '))
        }
    }
}
tasks.named('check') {
    dependsOn interpreterRuntimeClosure
    dependsOn interpreterJsRuntimeClosure
}

// --- Conformance corpus replay (WI-6) --------------------------------------------------------------
// CorpusReplayCommonTest replays the committed corpus/cases tree through the interpreter on BOTH targets
// (jvm + js). It locates the corpus via CORPUS_DIR (the robust Gradle-provided path — never a fragile
// relative guess from the Node/JVM working dir; CONFORMANCE-CORPUS-SPEC) — a case's modelRef resolves
// against the corpus root (CORPUS_DIR's parent). The whole corpus tree (cases + shared models/*.json) is
// declared inputs of both test tasks, so a case OR model edit re-runs the replay and a no-change run stays
// cached (the declared-inputs discipline, docs/TESTING-SPEC.md). jsNodeTest is the first kernel-grounded JS oracle.
def corpusCasesDir = rootProject.file('corpus/cases')
def corpusFiles = rootProject.fileTree('corpus') { include '**/*.json' }
['jvmTest', 'jsNodeTest'].each { taskName ->
    tasks.named(taskName) {
        environment 'CORPUS_DIR', corpusCasesDir.absolutePath
        inputs.files(corpusFiles).withPropertyName('conformanceCorpus').optional()
    }
}

// --- Local retained-heap/allocation worker forks (IG79 / RV-2026-07-20-03-8) ---------------------
// These measurement runs are deliberately opt-in: without -PfootprintForks the extra JVM/Node test runs
// are not even registered, so `check` and CI scheduling stay unchanged. Each fork is a separate Gradle test
// task and therefore a separate host process. The workers communicate only through one unique JSON file;
// stdout remains owned by the Gradle/Kotlin test harness.
def footprintForkCountProperty = providers.gradleProperty('footprintForks')
def footprintRun = tasks.register('interpreterFootprint') {
    group = 'measurement'
    description = 'Run independently forked JVM and Node retained-heap/allocation measurements (local opt-in).'
}

if (!footprintForkCountProperty.isPresent()) {
    footprintRun.configure {
        doLast {
            throw new GradleException(
                'interpreterFootprint is local opt-in; supply -PfootprintForks=5, -PfootprintCommit=<git-sha>, ' +
                    '-PfootprintScales=N,2N,4N,8N, -PfootprintWarmup=<n>, and -PfootprintRepetitions=<n>.')
        }
    }
} else {
    def forkCount = footprintForkCountProperty.get().toInteger()
    if (forkCount < 5) {
        throw new GradleException("footprintForks must be at least 5, was ${forkCount}")
    }
    def requiredProperty = { String name ->
        def value = providers.gradleProperty(name)
        if (!value.isPresent() || value.get().isBlank()) {
            throw new GradleException("interpreterFootprint requires -P${name}=...")
        }
        value.get()
    }
    def commit = requiredProperty('footprintCommit')
    if (!(commit ==~ /[0-9a-f]{8,64}/)) {
        throw new GradleException('footprintCommit must be an 8–64 character lowercase hexadecimal git identity')
    }
    def scalesText = requiredProperty('footprintScales')
    def scales = scalesText.split(',').collect { it.trim().toInteger() }
    if (scales.size() != 4 || scales[0] <= 0 ||
        (1..<scales.size()).any { index -> scales[index] != scales[index - 1] * 2 }) {
        throw new GradleException("footprintScales must be exactly N,2N,4N,8N, was ${scalesText}")
    }
    def warmup = requiredProperty('footprintWarmup').toInteger()
    def repetitions = requiredProperty('footprintRepetitions').toInteger()
    if (warmup <= 0 || repetitions <= 0) {
        throw new GradleException('footprintWarmup and footprintRepetitions must be positive')
    }
    def jvmHeap = providers.gradleProperty('footprintJvmHeap').getOrElse('512m')
    def nodeHeapMb = providers.gradleProperty('footprintNodeHeapMb').getOrElse('512')
    def nodeTimeout = providers.gradleProperty('footprintNodeTimeout').getOrElse('120s')
    if (!(nodeHeapMb ==~ /[1-9][0-9]*/)) {
        throw new GradleException('footprintNodeHeapMb must be a positive integer')
    }

    def rawReportDir = layout.buildDirectory.dir('reports/interpreter-footprint/raw')
    def commonEnvironment = { task, String host, int fork, File output ->
        task.environment 'FOOTPRINT_ENABLED', 'true'
        task.environment 'FOOTPRINT_OUTPUT', output.absolutePath
        task.environment 'FOOTPRINT_INVOCATION_ID', "${host.toLowerCase(Locale.ROOT)}-${fork}"
        task.environment 'FOOTPRINT_COMMIT', commit
        task.environment 'FOOTPRINT_SCALES', scalesText
        task.environment 'FOOTPRINT_WARMUP', warmup.toString()
        task.environment 'FOOTPRINT_REPETITIONS', repetitions.toString()
        task.outputs.file(output).withPropertyName('footprintResult')
        task.outputs.upToDateWhen { false }
        task.outputs.cacheIf { false }
        task.doFirst {
            project.delete(output)
            output.parentFile.mkdirs()
        }
        task.doLast {
            if (!output.isFile() || output.length() == 0L) {
                throw new GradleException("${task.path} did not write its structured result to ${output}")
            }
        }
    }

    def jvmTest = tasks.named('jvmTest', Test)
    def workerTasks = []
    (1..forkCount).each { fork ->
        def output = rawReportDir.get().file("jvm-${fork}.json").asFile
        workerTasks << tasks.register("footprintJvmFork${fork}", Test) {
            group = 'measurement'
            description = "Run JVM footprint sample fork ${fork}."
            dependsOn tasks.named('jvmTestClasses')
            testClassesDirs = jvmTest.get().testClassesDirs
            classpath = jvmTest.get().classpath
            filter {
                includeTestsMatching(
                    'io.github.mbackschat.a12.dm.interpreter.footprint.FootprintJvmWorkerTest')
            }
            maxParallelForks = 1
            forkEvery = 1
            failFast = true
            minHeapSize = jvmHeap
            maxHeapSize = jvmHeap
            jvmArgs '-XX:+UseSerialGC', '-XX:-DisableExplicitGC'
            commonEnvironment(delegate, 'JVM', fork, output)
        }
    }

    def jsTarget = kotlin.targets.getByName('js')
    (1..forkCount).each { fork ->
        def runName = "footprintNodeFork${fork}"
        jsTarget.testRuns.create(runName)
        def output = rawReportDir.get().file("node-${fork}.json").asFile
        workerTasks << tasks.named(
            "jsNode${runName.capitalize()}Test",
            org.jetbrains.kotlin.gradle.targets.js.testing.KotlinJsTest,
        ) {
            group = 'measurement'
            description = "Run Node footprint sample fork ${fork}."
            filter.includeTestsMatching(
                'io.github.mbackschat.a12.dm.interpreter.footprint.FootprintNodeWorkerTest')
            useMocha {
                timeout = nodeTimeout
            }
            nodeJsArgs.add('--expose-gc')
            nodeJsArgs.add("--max-old-space-size=${nodeHeapMb}")
            commonEnvironment(delegate, 'NODE', fork, output)
        }
    }

    def aggregateOutput = layout.buildDirectory.file('reports/interpreter-footprint/footprint-report.json')
    def aggregateTask = tasks.register('footprintAggregateReport', Test) {
        group = 'measurement'
        description = 'Validate raw JVM/Node footprint forks and write informative median/curve JSON.'
        dependsOn workerTasks
        dependsOn tasks.named('jvmTestClasses')
        testClassesDirs = jvmTest.get().testClassesDirs
        classpath = jvmTest.get().classpath
        filter {
            includeTestsMatching(
                'io.github.mbackschat.a12.dm.interpreter.footprint.FootprintAggregateWorkerTest')
        }
        maxParallelForks = 1
        forkEvery = 1
        failFast = true
        environment 'FOOTPRINT_AGGREGATE_ENABLED', 'true'
        environment 'FOOTPRINT_AGGREGATE_DIR', rawReportDir.get().asFile.absolutePath
        environment 'FOOTPRINT_AGGREGATE_OUTPUT', aggregateOutput.get().asFile.absolutePath
        environment 'FOOTPRINT_AGGREGATE_FORKS', forkCount.toString()
        inputs.files(workerTasks.collect { task -> task.flatMap { it.outputs.files.elements } })
            .withPropertyName('rawFootprintForks')
        outputs.file(aggregateOutput).withPropertyName('footprintAggregate')
        outputs.upToDateWhen { false }
        outputs.cacheIf { false }
        doFirst {
            project.delete(aggregateOutput)
        }
        doLast {
            if (!aggregateOutput.get().asFile.isFile() || aggregateOutput.get().asFile.length() == 0L) {
                throw new GradleException("footprint aggregation did not write ${aggregateOutput.get().asFile}")
            }
        }
    }

    footprintRun.configure {
        dependsOn aggregateTask
        doLast {
            println "[footprint] validated ${forkCount} JVM + ${forkCount} Node process results → " +
                aggregateOutput.get().asFile
        }
    }
}

// --- Local NFR-S/P evidence: independent first-answer processes + absolute JVM/Node throughput (IF172) ----
// Opt-in only. The lane records evidence and promotes no candidate number or CI schedule. A calibrating run may
// use fewer processes; a per-number certification must supply the sample count ratified for that number.
def performanceForkCountProperty = providers.gradleProperty('performanceForks')
def performanceRun = tasks.register('interpreterPerformance') {
    group = 'measurement'
    description = 'Run fresh-process JVM/Node first-answer and absolute warm-throughput measurements.'
}

if (!performanceForkCountProperty.isPresent()) {
    performanceRun.configure {
        doLast {
            throw new GradleException(
                'interpreterPerformance is local opt-in; supply -PperformanceForks=<n>, ' +
                    '-PperformanceCommit=<git-sha>, and -PperformanceRunner=<pinned-runner-id>.')
        }
    }
} else {
    def performanceForks = performanceForkCountProperty.get().toInteger()
    if (performanceForks <= 0) {
        throw new GradleException("performanceForks must be positive, was ${performanceForks}")
    }
    def requiredPerformanceProperty = { String name ->
        def value = providers.gradleProperty(name)
        if (!value.isPresent() || value.get().isBlank()) {
            throw new GradleException("interpreterPerformance requires -P${name}=...")
        }
        value.get()
    }
    def performanceCommit = requiredPerformanceProperty('performanceCommit')
    if (!(performanceCommit ==~ /[0-9a-f]{8,64}/)) {
        throw new GradleException(
            'performanceCommit must be an 8–64 character lowercase hexadecimal git identity')
    }
    def performanceRunner = requiredPerformanceProperty('performanceRunner')
    def performanceWarmup = providers.gradleProperty('performanceWarmup').getOrElse('3').toInteger()
    def performanceRepetitions = providers.gradleProperty('performanceRepetitions').getOrElse('5').toInteger()
    if (performanceWarmup <= 0 || performanceRepetitions <= 0 || performanceRepetitions % 2 == 0) {
        throw new GradleException('performanceWarmup must be positive and performanceRepetitions positive and odd')
    }
    def performanceJvmHeap = providers.gradleProperty('performanceJvmHeap').getOrElse('1g')
    def performanceNodeHeapMb = providers.gradleProperty('performanceNodeHeapMb').getOrElse('1024')
    def performanceNodeTimeout = providers.gradleProperty('performanceNodeTimeout').getOrElse('180s')
    if (!(performanceNodeHeapMb ==~ /[1-9][0-9]*/)) {
        throw new GradleException('performanceNodeHeapMb must be a positive integer')
    }

    def performanceRawDir = layout.buildDirectory.dir('reports/interpreter-performance/raw')
    def cleanPerformanceRaw = tasks.register('cleanPerformanceRaw') {
        doLast { project.delete(performanceRawDir) }
    }
    def configurePerformanceWorker = { task, String host, String scenario, String invocation, File output,
        int warmup, int repetitions ->
        task.dependsOn cleanPerformanceRaw
        task.environment 'PERFORMANCE_ENABLED', 'true'
        task.environment 'PERFORMANCE_OUTPUT', output.absolutePath
        task.environment 'PERFORMANCE_INVOCATION_ID', invocation
        task.environment 'PERFORMANCE_COMMIT', performanceCommit
        task.environment 'PERFORMANCE_RUNNER', performanceRunner
        task.environment 'PERFORMANCE_SCENARIO', scenario
        task.environment 'PERFORMANCE_WARMUP', warmup.toString()
        task.environment 'PERFORMANCE_REPETITIONS', repetitions.toString()
        task.outputs.file(output).withPropertyName('performanceResult')
        task.outputs.upToDateWhen { false }
        task.outputs.cacheIf { false }
        task.doFirst {
            project.delete(output)
            output.parentFile.mkdirs()
        }
        task.doLast {
            if (!output.isFile() || output.length() == 0L) {
                throw new GradleException("${task.path} did not write ${output}")
            }
        }
    }

    def performanceJvmTest = tasks.named('jvmTest', Test)
    def performanceWorkers = []
    def jvmFirstAnswerScenarios = [
        'jvm-48-rules-500-rows-first-answer',
        'jvm-192-rules-500-rows-first-answer',
        'jvm-b1-100000-rows-first-answer',
    ]
    jvmFirstAnswerScenarios.eachWithIndex { scenario, scenarioIndex ->
        (1..performanceForks).each { fork ->
            def taskName = "performanceJvmFirst${scenarioIndex + 1}Fork${fork}"
            def output = performanceRawDir.get().file("${taskName}.json").asFile
            performanceWorkers << tasks.register(taskName, Test) {
                group = 'measurement'
                description = "Run fresh JVM first-answer process ${fork} for ${scenario}."
                dependsOn tasks.named('jvmTestClasses')
                testClassesDirs = performanceJvmTest.get().testClassesDirs
                classpath = performanceJvmTest.get().classpath
                filter {
                    includeTestsMatching(
                        'io.github.mbackschat.a12.dm.interpreter.performance.PerformanceJvmWorkerTest')
                }
                maxParallelForks = 1
                forkEvery = 1
                failFast = true
                minHeapSize = performanceJvmHeap
                maxHeapSize = performanceJvmHeap
                configurePerformanceWorker(
                    delegate, 'JVM', scenario, "jvm-first-${scenarioIndex + 1}-${fork}", output, 0, 1)
            }
        }
    }

    def jvmThroughputScenario = 'jvm-b1-100000-rows-warm-throughput'
    def jvmThroughputOutput = performanceRawDir.get().file('jvm-throughput.json').asFile
    performanceWorkers << tasks.register('performanceJvmThroughput', Test) {
        group = 'measurement'
        description = 'Run the pinned JVM 100k-row absolute warm-throughput sample.'
        dependsOn tasks.named('jvmTestClasses')
        testClassesDirs = performanceJvmTest.get().testClassesDirs
        classpath = performanceJvmTest.get().classpath
        filter {
            includeTestsMatching(
                'io.github.mbackschat.a12.dm.interpreter.performance.PerformanceJvmWorkerTest')
        }
        maxParallelForks = 1
        forkEvery = 1
        failFast = true
        minHeapSize = performanceJvmHeap
        maxHeapSize = performanceJvmHeap
        configurePerformanceWorker(
            delegate, 'JVM', jvmThroughputScenario, 'jvm-throughput', jvmThroughputOutput,
            performanceWarmup, performanceRepetitions)
    }

    def performanceJsTarget = kotlin.targets.getByName('js')
    (1..performanceForks).each { fork ->
        def runName = "performanceNodeFirstFork${fork}"
        performanceJsTarget.testRuns.create(runName)
        def output = performanceRawDir.get().file("node-first-${fork}.json").asFile
        performanceWorkers << tasks.named(
            "jsNode${runName.capitalize()}Test",
            org.jetbrains.kotlin.gradle.targets.js.testing.KotlinJsTest,
        ) {
            group = 'measurement'
            description = "Run fresh Node first-answer process ${fork}."
            filter.includeTestsMatching(
                'io.github.mbackschat.a12.dm.interpreter.performance.PerformanceNodeWorkerTest')
            useMocha { timeout = performanceNodeTimeout }
            nodeJsArgs.add("--max-old-space-size=${performanceNodeHeapMb}")
            configurePerformanceWorker(
                delegate, 'NODE', 'node-b1-10000-rows-first-answer', "node-first-${fork}",
                output, 0, 1)
        }
    }
    [
        'node-b1-2500-10000-rows-warm-throughput',
        'node-b2-2500-10000-rows-warm-throughput',
    ].eachWithIndex { scenario, index ->
        def runName = "performanceNodeThroughput${index + 1}"
        performanceJsTarget.testRuns.create(runName)
        def output = performanceRawDir.get().file("node-throughput-${index + 1}.json").asFile
        performanceWorkers << tasks.named(
            "jsNode${runName.capitalize()}Test",
            org.jetbrains.kotlin.gradle.targets.js.testing.KotlinJsTest,
        ) {
            group = 'measurement'
            description = "Run pinned Node warm-throughput sample for ${scenario}."
            filter.includeTestsMatching(
                'io.github.mbackschat.a12.dm.interpreter.performance.PerformanceNodeWorkerTest')
            useMocha { timeout = performanceNodeTimeout }
            nodeJsArgs.add("--max-old-space-size=${performanceNodeHeapMb}")
            configurePerformanceWorker(
                delegate, 'NODE', scenario, "node-throughput-${index + 1}", output,
                performanceWarmup, performanceRepetitions)
        }
    }

    def performanceOutput = layout.buildDirectory.file(
        'reports/interpreter-performance/library-performance-report.json')
    def performanceAggregate = tasks.register('performanceAggregateReport', Test) {
        group = 'measurement'
        description = 'Validate JVM/Node process samples and write informative p95/throughput JSON.'
        dependsOn performanceWorkers
        dependsOn tasks.named('jvmTestClasses')
        testClassesDirs = performanceJvmTest.get().testClassesDirs
        classpath = performanceJvmTest.get().classpath
        filter {
            includeTestsMatching(
                'io.github.mbackschat.a12.dm.interpreter.performance.PerformanceAggregateWorkerTest')
        }
        maxParallelForks = 1
        forkEvery = 1
        failFast = true
        environment 'PERFORMANCE_AGGREGATE_ENABLED', 'true'
        environment 'PERFORMANCE_AGGREGATE_DIR', performanceRawDir.get().asFile.absolutePath
        environment 'PERFORMANCE_AGGREGATE_OUTPUT', performanceOutput.get().asFile.absolutePath
        environment 'PERFORMANCE_AGGREGATE_FORKS', performanceForks.toString()
        inputs.files(performanceWorkers.collect { task -> task.flatMap { it.outputs.files.elements } })
            .withPropertyName('rawPerformanceProcesses')
        outputs.file(performanceOutput).withPropertyName('performanceAggregate')
        outputs.upToDateWhen { false }
        outputs.cacheIf { false }
        doFirst { project.delete(performanceOutput) }
        doLast {
            if (!performanceOutput.get().asFile.isFile() ||
                performanceOutput.get().asFile.length() == 0L) {
                throw new GradleException(
                    "performance aggregation did not write ${performanceOutput.get().asFile}")
            }
        }
    }

    performanceRun.configure {
        dependsOn ':adapter:performanceFixtureGuardTest'
        dependsOn ':adapter:performanceEligibilityTest'
        dependsOn performanceAggregate
        doLast {
            println "[performance] validated ${performanceForks} fresh processes per startup scenario + " +
                "pinned JVM/Node throughput → ${performanceOutput.get().asFile}"
        }
    }
}
