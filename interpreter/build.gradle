def sha256File = { File artifact ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    artifact.withInputStream { input ->
        def buffer = new byte[64 * 1024]
        for (int read = input.read(buffer); read >= 0; read = input.read(buffer)) {
            if (read > 0) {
                digest.update(buffer, 0, read)
            }
        }
    }
    digest.digest().collect { String.format('%02x', it & 0xff) }.join()
}
def interpreterChecksums = rootProject.layout.buildDirectory.file(
    'interpreter-release/SHA256SUMS',
)
def generateInterpreterReleaseChecksums = tasks.register(
    'generateInterpreterReleaseChecksums',
) {
    group = 'build'
    description = 'Write one stable, sorted SHA-256 manifest for npm, Maven, and API-doc payloads.'
    dependsOn verifyInterpreterReleaseContracts
    dependsOn packInterpreterApiDocumentation
    outputs.file(interpreterChecksums)
    doLast {
        def assets = [:]
        assets["npm/${interpreterNpmTarball.get().asFile.name}"] =
            interpreterNpmTarball.get().asFile
        assets["api-docs/${interpreterApiDocsArchive.get().asFile.name}"] =
            interpreterApiDocsArchive.get().asFile
        def mavenRoot = interpreterStagingMavenDir.get().asFile
        fileTree(mavenRoot).files.findAll { artifact ->
            !artifact.name.matches(/.*\.(?:md5|sha1|sha256|sha512)$/) &&
                artifact.name != 'maven-metadata.xml'
        }.each { artifact ->
            def relative = mavenRoot.toPath()
                .relativize(artifact.toPath())
                .toString()
                .replace('\\', '/')
            assets["maven/${relative}"] = artifact
        }
        def render = {
            assets.keySet().toList().sort().collect { relative ->
                "${sha256File(assets[relative])}  ${relative}"
            }.join('\n') + '\n'
        }
        def first = render()
        def second = render()
        if (first != second) {
            throw new GradleException('interpreter checksum rendering is not deterministic')
        }
        def target = interpreterChecksums.get().asFile
        target.parentFile.mkdirs()
        target.setText(first, 'UTF-8')
    }
}

