// The raw workspace matrix is authored once through modelkit/EditSession/rulekit in :adapter, then committed
// as the exact source closure observed by the real Kernel/JVM-reader preparation lock. Embed that closure in
// commonTest so both JVM and Node prove the standalone interpreter can consume the self-contained baseline
// without adding a filesystem API or a kit dependency to the publication-eligible runtime.
def workspacePreparationFixtureDir = file('src/commonTest/resources/workspace-preparation')
def workspacePreparationFixtureManifest = new File(workspacePreparationFixtureDir, 'manifest.json')
def workspacePreparationFixtureFiles = fileTree(workspacePreparationFixtureDir) { include '**/*.json' }
def generatedWorkspacePreparationFixtureDir = layout.buildDirectory
    .dir('generated/workspacePreparationFixtures/commonTest/kotlin')
    .get()
    .asFile
def generatedWorkspacePreparationFixtureSource = new File(
    generatedWorkspacePreparationFixtureDir,
    'io/github/mbackschat/a12/dm/interpreter/workspace/WorkspacePreparationFixtureJson.kt',
)
def generateWorkspacePreparationFixtureSource = tasks.register('generateWorkspacePreparationFixtureSource') {
    group = 'build'
    description = 'Embed the typed-authored raw workspace matrix for common JVM/Node tests.'
    inputs.files(workspacePreparationFixtureFiles)
        .withPropertyName('typedWorkspacePreparationModels')
        .withPathSensitivity(org.gradle.api.tasks.PathSensitivity.RELATIVE)
    outputs.file(generatedWorkspacePreparationFixtureSource)
    doLast {
        if (!workspacePreparationFixtureManifest.isFile()) {
            throw new GradleException(
                'missing workspace-preparation manifest; run :adapter:syncWorkspacePreparationFixtures')
        }
        def manifest = new groovy.json.JsonSlurper().parse(workspacePreparationFixtureManifest)
        // JsonOutput emits valid quoted Kotlin literals except for Kotlin's additional `$` interpolation syntax.
        // Route every manifest/source value through one encoder so a DSL correlation token cannot become source code.
        def kotlinStringLiteral = { value ->
            groovy.json.JsonOutput.toJson(value).replace('$', '\\$')
        }
        def validCases = manifest.cases.findAll { ignored, fixture ->
            !fixture.containsKey('expectedPreparationDiagnostic')
        }
        def rejectedCases = manifest.cases.findAll { ignored, fixture ->
            fixture.containsKey('expectedPreparationDiagnostic')
        }
        def entryCases = manifest.cases.collect { caseId, fixture ->
            "        ${kotlinStringLiteral(caseId)} -> " +
                kotlinStringLiteral(fixture.entryModelId)
        }.join('\n')
        def sourceCases = manifest.cases.collect { caseId, fixture ->
            def sources = fixture.sources.collect { modelId, relativePath ->
                def source = new File(workspacePreparationFixtureDir, relativePath as String)
                if (!source.isFile()) {
                    throw new GradleException(
                        "missing workspace-preparation source ${relativePath}; " +
                        'run :adapter:syncWorkspacePreparationFixtures')
                }
                def literal = kotlinStringLiteral(source.getText('UTF-8'))
                "            ${kotlinStringLiteral(modelId)} to ${literal}"
            }.join(',\n')
            """\
        ${kotlinStringLiteral(caseId)} -> mapOf(
${sources}
        )"""
        }.join('\n')
        def effectiveTypeCases = validCases.collect { caseId, fixture ->
            def facts = groovy.json.JsonOutput.toJson(fixture.effectiveFieldTypes)
            "        ${kotlinStringLiteral(caseId)} -> ${kotlinStringLiteral(facts)}"
        }.join('\n')
        def preparedStructureCases = validCases.collect { caseId, fixture ->
            def facts = groovy.json.JsonOutput.toJson(fixture.preparedStructure)
            "        ${kotlinStringLiteral(caseId)} -> ${kotlinStringLiteral(facts)}"
        }.join('\n')
        def preparedElementCases = validCases.collect { caseId, fixture ->
            def facts = groovy.json.JsonOutput.toJson(fixture.preparedElements)
            "        ${kotlinStringLiteral(caseId)} -> ${kotlinStringLiteral(facts)}"
        }.join('\n')
        def expectedDiagnosticCases = rejectedCases.collect { caseId, fixture ->
            "        ${kotlinStringLiteral(caseId)} -> " +
                kotlinStringLiteral(fixture.expectedPreparationDiagnostic)
        }.join('\n')
        def caseIds = validCases.keySet()
            .collect(kotlinStringLiteral)
            .join(', ')
        def rejectedCaseIds = rejectedCases.keySet()
            .collect(kotlinStringLiteral)
            .join(', ')
        generatedWorkspacePreparationFixtureSource.parentFile.mkdirs()
        generatedWorkspacePreparationFixtureSource.text = """\
package io.github.mbackschat.a12.dm.interpreter.workspace

internal object WorkspacePreparationFixtureJson {
    fun entryModelId(caseId: String): String = when (caseId) {
${entryCases}
        else -> error("unknown workspace-preparation case: \$caseId")
    }

    fun sources(caseId: String): Map<String, String> = when (caseId) {
${sourceCases}
        else -> error("unknown workspace-preparation case: \$caseId")
    }

    fun effectiveFieldTypes(caseId: String): String = when (caseId) {
${effectiveTypeCases}
        else -> error("unknown workspace-preparation case: \$caseId")
    }

    fun preparedStructure(caseId: String): String = when (caseId) {
${preparedStructureCases}
        else -> error("unknown workspace-preparation case: \$caseId")
    }

    fun preparedElements(caseId: String): String = when (caseId) {
${preparedElementCases}
        else -> error("unknown workspace-preparation case: \$caseId")
    }

    fun expectedPreparationDiagnostic(caseId: String): String = when (caseId) {
${expectedDiagnosticCases}
        else -> error("unknown rejected workspace-preparation case: \$caseId")
    }

    fun caseIds(): List<String> = listOf(${caseIds})

    fun rejectedCaseIds(): List<String> = listOf(${rejectedCaseIds})
}
"""
    }
}
