def verifyInterpreterReleaseContracts = tasks.register(
    'verifyInterpreterReleaseContracts',
) {
    group = 'verification'
    description = 'Lock TypeScript ABI and exact package contents; scan dependency and secret boundaries.'
    dependsOn generateInterpreterTypeScriptApi
    dependsOn generateInterpreterPackageManifests
    inputs.files(
        committedTypeScriptApi,
        committedNpmPackageManifest,
        committedMavenPackageManifest,
    )
    outputs.upToDateWhen { false }
    doLast {
        assertReleaseContract(
            'TypeScript ABI',
            committedTypeScriptApi,
            generatedTypeScriptApi.get().asFile,
        )
        assertReleaseContract(
            'npm package allowlist',
            committedNpmPackageManifest,
            generatedNpmPackageManifest.get().asFile,
        )
        assertReleaseContract(
            'Maven package allowlist',
            committedMavenPackageManifest,
            generatedMavenPackageManifest.get().asFile,
        )

        def mavenRoot = interpreterStagingMavenDir.get().asFile
        def poms = fileTree(mavenRoot) { include '**/*.pom' }.files
        def expectedPomDependencies = [
            'dm-interpreter': [
                'org.jetbrains.kotlin:kotlin-stdlib:2.2.0:runtime',
            ] as Set,
            'dm-interpreter-jvm': [
                'org.jetbrains.kotlin:kotlin-stdlib:2.2.0:compile',
                'org.jetbrains.kotlinx:kotlinx-serialization-json-jvm:1.9.0:runtime',
            ] as Set,
            'dm-interpreter-js': [
                'org.jetbrains.kotlin:kotlin-dom-api-compat:2.2.0:compile',
                'org.jetbrains.kotlin:kotlin-stdlib-js:2.2.0:compile',
                'org.jetbrains.kotlinx:kotlinx-serialization-json-js:1.9.0:runtime',
            ] as Set,
        ]
        def actualPomDependencies = [:].withDefault { [] as Set }
        poms.each { pomFile ->
            def pom = new groovy.xml.XmlSlurper().parse(pomFile)
            def artifactId = pom.artifactId.text()
            pom.dependencies.dependency.each { dependency ->
                actualPomDependencies[artifactId] += [
                    dependency.groupId.text(),
                    dependency.artifactId.text(),
                    dependency.version.text(),
                    dependency.scope.text(),
                ].join(':')
            }
        }
        if (poms.size() != expectedPomDependencies.size() ||
            actualPomDependencies != expectedPomDependencies) {
            throw new GradleException(
                "unexpected interpreter Maven dependency contract ${actualPomDependencies}; " +
                    "expected ${expectedPomDependencies}",
            )
        }

        def moduleCoordinates = [] as Set
        fileTree(mavenRoot) { include '**/*.module' }.files.each { moduleFile ->
            collectCoordinates(
                new groovy.json.JsonSlurper().parse(moduleFile),
                moduleCoordinates,
            )
        }
        def expectedModuleCoordinates = [
            'io.github.mbackschat.a12.dm:dm-interpreter',
            'io.github.mbackschat.a12.dm:dm-interpreter-jvm',
            'io.github.mbackschat.a12.dm:dm-interpreter-js',
            'org.jetbrains.kotlin:kotlin-dom-api-compat',
            'org.jetbrains.kotlin:kotlin-stdlib',
            'org.jetbrains.kotlinx:kotlinx-serialization-json',
        ] as Set
        if (moduleCoordinates != expectedModuleCoordinates) {
            throw new GradleException(
                "unexpected interpreter Gradle-module dependency contract ${moduleCoordinates}; " +
                    "expected ${expectedModuleCoordinates}",
            )
        }

        def violations = []
        def npmArchive = tarTree(interpreterNpmTarball.get().asFile)
        npmArchive.visit { details ->
            scanReleaseText("npm entry ${details.relativePath}", details.relativePath.pathString, violations)
        }
        npmArchive.files.each { packed ->
            scanReleaseText("npm payload ${packed.name}", packed.getText('UTF-8'), violations)
        }
        fileTree(mavenRoot) {
            include '**/*.pom'
            include '**/*.module'
            include '**/*.json'
        }.files.each { metadata ->
            scanReleaseText("Maven metadata ${metadata.name}", metadata.getText('UTF-8'), violations)
        }
        fileTree(mavenRoot) { include '**/*-sources.jar' }.files.each { sourcesJar ->
            zipTree(sourcesJar).matching {
                include '**/*.kt'
                include '**/*.java'
                include '**/*.json'
                include '**/*.md'
            }.files.each { source ->
                scanReleaseText("Maven source ${source.name}", source.getText('UTF-8'), violations)
            }
        }
        if (violations) {
            throw new GradleException(
                "interpreter release artifacts expose secret/private-source markers:\n  " +
                    violations.toSet().toList().sort().join('\n  '),
            )
        }
    }
}

