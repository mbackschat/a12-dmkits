// --- Conformance corpus replay ---------------------------------------------------------------------
// CorpusReplayCommonTest replays the committed corpus/cases tree through the interpreter on BOTH targets
// (jvm + js). It locates the corpus via CORPUS_DIR (the robust Gradle-provided path — never a fragile
// relative guess from the Node/JVM working dir; CONFORMANCE-CORPUS-SPEC) — a case's modelRef resolves
// against the corpus root (CORPUS_DIR's parent). The whole corpus tree (cases + shared models/*.json) is
// declared inputs of both test tasks, so a case OR model edit re-runs the replay and a no-change run stays
// cached (the declared-inputs discipline, docs/TESTING-SPEC.md). jsNodeTest is the first kernel-grounded JS oracle.
def corpusCasesDir = rootProject.file('corpus/cases')
