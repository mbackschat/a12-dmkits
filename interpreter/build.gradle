    }
}

// --- Local retained-heap/allocation worker forks (IG79 / RV-2026-07-20-03-8) ---------------------
// These measurement runs are deliberately opt-in: without -PfootprintForks the extra JVM/Node test runs
// are not even registered, so `check` and CI scheduling stay unchanged. Each fork is a separate Gradle test
// task and therefore a separate host process. The workers communicate only through one unique JSON file;
// stdout remains owned by the Gradle/Kotlin test harness.
def footprintForkCountProperty = providers.gradleProperty('footprintForks')
def footprintRun = tasks.register('interpreterFootprint') {
    group = 'measurement'
    description = 'Run independently forked JVM and Node retained-heap/allocation measurements (local opt-in).'
}

if (!footprintForkCountProperty.isPresent()) {
    footprintRun.configure {
        doLast {
            throw new GradleException(
                'interpreterFootprint is local opt-in; supply -PfootprintForks=5, -PfootprintCommit=<git-sha>, ' +
                    '-PfootprintScales=N,2N,4N,8N, -PfootprintWarmup=<n>, and -PfootprintRepetitions=<n>.')
        }
    }
} else {
    def forkCount = footprintForkCountProperty.get().toInteger()
    if (forkCount < 5) {
        throw new GradleException("footprintForks must be at least 5, was ${forkCount}")
    }
    def requiredProperty = { String name ->
        def value = providers.gradleProperty(name)
        if (!value.isPresent() || value.get().isBlank()) {
            throw new GradleException("interpreterFootprint requires -P${name}=...")
        }
        value.get()
    }
    def commit = requiredProperty('footprintCommit')
    if (!(commit ==~ /[0-9a-f]{8,64}/)) {
        throw new GradleException('footprintCommit must be an 8–64 character lowercase hexadecimal git identity')
    }
    def scalesText = requiredProperty('footprintScales')
    def scales = scalesText.split(',').collect { it.trim().toInteger() }
    if (scales.size() != 4 || scales[0] <= 0 ||
        (1..<scales.size()).any { index -> scales[index] != scales[index - 1] * 2 }) {
        throw new GradleException("footprintScales must be exactly N,2N,4N,8N, was ${scalesText}")
    }
    def warmup = requiredProperty('footprintWarmup').toInteger()
    def repetitions = requiredProperty('footprintRepetitions').toInteger()
    if (warmup <= 0 || repetitions <= 0) {
        throw new GradleException('footprintWarmup and footprintRepetitions must be positive')
    }
    def jvmHeap = providers.gradleProperty('footprintJvmHeap').getOrElse('512m')
    def nodeHeapMb = providers.gradleProperty('footprintNodeHeapMb').getOrElse('512')
    def nodeTimeout = providers.gradleProperty('footprintNodeTimeout').getOrElse('120s')
    if (!(nodeHeapMb ==~ /[1-9][0-9]*/)) {
        throw new GradleException('footprintNodeHeapMb must be a positive integer')
    }

    def rawReportDir = layout.buildDirectory.dir('reports/interpreter-footprint/raw')
    def commonEnvironment = { task, String host, int fork, File output ->
        task.environment 'FOOTPRINT_ENABLED', 'true'
        task.environment 'FOOTPRINT_OUTPUT', output.absolutePath
        task.environment 'FOOTPRINT_INVOCATION_ID', "${host.toLowerCase(Locale.ROOT)}-${fork}"
        task.environment 'FOOTPRINT_COMMIT', commit
        task.environment 'FOOTPRINT_SCALES', scalesText
        task.environment 'FOOTPRINT_WARMUP', warmup.toString()
        task.environment 'FOOTPRINT_REPETITIONS', repetitions.toString()
        task.outputs.file(output).withPropertyName('footprintResult')
        task.outputs.upToDateWhen { false }
        task.outputs.cacheIf { false }
        task.doFirst {
            project.delete(output)
            output.parentFile.mkdirs()
        }
        task.doLast {
            if (!output.isFile() || output.length() == 0L) {
                throw new GradleException("${task.path} did not write its structured result to ${output}")
            }
        }
    }

    def jvmTest = tasks.named('jvmTest', Test)
    def workerTasks = []
    (1..forkCount).each { fork ->
        def output = rawReportDir.get().file("jvm-${fork}.json").asFile
        workerTasks << tasks.register("footprintJvmFork${fork}", Test) {
            group = 'measurement'
            description = "Run JVM footprint sample fork ${fork}."
            dependsOn tasks.named('jvmTestClasses')
            testClassesDirs = jvmTest.get().testClassesDirs
            classpath = jvmTest.get().classpath
            filter {
                includeTestsMatching(
                    'io.github.mbackschat.a12.dm.interpreter.footprint.FootprintJvmWorkerTest')
            }
            maxParallelForks = 1
            forkEvery = 1
            failFast = true
            minHeapSize = jvmHeap
            maxHeapSize = jvmHeap
            jvmArgs '-XX:+UseSerialGC', '-XX:-DisableExplicitGC'
            commonEnvironment(delegate, 'JVM', fork, output)
        }
    }

    def jsTarget = kotlin.targets.getByName('js')
    (1..forkCount).each { fork ->
        def runName = "footprintNodeFork${fork}"
        jsTarget.testRuns.create(runName)
        def output = rawReportDir.get().file("node-${fork}.json").asFile
        workerTasks << tasks.named(
            "jsNode${runName.capitalize()}Test",
            org.jetbrains.kotlin.gradle.targets.js.testing.KotlinJsTest,
        ) {
            group = 'measurement'
            description = "Run Node footprint sample fork ${fork}."
            filter.includeTestsMatching(
                'io.github.mbackschat.a12.dm.interpreter.footprint.FootprintNodeWorkerTest')
            useMocha {
                timeout = nodeTimeout
            }
            nodeJsArgs.add('--expose-gc')
            nodeJsArgs.add("--max-old-space-size=${nodeHeapMb}")
            commonEnvironment(delegate, 'NODE', fork, output)
        }
    }

    def aggregateOutput = layout.buildDirectory.file('reports/interpreter-footprint/footprint-report.json')
    def aggregateTask = tasks.register('footprintAggregateReport', Test) {
        group = 'measurement'
        description = 'Validate raw JVM/Node footprint forks and write informative median/curve JSON.'
        dependsOn workerTasks
        dependsOn tasks.named('jvmTestClasses')
        testClassesDirs = jvmTest.get().testClassesDirs
        classpath = jvmTest.get().classpath
        filter {
            includeTestsMatching(
                'io.github.mbackschat.a12.dm.interpreter.footprint.FootprintAggregateWorkerTest')
        }
        maxParallelForks = 1
        forkEvery = 1
        failFast = true
        environment 'FOOTPRINT_AGGREGATE_ENABLED', 'true'
        environment 'FOOTPRINT_AGGREGATE_DIR', rawReportDir.get().asFile.absolutePath
        environment 'FOOTPRINT_AGGREGATE_OUTPUT', aggregateOutput.get().asFile.absolutePath
        environment 'FOOTPRINT_AGGREGATE_FORKS', forkCount.toString()
        inputs.files(workerTasks.collect { task -> task.flatMap { it.outputs.files.elements } })
            .withPropertyName('rawFootprintForks')
        outputs.file(aggregateOutput).withPropertyName('footprintAggregate')
        outputs.upToDateWhen { false }
        outputs.cacheIf { false }
        doFirst {
            project.delete(aggregateOutput)
        }
        doLast {
            if (!aggregateOutput.get().asFile.isFile() || aggregateOutput.get().asFile.length() == 0L) {
                throw new GradleException("footprint aggregation did not write ${aggregateOutput.get().asFile}")
            }
        }
    }

    footprintRun.configure {
        dependsOn aggregateTask
        doLast {
            println "[footprint] validated ${forkCount} JVM + ${forkCount} Node process results → " +
                aggregateOutput.get().asFile
        }
    }
}

// --- Local NFR-S/P evidence: independent first-answer processes + absolute JVM/Node throughput (IF172) ----
// Opt-in only. The lane records evidence and promotes no candidate number or CI schedule. A calibrating run may
// use fewer processes; a per-number certification must supply the sample count ratified for that number.
def performanceForkCountProperty = providers.gradleProperty('performanceForks')
def performanceRun = tasks.register('interpreterPerformance') {
    group = 'measurement'
    description = 'Run fresh-process JVM/Node first-answer and absolute warm-throughput measurements.'
}

if (!performanceForkCountProperty.isPresent()) {
    performanceRun.configure {
        doLast {
            throw new GradleException(
                'interpreterPerformance is local opt-in; supply -PperformanceForks=<n>, ' +
                    '-PperformanceCommit=<git-sha>, and -PperformanceRunner=<pinned-runner-id>.')
        }
    }
} else {
    def performanceForks = performanceForkCountProperty.get().toInteger()
    if (performanceForks <= 0) {
        throw new GradleException("performanceForks must be positive, was ${performanceForks}")
    }
    def requiredPerformanceProperty = { String name ->
        def value = providers.gradleProperty(name)
        if (!value.isPresent() || value.get().isBlank()) {
            throw new GradleException("interpreterPerformance requires -P${name}=...")
        }
        value.get()
    }
    def performanceCommit = requiredPerformanceProperty('performanceCommit')
    if (!(performanceCommit ==~ /[0-9a-f]{8,64}/)) {
        throw new GradleException(
            'performanceCommit must be an 8–64 character lowercase hexadecimal git identity')
    }
    def performanceRunner = requiredPerformanceProperty('performanceRunner')
    def performanceWarmup = providers.gradleProperty('performanceWarmup').getOrElse('3').toInteger()
    def performanceRepetitions = providers.gradleProperty('performanceRepetitions').getOrElse('5').toInteger()
    if (performanceWarmup <= 0 || performanceRepetitions <= 0 || performanceRepetitions % 2 == 0) {
        throw new GradleException('performanceWarmup must be positive and performanceRepetitions positive and odd')
    }
    def performanceJvmHeap = providers.gradleProperty('performanceJvmHeap').getOrElse('1g')
    def performanceNodeHeapMb = providers.gradleProperty('performanceNodeHeapMb').getOrElse('1024')
    def performanceNodeTimeout = providers.gradleProperty('performanceNodeTimeout').getOrElse('180s')
    if (!(performanceNodeHeapMb ==~ /[1-9][0-9]*/)) {
        throw new GradleException('performanceNodeHeapMb must be a positive integer')
    }

    def performanceRawDir = layout.buildDirectory.dir('reports/interpreter-performance/raw')
    def cleanPerformanceRaw = tasks.register('cleanPerformanceRaw') {
        doLast { project.delete(performanceRawDir) }
    }
    def configurePerformanceWorker = { task, String host, String scenario, String invocation, File output,
        int warmup, int repetitions ->
        task.dependsOn cleanPerformanceRaw
        task.environment 'PERFORMANCE_ENABLED', 'true'
        task.environment 'PERFORMANCE_OUTPUT', output.absolutePath
        task.environment 'PERFORMANCE_INVOCATION_ID', invocation
        task.environment 'PERFORMANCE_COMMIT', performanceCommit
        task.environment 'PERFORMANCE_RUNNER', performanceRunner
        task.environment 'PERFORMANCE_SCENARIO', scenario
        task.environment 'PERFORMANCE_WARMUP', warmup.toString()
        task.environment 'PERFORMANCE_REPETITIONS', repetitions.toString()
        task.outputs.file(output).withPropertyName('performanceResult')
        task.outputs.upToDateWhen { false }
        task.outputs.cacheIf { false }
        task.doFirst {
            project.delete(output)
            output.parentFile.mkdirs()
        }
        task.doLast {
            if (!output.isFile() || output.length() == 0L) {
                throw new GradleException("${task.path} did not write ${output}")
            }
        }
    }

    def performanceJvmTest = tasks.named('jvmTest', Test)
    def performanceWorkers = []
    def jvmFirstAnswerScenarios = [
        'jvm-48-rules-500-rows-first-answer',
        'jvm-192-rules-500-rows-first-answer',
        'jvm-b1-100000-rows-first-answer',
    ]
    jvmFirstAnswerScenarios.eachWithIndex { scenario, scenarioIndex ->
        (1..performanceForks).each { fork ->
            def taskName = "performanceJvmFirst${scenarioIndex + 1}Fork${fork}"
            def output = performanceRawDir.get().file("${taskName}.json").asFile
            performanceWorkers << tasks.register(taskName, Test) {
                group = 'measurement'
                description = "Run fresh JVM first-answer process ${fork} for ${scenario}."
                dependsOn tasks.named('jvmTestClasses')
                testClassesDirs = performanceJvmTest.get().testClassesDirs
                classpath = performanceJvmTest.get().classpath
                filter {
                    includeTestsMatching(
                        'io.github.mbackschat.a12.dm.interpreter.performance.PerformanceJvmWorkerTest')
                }
                maxParallelForks = 1
                forkEvery = 1
                failFast = true
                minHeapSize = performanceJvmHeap
                maxHeapSize = performanceJvmHeap
                configurePerformanceWorker(
                    delegate, 'JVM', scenario, "jvm-first-${scenarioIndex + 1}-${fork}", output, 0, 1)
            }
        }
    }

    def jvmThroughputScenario = 'jvm-b1-100000-rows-warm-throughput'
    def jvmThroughputOutput = performanceRawDir.get().file('jvm-throughput.json').asFile
    performanceWorkers << tasks.register('performanceJvmThroughput', Test) {
        group = 'measurement'
        description = 'Run the pinned JVM 100k-row absolute warm-throughput sample.'
        dependsOn tasks.named('jvmTestClasses')
        testClassesDirs = performanceJvmTest.get().testClassesDirs
        classpath = performanceJvmTest.get().classpath
        filter {
            includeTestsMatching(
                'io.github.mbackschat.a12.dm.interpreter.performance.PerformanceJvmWorkerTest')
        }
        maxParallelForks = 1
        forkEvery = 1
        failFast = true
        minHeapSize = performanceJvmHeap
        maxHeapSize = performanceJvmHeap
        configurePerformanceWorker(
            delegate, 'JVM', jvmThroughputScenario, 'jvm-throughput', jvmThroughputOutput,
            performanceWarmup, performanceRepetitions)
    }

    def performanceJsTarget = kotlin.targets.getByName('js')
    (1..performanceForks).each { fork ->
        def runName = "performanceNodeFirstFork${fork}"
        performanceJsTarget.testRuns.create(runName)
        def output = performanceRawDir.get().file("node-first-${fork}.json").asFile
        performanceWorkers << tasks.named(
            "jsNode${runName.capitalize()}Test",
            org.jetbrains.kotlin.gradle.targets.js.testing.KotlinJsTest,
        ) {
            group = 'measurement'
            description = "Run fresh Node first-answer process ${fork}."
            filter.includeTestsMatching(
                'io.github.mbackschat.a12.dm.interpreter.performance.PerformanceNodeWorkerTest')
            useMocha { timeout = performanceNodeTimeout }
            nodeJsArgs.add("--max-old-space-size=${performanceNodeHeapMb}")
            configurePerformanceWorker(
                delegate, 'NODE', 'node-b1-10000-rows-first-answer', "node-first-${fork}",
                output, 0, 1)
        }
    }
    [
        'node-b1-2500-10000-rows-warm-throughput',
        'node-b2-2500-10000-rows-warm-throughput',
    ].eachWithIndex { scenario, index ->
        def runName = "performanceNodeThroughput${index + 1}"
        performanceJsTarget.testRuns.create(runName)
        def output = performanceRawDir.get().file("node-throughput-${index + 1}.json").asFile
        performanceWorkers << tasks.named(
            "jsNode${runName.capitalize()}Test",
            org.jetbrains.kotlin.gradle.targets.js.testing.KotlinJsTest,
        ) {
            group = 'measurement'
            description = "Run pinned Node warm-throughput sample for ${scenario}."
            filter.includeTestsMatching(
                'io.github.mbackschat.a12.dm.interpreter.performance.PerformanceNodeWorkerTest')
            useMocha { timeout = performanceNodeTimeout }
            nodeJsArgs.add("--max-old-space-size=${performanceNodeHeapMb}")
            configurePerformanceWorker(
                delegate, 'NODE', scenario, "node-throughput-${index + 1}", output,
                performanceWarmup, performanceRepetitions)
        }
    }

    def performanceOutput = layout.buildDirectory.file(
        'reports/interpreter-performance/library-performance-report.json')
    def performanceAggregate = tasks.register('performanceAggregateReport', Test) {
        group = 'measurement'
        description = 'Validate JVM/Node process samples and write informative p95/throughput JSON.'
        dependsOn performanceWorkers
        dependsOn tasks.named('jvmTestClasses')
        testClassesDirs = performanceJvmTest.get().testClassesDirs
        classpath = performanceJvmTest.get().classpath
        filter {
            includeTestsMatching(
                'io.github.mbackschat.a12.dm.interpreter.performance.PerformanceAggregateWorkerTest')
        }
        maxParallelForks = 1
        forkEvery = 1
        failFast = true
        environment 'PERFORMANCE_AGGREGATE_ENABLED', 'true'
        environment 'PERFORMANCE_AGGREGATE_DIR', performanceRawDir.get().asFile.absolutePath
        environment 'PERFORMANCE_AGGREGATE_OUTPUT', performanceOutput.get().asFile.absolutePath
        environment 'PERFORMANCE_AGGREGATE_FORKS', performanceForks.toString()
        inputs.files(performanceWorkers.collect { task -> task.flatMap { it.outputs.files.elements } })
            .withPropertyName('rawPerformanceProcesses')
        outputs.file(performanceOutput).withPropertyName('performanceAggregate')
        outputs.upToDateWhen { false }
        outputs.cacheIf { false }
        doFirst { project.delete(performanceOutput) }
        doLast {
            if (!performanceOutput.get().asFile.isFile() ||
                performanceOutput.get().asFile.length() == 0L) {
                throw new GradleException(
                    "performance aggregation did not write ${performanceOutput.get().asFile}")
            }
        }
    }

    performanceRun.configure {
        dependsOn ':adapter:performanceFixtureGuardTest'
        dependsOn ':adapter:performanceEligibilityTest'
        dependsOn performanceAggregate
        doLast {
            println "[performance] validated ${performanceForks} fresh processes per startup scenario + " +
                "pinned JVM/Node throughput → ${performanceOutput.get().asFile}"
        }
    }
}
