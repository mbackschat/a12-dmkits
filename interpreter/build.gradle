// --- Separation by linting (proposal §8) ------------------------------------------------------------
// The engine must never couple to the kernel or dmtool. A forbidden import fails the build, so the
// kernel-free / native-safe / publication-eligible standalone boundary can't silently erode as the engine grows.
def verifyInterpreterPurity = tasks.register('verifyInterpreterPurity') {
    group = 'verification'
    description = 'Fail on a forbidden import so the kernel-free engine cannot couple to the kernel/dmtool/JVM.'
    def srcRoot = file('src')
    inputs.dir(srcRoot)
    doLast {
        // commonMain (the code that compiles to JS + native) is held to an ALLOWLIST, not just a blacklist:
        // every third-party dependency must be a DELIBERATE, reviewed boundary (proposal §11 fork F1). A new
        // external import fails the build until it is declared here on purpose — it can never slip in silently.
        // Allowed in commonMain = the Kotlin stdlib, the module's own packages, and these named third parties:
        def commonAllowedThirdParty = [
            'kotlinx.serialization.',   // F1: DM-JSON loader — TREE API only (Json.parseToJsonElement + hand mapper)
        ]
        def commonAllowedPrefixes = ['kotlin.', 'io.github.mbackschat.a12.dm.interpreter.'] + commonAllowedThirdParty

        // sourceSet -> forbidden import prefixes (+ why). commonMain must be pure common Kotlin (it compiles
        // to JS); the JVM shim may touch java.* but never the kernel; the JS shim is pure Kotlin/JS + externals.
        def rules = [
            commonMain: [forbidden: ['java.', 'javax.', 'com.mgmtp.', 'groovy.'], allowed: commonAllowedPrefixes,
                         why: 'must be pure common Kotlin (compiles to JS) — no JVM/kernel/groovy types'],
            jvmMain   : [forbidden: ['com.mgmtp.', 'groovy.'],
                         why: 'the JVM shim may use java.* but never the kernel/groovy (no runtime kernel dep)'],
            jsMain    : [forbidden: ['java.', 'javax.', 'com.mgmtp.', 'groovy.'],
                         why: 'the JS shim is pure Kotlin/JS + JS externals'],
            commonTest: [forbidden: ['com.mgmtp.', 'groovy.'],
                         why: 'the kernel differential tests live in :adapter, not here — keep this module kernel-free'],
        ]
        def violations = []
        rules.each { sourceSet, rule ->
            def dir = new File(srcRoot, sourceSet)
            if (!dir.exists()) return
            dir.eachFileRecurse { f ->
                if (!f.name.endsWith('.kt')) return
                f.eachLine { line, n ->
                    def m = (line =~ /^\s*import\s+([\w.]+)/)
                    if (m) {
                        def imp = m.group(1)
                        rule.forbidden.each { bad ->
                            if (imp.startsWith(bad)) {
                                violations << "${sourceSet}/${f.name}:${n}: import ${imp}  (${rule.why})".toString()
                            }
                        }
                        if (rule.allowed && !rule.allowed.any { imp.startsWith(it) }) {
                            violations << ("${sourceSet}/${f.name}:${n}: import ${imp}  (undeclared third-party — commonMain " +
                                "allows only the Kotlin stdlib, the interpreter's own packages, and declared deps; add it to " +
                                "commonAllowedThirdParty citing proposal §11 F1 if deliberate)").toString()
                        }
                    }
                }
            }
        }
        // The filtered field-list traversal has ONE owner (SPEC-2026-07-23-12 follow-up, client-required):
        // keptRowsWithSuccessorLookahead in eval/ExprEval.kt. Every filtered field-list consumer
        // (FirstFilledValue, the value aggregates, the starred value/fill counts) must route through it —
        // a second `havingInterp(` call site in ExprEval.kt is a duplicate traversal mechanism that can
        // drift from the kernel's one-kept-successor account, so it fails the build.
        def exprEval = new File(srcRoot, 'commonMain/kotlin/io/github/mbackschat/a12/dm/interpreter/eval/ExprEval.kt')
        if (exprEval.exists()) {
            def havingSites = 0
            exprEval.eachLine { line -> havingSites += (line =~ /havingInterp\(/).count }
            if (havingSites != 1) {
                violations << ("eval/ExprEval.kt: ${havingSites} havingInterp( call sites — the filtered " +
                    "field-list traversal has ONE owner (keptRowsWithSuccessorLookahead); route the new " +
                    "consumer through it instead of a direct filter loop").toString()
            }
        }
        if (violations) {
            throw new GradleException(
                "interpreter purity violated — separation by linting (proposal §8):\n  " + violations.join('\n  '))
        }
    }
}
tasks.named('check') { dependsOn verifyInterpreterPurity }

// --- Relative footprint: the NFR-F1 hard-zero + a reproducible runtime-closure measurement (IG79 → IF160) ---
enum RuntimeClosureEntryKind {
    PROJECT,
    MODULE,
    OPAQUE_FILE,
    NPM_PACKAGE
}

class RuntimeClosurePolicy {
    private static final String PROJECT_GROUP = 'io.github.mbackschat.a12.dm'

    static String violation(Map entry) {
        switch (entry.kind as RuntimeClosureEntryKind) {
            case RuntimeClosureEntryKind.PROJECT:
                return "${entry.identity} — an intra-repo project module"
            case RuntimeClosureEntryKind.MODULE:
                if (entry.group?.startsWith('com.mgmtp')) {
                    return "${entry.identity} — a kernel (com.mgmtp) runtime dependency"
                }
                if (entry.group == PROJECT_GROUP) {
                    return "${entry.identity} — a published dmkits/dmtool/adapter runtime dependency"
                }
                if (isGroovy(entry.group as String, entry.name as String)) {
                    return "${entry.identity} — a Groovy runtime dependency"
                }
                return null
            case RuntimeClosureEntryKind.OPAQUE_FILE:
                return "${entry.identity} — an opaque runtime file/directory cannot satisfy the hard-zero"
            case RuntimeClosureEntryKind.NPM_PACKAGE:
                def name = (entry.name ?: '').toString().toLowerCase()
                def normalizedName = name.replaceAll('[/_.]+', '-')
                if (normalizedName.contains('dmkits') || normalizedName.contains('dmtool') ||
                    normalizedName.contains('a12-kernel') || normalizedName.contains('a12-adapter') ||
                    normalizedName.contains('groovy')) {
                    return "${entry.identity} — a forbidden dmkits/dmtool/adapter/kernel/Groovy npm package"
                }
                return null
        }
        throw new IllegalStateException("unhandled runtime closure entry kind: ${entry.kind}")
    }

    private static boolean isGroovy(String group, String name) {
        def g = group?.toLowerCase() ?: ''
        def n = name?.toLowerCase() ?: ''
        g.contains('groovy') || n.contains('groovy')
    }
}

class RuntimeClosureReconciler {
    static Map reconcile(Collection<File> runtimeFiles, Collection<Map> artifacts) {
        def errors = []
        def filesByPath = [:]
        runtimeFiles.each { file ->
            def path = file.canonicalPath
            if (filesByPath.put(path, file) != null) {
                errors << "runtime file occurs more than once: ${path}".toString()
            }
        }
        def artifactsByPath = artifacts.groupBy { (it.file as File).canonicalPath }
        artifactsByPath.each { path, matches ->
            if (!filesByPath.containsKey(path)) {
                errors << "resolved artifact is absent from runtime files: ${path}".toString()
            }
            if (matches.size() != 1) {
                errors << "runtime file maps to ${matches.size()} resolved artifacts instead of exactly one: ${path}".toString()
            }
        }
        def entries = filesByPath.keySet().sort().collect { path ->
            def file = filesByPath[path] as File
            def matches = artifactsByPath[path] ?: []
            def entry = matches.size() == 1
                ? new LinkedHashMap(matches[0].entry as Map)
                : [kind: RuntimeClosureEntryKind.OPAQUE_FILE, identity: "opaque:${file.name}", key: "opaque:${path}"]
            entry.file = file
            entry.bytes = byteSize(file)
            entry
        }
        [entries: entries, errors: errors]
    }

    static long byteSize(File file) {
        if (file.isFile()) return file.length()
        if (!file.isDirectory()) return 0L
        long total = 0L
        file.eachFileRecurse { child ->
            if (child.isFile()) total += child.length()
        }
        total
    }
}

class NpmProductionClosure {
    static Map resolve(File publicPackageJson, File nodeModulesRoot) {
        def root = parse(publicPackageJson)
        def queue = []
        enqueueDependencies(root.dependencies, root.optionalDependencies, publicPackageJson.parentFile, queue)
        enqueuePeers(root.peerDependencies, root.peerDependenciesMeta, publicPackageJson.parentFile, queue)
        def seen = [] as Set
        def entries = []
        def errors = []
        while (!queue.isEmpty()) {
            def request = queue.remove(0)
            def packageDir = findPackage(request.name as String, request.requester as File, nodeModulesRoot)
            if (packageDir == null) {
                def declaration = [
                    kind: RuntimeClosureEntryKind.NPM_PACKAGE,
                    identity: "${request.name}@${request.version} (${request.relation} declaration)".toString(),
                    key: "npm-declaration:${request.requester}:${request.name}:${request.relation}".toString(),
                    name: request.name,
                    version: request.version,
                    bytes: 0L,
                ]
                if (RuntimeClosurePolicy.violation(declaration) != null) entries << declaration
                if (!request.optional) {
                    errors << "required npm package is not installed: ${request.name}".toString()
                }
                continue
            }
            def path = packageDir.canonicalPath
            if (!seen.add(path)) continue
            def manifest = new File(packageDir, 'package.json')
            if (!manifest.isFile()) {
                errors << "installed npm package has no package.json: ${path}".toString()
                continue
            }
            def data = parse(manifest)
            def identity = "${data.name}@${data.version}".toString()
            entries << [
                kind: RuntimeClosureEntryKind.NPM_PACKAGE,
                identity: identity,
                key: "npm:${path}".toString(),
                name: data.name,
                version: data.version,
                file: packageDir,
                bytes: packageBytes(packageDir),
            ]
            enqueueDependencies(data.dependencies, data.optionalDependencies, packageDir, queue)
            enqueuePeers(data.peerDependencies, data.peerDependenciesMeta, packageDir, queue)
        }
        [entries: entries, errors: errors]
    }

    private static void enqueueDependencies(
            Object dependencies,
            Object optionalDependencies,
            File requester,
            List queue) {
        def optionalNames = optionalDependencies instanceof Map ? optionalDependencies.keySet() : Set.of()
        def required = dependencies instanceof Map
            ? dependencies.findAll { name, ignored -> !optionalNames.contains(name) }
            : dependencies
        enqueue(required, false, requester, queue)
        enqueue(optionalDependencies, true, requester, queue)
    }

    private static void enqueue(Object dependencies, boolean optional, File requester, List queue) {
        if (!(dependencies instanceof Map)) return
        dependencies.keySet().sort().each { name ->
            queue << [
                name: name.toString(),
                version: dependencies[name]?.toString(),
                optional: optional,
                relation: optional ? 'optional' : 'dependency',
                requester: requester,
            ]
        }
    }

    private static void enqueuePeers(Object dependencies, Object metadata, File requester, List queue) {
        if (!(dependencies instanceof Map)) return
        dependencies.keySet().sort().each { name ->
            def peerMetadata = metadata instanceof Map ? metadata[name] : null
            def optional = peerMetadata instanceof Map && peerMetadata.optional == true
            queue << [
                name: name.toString(),
                version: dependencies[name]?.toString(),
                optional: optional,
                relation: 'peer',
                requester: requester,
            ]
        }
    }

    private static File findPackage(String name, File requester, File nodeModulesRoot) {
        def boundary = nodeModulesRoot.parentFile.canonicalFile
        def requesterPath = requester.canonicalFile.toPath()
        if (requesterPath.startsWith(boundary.toPath())) {
            File cursor = requester.canonicalFile
            while (cursor != null) {
                if (cursor.name != 'node_modules') {
                    def candidate = new File(cursor, "node_modules/${name}")
                    if (candidate.isDirectory()) return candidate
                }
                if (cursor == boundary) break
                cursor = cursor.parentFile
            }
        }
        def rootPackage = new File(nodeModulesRoot, name)
        rootPackage.isDirectory() ? rootPackage : null
    }

    private static Object parse(File file) {
        new groovy.json.JsonSlurper().parse(file)
    }

    private static long packageBytes(File packageDir) {
        long total = 0L
        def root = packageDir.toPath()
        packageDir.eachFileRecurse { file ->
            def relative = root.relativize(file.toPath())
            def insideNestedModules = relative.any { it.toString() == 'node_modules' }
            if (file.isFile() && !insideNestedModules) {
                total += file.length()
            }
        }
        total
    }
}

def runtimeEntry = { component ->
    if (component instanceof org.gradle.api.artifacts.component.ProjectComponentIdentifier) {
        return [kind: RuntimeClosureEntryKind.PROJECT, identity: "project ${component.projectPath}".toString(),
                key: "project:${component.projectPath}".toString()]
    }
    if (component instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier) {
        def identity = "${component.group}:${component.module}:${component.version}".toString()
        return [kind: RuntimeClosureEntryKind.MODULE, identity: identity, key: "module:${identity}".toString(),
                group: component.group, name: component.module, version: component.version]
    }
    [kind: RuntimeClosureEntryKind.OPAQUE_FILE, identity: "component ${component.displayName}".toString(),
     key: "component:${component.displayName}".toString()]
}

def collectClosure = { configuration ->
    def artifacts = configuration.incoming.artifactView {}.artifacts.artifacts.collect { artifact ->
        [file: artifact.file, entry: runtimeEntry(artifact.id.componentIdentifier)]
    }
    def reconciled = RuntimeClosureReconciler.reconcile(configuration.files, artifacts)
    def artifactKeys = artifacts.collect { it.entry.key }.toSet()
    def graphOnly = []
    configuration.incoming.resolutionResult.allComponents.each { component ->
        def entry = runtimeEntry(component.id)
        def ownRoot = component.id instanceof org.gradle.api.artifacts.component.ProjectComponentIdentifier &&
            component.id.projectPath == project.path
        if (!ownRoot && !artifactKeys.contains(entry.key)) {
            graphOnly << entry
        }
    }
    [entries: reconciled.entries, graphOnly: graphOnly, errors: reconciled.errors]
}

