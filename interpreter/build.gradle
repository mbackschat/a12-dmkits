}
def publicKlibTypeNames = {
    def names = [] as Set
    def matcher = (
        committedKlibApi.getText('UTF-8') =~
            /(?m)^(?:final |abstract |sealed )*(?:enum class|class|fun interface|interface) io\.github\.mbackschat\.a12\.dm\.interpreter\/([^\s:]+)/
    )
    while (matcher.find()) {
