    def windowsExecutable = new File(gradle.gradleHomeDir, 'bin/gradle.bat')
    if (windowsExecutable.isFile()) {
        return windowsExecutable
    }
    throw new GradleException("current Gradle executable not found under ${gradle.gradleHomeDir}")
}
