plugins {
    id 'application'
    id 'org.graalvm.buildtools.native' version '1.1.1'   // release native image (opt-in `:cli:nativeCompile`, GraalVM 25)
}

// The standalone CLI (PROJECT-DESIGN N10 / docs/CLI-SPEC.md): the modeller/BA front-end. The `application`
// plugin gives `run` / `installDist` / `distZip` so the dev inner loop never builds the self-contained
// app-image (jlink/jpackage is Phase B, distribution only — it adds no behavior, just bundles a JVM).
repositories {
    mavenLocal()
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Ratchet (A12K-3589 / docs/KERNEL-INTEGRATION-NOTES "A12K-3589 kernel-API removal surface"): a kernel API MARKED FOR REMOVAL
// cannot compile in this kernel-facing module. Only the `removal` lint (not `deprecation`) is treated as an
// error, so a new call to a removal-scheduled kernel API fails the build while plain-@Deprecated APIs (incl.
// Jackson's) still compile. See docs/KERNEL-INTEGRATION-NOTES.md "A12K-3589 kernel-API removal surface".
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:removal', '-Werror']
}

dependencies {
    // The kernel-free kits — the full authoring/read surface (Stage-4 module cut: `project(':')` split into
    // the per-kit modules; the CLI is the front-end that uses all four). The kernel arrives via :adapter.
    implementation project(':core')
    implementation project(':rulekit')
    implementation project(':modelkit')
    implementation project(':edit')

    // the opt-in kernel-adapter (internal a12internal read tier) — powers the read-back verbs
    // (read/explain). Fine to bundle here: the CLI is an *app*, not a published library, so the
    // N8/D15 "no internal tier in core" rule doesn't apply to it; kernel types stay inside the adapter.
    implementation project(':adapter')

    // The Kernel-free portable checker, for `model check --engine=portable` (F1-a). It is a SECOND checking
    // path beside the adapter's Kernel gate, never a fallback for it: nothing about availability, coverage or
    // an exception may choose between them, so both are always present and only the caller selects.
    implementation project(':consistency')

    // The CLI serializes the context projections to JSONL/markdown itself (kept out of core), so it
    // needs Jackson directly (core's is `implementation`, not exposed transitively).
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'

    // picocli — the declarative command framework (CLI-SPEC §2, the self-explaining requirement): one
    // `@Command`/`@Option` declaration per verb drives parsing, `--help`, AND the machine-readable
    // manifest, so help can't drift from behavior. codegen (annotation processor) emits the GraalVM
    // native-image reflection config under META-INF/native-image, so the native build (CLI-SPEC §11 phase B2)
    // needs no hand-written config.
    implementation 'info.picocli:picocli:4.7.6'
    annotationProcessor 'info.picocli:picocli-codegen:4.7.6'

    // The kernel logs via SLF4J; with no provider it prints "No SLF4J providers were found" warnings
    // to stderr. A no-op binding silences them so the CLI's output stays clean for agent piping.
    runtimeOnly 'org.slf4j:slf4j-nop:2.0.16'

    // Locks the served-schema self-containment claim against a REAL 2020-12 validator: a hand-run
    // measurement of resolution semantics rots silently (CLI-SPEC §5a).
    testImplementation 'com.networknt:json-schema-validator:1.5.7'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation(testFixtures(project(':adapter')))

    // the native-safe runtime evaluator — dmtool's DEFAULT engine for the runtime verbs (model eval/compute,
    // rule eval): it loads a DM-JSON model into the kernel-free interpreter and evaluates rules/computations
    // WITHOUT the kernel's on-the-fly Groovy, so those verbs can run in the GraalVM native image (the Groovy
    // ceiling, INTERPRETER-SPEC) — the sole runtime eval engine on every target (the `--kernel` eval flag was
    // retired, Set V). NB: this is a native-image dependency — re-capture reflection metadata before a native
    // build (NATIVE-IMAGE-GRAALVM §5.1).
    implementation project(':interpreter')

    // schemakit (the JSON Schema ⇄ Document Model transcoder) backs the `model import-jsonschema` /
    // `model export-jsonschema` verbs. JVM/Java, kernel-free at the source level (SCHEMAKIT-SPEC).
    implementation project(':schemakit')

    // modelkit (the modeller's authoring kit, used to build multi-file include/typedef workspaces in
    // tests) folded into the root project (2026-06-09) — its classes arrive via `implementation project(':')`.
}

application {
    mainClass = 'io.github.mbackschat.a12.dm.cli.CliMain'
    // The public command name is `dmtool` (README, bin/dmtool shim, examples/, CLI-SPEC §8). This names
    // the installDist launcher + install dir → cli/build/install/dmtool/bin/dmtool (NOT .../cli/bin/cli).
    // The native binary (release) and the eval's JVM launcher both resolve under this one name, so the
    // shipped skill is a single verbatim artifact. See docs/RELEASE-SPEC.md §1.
    applicationName = 'dmtool'
}

// Bake the build's versions and source provenance into a resource so `--version` / `manifest.version`
// can report them at runtime (works from `:cli:test` classes AND the installDist jar, unlike a jar-manifest
// attribute). Git state is a task input: committing or dirtying the tree invalidates a previously generated
// resource, which prevents an installDist launcher from silently retaining the provenance of an older build.
// The kernel *runtime* version is read separately from the kernel jar; the catalog floor from operators.json.
def generatedVersionDir = layout.buildDirectory.dir('generated/version-resources')
def packagedVersionSnapshotName = 'dmtool-version.properties'
def sourceProvenanceProgram = rootProject.file('scripts/SourceProvenance.java')
def javaExecutable = new File(System.getProperty('java.home'), 'bin/'
        + (System.getProperty('os.name').toLowerCase(java.util.Locale.ROOT).contains('win') ? 'java.exe' : 'java'))
// Execute one portable, black-box-tested implementation. Its two-line output is deliberately trivial to parse.
def provenanceExec = providers.exec {
    commandLine javaExecutable, sourceProvenanceProgram, rootProject.projectDir
    ignoreExitValue = true
}
def provenance = provenanceExec.standardOutput.asText.zip(provenanceExec.result) { output, result ->
    def lines = output.readLines()
    result.exitValue == 0 && lines.size() == 2
            ? [revision: lines[0], state: lines[1]]
            : [revision: '(unknown)', state: 'UNKNOWN']
}
def sourceRevision = provenance.map { it.revision }
def sourceState = provenance.map { it.state }
def generateVersionProperties = tasks.register('generateVersionProperties', WriteProperties) {
    destinationFile = generatedVersionDir.map { it.file('io/github/mbackschat/a12/dm/cli/version.properties') }
    inputs.file(sourceProvenanceProgram)
    property 'rulekit', rootProject.version.toString()
    property 'sourceRevision', sourceRevision
    property 'sourceState', sourceState
    property 'kernelBuiltAgainst', rootProject.ext.kernelVersion
    property 'a12Distribution', rootProject.ext.a12Distribution
}
sourceSets.main.resources.srcDir(generatedVersionDir)
tasks.named('processResources') { dependsOn generateVersionProperties }

// The packaged contract must compare an artifact with the tree snapshot that artifact actually consumed, not
// with a later working tree. Keep the exact generated properties beside each launcher so the same black-box
// suite can oracle both installDist and native artifacts without reopening Git at test time (measured 2026-09-01:
// an untracked file created after packaging changed only the old test-time expectation and produced a false red).
def nativeVersionSnapshot = layout.buildDirectory.file(
        "native/nativeCompile/${packagedVersionSnapshotName}")
def copyVersionSnapshot = { targetProvider ->
    def source = generateVersionProperties.get().destinationFile.get().asFile.toPath()
    def target = targetProvider.get().asFile.toPath()
    java.nio.file.Files.createDirectories(target.parent)
    java.nio.file.Files.copy(source, target, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
}
tasks.named('installDist', Sync) {
    inputs.file(generateVersionProperties.map { it.destinationFile })
    from(generateVersionProperties.map { it.destinationFile }) {
        into 'bin'
        rename { packagedVersionSnapshotName }
    }
}

// …but keep that deliberate per-commit invalidation OFF the test runtime classpath. The resource above is a
// main resource, so it rides `sourceSets.test.runtimeClasspath` — the `classpath` of `test` and of all six
// `:cli` guard tasks. Its content changes on every commit (new SHA) and on the first edit after one
// (CLEAN→DIRTY), so without this normalization the whole `:cli` test estate re-runs on a bare commit that
// changed no source at all, and `publicContractTest` (~3–10 min) re-runs with it.
//
// Ignoring it here cannot mask a defect: the only tests that read it assert its SHAPE, never a literal
// revision (`VersionVerbTest` matches `[0-9a-f]{40}` / `CLEAN|DIRTY|UNKNOWN`; `BatchObservationsTest`
// compares the CLI's output against `VersionInfo.load()`, so both sides move together). A change to HOW
// provenance is produced still re-triggers, via `sourceProvenanceGuardTest`'s declared inputs on this build
// file and `scripts/SourceProvenance.java`.
//
// The freshness property the resource exists for holds for `jar`/`installDist`, which consume the generated
// file itself — but it did NOT hold for `nativeCompile`, and the claim that it did was wrong for eight weeks.
// Measured 2026-08-07: in ONE invocation, `generateVersionProperties` executed with a new revision and
// `:cli:nativeCompile` still reported UP-TO-DATE, so the binary kept the previous commit's provenance baked in
// (HEAD `aa6f1763`, both copies of the resource `aa6f1763 CLEAN`, binary reporting `3b85a822 (clean)`). The
// generated file was simply not an effective input of that task. `native-gate.sh` caught it — a release
// binary would otherwise have shipped naming a commit that is not the one it was built from.
normalization {
    runtimeClasspath {
        ignore 'io/github/mbackschat/a12/dm/cli/version.properties'
    }
}

// So declare it, the same way `publicContractTest` below has to. Provenance alone must be able to invalidate
// the image; nothing else in the task graph will do it, and a stale-binary check that the binary can defeat
// is not a check.
tasks.named('nativeCompile') {
    inputs.file(generateVersionProperties.map { it.destinationFile })
    outputs.file(nativeVersionSnapshot)
    doLast { copyVersionSnapshot(nativeVersionSnapshot) }
}

// --- Native reflection-metadata FRESHNESS STAMP (docs/NATIVE-IMAGE-GRAALVM.md §5.1) ----------------------
// Closes the one native staleness hole neither mtime gate can see: edit source, skip the capture, run
// `nativeCompile`, and the binary is now newer than every source file — so `prep-probe.sh` and
// `native-gate.sh` both pass while the committed reflection metadata describes older code. That is what
// §3.5's five shipped native-only defects look like from the outside.
//
// The capture IS `:cli:test` under the tracing agent, so its inputs are that run's inputs: this project's
// TEST sources (they decide which paths get exercised at all) plus every module's MAIN sources and the
// resolved external jars, because a reflective site anywhere on the runtime classpath is what gets recorded.
// The digest is COMMITTED rather than left to Gradle's up-to-date history, which lives in `.gradle/` and does
// not travel between machines or survive a fresh clone.
//
// Deliberately OVER-approximating, and derived rather than hand-listed: a new module's sources are swept
// automatically. The failure directions are not symmetric — hashing too much costs a re-capture that was not
// owed, while hashing too little passes a stale capture and ships a binary that throws on a user's machine.
// Other modules' TEST sources are excluded because only `:cli:test` is traced (the guard tasks it depends on
// run untraced), so including them would raise false staleness on the commonest edits in the repo.
def nativeCaptureStampFile = file('native-capture-stamp.txt')
def nativeCaptureStampDigest = {
    def md = java.security.MessageDigest.getInstance('SHA-256')
    def add = { String label, byte[] bytes ->
        md.update(label.getBytes('UTF-8')); md.update((byte) 0); md.update(bytes); md.update((byte) 0)
    }
    // A Kotlin Multiplatform module has NO `src/main` — its sources are `src/commonMain`/`src/jvmMain`/… — so
    // globbing the Java layout alone contributed ZERO bytes for `:interpreter`, `:consistency` and
    // `:predicates` (measured 2026-09-16: a file added under `consistency/src/commonMain` left the digest at
    // 45d9e7e6756b). That is the exact hole the stamp exists to close, open for three whole modules, and
    // `:interpreter` is the native binary's only runtime-eval engine. Derived from the tree rather than
    // enumerated, so a new target or KMP module is covered on arrival instead of when someone remembers.
    // `jsMain` rides along: it cannot reach the JVM image, but an unowed re-capture is the cheap direction and
    // `-PrkStampReason` already exists to state why one is being skipped.
    def trees = rootProject.allprojects.collectMany { p ->
        def src = p.file('src')
        [p.file('src/main')] + (src.directory
                ? (src.listFiles() ?: []).findAll { it.directory && it.name.endsWith('Main') }
                : [])
    } + [project.file('src/test')]
    trees.findAll { it.directory }.toSorted { a, b -> a.absolutePath <=> b.absolutePath }.each { root ->
        project.fileTree(root).files.toSorted { a, b -> a.absolutePath <=> b.absolutePath }.each { f ->
            add(rootProject.relativePath(f), f.bytes)
        }
    }
    // Capture ROUTING is an input too. A build-script edit can exclude a test class, omit a required runtime
    // property, or change the traced classpath without touching one source file. The old source-only digest
    // therefore certified a narrower capture as fresh. Derive every project build file rather than naming the
    // current modules, and include the controls that decide builder identity, how loss is accepted, and what
    // artifact is copied.
    def captureControlFiles = rootProject.fileTree(rootProject.projectDir) {
        include 'build.gradle', '*/build.gradle', 'settings.gradle', 'gradle.properties', 'gradle/*.toml'
        include 'gradle/graalvm-native.properties'
        include 'scripts/capture-native-config.sh', 'scripts/check-native-metadata-removals.sh'
        include 'scripts/verify-graalvm-native.sh'
    }
    captureControlFiles.files.toSorted { a, b -> a.absolutePath <=> b.absolutePath }.each { f ->
        add(rootProject.relativePath(f), f.bytes)
    }
    // External dependency IDENTITY, not content: the file name carries the version, which is what changes a
    // reflective surface (a kernel bump, a Jackson bump). Project entries are skipped — their sources are
    // already hashed above, and their build outputs would make the stamp depend on compilation state.
    configurations.testRuntimeClasspath.files
            .findAll { it.name.endsWith('.jar') }
            .collect { it.name }.toSorted()
            .each { add('jar', it.getBytes('UTF-8')) }
    add('callerFilter', rootProject.file('scripts/native-agent-caller-filter.json').bytes)
    // GRAALVM_HOME is deliberately NOT hashed: it is an absolute installation path, so hashing it made the stamp
    // unverifiable anywhere but the machine that minted it (measured 2026-08-07). Builder identity is portable
    // and fail-closed instead: the exact version file and its executable verifier are hashed above, and the
    // verifier runs before both the tracing-agent test and nativeCompile.
    return md.digest().encodeHex().toString()
}

// Minting the stamp is the one operation that can ASSERT freshness without establishing it, so it refuses to
// run bare. `capture-native-config.sh` sets the marker and reaches it only after the traced suite, the removal
// check and the hygiene assertion have all passed; a hand-run claims the same thing with none of them behind it.
// That is not hypothetical — it happened on 2026-08-07, minutes after a hygiene FAILURE.
//
// The escape hatch is deliberate and mirrors `RK_NATIVE_REMOVAL_REASON`: the digest deliberately
// over-approximates (it hashes all of `cli/src/test`, including the classes `-PrkNativeAgent` excludes from
// tracing), so a change that provably cannot alter a capture would otherwise cost a 27-minute re-trace. Stating
// WHY is the price of skipping it, and the reason is echoed into the build log rather than kept private.
//
// Gradle PROPERTIES, not environment variables: `System.getenv` inside a build reads the long-lived DAEMON's
// environment, which is whatever it was when the daemon started, so an env-var gate would answer about the
// wrong invocation. Same `-Prk…` convention as the capture's own `-PrkNativeAgent`.
def capturingNativeMetadata = project.hasProperty('rkCaptureInProgress')
def handMintedStampReason = project.findProperty('rkStampReason')
tasks.register('nativeCaptureStamp') {
    group = 'build'
    description = 'Record the input digest the committed native reflection metadata was captured from.'
    outputs.upToDateWhen { false }
    doLast {
        if (!capturingNativeMetadata && !handMintedStampReason) {
            throw new GradleException('refusing to mint a native capture stamp outside '
                    + 'scripts/capture-native-config.sh — it would certify a freshness no capture established.\n'
                    + '  Re-capture:  GRAALVM_HOME=<graalvm-25> ./scripts/capture-native-config.sh\n'
                    + '  Or, if the changed sources provably cannot alter the captured metadata, say why:\n'
                    + '    ./build.sh -PrkStampReason="…" :cli:nativeCaptureStamp')
        }
        nativeCaptureStampFile.text = nativeCaptureStampDigest() + '\n'
        logger.lifecycle("native capture stamp → ${rootProject.relativePath(nativeCaptureStampFile)}"
                + (capturingNativeMetadata ? '' : " (hand-minted: ${handMintedStampReason})"))
    }
}

tasks.register('verifyNativeCaptureStamp') {
    group = 'verification'
    description = 'Fail when the committed native reflection metadata was captured from different sources.'
    outputs.upToDateWhen { false }
    doLast {
        if (!nativeCaptureStampFile.file) {
            throw new GradleException('no native capture stamp — run scripts/capture-native-config.sh '
                    + '(it records one), so a stale capture can never pass unnoticed')
        }
        def recorded = nativeCaptureStampFile.text.trim()
        def actual = nativeCaptureStampDigest()
        if (recorded != actual) {
            throw new GradleException('STALE native reflection metadata: it was captured from different '
                    + "sources (stamp ${recorded.take(12)}…, now ${actual.take(12)}…).\n"
                    + '  The capture is TEST-SUITE-DRIVEN, so a reflective site your change added is not in '
                    + 'it and the native gate cannot see that (docs/NATIVE-IMAGE-GRAALVM.md §3.5). Re-capture:\n'
                    + '    GRAALVM_HOME=<graalvm-25> ./scripts/capture-native-config.sh')
        }
        logger.lifecycle("native reflection metadata is fresh (stamp ${recorded.take(12)}…)")
    }
}

// picocli-codegen: name the project so the generated native-image config lands under a stable
// META-INF/native-image/<group>/<artifact>/ path (CLI-SPEC §11 phase B2).
tasks.named('compileJava') {
    options.compilerArgs += ['-Aproject=io.github.mbackschat.a12.dm/rulekit-cli']
}

// Dev convenience: `:cli:run` resolves relative model paths from the repo root (its default is the
// subproject dir). The shipped CLI runs from the user's CWD; this only affects `:cli:run`.
tasks.named('run') {
    workingDir = rootProject.projectDir
}

// The native tracing agent needs two independent filters. The caller filter removes reflection initiated by
// JUnit/Gradle; it cannot remove a test-only DTO handed to production reflection (Jackson/picocli is then the
// caller). Derive an access filter from the compiled test artifact so every own *Test/*Tests class, including
// nested classes, is excluded as a TARGET without maintaining a list that can rot.
def nativeAgentAccessFilter = layout.buildDirectory.file('native-agent/test-artifact-access-filter.json')
def generateNativeAgentAccessFilter = tasks.register('generateNativeAgentAccessFilter') {
    description = 'Derives a Graal tracing-agent target filter for own compiled test artifacts.'
    dependsOn tasks.named('testClasses')
    inputs.files(sourceSets.test.output.classesDirs)
    outputs.file(nativeAgentAccessFilter)
    doLast {
        def excluded = new TreeSet<String>()
        sourceSets.test.output.classesDirs.files.findAll { it.isDirectory() }.each { classesDir ->
            fileTree(classesDir).matching { include '**/*.class' }.files.each { classFile ->
                def relative = classesDir.toPath().relativize(classFile.toPath()).toString()
                def className = relative.replace(File.separatorChar, '.' as char).replaceFirst(/\.class$/, '')
                def outer = className.contains('$') ? className.substring(0, className.indexOf('$')) : className
                def simple = outer.substring(outer.lastIndexOf('.') + 1)
                if (className.startsWith('io.github.mbackschat.')
                        && (simple.endsWith('Test') || simple.endsWith('Tests'))) {
                    excluded.add(className)
                }
            }
        }
        if (excluded.isEmpty()) {
            throw new GradleException('native-agent test-artifact access filter derived zero classes')
        }
        def payload = [comment: 'GENERATED by :cli:generateNativeAgentAccessFilter from compiled test classes.',
                       rules: excluded.collect { [excludeClasses: it] }]
        def output = nativeAgentAccessFilter.get().asFile
        output.parentFile.mkdirs()
        output.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(payload)) + System.lineSeparator()
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// Trace only the ordinary product-exercising suite. Repository-structure guards still run as dependencies of
// `test`, but under the normal JDK and without the agent: their parsers and build-time tooling are not dmtool
// runtime reachability. In particular, MutationTailSingleSourceTest invokes javac to parse production source;
// tracing every Test task made javac's ServiceLoader/resource-bundle traffic leak into the shipped metadata.
// The packaged launcher the contract lane spawns. Defined HERE, above `test`, because the reflection
// capture below must hand the same value to the traced lane (see the -PrkNativeAgent block).
def dmtoolContractExecutable = project.findProperty('dmtoolContractExecutable')
        ?: layout.buildDirectory.file('install/dmtool/bin/dmtool').get().asFile.absolutePath
def dmtoolContractVersionProperties = project.findProperty('dmtoolContractVersionProperties')
        ?: new File(file(dmtoolContractExecutable).parentFile, packagedVersionSnapshotName).absolutePath
def graalvmHome = providers.environmentVariable('GRAALVM_HOME')
def graalvmNativeVerifier = rootProject.file('scripts/verify-graalvm-native.sh')
def graalvmNativeIdentity = rootProject.file('gradle/graalvm-native.properties')
def verifyGraalvmNativeToolchain = tasks.register('verifyGraalvmNativeToolchain', Exec) {
    group = 'verification'
    description = 'Refuse native metadata capture or compilation unless it uses the exact pinned GraalVM builder.'
    inputs.file(graalvmNativeVerifier)
    inputs.file(graalvmNativeIdentity)
    inputs.property('GRAALVM_HOME', graalvmHome.orElse(''))
    outputs.upToDateWhen { false }
    doFirst {
        if (!graalvmHome.present) {
            throw new GradleException('native metadata capture and compilation require GRAALVM_HOME; '
                    + 'docs/NATIVE-IMAGE-GRAALVM.md §2')
        }
        commandLine 'sh', graalvmNativeVerifier, graalvmHome.get()
    }
}

tasks.named('test', Test) {
    // Native-image reflection capture (docs/NATIVE-IMAGE-GRAALVM.md §5) — TEST-SUITE driven, opt-in.
    // `-PrkNativeAgent` runs the suite under the GraalVM tracing agent so the captured reachability
    // metadata TRACKS THE TEST SUITE (grows with TDD), replacing the old curated verb-driving capture
    // whose coverage was bounded by the invocations it remembered to list (the v0.1.0/v0.1.1 bugs, §3.5).
    // The agent ships inside GraalVM, so the test JVM must be GraalVM, not the JDK-21 toolchain: point
    // `executable` at $GRAALVM_HOME and serialize forks (config-merge-dir is not fork-safe). Driven by
    // scripts/capture-native-config.sh; never on in the normal test run.
    if (project.hasProperty('rkNativeAgent')) {
        dependsOn verifyGraalvmNativeToolchain
        def graalHome = graalvmHome.orNull
        if (!graalHome) throw new GradleException('rkNativeAgent capture needs GRAALVM_HOME (the pinned GraalVM home)')
        def cfgDir = project.findProperty('rkNativeAgentDir') ?: "${rootProject.projectDir}/build/rk-native-capture"
        // caller-filter drops reflective lookups MADE BY the test harness (JUnit/Gradle), so the metadata
        // does not record JUnit's instantiation of the *Test classes (which share the …cli package with
        // production classes, so a package access-filter cannot separate them). Repository-structure guards
        // are outside this traced task; the derived access filter additionally removes test artifacts reached
        // through production reflection.
        def callerFilter = "${rootProject.projectDir}/scripts/native-agent-caller-filter.json"
        dependsOn generateNativeAgentAccessFilter
        executable = "${graalHome}/bin/java"
        jvmArgs "-agentlib:native-image-agent=config-merge-dir=${cfgDir},caller-filter-file=${callerFilter},access-filter-file=${nativeAgentAccessFilter.get().asFile}"
        maxParallelForks = 1
        // A capture-ONLY heap cap. A forked test JVM defaults to a quarter of physical RAM — 4 GB on a 16 GB
        // machine — and this one lives for the whole traced suite, so a lazy GC lets its RSS grow for half an
        // hour beside a Gradle daemon, a Kotlin daemon and the agent's own native tables. A harness memory
        // watchdog killed a capture at nine minutes on 2026-09-16 for exactly that. The cap costs some GC
        // time and buys a footprint that fits; it applies to no other run, because only a capture is both
        // single-forked and long-lived.
        maxHeapSize = '1g'
        // Picocli's AUTO ANSI path reflectively calls System.console(). Ambient colour hints can bypass that
        // lookup: a capture run with NO_COLOR=1 lost the committed reflection member even though the runtime
        // path still exists. Normalize on the child process, not capture-native-config.sh's shell, because an
        // already-running Gradle daemon can otherwise reintroduce the environment it started with.
        ['NO_COLOR', 'CLICOLOR', 'CLICOLOR_FORCE', 'ANSICON', 'ConEmuANSI'].each { environment.remove(it) }
        // A capture DISABLES the exclusive-lane exclusion (root build.gradle), so this lane absorbs the four
        // `publicContractTest` classes — and must therefore also supply that lane's RUNTIME INPUTS. Absorbing
        // the classes without its executable is what made the first capture after both features existed die on
        // 13 execs of the module directory. Excluding them instead is NOT the fix: two of the four also drive the CLI
        // IN-PROCESS, so dropping them silently loses committed metadata (measured: 5 entries, including the
        // picocli field injections behind `rule eval` and `batch`).
        dependsOn tasks.named('installDist')
        systemProperty 'dmtool.executable', dmtoolContractExecutable
        systemProperty 'dmtool.versionProperties', dmtoolContractVersionProperties
        outputs.upToDateWhen { false }   // always re-run; a cached (skipped) test run captures nothing
    }
}

// A few guards read REPO FILES at RUNTIME that Gradle can't infer as inputs — CliTourFreshnessTest reads
// examples/*.md; CommandReferencesResolveTest reads the source + public READMEs, skill/SKILL.md, the Codex
// AGENTS.md, the eval workflow JS, and the operator catalog; SharedReadmeRegionTest reads both public
// READMEs; ModelLoaderParityTest reads both fixture-model roots; DocsIndexGuardTest reads the whole docs/
// tree + its index; DirectoryIndexGuardTest reads the scripts/ + examples/ trees + their indexes.
// They run in THIS
// dedicated task with those files declared as ITS inputs, so the win is scoped: editing a demo/doc/model
// re-runs ONLY these classes (not the ~620-test suite), and such a change can no longer go up-to-date /
// restore from the BUILD CACHE into a FALSE GREEN locally while CI (a fresh checkout) fails. `test` dependsOn
// this, so `:cli:test` (CI, local, and the -PrkNativeAgent capture) always drives it.
tasks.register('docGuardTest', Test) {
    description = 'Freshness/conformance/parity guards that read repo demos+docs+models at runtime (split out so such an edit re-runs only these).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching 'io.github.mbackschat.a12.dm.cli.CliTourFreshnessTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.cli.CommandReferencesResolveTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.cli.CliSpecVerbTableTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.cli.SharedReadmeRegionTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.cli.InfographicAssetGuardTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.cli.DocsIndexGuardTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.cli.DirectoryIndexGuardTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.cli.GapLedgerTemplateGuardTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.cli.InterpreterGapIdRegistryGuardTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.cli.DocAnchorResolveGuardTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.cli.DocRelativeLinkGuardTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.cli.MarkdownFenceBalanceGuardTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.cli.OperatorIndexGuardTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.cli.DocsEvidencePlacementGuardTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.cli.PerformancePairAddressingGuardTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.cli.DocumentShapeSingleSourceTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.cli.DemoOutputIsRealTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.cli.ProbeRepeatedComputationIdentityTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.cli.PublicCommandShapeClaimsTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.cli.PublicOutputClaimsTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.cli.interp.ModelLoaderParityTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.cli.JdkPinGuardTest'
    }
    // guardInputs (root ext, kernel-decoupling §3b #17) declares these runtime-read files as inputs AND fails
    // loudly if any tree goes empty — so a moved folder can't silently turn this guard into a false green.
    rootProject.guardInputs(it, [
            'examples/*.md'      : rootProject.fileTree('examples') { include '**/*.md' },
            // DirectoryIndexGuardTest reads scripts/ + its index (examples/ rides the *.md tree above), so an
            // added/renamed/removed script must re-run the guard that checks its index row.
            'scripts tree'       : rootProject.fileTree('scripts'),
            'README.md'          : rootProject.file('README.md'),
            // CommandReferencesResolveTest scans the project instructions too (root AGENTS.md is a symlink to it).
            // DocAnchorResolveGuardTest additionally resolves every `CLAUDE.md "quoted section"` citation in the
            // docs against ALL FOUR instruction files, so pruning a section in any of them must re-run this lane
            // rather than restore a green produced while that section still existed. (docs/CLAUDE.md rides the
            // docs tree above.)
            'CLAUDE.md'          : rootProject.file('CLAUDE.md'),
            'interpreter/CLAUDE.md': rootProject.file('interpreter/CLAUDE.md'),
            'plugin/CLAUDE.md'   : rootProject.file('plugin/CLAUDE.md'),
            'plugin/README.md'   : rootProject.file('plugin/README.md'),
            'infographic assets': rootProject.fileTree('.') {
                include 'assets/infographics/*.avif'
                include 'plugin/assets/infographics/*.avif'
                include 'interpreter/public-release/assets/infographics/*.avif'
            },
            'interpreter release README': rootProject.file('interpreter/public-release/README.md'),
            'skill/SKILL.md'     : rootProject.file('skill/SKILL.md'),
            'plugin-codex/AGENTS.md': rootProject.file('plugin-codex/AGENTS.md'),
            'docs/CLI-SPEC.md'   : rootProject.file('docs/CLI-SPEC.md'),
            // DocsIndexGuardTest reads docs/README.md (the index) + the whole docs/ + docs/archived/ md tree.
            'docs/README.md'     : rootProject.file('docs/README.md'),
            'docs/*.md tree'     : rootProject.fileTree('docs') { include '**/*.md' },
            // DocRelativeLinkGuardTest's non-docs arm (widened 2026-09-20) resolves every relative link in the
            // module and sub-project READMEs, so an edit to one must RE-RUN it rather than restore a green taken
            // while its target still existed. Without this the task goes UP-TO-DATE on exactly the edit that can
            // break it — the false green this repository has paid for before. `build/` is excluded because the
            // Kotlin/JS and npm staging trees copy our markdown into it, and a stale copy there is not a defect.
            'module READMEs'     : rootProject.fileTree('.') {
                include '**/*.md'
                exclude 'docs/**', 'build/**', '*/build/**', '**/node_modules/**',
                        '.gradle*/**', '.kotlin/**', '.uv-cache/**', '.uv-tools/**'
            },
            'eval workflow'      : rootProject.file('eval/benchmark.workflow.js'),
            'probe task 14'      : rootProject.file('probe/tasks/14-repeated-computation-outcomes.md'),
            'operator catalog'   : rootProject.fileTree('rulekit/src/main/resources/catalog'),
            // JdkPinGuardTest reads every private and shipped-mirror workflow, so an edit in any source tree must
            // re-run it rather than restore a green result produced against a smaller denominator.
            'CI workflows'       : files(
                    rootProject.fileTree('.github/workflows') { include '**/*.yml', '**/*.yaml' },
                    rootProject.fileTree('.github/mirror-workflows') { include '**/*.yml', '**/*.yaml' },
                    rootProject.fileTree('.github/interpreter-mirror-workflows') {
                        include '**/*.yml', '**/*.yaml'
                    }),
            'GraalVM native identity': rootProject.file('gradle/graalvm-native.properties'),
            // ModelLoaderParityTest reads every fixture model in both roots.
            'cli test models'    : rootProject.fileTree('cli/src/test/resources/models') { include '**/*.json' },
            'examples/models'    : rootProject.fileTree('examples/models') { include '**/*.json' },
            'permit showcase fixture': rootProject.file(
                    'interpreter/src/commonTest/resources/workspace-preparation/self-contained/permit-basic.dm.json'),
            // DocumentShapeSingleSourceTest walks the whole served schema dir at runtime, so a NEW schema that
            // restates the --instance shape re-runs the guard that would catch it.
            'served schemas'     : rootProject.fileTree('cli/src/main/resources/schema') { include '**/*.json' }])
}

// The eval backbone reads its task corpus and workflow sources directly from the repository. Keep those
// runtime inputs on a focused task: changing a task gold or either workflow must execute the guards that own
// them, while the rest of the CLI suite remains cacheable. `guardInputs` also makes an emptied task tree fail.
tasks.register('evalGuardTest', Test) {
    description = 'Deterministic eval-gold, suite-ledger, prompt-neutrality, and workflow-completeness guards.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching 'io.github.mbackschat.a12.dm.cli.eval.EvalGoldOracleTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.cli.eval.EvalSuiteLedgerTest'
    }
    rootProject.guardInputs(it, [
            'eval task corpus'       : rootProject.fileTree('eval/tasks') { include '**/*.json' },
            'benchmark workflow'     : rootProject.file('eval/benchmark.workflow.js'),
            'gap-finder workflow'    : rootProject.file('eval/gap-finder.workflow.js')])
}

// The semantics-map resolve-guard (SemanticsMapResolveTest) reads the map + KERNEL-FINDINGS + the catalog +
// the corpus cases + the three lock-test source trees at runtime — its own dedicated task (same rationale as
// docGuardTest, but its input set is the map's derivation surfaces, incl. TEST SOURCE TREES, which must not
// become inputs of the broader guard task).
// The operator index's fixer, mirroring root `dumpKitApi` over the API goldens: the SAME class that asserts
// the page also writes it, so the generator and the checker can never diverge. Regenerate whenever a kernel
// doc gains an entry or the operator catalog changes, and commit the page with that change.
tasks.register('dumpOperatorIndex', Test) {
    group = 'documentation'
    description = 'Regenerate docs/OPERATOR-INDEX.md from the operator catalog and the two kernel docs.'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperty 'operatorIndex.fix', 'true'
    outputs.upToDateWhen { false }
    filter {
        includeTestsMatching 'io.github.mbackschat.a12.dm.cli.OperatorIndexGuardTest'
    }
}

tasks.register('semanticsMapGuardTest', Test) {
    description = 'Resolve-guard for docs/SEMANTICS-MAP.md + the KERNEL-FINDINGS↔KERNEL-SEMANTICS fold contract — every cited §/facet/corpus-family/test-class derives from its live surface, and every finding carries a valid fold-status.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching 'io.github.mbackschat.a12.dm.cli.SemanticsMapResolveTest'
        // The fold-status contract between the two kernel docs (DOC-DISCIPLINE §1) reads exactly two of
        // this task's declared inputs (KERNEL-FINDINGS + KERNEL-SEMANTICS), so it rides the same lane.
        includeTestsMatching 'io.github.mbackschat.a12.dm.cli.KernelDocsFoldContractTest'
        // The basis contract reads the same two docs — a mechanism claim must name its oracle.
        includeTestsMatching 'io.github.mbackschat.a12.dm.cli.KernelDocsBasisContractTest'
    }
    // guardInputs (root ext, kernel-decoupling §3b #17): declare the map's derivation surfaces as inputs AND
    // fail loudly if any lock tree / catalog / corpus goes empty (a moved folder must not silence this guard).
    rootProject.guardInputs(it, [
            'docs/SEMANTICS-MAP.md'   : rootProject.file('docs/SEMANTICS-MAP.md'),
            'docs/KERNEL-FINDINGS.md' : rootProject.file('docs/KERNEL-FINDINGS.md'),
            'docs/KERNEL-SEMANTICS.md': rootProject.file('docs/KERNEL-SEMANTICS.md'),
            'operator catalog'        : rootProject.fileTree('rulekit/src/main/resources/catalog'),
            'corpus cases'            : rootProject.fileTree('corpus/cases') { include '**/*.json' },
            'validate/laws lock tree' : rootProject.fileTree('src/test/java/io/github/mbackschat/a12/dm/rulekit/validate/laws'),
            'adapter/laws (java)'     : rootProject.fileTree('adapter/src/test/java/io/github/mbackschat/a12/dm/adapter/laws'),
            'adapter/laws (kotlin)'   : rootProject.fileTree('adapter/src/test/kotlin/io/github/mbackschat/a12/dm/adapter/laws'),
            'checker syntax verdict lock': rootProject.file('consistency/src/commonTest/kotlin/io/github/mbackschat/a12/dm/consistency/SyntaxVerdictTest.kt'),
            'checker field-read contract lock': rootProject.file('consistency/src/commonTest/kotlin/io/github/mbackschat/a12/dm/consistency/FieldReadContractTest.kt'),
            'checker numeric-name contract lock': rootProject.file('consistency/src/commonTest/kotlin/io/github/mbackschat/a12/dm/consistency/NumericNameContractTest.kt'),
            'checker syntax trace lock': rootProject.file('adapter/src/test/kotlin/io/github/mbackschat/a12/dm/adapter/A12ParseTraceTest.kt'),
            'adapter preparation locks': rootProject.fileTree(
                    'adapter/src/test/java/io/github/mbackschat/a12/dm/adapter') {
                include '**/Workspace*Test.java'
            },
            'interpreter commonTest'  : rootProject.fileTree('interpreter/src/commonTest')])
}

// The deleted-gap reference guard (StaleGapReferenceGuardTest, IF141) reads docs/INTERPRETER-GAPS.md (the live-gap
// set) + derives every module's source/build surface at runtime; shared kit modules can carry interpreter contracts
// too. Its own task (the semanticsMapGuardTest rationale — source trees as inputs must not bloat docGuardTest), so
// an IG graduation or relevant source/build edit re-runs ONLY this guard and can't false-green from the build cache.
def staleGapGuardInputs = ['docs/INTERPRETER-GAPS.md': rootProject.file('docs/INTERPRETER-GAPS.md')]
([rootProject] + rootProject.subprojects).each { p ->
    def label = p == rootProject ? 'root' : p.path.substring(1)
    def source = p.file('src')
    if (source.isDirectory()) {
        staleGapGuardInputs["${label}/src"] = p.fileTree(source) {
            include('**/*.kt', '**/*.java', '**/*.gradle', '**/*.gradle.kts')
        }
    }
    if (p.buildFile.isFile()) {
        staleGapGuardInputs["${label}/build"] = p.buildFile
    }
}
if (rootProject.file('settings.gradle').isFile()) {
    staleGapGuardInputs['settings.gradle'] = rootProject.file('settings.gradle')
}
if (rootProject.file('settings.gradle.kts').isFile()) {
    staleGapGuardInputs['settings.gradle.kts'] = rootProject.file('settings.gradle.kts')
}
tasks.register('staleGapGuardTest', Test) {
    description = 'Rejects a present-tense-OPEN reference to a DELETED interpreter gap (IF141); the live-gap set is docs/INTERPRETER-GAPS.md.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching 'io.github.mbackschat.a12.dm.cli.StaleGapReferenceGuardTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.cli.StaleGapReferenceClassifierTest'
    }
    rootProject.guardInputs(it, staleGapGuardInputs)
}

// The referent-drift guard (ReferentDriftGuardTest) reads EVERY prose and source file in the repository at
// runtime — a rename reassigns what prose asserts wherever that prose lives, which is markdown outside docs/ and
// javadoc/Kotlin comments as much as docs/ itself. Its own task for the staleGapGuardTest reason (a repo-wide
// input set must not bloat docGuardTest's markdown-scoped one). These three guards take their denominator from
// `git ls-files`, which no Gradle input can express, so the declared tree is a deliberate SUPERSET of it rather
// than a mirror: every suffix they read (.md, .java, .kt) is inside the include list, and nothing git tracks sits
// under an excluded path. Over-declaring costs a spurious re-run; under-declaring would leave the task UP-TO-DATE
// with the scan unrun, so widen this tree before widening a guard's suffix filter.
tasks.register('referentGuardTest', Test) {
    description = 'Rejects prose pointing dated evidence at the pre-split home of a moved performance checkpoint (referent drift: the link still resolves, the sentence is false).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching 'io.github.mbackschat.a12.dm.cli.ReferentDriftGuardTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.cli.QuotedTitleCitationRatchetTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.cli.DerivedFigureDatingGuardTest'
    }
    rootProject.guardInputs(it, [
            'repo prose + source': rootProject.fileTree(rootProject.projectDir) {
                include '**/*.md', '**/*.java', '**/*.kt', '**/*.gradle', '**/*.gradle.kts', '**/*.sh'
                exclude '**/build/**', '**/.git/**', '**/.gradle/**', '**/node_modules/**'
            }])
}

// MutationTailSingleSourceTest parses production Java source and reads the authored demonstration registry at
// runtime. Compiled classes are insufficient inputs: a comment containing a fake ModelWrite marker compiles to
// identical bytecode, which is exactly one planted vacuity control. Keep this narrow task source-sensitive.
tasks.register('mutationTailGuardTest', Test) {
    description = 'Structural and denominator guard for the one shared CLI model-mutation ending.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching 'io.github.mbackschat.a12.dm.cli.MutationTailSingleSourceTest'
    }
    rootProject.guardInputs(it, [
            'CLI production Java': rootProject.fileTree('cli/src/main/java') { include '**/*.java' },
            'verb demonstrations': rootProject.file('cli/src/main/resources/verb-examples.json')])
}

// SourceProvenanceBuildTest executes the build-time Java source and reads this build file at runtime. Keep it
// on a source-sensitive lane so a behavior-only helper/build edit cannot be hidden by the broad test cache.
tasks.register('sourceProvenanceGuardTest', Test) {
    description = 'Adversarial clean/nested/untracked checks for dmtool build provenance.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching 'io.github.mbackschat.a12.dm.cli.SourceProvenanceBuildTest'
    }
    rootProject.guardInputs(it, [
            'CLI build wiring'          : project.file('build.gradle'),
            'source provenance program' : sourceProvenanceProgram])
}

// The public-contract suite crosses the packaging boundary deliberately: it spawns the exact installDist
// launcher, never CliTestSupport's in-process seam and never the environment-selecting repo shim. A native gate
// can point the same runner at its freshly built binary with -PdmtoolContractExecutable=<path>.
tasks.register('publicContractTest', Test) {
    description = 'Black-box operational-contract, mutation-safety, and packaged-journey suite.'
    group = 'verification'
    dependsOn tasks.named('installDist')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperty 'dmtool.executable', dmtoolContractExecutable
    systemProperty 'dmtool.versionProperties', dmtoolContractVersionProperties
    inputs.file(file(dmtoolContractExecutable))
    inputs.file(file(dmtoolContractVersionProperties))
    inputs.file(rootProject.file('skill/SKILL.md'))
    // Every method owns an independent @TempDir and PackagedDmtool instance. The expensive work is waiting for
    // separate launcher processes, so run methods concurrently without replacing or batching away that public
    // process boundary. Keep this task-local: the native-agent capture merges into `test`, whose metadata output
    // is deliberately serialized above.
    def processParallelism = Math.max(2, Math.min(4, Runtime.runtime.availableProcessors()))
    systemProperty 'junit.jupiter.execution.parallel.enabled', 'true'
    systemProperty 'junit.jupiter.execution.parallel.config.strategy', 'fixed'
    systemProperty 'junit.jupiter.execution.parallel.config.fixed.parallelism', processParallelism
    // The native capture re-hosts these classes inside :cli:test. These three keys affect only JUnit's method
    // scheduler, never a test or dmtool input, so that serial capture classifies rather than copies them. The
    // absorption guard still requires `dmtool.executable`, whose absence measurably fails/shrinks the capture.
    extensions.extraProperties.set('nativeCaptureNonRuntimeSystemProperties', [
            'junit.jupiter.execution.parallel.enabled':
                    'capture keeps one serial test fork while reaching the same methods',
            'junit.jupiter.execution.parallel.config.strategy':
                    'fixed-pool selection affects wall time only',
            'junit.jupiter.execution.parallel.config.fixed.parallelism':
                    'worker count affects wall time only',
    ])
    // The snapshot above is a plain, non-classpath-normalized input. A bare commit or CLEAN↔DIRTY transition
    // rebuilds installDist and changes that artifact-owned file, so this lane re-runs even though the launcher
    // script's bytes stay constant. With an external native executable, both inputs remain tied to that prior
    // build and a later unrelated tree mutation cannot rewrite the test's oracle.
    filter {
        includeTestsMatching 'io.github.mbackschat.a12.dm.cli.DmtoolPublicContractTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.cli.MalformedModelPublicContractTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.cli.DmtoolMutationSafetyTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.cli.PackagedDmtoolJourneyTest'
        includeTestsMatching 'io.github.mbackschat.a12.dm.cli.CommandRouteEquivalenceTest'
    }
}
tasks.named('check') { dependsOn 'publicContractTest' }

// Every dedicated Test task above hosts classes `test` must NOT re-run, because each owns runtime inputs that
// `test` does not declare. Their include patterns therefore ARE `test`'s exclude list — DERIVED, not mirrored.
// It used to be a hand-kept copy and had already drifted: four docGuardTest classes (DocumentShapeSingleSource,
// DemoOutputIsReal, ProbeRepeatedComputationIdentity, InterpreterGapIdRegistryGuard) were absent from the copy
// and so ran in both lanes. Deriving it means adding a class to a guard task removes it from the broad suite in
// the same edit, and the two lists cannot disagree again.
def dedicatedTestTasks = ['docGuardTest', 'evalGuardTest', 'semanticsMapGuardTest', 'staleGapGuardTest',
                          'referentGuardTest', 'mutationTailGuardTest', 'sourceProvenanceGuardTest',
                          'publicContractTest']

tasks.named('test') {
    // `-Pfast` drops the guard prerequisites for the dev inner loop, the same lever `:adapter:test` already
    // carries and for the same reason: `--tests` filters only the test task, NOT its dependencies, so a
    // single-class run paid for every guard below on each iteration. A full run (no -Pfast) still drives them,
    // and the checkpoint gate and CI are unchanged. Measured 2026-08-14: single class ~20 s → ~5 s.
    //
    // …but only the ones that cost something: a guard cheap enough that dropping it saves nothing is never
    // droppable (the root module's rule — TESTING-SPEC "Test tiers"). Measured per task from a green run's
    // result XMLs, re-measured 2026-08-16 (median of two isolated runs): docGuardTest 4.2s, evalGuardTest 3.2s
    // and mutationTailGuardTest 3.4s against sourceProvenanceGuardTest 1.4s, staleGapGuardTest 0.5s and
    // semanticsMapGuardTest 0.3s. The cheap three total 2.2s of the ~15s, and each binds a COMMITTED artifact
    // to the source it must mirror — the generated
    // provenance resource, the gap ledgers' live ids, and the semantics-map registration of every lock class.
    // That is precisely the class the root lever let through when the API goldens shipped stale, so they stay
    // unconditional; the three broad ones remain the checkpoint's job. (This mirrors root keeping
    // apiGuardTest/releaseGapGuardTest and dropping its own docGuardTest, for the same reasons.)
    dependsOn 'semanticsMapGuardTest'
    dependsOn 'staleGapGuardTest'
    dependsOn 'sourceProvenanceGuardTest'
    dependsOn 'referentGuardTest'
    if (!project.hasProperty('fast')) {
        dependsOn 'docGuardTest'
        dependsOn 'evalGuardTest'
        dependsOn 'mutationTailGuardTest'
    } else {
        doFirst {
            logger.lifecycle('-Pfast: SKIPPING docGuardTest, evalGuardTest, mutationTailGuardTest — this run is '
                    + 'NOT the estate. Re-run without -Pfast before treating green as a checkpoint.')
        }
    }
    // This suite contains the two tests that READ the provenance resource (`VersionVerbTest`,
    // `BatchObservationsTest`), so it declares it explicitly and keeps re-running on every commit — the
    // normalization above must not cause a test that used to run to stop running. Only the six guard tasks,
    // none of which contains a provenance-reading test, legitimately go up-to-date on a bare commit.
    inputs.file(generateVersionProperties.map { it.destinationFile })
    // The repo-file-reading guards live in docGuardTest / semanticsMapGuardTest (with the right inputs); keep
    // them OUT of the cacheable main suite so a docs/model-only edit can't invalidate all ~620 tests.
    // `dumpOperatorIndex` runs OperatorIndexGuardTest with `operatorIndex.fix=true`, so it writes
    // docs/OPERATOR-INDEX.md instead of asserting against it — the same shape as root's `dumpKitApi` over the
    // API goldens. It owns no class: docGuardTest does, and this lane only re-enters it in fixer mode.
    rootProject.routeExclusivelyHostedTests(it, dedicatedTestTasks,
            ['dumpOperatorIndex': 'regenerator over docGuardTest\'s OperatorIndexGuardTest — writes the '
                    + 'committed index instead of asserting against it'],
            ['mutationTailGuardTest': 'MutationTailSingleSourceTest invokes javac to parse production source, '
                    + 'so tracing it registers jdk.compiler resource bundles that are build tooling, not dmtool '
                    + 'runtime reachability (NativeImageMetadataHygieneTest fails on exactly those globs)'])
    filter {
        // During tracing this one assertion necessarily reads the PRE-CAPTURE committed metadata. Exclude
        // only it; capture-native-config.sh copies the generated file and runs the class immediately after.
        // Every other test remains mandatory, so a real red suite cannot be swallowed by the capture.
        if (project.hasProperty('rkNativeAgent')) {
            excludeTestsMatching 'io.github.mbackschat.a12.dm.cli.NativeImageMetadataHygieneTest'
        }
    }
}

// GraalVM native image — release-only, opt-in `:cli:nativeCompile` (GraalVM 25 + GRAALVM_HOME). Full recipe,
// findings, and status in docs/NATIVE-IMAGE-GRAALVM.md. Not in the dev loop or CI; the JVM build is unaffected.
// Groovy is excluded from the NATIVE classpath only (the JVM keeps it): GraalVM 25 compiles Groovy fine, but
// picocli initializes groovy.lang.Closure at build time and its metadata stream is closed at runtime. The
// runtime-eval verbs remain available in the native binary because the interpreter is their sole engine; the
// JVM classpath stays unchanged for the remaining kernel-backed tooling. The native gate covers every
// native-applicable demo.
configurations.named('nativeImageClasspath') { exclude group: 'org.codehaus.groovy' }   // native-only; JVM keeps Groovy
graalvmNative {
    toolchainDetection = false
    binaries {
        named('main') {
            imageName = 'dmtool'
            buildArgs.add('--no-fallback')
            buildArgs.add('-Os')   // size optimization (GraalVM 25 supports it; 21 didn't)
            // Locale-COMPLETE, build-host-INDEPENDENT. GraalVM bundles only the BUILD HOST's default locale (+ en)
            // unless told otherwise — so a binary built on a `de_DE` host carries the German condition-grammar
            // terminal data while one built on an `en`/`C` host (Linux CI) does NOT. The kernel's condition
            // FORMATTER is German-canonical (AbstractMultiLanguageHandler maps the GERMAN terminal map → the target
            // language even to render ENGLISH), so a missing German locale makes `rule format` fail on the en-built
            // binary only ("german token 'Und' is unknown"). Pin de+en so every build is identical regardless of host.
            buildArgs.add('-H:IncludeLocales=en,de')
            buildArgs.add('-H:IncludeResources=catalog/.*\\.json')      // operator catalog
            buildArgs.add('-H:IncludeResources=internal/templates/.*')  // StringTemplate (checkConsistency)
            // ALL kernel i18n error-message bundles, every locale — NOT capture-bound. The agent only records
            // bundles a traced run actually loads, and these load lazily only when FORMATTING an error (e.g. a
            // parser diagnostic), per locale — so capture missed `vk_parser_common_error_messages` entirely and
            // every locale variant of the rest. A glob over the whole tree includes them by rule. (Bug: native
            // `rule check`/`model check` of any invalid condition failed with "Can't find bundle …".)
            buildArgs.add('-H:IncludeResources=.*error_messages.*\\.properties')
            buildArgs.add('-H:IncludeResources=schema/.*\\.json')       // CLI schema contracts
            buildArgs.add('-H:IncludeResources=verb-examples\\.json')
            buildArgs.add('-H:IncludeResources=.*version\\.properties')
            buildArgs.add('-H:IncludeResources=.*custom-js-worker\\.mjs')   // the G31 Node worker (extracted + run via `node`)
        }
    }
}
tasks.named('nativeCompile') { dependsOn verifyGraalvmNativeToolchain }
