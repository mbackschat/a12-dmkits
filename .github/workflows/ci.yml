name: CI

# Builds & tests rulekit against the REAL kernel — the kernel isn't on any public Maven repo, so CI
# rebuilds it from public sources via the sibling a12-kernel-bootstrap (the same path the README
# documents for humans). That bootstrapped ~/.m2 is cached and keyed on the kernel version + the
# bootstrap script, so the heavy kernel build runs only on a cache miss. The token-heavy N6 eval is
# NOT run here (it's opt-in, run manually via the run-dmtool-eval skill).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Supersede, don't finish. A run takes ~53 min while pushes land in bursts, so without this a superseded
# commit keeps a runner busy long after nobody needs its answer: on 2026-08-14, 16 of 21 CI runs were
# already obsolete before they completed — 840 billed minutes, 63% of that month's entire Actions spend.
# Cancelling costs the intermediate commits their green tick; the TIP is what is verified, which is what a
# batched-push workflow actually depends on. Need a known-green mid-batch commit later (bisect)? Re-run it
# with workflow_dispatch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Hosted runners have no private init scripts, but retain the repo's explicit isolated-home contract.
      # setup-gradle below persists its dependencies, transformed jars, and local build cache across runs.
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-isolated
    steps:
      - name: Checkout rulekit
        uses: actions/checkout@v4
        with:
          path: a12-dmkits

      # Shell-only and first after the checkout already required by every green run. A failure stops before the
      # Kernel checkout, JDK and Gradle setup, cache restore, or bootstrap, without paying for a second job and
      # duplicate checkout on every successful run.
      - name: Verify infographic claims, placements, and public copies
        working-directory: a12-dmkits
        run: ./scripts/check-infographic-freshness.sh

      # The bootstrap clones the kernel sources as siblings under its parent dir, so checking it out
      # next to rulekit makes A12_ROOT = the workspace (the layout the script expects locally).
      - name: Checkout the kernel bootstrap kit
        uses: actions/checkout@v4
        with:
          repository: mbackschat/a12-kernel-bootstrap
          path: a12-kernel-bootstrap

      # JDK 21 runs Gradle (and is rulekit's toolchain); JDK 25 only compiles a12-devtools'
      # build-utilities. setup-java exports JAVA_HOME_21_X64 / JAVA_HOME_25_X64 for the bootstrap.
      - name: Set up JDK 21 + 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # PINNED TO EXACT PATCH VERSIONS, deliberately. `21` alone resolves to whichever 21.0.x the runner
          # image happens to cache, and that drifted 21.0.11 -> 21.0.12 mid-August: the hosted performance
          # record then carried two JDK values, which split its trend series into segments too short for a step
          # claim. A patch version is a lottery draw, not a platform choice, so it is pinned and bumped by a
          # reviewable edit — the same "committed rather than rolling" rule the performance anchor follows.
          # 21.0.12 is what every local run in perf-results/ was measured on. Guarded by JdkPinGuardTest.
          java-version: |
            21.0.12
            25.0.4

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      # Cache the bootstrapped kernel artifacts. Key on the kernel/base versions + the bootstrap
      # script & patches, so a kernel bump or a bootstrap change re-runs it; otherwise it's restored.
      - name: Cache bootstrapped kernel (mavenLocal)
        id: kernel-cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/com/mgmtp
          key: a12-kernel-30.8.1-base-29.3.0-${{ hashFiles('a12-kernel-bootstrap/bootstrap.sh', 'a12-kernel-bootstrap/patches/**') }}

      - name: Bootstrap the A12 kernel from public sources (cache miss only)
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        working-directory: a12-kernel-bootstrap
        env:
          JAVA21_HOME: ${{ env.JAVA_HOME_21_X64 }}
          JAVA25_HOME: ${{ env.JAVA_HOME_25_X64 }}
        run: ./bootstrap.sh

      # The default suite + the differential FUZZERS (-PrunFuzz) run on every push/PR — fuzzers are
      # correctness nets (interpreter == kernel). The isolated routine perf gate lives in the dedicated
      # nightly-performance workflow (docs/TESTING-SPEC "Test tiers"). Stage-4 module cut: root `test`
      # still exists (root is the cross-kit integration-test host, PROPOSAL §3a Option 1) so it runs the same
      # suite; we ALSO run the kernel-decoupling regression nets `:verifyKitPurity` (no kit main names a
      # kernel type) + `:noBackendTest` (the §2c degraded lane) here, since they were previously only on the
      # local `check` and Stage 4 is exactly a change that could regress the kernel-free property.
      - name: Build & test rulekit (kits + adapter + cli + fuzzers + kernel-free nets)
        working-directory: a12-dmkits
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: ./gradlew --no-daemon test :adapter:test :cli:test :cli:publicContractTest :interpreter:allTests :verifyKitPurity :noBackendTest -PrunFuzz

      # Both agent plugins (Claude Code, Codex) bundle COPIES of the single-source assets — the skills,
      # installer, and release-asset manifest — synced by scripts/sync-plugin-assets.sh. Fail loudly if any
      # copy drifts; the canonical sources are the originals and the plugin copies are regenerated, never edited.
      - name: Verify the plugin assets are in sync (skills + installer, all agents)
        working-directory: a12-dmkits
        run: ./scripts/sync-plugin-assets.sh --check

      # The public mirror's SCENARIOS.md is generated fresh at release from probe/tasks/ (not committed
      # here). Self-validate the generator so a probe/tasks change that breaks the scrape — or leaks
      # internal framing — fails CI now, not at release time.
      - name: Verify the public scenario generator
        working-directory: a12-dmkits
        run: ./scripts/gen-scenarios.sh --check

      # Doc-drift gate (F11 "loud detection at build"): the examples/ Showboat demos are executable
      # docs — `verify` re-runs each captured CLI invocation and exact-matches its recorded output. A
      # verb rename or output-shape change that wasn't reflected in the demos fails CI here instead of
      # rotting silently (the read/export rename bit them twice before this gate existed). We run the
      # committed scripts/verify-demos.sh — the SAME script developers run locally — which builds the CLI
      # launcher (installDist), DISCOVERS every demo (so the set can't drift from a hand-kept CI list),
      # and verifies them IN PARALLEL. Needs Node (the --custom-*-js worker demo) + uv (`uvx showboat`);
      # jq is on the runner. verify-demos.sh puts the repo bin/ shim on PATH so the demos' bare `dmtool`
      # resolves to the freshly-built JVM launcher.
      - name: Set up Node (for the --custom-conditions-js / --custom-field-types-js worker + its demo)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up uv (for uvx showboat)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false   # no Python deps to key a cache on (one-off `uvx showboat`); silences the cache-glob warning

      - name: Verify the Showboat demos still match the live CLI (all, parallel)
        working-directory: a12-dmkits
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: ./scripts/verify-demos.sh
