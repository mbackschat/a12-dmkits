name: CI

# Builds & tests rulekit against the REAL kernel — the kernel isn't on any public Maven repo, so CI
# rebuilds it from public sources via the sibling a12-kernel-bootstrap (the same path the README
# documents for humans). That bootstrapped ~/.m2 is cached and keyed on the kernel version + the
# bootstrap script, so the heavy kernel build runs only on a cache miss. The token-heavy N6 eval is
# NOT run here (it's opt-in, run manually via the run-dmtool-eval skill).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Supersede, don't finish. A run takes ~53 min while pushes land in bursts, so without this a superseded
# commit keeps a runner busy long after nobody needs its answer: on 2026-08-14, 16 of 21 CI runs were
# already obsolete before they completed — 840 billed minutes, 63% of that month's entire Actions spend.
# Cancelling costs the intermediate commits their green tick; the TIP is what is verified, which is what a
# batched-push workflow actually depends on. Need a known-green mid-batch commit later (bisect)? Re-run it
# with workflow_dispatch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    # An uncached run needs ~70–75 min (2026-10-22: setup + :adapter:test ~22 + :cli:test ~16–19 +
    # :cli:publicContractTest ~23); 60 cancelled every such push from 2026-10-09 on. The cap only stops a hang.
    timeout-minutes: 90
    env:
      # Hosted runners have no private init scripts, but retain the repo's explicit isolated-home contract.
      # setup-gradle below persists its dependencies, transformed jars, and local build cache across runs.
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-isolated
    steps:
      - name: Checkout rulekit
        uses: actions/checkout@v4
        with:
          path: a12-dmkits
          # NFR #1's currency guard resolves the commits that perf-results/**/*.jsonl name, and the action's
          # default depth of 1 fetches none of them. At that depth the guard reached `:adapter:test` after 31
          # billable minutes and reported HEAD as unmeasured — a commit that had touched only settings.gradle
          # and a doc (2026-09-21). Full history is the input that check, and `git describe`, actually need.
          fetch-depth: 0

      # Seconds, and first, because the condition it catches is otherwise found half an hour in. The Kotlin
      # guard still owns the invariant; this only refuses a checkout that cannot decide it.
      - name: Verify measurement history is resolvable
        working-directory: a12-dmkits
        run: ./scripts/check-measurement-history.sh

      # `/bin/sh` is Bash in sh-mode on macOS and accepts extensions that Ubuntu's Dash rejects. The committed
      # command discovers every POSIX entrypoint and applies both the ShellCheck language oracle and Dash parser.
      - name: Verify POSIX shell entrypoints
        working-directory: a12-dmkits
        run: ./scripts/check-shell-portability.sh

      # Repository TypeScript tools execute directly through Node's stable type stripping. Pin the exact LTS
      # patch here once; the same runtime is reused by interpreter JS tests and the custom-JS demo later.
      - name: Set up Node for repository TypeScript tools
        uses: actions/setup-node@v6
        with:
          node-version: '24.20.0'

      - name: Install Tokei for measured infographic evidence
        run: cargo install tokei --version 15.0.0 --locked

      - name: Run repository TypeScript tool tests
        working-directory: a12-dmkits
        run: ./scripts/run-typescript.sh --test scripts/typescript/*.test.ts

      # First repository check after its one required runtime setup. A failure still stops before Kernel checkout,
      # JDK and Gradle setup, cache restore, or bootstrap, without paying for a second job and duplicate checkout.
      - name: Verify infographic claims, placements, and public copies
        working-directory: a12-dmkits
        run: ./scripts/check-infographic-freshness.sh

      # SourceFileSizeLimitGuardTest counts code lines with locmetry and refuses any version but the one the policy
      # pins, so the version and the Linux asset's checksum are read from that file. It downloads, so it runs after
      # the preflights above and before the Gradle step whose root `test` needs it.
      - name: Install the pinned locmetry
        working-directory: a12-dmkits
        run: |
          policy=scripts/source-size-limits.json
          version="$(jq -r .locmetry.version "$policy")"
          asset="locmetry-v$version-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$asset" \
            "https://github.com/$(jq -r .locmetry.repository "$policy")/releases/download/v$version/$asset"
          echo "$(jq -r .locmetry.linuxSha256 "$policy")  $RUNNER_TEMP/$asset" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/${asset%.tar.gz}" >> "$GITHUB_PATH"

      # The bootstrap clones the kernel sources as siblings under its parent dir, so checking it out
      # next to rulekit makes A12_ROOT = the workspace (the layout the script expects locally).
      - name: Checkout the kernel bootstrap kit
        uses: actions/checkout@v4
        with:
          repository: mbackschat/a12-kernel-bootstrap
          path: a12-kernel-bootstrap

      # JDK 21 runs Gradle (and is rulekit's toolchain); JDK 25 only compiles a12-devtools'
      # build-utilities. setup-java exports JAVA_HOME_21_X64 / JAVA_HOME_25_X64 for the bootstrap.
      - name: Set up JDK 21 + 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # PINNED TO EXACT PATCH VERSIONS, deliberately. `21` alone resolves to whichever 21.0.x the runner
          # image happens to cache, and that drifted 21.0.11 -> 21.0.12 mid-August: the hosted performance
          # record then carried two JDK values, which split its trend series into segments too short for a step
          # claim. A patch version is a lottery draw, not a platform choice, so it is pinned and bumped by a
          # reviewable edit — the same "committed rather than rolling" rule the performance anchor follows.
          # 21.0.12 is what every local run in perf-results/ was measured on. Guarded by JdkPinGuardTest.
          java-version: |
            21.0.12
            25.0.4

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      # Cache the bootstrapped kernel artifacts. Key on the kernel/base versions + the bootstrap
      # script & patches, so a kernel bump or a bootstrap change re-runs it; otherwise it's restored.
      - name: Cache bootstrapped kernel (mavenLocal)
        id: kernel-cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/com/mgmtp
          key: a12-kernel-30.8.1-base-29.3.0-${{ hashFiles('a12-kernel-bootstrap/bootstrap.sh', 'a12-kernel-bootstrap/patches/**') }}

      - name: Bootstrap the A12 kernel from public sources (cache miss only)
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        working-directory: a12-kernel-bootstrap
        env:
          JAVA21_HOME: ${{ env.JAVA_HOME_21_X64 }}
          JAVA25_HOME: ${{ env.JAVA_HOME_25_X64 }}
        run: ./bootstrap.sh

      # The default suite + the differential FUZZERS (-PrunFuzz) run on main pushes and manual runs — fuzzers are
      # correctness nets (interpreter == kernel). The isolated routine perf gate lives in the dedicated
      # nightly-performance workflow (docs/TESTING-SPEC "Test tiers"). Stage-4 module cut: root `test`
      # still exists (root is the cross-kit integration-test host, PROPOSAL §3a Option 1) so it runs the same
      # suite; we ALSO run the kernel-decoupling regression nets `:verifyKitPurity` (no kit main names a
      # kernel type) + `:noBackendTest` (the §2c degraded lane) here, since they were previously only on the
      # local `check` and Stage 4 is exactly a change that could regress the kernel-free property.
      # `:interpreter-bridge:check` is the second ConditionReadBack provider plus its own purity lint;
      # `check` rather than `test` because the lint is what holds the module's kernel-free claim.
      # `:schemakit:check` for the same reason and a sharper one: until 2026-09-05 the fifth published kit
      # appeared in NO lane here, so neither its 27 test classes nor `verifySchemakitPurity` — the guard
      # SCHEMAKIT-SPEC §1 cites for the module's kernel-free claim — had ever run in CI. It costs 4 s.
      # `:consistency-gate:check` is the F3/F3-c façade module — the one whose whole claim is a verdict reached
      # with NO kernel present, so its purity lint is the guard behind that claim rather than a formality. It
      # carried a sibling `:interpreter-preflight:check` until 2026-09-20, when the two façades merged.
      # `:verifyPublishedClasspathsAreKernelFree` is the resolution-level half of that same claim across every
      # published artifact, and is named explicitly for the reason the module lanes above are: it hangs off
      # root `check`, which this workflow does not run.
      # `:verifyPublishedPomsResolveInRepoCoordinates` hangs off root `check` too, and answers the question no
      # API dump can: whether a consumer can RESOLVE the coordinates a shipped POM names. Two published POMs
      # declared `consistency-jvm` at compile scope while that module published nothing, which only a release
      # would have surfaced. It generates every publication's POM, so it costs ~2 s here.
      # `:consistency:check` is named for the same reason AND a second one: a Kotlin Multiplatform module
      # registers no `test` task, so the unqualified `test` above cannot reach it — the H1 purity guard and
      # every portable checker test would run on no automated lane otherwise.
      # `:consistency:nodeConsumerTest` is the only lane that can see whether the checker is CONSUMABLE rather
      # than merely correct: it packs the npm tarball, clean-installs it and imports by package name. Every
      # other test has the checker on the compile classpath by construction, which is how the JS target
      # compiled green for the module's whole life while emitting nothing importable. It is off
      # `:consistency:check` deliberately (it needs node and npm), so naming it here is what runs it at all —
      # the Node setup step above puts both on PATH. It reaches no network.
      # `:consistency:verifyConsistencyDeliveryCeiling` is the JS half of the checker's ABSOLUTE release bar (owner-ratified
      # 2026-09-16): the packed tarball's byte count against a 1 MiB ceiling. It reuses the pack the consumer
      # test already performs, so it costs nothing extra here, and it needs a routine lane precisely because the
      # cross-revision collector runs only at release — a doubled download would otherwise ship unnoticed. Its
      # JVM twin `verifyConsistencyJvmJarCeiling` (2 MiB on the jar, ratified 2026-09-18) is NOT named here
      # because it rides `:consistency:check` below: it needs only `jvmJar`, which that lifecycle already
      # builds, where the tarball bar needs a pack this workflow sets node and npm up for.
      # `:consistency:verifyConsistencyShippedFiles` closes the denominator on what the checker publishes, in
      # both carriers — every npm tarball entry and every jvm class package must be one something decided to
      # ship. F's oracle asks for exactly this and says why neither other guard can do it: a COPIED file
      # carries no dependency edge, so a linkage guard and a resolution guard are both blind to it. It reuses
      # the pack the lanes above already perform.
      # `:consistency:verifyCheckerArtifactIdentity` compares the three build outputs nothing else compares:
      # the version the JS `package.json` publishes, the version the jvm jar's coordinate carries, and the
      # `CHECKER_VERSION` compiled into that jar. A disagreement means a consumer installs one id and reads a
      # receipt citing another, which is one published identity with two byte contracts.
      - name: Build & test rulekit (kits + adapter + cli + fuzzers + kernel-free nets)
        working-directory: a12-dmkits
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        # `:interpreter:verifyInterpreterDependencies` is the MIRROR of the checker's NFR #1: ordinary
        # evaluation must not depend on consistency checking. It landed 2026-09-17 because the claim had no
        # enforcement locus — a planted `project(':consistency')` on `jsMain` passed both existing interpreter
        # gates under forced execution. The purity lint reads import TEXT and so cannot see a declared-but-
        # unimported edge; this one reads the resolved graph, including intra-repo project components, which no
        # group filter sees.
        # The `:interpreter:*` gates are named individually because this workflow runs `:interpreter:allTests`,
        # not `:interpreter:check` — that lifecycle also drags in dokka, npm packing and Maven staging, which
        # belong to the release rehearsal. Naming them is what GateTierWiringTest derives and enforces; five of
        # them ran nowhere at all until 2026-09-12, `verifyInterpreterPurity` — the EUPL import boundary —
        # among them.
        run: ./gradlew --no-daemon test :adapter:test :cli:test :cli:publicContractTest :interpreter:allTests :interpreter:verifyInterpreterPurity :interpreter:verifyInterpreterDependencies :interpreter:interpreterRuntimeClosurePolicyTest :interpreter:interpreterAbiGoldenDepthTest :interpreter:verifyInterpreterVersionAlignment :interpreter:verifyInterpreterPerformanceClaims :interpreter-bridge:check :consistency-gate:check :consistency:check :consistency:nodeConsumerTest :consistency:verifyConsistencyDeliveryCeiling :consistency:verifyCheckerArtifactIdentity :consistency:verifyConsistencyShippedFiles :schemakit:check :verifyKitPurity :verifyPublishedClasspathsAreKernelFree :verifyPublishedPomsResolveInRepoCoordinates :noBackendTest :consistency:verifyCheckerMavenPublication -PrunFuzz

      - name: Set up pnpm for the checker showcase
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Build and verify the checker showcase
        working-directory: a12-dmkits
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          ./gradlew --no-daemon :consistency:packConsistencyNpmPackage
          ./scripts/run-typescript.sh "checker showcase" scripts/typescript/checker-showcase.ts
          cd build/consistency-showcase
          pnpm run verify


      # Both agent plugins (Claude Code, Codex) bundle COPIES of the single-source assets — the skills,
      # installer, and release-asset manifest — synced by scripts/sync-plugin-assets.sh. Fail loudly if any
      # copy drifts; the canonical sources are the originals and the plugin copies are regenerated, never edited.
      - name: Verify the plugin assets are in sync (skills + installer, all agents)
        working-directory: a12-dmkits
        run: ./scripts/sync-plugin-assets.sh --check

      # The public mirror's SCENARIOS.md is generated fresh at release from probe/tasks/ (not committed
      # here). Self-validate the generator so a probe/tasks change that breaks the scrape — or leaks
      # internal framing — fails CI now, not at release time.
      - name: Verify the public scenario generator
        working-directory: a12-dmkits
        run: ./scripts/gen-scenarios.sh --check

      # Doc-drift gate (F11 "loud detection at build"): the examples/ Showboat demos are executable
      # docs — `verify` re-runs each captured CLI invocation and exact-matches its recorded output. A
      # verb rename or output-shape change that wasn't reflected in the demos fails CI here instead of
      # rotting silently (the read/export rename bit them twice before this gate existed). We run the
      # committed scripts/verify-demos.sh — the SAME script developers run locally — which builds the CLI
      # launcher (installDist), DISCOVERS every demo (so the set can't drift from a hand-kept CI list),
      # and verifies them IN PARALLEL. Needs Node (the --custom-*-js worker demo) + uv (`uvx showboat`);
      # jq is on the runner. verify-demos.sh puts the repo bin/ shim on PATH so the demos' bare `dmtool`
      # resolves to the freshly-built JVM launcher.
      - name: Set up uv (for uvx showboat)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false   # no Python deps to key a cache on (one-off `uvx showboat`); silences the cache-glob warning

      - name: Verify the Showboat demos still match the live CLI (all, parallel)
        working-directory: a12-dmkits
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: ./scripts/verify-demos.sh

      # A red run otherwise leaves only a ~53-minute log to read. Gradle's HTML reports carry the failing
      # test, its message and its stack; the Problems report carries anything reported through the Problems
      # API. `if: failure()` fires when ANY earlier step failed, and this is the last step, so it covers the
      # whole job. Nothing here needs a token permission — an artifact upload uses the runner's own upload
      # endpoint, not the API — so `permissions: contents: read` above is unchanged.
      - name: Upload build reports (failed runs only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            a12-dmkits/**/build/reports/**
            a12-dmkits/**/build/test-results/**
          retention-days: 14
          if-no-files-found: ignore
