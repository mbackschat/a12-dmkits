name: Nightly performance

# Performance-only by design. The deterministic correctness, fuzz, plugin and Showboat gates run in ci.yml;
# repeating them here adds no coverage and dominates scheduled wall time. Note ci.yml cancels superseded
# runs, so that cover is per main TIP rather than per main SHA — an intermediate commit in a burst may
# carry no completed CI run of its own.
on:
  workflow_dispatch:
  # WEEKLY since 2026-08-16, though the workflow keeps its name. This repo is private, so each run bills
  # Actions minutes: measured over six cron runs the median is 10.3 min, i.e. ~315 min/month daily against a
  # total steady-state spend near 1,300. Weekly costs ~45.
  #
  # Frequency is the right dial because a release is independently gated (scripts/release-perf-gate.sh refuses
  # a run that proved nothing), so this schedule is not what stops a regression shipping — it is what narrows
  # WHEN one entered, and a week-wide bisect is cheap. What it must not become is dispatch-only: every manual
  # dispatch happens while perf work is in flight, so a dispatch-only series has no quiet baseline and a step
  # cannot be told from an intended change. That unattended baseline is the whole reason a cron survives here.
  #
  # The NAME stays `Nightly performance`: it is the dispatch identifier in committed commands
  # (`gh workflow run 'Nightly performance'` in scripts/perf-anchor.sh and scripts/README.md) and the filename
  # is a declared Gradle input in build.gradle plus a locus in GateTierWiringTest. Renaming buys accuracy in
  # one word and costs a rename across ~10 loci, two of them executable.
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: read

jobs:
  performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-isolated
    steps:
      - name: Checkout rulekit
        uses: actions/checkout@v4
        with:
          path: a12-dmkits

      - name: Checkout the kernel bootstrap kit
        uses: actions/checkout@v4
        with:
          repository: mbackschat/a12-kernel-bootstrap
          path: a12-kernel-bootstrap

      - name: Set up JDK 21 + 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # PINNED TO EXACT PATCH VERSIONS, deliberately. `21` alone resolves to whichever 21.0.x the runner
          # image happens to cache, and that drifted 21.0.11 -> 21.0.12 mid-August: the hosted performance
          # record then carried two JDK values, which split its trend series into segments too short for a step
          # claim. A patch version is a lottery draw, not a platform choice, so it is pinned and bumped by a
          # reviewable edit — the same "committed rather than rolling" rule the performance anchor follows.
          # 21.0.12 is what every local run in perf-results/ was measured on. Guarded by JdkPinGuardTest.
          java-version: |
            21.0.12
            25.0.4

      # The 2026.06-ext1 kernel bootstrap refuses to build below Node 24, and the hosted image's PATH carries
      # Node 22 (run 41818557495, 2026-11-04). Same reviewed patch as main CI; NodeRuntimePinGuardTest.
      - name: Set up Node for the kernel bootstrap
        uses: actions/setup-node@v6
        with:
          node-version: '24.20.0'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Cache bootstrapped kernel (mavenLocal)
        id: kernel-cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/com/mgmtp
          key: a12-kernel-31.1.1-base-30.0.2-${{ hashFiles('a12-kernel-bootstrap/bootstrap.sh', 'a12-kernel-bootstrap/releases/**', 'a12-kernel-bootstrap/scripts/**', 'a12-kernel-bootstrap/build-support/**') }}

      - name: Bootstrap the A12 kernel from public sources (cache miss only)
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        working-directory: a12-kernel-bootstrap
        env:
          JAVA21_HOME: ${{ env.JAVA_HOME_21_X64 }}
          JAVA25_HOME: ${{ env.JAVA_HOME_25_X64 }}
        run: ./bootstrap.sh

      # This launcher targets the dedicated non-cacheable, single-fork perfGateTest task. Compilation and
      # dependencies may restore from cache; the timed measurements themselves always execute fresh.
      #
      # This is the ONLY automated lane that runs a timing bar (owner policy 2026-08-13: ordinary pushes are
      # covered by this workflow with full perf coverage, and a release is blocked on regressions). *Qualified
      # 2026-08-16 when the schedule went weekly: "ordinary pushes are covered" now means covered WITHIN A WEEK,
      # not overnight. The release gate is unchanged and is what actually blocks a regression from shipping.*
      # The task
      # selects the whole @Tag('perf') routine tier BY TAG, so a new perf test is gated here by existing — the
      # enumerated filter this replaced ran 2 of 9 such classes. On a hosted runner the self-referential bars
      # (growth floors, the absolute anchor) report rather than fail: contention here cannot be told apart from
      # a regression (IF280/IF293). The cross-engine bars gate everywhere and are the real nightly signal.
      - name: Run the isolated routine performance gate
        working-directory: a12-dmkits
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: ./scripts/perf.sh gate

      # The gate can only see a breach ABOVE its tolerance (1.65x + 1ms), so a slowdown that stays under it is
      # invisible to every step above — and successive within-tolerance degradations are exactly what a committed
      # (rather than rolling) anchor exists to stop compounding silently. `perf-trend.sh` is the other half: it
      # segments the committed series by (environment, jdk, os, machine) and reports where a row's LEVEL stepped.
      # It is a REPORT and always exits 0 on a readable record, so it cannot fail the nightly — a change point is
      # what a deliberate optimization looks like too, and only a human can tell the two apart. Running it here is
      # what makes drift SURFACED rather than merely detectable: the script existed and nothing invoked it.
      - name: Report step changes in the committed performance record
        if: always()
        working-directory: a12-dmkits
        run: ./scripts/perf-trend.sh

      # The run writes its record INTO the committed perf-results/ tree (never build/, which clean deletes), so the
      # tree now holds this run's file beside every previously committed one. Uploading the tree would hand the
      # operator an artifact of mostly other machines' and other revisions' numbers, presented as this run's output.
      # `git ls-files --others` is exactly the set this run added, because CI checks out clean and the gate only
      # appends. Runs on failure too — a breach is exactly when the numbers are wanted.
      - name: Collect this run's own performance record
        if: always()
        working-directory: a12-dmkits
        run: |
          mkdir -p "$RUNNER_TEMP/perf-record"
          git ls-files --others --exclude-standard -- perf-results | while read -r record; do
            mkdir -p "$RUNNER_TEMP/perf-record/$(dirname "$record")"
            cp "$record" "$RUNNER_TEMP/perf-record/$record"
          done
          # Staged alongside the record so the artifact has ONE root: upload-artifact makes paths relative to the
          # least common ancestor of everything matched, and a second path elsewhere on the filesystem would bury
          # the record under the runner's absolute directories.
          cp build/perf-gate.log "$RUNNER_TEMP/perf-record/" 2>/dev/null || true
          find "$RUNNER_TEMP/perf-record" -type f -print

      # CI does not commit, so this artifact is how a hosted run's record leaves the runner: a hosted anchor block
      # can be authored from nowhere else.
      - name: Upload the run's performance observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-observations
          path: ${{ runner.temp }}/perf-record/**
          if-no-files-found: warn
