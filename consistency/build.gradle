// The :consistency module (docs/PORTABLE-CONSISTENCY-PROPOSAL.md): the standalone, Kernel-free consistency
// checker for a DocumentModel's RULES AND COMPUTATIONS — Kotlin Multiplatform (jvm + js), published for
// TypeScript/Node consumers under H2.
//
// Two dependency rules are the contract, not a preference. It depends on NEITHER the kernel (H1) nor
// :interpreter (NFR #1, and the plan's empty neutral-leaf allowlist): the checker owns its analysis syntax,
// and `Dec` sits on the interpreter's arithmetic paths, so sharing one would trade the interpreter's
// performance for the checker's convenience. Its own test source sets stay Kernel-free too; Kernel
// differentials live in :adapter.
plugins {
    id 'org.jetbrains.kotlin.multiplatform'
}

kotlin {
    jvmToolchain(21)

    jvm()
    // The JS target is a consumable LIBRARY, not only a test lane. `binaries.library()` plus `useEsModules`
    // is what makes the compiled output importable at all — without them the target compiles and produces
    // nothing a Node project can `import`, which is exactly how a green build can coexist with an
    // unconsumable artifact. The settings mirror `:interpreter`, the module that already ships to Node.
    js {
        outputModuleName = 'a12-consistency'
        nodejs()
        // The BROWSER is a target H5/F require and this module did not declare until 2026-09-17, which is
        // why F's "run the corpus through Java, packed Node and browser" could not have run its third arm:
        // a target the module does not compile for cannot be replayed against
        // (docs/PORTABLE-CONSISTENCY-IMPLEMENTATION-PLAN.md#stage-8-browser). Unlike `:interpreter`, whose
        // `jsBrowserTest` is disabled because its commonTest imports `node:*` host probes, this module's
        // sources touch no host API at all, so the shared suite COULD run in Karma here — and deliberately
        // does not. Measured 2026-09-17: enabling `jsBrowserTest` grows the committed `kotlin-js-store/
        // yarn.lock` from 524 to 2077 lines, pulling Karma and its transitive tree into a lock that carries
        // no Karma today, and it would exercise the COMPILER'S OUTPUT rather than the packed tarball F's
        // acceptance actually names. Browser assurance therefore comes from a packed-artifact consumer, which
        // is the same trade `:interpreter` already made for the same two reasons.
        browser()
        useEsModules()
        binaries.library()
        generateTypeScriptDefinitions()
        compilerOptions {
            target.set('es2015')
        }
    }

    sourceSets {
        commonMain {
            dependencies {
                implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0'
                // The shared-predicate leaf, and the ONE intra-repo edge this module may have: it is
                // dependency-free by its own guard and exists so a law the Java kits also enforce has a
                // single live statement rather than a copy here (plan row 5a; C1's re-open trigger).
                api project(':predicates')
            }
        }
        commonTest {
            dependencies {
                implementation kotlin('test')
            }
        }
    }
}

tasks.named('jsBrowserTest') {
    // Disabled for the two reasons the `browser()` call above measures: Karma would quadruple the committed
    // yarn lock, and the shared suite under Karma tests the compiler's output rather than the packed tarball
    // F's acceptance names. The browser target still earns its place — it produces the browser library binary
    // a bundler consumes, which is the artifact that replay needs to exist at all.
    enabled = false
}

// --- The boundary guard (plan stage 2; the empty neutral-leaf allowlist's enforcement locus) -------------
//
// Two instruments for one contract, because each is blind where the other sees. `verifyConsistencyPurity`
// asks what the compiled classes LINK; `verifyConsistencyDependencies` asks what a consumer would RESOLVE,
// which a linkage guard cannot see, since a jar reaches a POM by being declared and not by being used.
//
// Both replace an `import`-text scan, and for the reason SCHEMAKIT-SPEC §1 records from the same mistake
// there: a regex over import lines misses a fully-qualified use, a name inside a raw string, and anything a
// comment delimiter inside a literal blanks. jdeps reads class dependencies, so literals and comments are
// irrelevant by construction, and the shared helper refuses an empty class denominator and requires a
// compiled-reference positive control before accepting absence.
//
// The forbidden set carries the addition that is this module's whole point: the INTERPRETER is forbidden as
// firmly as the kernel. The plan's allowlist for a shared syntax leaf is empty, so there is no permitted type
// to encode an exception for. Test scope is IN scope here, unlike the kit and schemakit gates — those keep
// the kernel as their test oracle, while this module's differentials live in :adapter by design.
def verifyConsistencyPurity = tasks.register('verifyConsistencyPurity') {
    group = 'verification'
    description = 'Fail on a compiled kernel, interpreter or Groovy edge out of the checker, in main and test scope.'
    dependsOn 'jvmMainClasses', 'jvmTestClasses'
    def srcRoot = file('src')
    // Only the source sets that compile INTO the JVM target are covered by jdeps — `common*` and `jvm*` do,
    // so the JVM class output is what this instrument can read. The guard derives what exists and refuses
    // what NEITHER instrument reaches, rather than remembering a list that silently stops matching the tree.
    def jdepsCoveredSourceSets = ['commonMain', 'commonTest', 'jvmMain', 'jvmTest']
    // `js*` compiles to `.mjs`, which jdeps cannot read, so the SECOND instrument is what covers them:
    // `verifyConsistencyDependencies` reads `jsRuntimeClasspath` and `jsTestRuntimeClasspath` and is closed
    // over intra-repo project edges as well as external groups. Listing these here claims that instrument
    // covers them, NOT that this one does — a `nativeMain` would still be refused, because no instrument
    // reaches it.
    //
    // Corrected 2026-09-17: this said the forbidden set was "unreachable there by construction", because the
    // kernel, `:interpreter` and Groovy are JVM artifacts that "cannot sit on a Kotlin/JS compile classpath".
    // That is false of `:interpreter`, which is Kotlin Multiplatform and publishes a JS target — and it was
    // measured false: `implementation project(':interpreter')` on `jsMain` resolved onto
    // `jsRuntimeClasspath` with both guards green, because a project edge carries no module coordinate for a
    // group filter to see. The dependency guard is closed over project paths as of the same day.
    def classpathCoveredSourceSets = ['jsMain', 'jsTest']
    def coveredSourceSets = jdepsCoveredSourceSets + classpathCoveredSourceSets
    def classRoots = providers.provider {
        kotlin.targets.getByName('jvm').compilations.collectMany { it.output.classesDirs.files }
    }
    inputs.dir(srcRoot)
    inputs.files(classRoots)
    doLast {
        def unreached = srcRoot.listFiles().findAll { it.isDirectory() }*.name.toSorted()
                .findAll { !coveredSourceSets.contains(it) }
        if (unreached) {
            throw new GradleException(
                    "consistency source set(s) ${unreached} do not compile into the JVM target, so " +
                    'verifyConsistencyPurity cannot see them. Give them their own compiled scan before adding code.')
        }
        rootProject.verifyCompiledPurity(
            'consistency purity — main and test (H1: no kernel; NFR #1: no :interpreter)',
            classRoots.get(),
            ['com.mgmtp.', 'groovy.', 'io.github.mbackschat.a12.dm.interpreter.'],
            'java.lang.Object')
    }
}

// What the module may DEPEND on, as an allowlist rather than a denylist: H2 promises an ordinary npm/TS
// consumption, and every module resolved here becomes something that consumer installs. Naming the permitted
// groups makes a new third-party dependency fail on arrival; naming forbidden ones would only catch the
// dependency somebody already thought of. The one third-party group is kotlinx — `kotlinx.serialization`, TREE
// API only, because it retains a number's literal text (B3) — plus the test framework's own groups.
def verifyConsistencyDependencies = tasks.register('verifyConsistencyDependencies') {
    group = 'verification'
    description = 'Fail if the checker resolves anything outside its allowlist, on either target, compile or runtime.'
    doLast {
        rootProject.verifyKernelFreeClasspath(
            'consistency dependencies — jvm and js, main and test, compile and runtime',
            // COMPILE as well as RUNTIME, because the two differ exactly where a sneaky edge would live: a
            // `compileOnly` dependency never reaches a runtime classpath, so a runtime-only guard would let
            // the one configuration that can still make code compile through unexamined.
            ['jvmCompileClasspath', 'jvmRuntimeClasspath',
             'jvmTestCompileClasspath', 'jvmTestRuntimeClasspath',
             'jsCompileClasspath', 'jsRuntimeClasspath',
             'jsTestCompileClasspath', 'jsTestRuntimeClasspath']
                    .collect { configurations.getByName(it) },
            ['com.mgmtp.'],
            'org.jetbrains.kotlin',
            ['org.jetbrains', 'org.jetbrains.kotlin', 'org.jetbrains.kotlinx', 'junit', 'org.hamcrest',
             // Every module in this repository publishes under this ONE group, so admitting it by group
             // admits `:interpreter` exactly as readily as the shared-predicate leaf — which is why the
             // intra-repo claim is made by PROJECT PATH below and not here. What keeps the leaf itself from
             // being a hole is its own `verifyPredicatesPurity`: it resolves nothing but the Kotlin stdlib,
             // so nothing can arrive here THROUGH it.
             'io.github.mbackschat.a12.dm'],
            // CLOSED over intra-repo edges, and measured on 2026-09-17 to be the only instrument that is:
            // `implementation project(':interpreter')` on `jsMain` resolved onto `jsRuntimeClasspath` while
            // this guard and `verifyConsistencyPurity` both reported clean. jdeps cannot read `.mjs`, and a
            // project edge is a `ProjectComponentIdentifier` that every group filter is blind to.
            [':consistency', ':predicates'])
    }
}

tasks.named('check') { dependsOn verifyConsistencyPurity, verifyConsistencyDependencies }

// ─────────────────────────────────────────────────────────────────────────────────────────────────────────
// The raw-workspace matrix: the checker's fact base, measured against the one the real Kernel produces.
//
// The matrix is authored once through modelkit/EditSession/rulekit in :adapter and committed together with
// the expanded facts the Kernel and the JVM reader agree on (`:adapter:syncWorkspacePreparationFixtures`,
// locked by WorkspacePreparationParityTest). Reading it here gives the checker's own mounting an external
// oracle over includes, imported typedefs, repeated mounts and a seven-source diamond, instead of fixtures
// written by the same hand as the code. It is data, not code: no :interpreter class is on any classpath, and
// the purity and dependency guards above still see the whole module.
//
// Embedded as generated Kotlin for the reason the interpreter's copy is: commonTest runs on Node as well as
// the JVM, where a resource read costs an implementation per target and a string literal costs none.
def workspaceMatrixDir = rootProject.file('interpreter/src/commonTest/resources/workspace-preparation')
def workspaceMatrixManifest = new File(workspaceMatrixDir, 'manifest.json')
def generatedWorkspaceMatrixDir =
        layout.buildDirectory.dir('generated/workspaceMatrix/commonTest/kotlin').get().asFile
def generatedWorkspaceMatrix = new File(generatedWorkspaceMatrixDir,
        'io/github/mbackschat/a12/dm/consistency/WorkspaceMatrixJson.kt')
def generateWorkspaceMatrix = tasks.register('generateWorkspaceMatrix') {
    description = 'Embeds the shared raw-workspace matrix and its Kernel-locked facts for common tests.'
    inputs.files(fileTree(workspaceMatrixDir) { include '**/*.json' })
            .withPropertyName('sharedWorkspaceMatrix')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.file(generatedWorkspaceMatrix)
    doLast {
        if (!workspaceMatrixManifest.isFile()) {
            throw new GradleException(
                    'missing workspace-preparation manifest; run :adapter:syncWorkspacePreparationFixtures')
        }
        // JsonOutput emits a valid Kotlin literal except for `$` interpolation, which a condition's own
        // correlation token can carry — escape it once here so fixture text can never become source code.
        def literal = { value -> groovy.json.JsonOutput.toJson(value).replace('$', '\\$') }
        // A case carrying `expectedPreparationDiagnostic` is one the interpreter REFUSES to prepare; it has
        // no expanded facts to compare against, so this matrix is the accepted half only.
        def cases = new groovy.json.JsonSlurper().parse(workspaceMatrixManifest).cases
                .findAll { ignored, fixture -> !fixture.containsKey('expectedPreparationDiagnostic') }
        def arm = { Closure<String> body -> cases.collect { id, fixture -> "        ${literal(id)} -> ${body(fixture)}" }.join('\n') }
        def sourceArms = cases.collect { id, fixture ->
            def entries = fixture.sources.collect { modelId, relativePath ->
                def file = new File(workspaceMatrixDir, relativePath as String)
                if (!file.isFile()) {
                    throw new GradleException("missing workspace-preparation source ${relativePath}; " +
                            'run :adapter:syncWorkspacePreparationFixtures')
                }
                "            ${literal(modelId)} to ${literal(file.getText('UTF-8'))}"
            }.join(',\n')
            "        ${literal(id)} -> mapOf(\n${entries}\n        )"
        }.join('\n')
        generatedWorkspaceMatrix.parentFile.mkdirs()
        generatedWorkspaceMatrix.text = """\
package io.github.mbackschat.a12.dm.consistency

/**
 * GENERATED by `:consistency:generateWorkspaceMatrix` from the shared raw-workspace fixtures. Do not edit:
 * the fixtures are authored in :adapter through the typed kits and their facts are locked against the real
 * Kernel, which is what makes them an oracle for this module rather than a restatement of it.
 */
internal object WorkspaceMatrixJson {
    fun caseIds(): List<String> = listOf(${cases.keySet().collect(literal).join(', ')})

    fun entryModelId(caseId: String): String = when (caseId) {
${arm { literal(it.entryModelId) }}
        else -> error("unknown workspace matrix case: \$caseId")
    }

    fun sources(caseId: String): Map<String, String> = when (caseId) {
${sourceArms}
        else -> error("unknown workspace matrix case: \$caseId")
    }

    /**
     * The expanded element set as `path -> {elementType, facts}`.
     *
     * This projection and not the sibling `preparedElements`: it is the one built from the surface whose
     * equality with the real Kernel `assertEquivalent` asserts, where the other is derived from the JVM
     * reader's emitted ids. The two agree today, and only this one is locked to say so.
     */
    fun preparedStructure(caseId: String): String = when (caseId) {
${arm { literal(groovy.json.JsonOutput.toJson(it.preparedStructure)) }}
        else -> error("unknown workspace matrix case: \$caseId")
    }
}
"""
    }
}
kotlin.sourceSets.commonTest.kotlin.srcDir(generatedWorkspaceMatrixDir)
tasks.named('compileTestKotlinJvm') { dependsOn generateWorkspaceMatrix }
tasks.named('compileTestKotlinJs') { dependsOn generateWorkspaceMatrix }

// ─────────────────────────────────────────────────────────────────────────────────────────────────────────
// The three-arm parity corpus, embedded for the arm that is neither Node nor a browser.
//
// F's oracle for "JS matches JVM" wants the full report contract compared across Java, packed Node and a real
// browser (docs/PORTABLE-CONSISTENCY-PROPOSAL.md, "Claim-specific oracles"). The two packaged arms read
// `consumer-tests/shared/parity` at runtime; this target cannot — commonTest runs on Node as well as the JVM,
// where a resource read costs an implementation per target — so the same committed bytes are embedded as
// generated Kotlin, exactly as the workspace matrix above is. Embedding is what makes the JVM comparison run
// on the SAME bytes the packaged arms compare against, so three arms are one claim rather than three.
//
// The corpus is written by `syncCheckerParityCorpus` from the packed package. This task only reads it, so a
// corpus that has never been generated fails here with that command named.
def parityCorpusDir = file('consumer-tests/shared/parity')
def parityCorpusManifest = new File(parityCorpusDir, 'manifest.json')
// The manifest's source paths are relative to the SHARED tree, not to the corpus: a model committed for
// another suite is referenced rather than copied, so a fixture has one live statement.
def parityCorpusSharedDir = file('consumer-tests/shared')
def generatedParityCorpusDir =
        layout.buildDirectory.dir('generated/parityCorpus/commonTest/kotlin').get().asFile
def generatedParityCorpus = new File(generatedParityCorpusDir,
        'io/github/mbackschat/a12/dm/consistency/ParityCorpusJson.kt')
def generateParityCorpus = tasks.register('generateParityCorpus') {
    description = 'Embeds the three-arm parity corpus so the JVM arm compares the packaged arms own bytes.'
    inputs.files(fileTree(parityCorpusSharedDir) { include '**/*.json'; include '**/*.txt' })
            .withPropertyName('parityCorpus')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.file(generatedParityCorpus)
    doLast {
        if (!parityCorpusManifest.isFile()) {
            throw new GradleException('missing the parity corpus manifest; run ' +
                    ':consistency:syncCheckerParityCorpus')
        }
        // JsonOutput emits a valid Kotlin literal except for `$` interpolation, which a model's own text can
        // carry — escape it once here so fixture text can never become source code.
        def literal = { value -> groovy.json.JsonOutput.toJson(value).replace('$', '\\$') }
        def corpus = new groovy.json.JsonSlurper().parse(parityCorpusManifest)
        def readOrFail = { File file, String what ->
            if (!file.isFile()) {
                throw new GradleException("missing parity corpus ${what} ${file.name}; run " +
                        ':consistency:syncCheckerParityCorpus')
            }
            return file.getText('UTF-8')
        }
        def sourceArms = corpus.sources.collect { key, relativePath ->
            def text = readOrFail(new File(parityCorpusSharedDir, relativePath as String), 'source')
            "        ${literal(key)} -> ${literal(text)}"
        }.join('\n')
        def reportArms = corpus.cases.collect { kase ->
            def text = readOrFail(new File(parityCorpusDir, "reports/${kase.name}.json"), 'report')
            "        ${literal(kase.name)} -> ${literal(text)}"
        }.join('\n')
        def caseArms = corpus.cases.collect { kase ->
            "        ParityCase(${literal(kase.name)}, ${literal(kase.call)}, " +
                    "listOf(${kase.sources.collect(literal).join(', ')}))"
        }.join(',\n')
        generatedParityCorpus.parentFile.mkdirs()
        generatedParityCorpus.text = """\
package io.github.mbackschat.a12.dm.consistency

/** One parity case: the call to make, and the source keys to make it with. */
internal data class ParityCase(val name: String, val call: String, val sources: List<String>)

/**
 * GENERATED by `:consistency:generateParityCorpus` from `consumer-tests/shared/parity`. Do not edit.
 *
 * The same committed bytes the packed Node and browser arms read at runtime, so the three arms compare one
 * corpus rather than three. Regenerate the corpus itself with `:consistency:syncCheckerParityCorpus`, which
 * writes it from the packed npm package.
 */
internal object ParityCorpusJson {
    fun cases(): List<ParityCase> = listOf(
${caseArms}
    )

    fun source(key: String): String = when (key) {
${sourceArms}
        else -> error("unknown parity corpus source: \$key")
    }

    fun report(name: String): String = when (name) {
${reportArms}
        else -> error("unknown parity corpus case: \$name")
    }
}
"""
    }
}
kotlin.sourceSets.commonTest.kotlin.srcDir(generatedParityCorpusDir)
tasks.named('compileTestKotlinJvm') { dependsOn generateParityCorpus }
tasks.named('compileTestKotlinJs') { dependsOn generateParityCorpus }

// ─────────────────────────────────────────────────────────────────────────────────────────────────────────
// The condition keyword table is DERIVED, never hand-edited — and it is PER LANGUAGE.
//
// A faithful tokenizer has to know which names are keywords, because A12's own lexer decides that
// dynamically (`ID` carries `setTypeInLexer`) by looking the text up in ONE language's terminal bundle:
// `AbstractMultiLanguageHandler.setTypeInLexer` sets the keyword's token type on a hit and
// `NameOhnePunktSTRAmAnfang` on a miss. So the sets are disjoint questions — `Und` is a keyword in a German
// model and an ordinary field name in an English one, and a merged table would silently drop the reference.
//
// The operator keywords have a single owner, rulekit's catalog, whose examples CI runs through the real
// kernel, so the table reads a PROJECTION of it. The catalog does not cover every terminal the lexer knows,
// and the remainder is declared below with its reason rather than left to be discovered as a missing
// reference. `ConditionKeywordProjectionTest` measures the union against the Kernel's own bundle in both
// directions, so neither list can drift.
//
// It is generated as Kotlin SOURCE rather than a resource because this is a multiplatform module: a resource
// read costs a different implementation per target, while a generated source file costs none. The guard is
// the same one `docs/OPERATOR-INDEX.md` gets — regenerate and diff, so an edit to either side fails loudly.
def catalogFile = rootProject.file('rulekit/src/main/resources/catalog/operators.json')
def generatedKeywords =
        file('src/commonMain/kotlin/io/github/mbackschat/a12/dm/consistency/syntax/ConditionKeywords.kt')

// Terminals the lexer resolves that the OPERATOR catalog does not carry, so the projection alone is short.
// Measured against `LexerTerminals_{en,de}` at kernel 30.8.1 on 2026-09-12. This is the same population
// `KeywordReverseParityTest.EXCLUDED` reasons about, reached from the other side: that test asks which
// terminals the catalog may omit, this asks which the checker must add back, and `ConditionKeywordProjectionTest`
// re-derives the union from the bundles so neither list can drift from the lexer or from the other.
def uncatalogedTerminals = [
        en: [
                // The catalog stores one canonical spelling per language; the lexer also admits these.
                'and', 'AND', 'or', 'OR', 'In', 'in', 'IN', 'To', 'to', 'TO',
                // Grammar keywords that are not operators: the rule-context entity and the preamble.
                'RuleGroup', 'SuppressWarning',
                // An operator rulekit defers (dynamic-enumeration dependent columns) and so does not
                // catalog. The checker cannot defer it: unlisted, it reads as an undeclared field.
                'ValueNotConsistent',
        ],
        de: [
                'und', 'UND', 'oder', 'ODER', 'In', 'in', 'IN', 'Zu', 'zu', 'ZU',
                'RegelKontext', 'UnterdrueckeWarnung',
                'WertNichtKonsistent',
                // H-model operators. They exist ONLY in the German bundle, so in an English model these
                // spellings are ordinary field names — which is the sharpest case for keeping the tables apart.
                'AktuelleVordruckNummer', 'AnzahlAngegebeneUsb', 'AnzahlAngegebenerVordrucke',
                'KeinVordruckAngegeben', 'MaximalAngegebenerZeilenindex', 'MindestensEinVordruckAngegeben',
                'UsbNichtFortlaufend', 'VordruckAngegeben', 'VordruckNichtAngegeben',
                'VordruckNichtFortlaufend', 'ZeileNichtEindeutig', 'ZeilenLueckenlos',
                'ZeilenNichtAufsteigend',
        ],
]

// `#Zeile` is a fixed lexer literal rather than a bundle entry, so it is in no language's terminal map and
// the denominator guard excludes it by name. It is listed here because a name scan must still not read
// `Zeile` as a reference.
def fixedLiterals = ['#Zeile']

def renderConditionKeywords = { File catalog ->
    def operators = new groovy.json.JsonSlurper().parse(catalog).operators
    def kindOf = { String kind -> kind.toUpperCase().replace('-', '_') }
    def perLanguage = ['en', 'de'].collectEntries { language ->
        def rows = [:]
        operators.each { op ->
            def keyword = op.keywords?."$language"
            // Symbolic operators (`==`, `->`, `+`) never reach the keyword lookup: the lexer matches them as
            // their own tokens and the tokenizer emits them as symbols, so a NAME can never spell one.
            if (keyword && keyword ==~ /^[@A-Za-z].*/) {
                def existing = rows[keyword]
                if (existing && existing != kindOf(op.kind)) {
                    throw new GradleException("the operator catalog gives the $language keyword '$keyword' " +
                            "two kinds ($existing, ${kindOf(op.kind)}), which the tokenizer cannot resolve")
                }
                rows[keyword] = kindOf(op.kind)
            }
        }
        (uncatalogedTerminals[language] + fixedLiterals).each { keyword ->
            if (rows.containsKey(keyword)) {
                throw new GradleException("'$keyword' is declared as uncataloged for $language but the " +
                        'operator catalog now carries it — delete the declaration')
            }
            rows[keyword] = 'UNCATALOGED'
        }
        [language, rows]
    }
    // …and how each OPERATOR is spelled, keyed by the catalog's own id, so a family can name an operator once
    // and still read a model written in either language. Keyed by id rather than by keyword because only
    // that direction is a function: `Valid` and `ValidType` share the spelling `Valid` (and `Gueltig`), being
    // one operator's two signatures, so a keyword-keyed table would have to drop them or carry a list.
    def spellingsPerLanguage = ['en', 'de'].collectEntries { language ->
        def rows = [:]
        operators.each { op ->
            def keyword = op.keywords?."$language"
            if (keyword && keyword ==~ /^[@A-Za-z].*/) {
                rows[op.id] = keyword
            }
        }
        [language, rows]
    }
    def kinds = ((operators.collect { kindOf(it.kind) } as Set) + 'UNCATALOGED').sort()
            .collect { "    $it," }.join('\n')
    def table = perLanguage.collect { language, rows ->
        def body = rows.keySet().sort()
                .collect { "        \"${it}\" to KeywordKind.${rows[it]}," }.join('\n')
        "    ConditionLanguage.${language.toUpperCase()} to mapOf(\n${body}\n    ),"
    }.join('\n')
    def idTable = spellingsPerLanguage.collect { language, rows ->
        def body = rows.keySet().sort()
                .collect { "        \"${it}\" to \"${rows[it]}\"," }.join('\n')
        "    ConditionLanguage.${language.toUpperCase()} to mapOf(\n${body}\n    ),"
    }.join('\n')
    return """package io.github.mbackschat.a12.dm.consistency.syntax

/**
 * GENERATED from `rulekit/src/main/resources/catalog/operators.json` by `:consistency:generateConditionKeywords`.
 * Do not edit: `verifyConditionKeywords` regenerates and diffs, so a hand edit here or a catalog change there
 * fails the build. The catalog is the single owner because its examples are CI-executed against the Kernel;
 * the terminals it does not carry are declared in `consistency/build.gradle` with their reason, and
 * `ConditionKeywordProjectionTest` measures the union against the Kernel's own terminal bundle.
 */

/** What a keyword is, as the operator catalog classifies it. */
enum class KeywordKind {
${kinds}
}

/**
 * Every keyword A12's condition lexer resolves, per language.
 *
 * The languages are SEPARATE maps rather than one merged set because the Kernel resolves a name against
 * exactly one language's terminals (`AbstractMultiLanguageHandler.setTypeInLexer`). `Und` is a keyword in a
 * German model and a perfectly ordinary field name in an English one, so a merged table would read that
 * field as an operator and drop the reference without a diagnostic.
 */
val CONDITION_KEYWORDS: Map<ConditionLanguage, Map<String, KeywordKind>> = mapOf(
${table}
)

/**
 * How each cataloged operator is SPELLED in one language, keyed by the catalog's own id.
 *
 * A family that cares about one operator's operands names the id once and reads a model in either language
 * through this, instead of carrying a second copy of the spellings. Only cataloged operators appear: the
 * uncataloged terminals beside them in [CONDITION_KEYWORDS] have no operator identity to give.
 *
 * Keyed by id and not by keyword because only that direction is a function — `Valid` and `ValidType` are one
 * operator's two signatures and share the spelling `Valid` (and `Gueltig`), so a keyword names no single id.
 */
val CONDITION_OPERATOR_KEYWORDS: Map<ConditionLanguage, Map<String, String>> = mapOf(
${idTable}
)
"""
}

tasks.register('generateConditionKeywords') {
    description = 'Regenerates the condition keyword table from the rulekit catalog.'
    inputs.file(catalogFile)
    outputs.file(generatedKeywords)
    doLast {
        generatedKeywords.parentFile.mkdirs()
        generatedKeywords.text = renderConditionKeywords(catalogFile)
    }
}

tasks.register('verifyConditionKeywords') {
    description = 'Fails when the generated condition keyword table is out of step with the catalog.'
    inputs.file(catalogFile)
    inputs.file(generatedKeywords)
    doLast {
        def expected = renderConditionKeywords(catalogFile)
        if (generatedKeywords.text != expected) {
            throw new GradleException(
                    "${generatedKeywords} is out of step with the operator catalog. It is DERIVED, never " +
                            "hand-edited: regenerate it with `./build.sh :consistency:generateConditionKeywords` " +
                            'and commit the result alongside the change that moved it.')
        }
    }
}

tasks.named('check') { dependsOn 'verifyConditionKeywords' }

// ─────────────────────────────────────────────────────────────────────────────────────────────────────────
// The condition CORPUS: the catalog's own DSL, as data, so a Kernel-free module can be held to it.
//
// Every text here is one the real Kernel accepts — the catalog's examples are CI-executed against it — which
// makes the corpus an over-rejection gate rather than a restatement: a syntax family that reports anything
// about any of these texts is rejecting a condition A12 admits, the one direction this checker must never
// take. The `invalidExample` texts belong in it for the reason their name hides: they are grammatically
// VALID and fail on MEANING (`[CustomerName] <= [ProductCode]` parses perfectly and is a type error), so
// measured, 0 of them carries a parse code.
//
// Generated into `build/` rather than the committed tree, like the workspace matrix beside it: an artifact
// that cannot drift from its source by construction needs no diff guard, and unlike the keyword table this
// one is not read by humans or cited in findings.
//
// The German half is localized HERE, from the catalog's own bilingual keyword pairs, because the runtime
// localizer lives in :adapter and this module may not depend on it. That makes the localization a second
// implementation, so the corpus is built to police itself: `ConditionCorpusTest` tokenizes each German text
// against its English original and requires the same token kinds in the same order with identical string
// literals, which is what a substitution leaking into a literal or eating a delimiter would break.
def generatedCorpusDir = layout.buildDirectory.dir('generated/conditionCorpus/commonTest/kotlin').get().asFile
def generatedCorpus = new File(generatedCorpusDir,
        'io/github/mbackschat/a12/dm/consistency/ConditionCorpus.kt')

// Substitute English operator keywords for their German spellings outside string literals and quoted names.
// `@From` is handled first because it is the one keyword whose first character is not a letter.
def localizeGerman = { String english, Map<String, String> keywords, Set<String> used ->
    def out = new StringBuilder(english.length())
    int position = 0
    boolean quoted = false
    boolean pathQuoted = false
    while (position < english.length()) {
        char current = english.charAt(position)
        if (current == '"' as char && !pathQuoted) {
            quoted = !quoted
            out.append(current)
            position++
        } else if (current == '\'' as char && !quoted) {
            pathQuoted = !pathQuoted
            out.append(current)
            position++
        } else if (!quoted && !pathQuoted && english.startsWith('@From', position)) {
            out.append('@Von')
            used.add('@From')
            position += '@From'.length()
        } else if (!quoted && !pathQuoted && (Character.isLetter(current) || current == '_' as char)) {
            int end = position + 1
            while (end < english.length() &&
                    (Character.isLetterOrDigit(english.charAt(end)) || english.charAt(end) == '_' as char)) {
                end++
            }
            def word = english.substring(position, end)
            def german = keywords[word]
            if (german != null) {
                used.add(word)
            }
            out.append(german ?: word)
            position = end
        } else {
            out.append(current)
            position++
        }
    }
    return out.toString()
}

def renderConditionCorpus = { File catalog ->
    def operators = new groovy.json.JsonSlurper().parse(catalog).operators
    def literal = { value -> groovy.json.JsonOutput.toJson(value).replace('$', '\\$') }
    def keywords = [:]
    operators.each { op ->
        def english = op.keywords?.en
        def german = op.keywords?.de
        if (english && german && english ==~ /^[A-Za-z_][A-Za-z0-9_]*$/) {
            keywords[english] = german
        }
    }
    keywords['RuleGroup'] = 'RegelKontext'
    def used = [] as Set
    def rows = { String member, Closure<String> pick ->
        operators.findResults { op ->
            def text = pick(op)
            text ? [id: op.id, member: member, en: text, de: localizeGerman(text, keywords, used)] : null
        }
    }
    def conditions = rows('validExample', { it.validExample?.dsl }) +
            rows('invalidExample', { it.invalidExample?.dsl })
    def operations = rows('computationExample', { it.computationExample?.operation })
    def render = { List entries ->
        entries.collect {
            "        Corpus(${literal(it.id + ':' + it.member)}, ${literal(it.en)}, ${literal(it.de)}),"
        }.join('\n')
    }
    def unused = (keywords.keySet() - used).sort()
    return """package io.github.mbackschat.a12.dm.consistency

/**
 * GENERATED by `:consistency:generateConditionCorpus` from `rulekit/src/main/resources/catalog/operators.json`.
 *
 * Every text is one the real Kernel accepts: the catalog's examples are executed against it in CI. That is
 * what makes this an over-rejection gate — a syntax family reporting anything here is refusing a condition
 * A12 admits. `invalidExample` texts are included deliberately: they are grammatically valid and fail on
 * MEANING, so they belong in the accept population despite the name.
 *
 * @param de the English text with its operator keywords localized. `ConditionCorpusTest` holds the pair to
 *     the same token shape, which is what keeps a build-time substitution from silently corrupting a text.
 */
internal data class Corpus(val id: String, val en: String, val de: String)

internal object ConditionCorpus {
    /** Rule conditions — the `validExample` and `invalidExample` texts. */
    fun conditions(): List<Corpus> = listOf(
${render(conditions)}
    )

    /** Computation operations, which A12 parses with the expression entry rather than the condition one. */
    fun operations(): List<Corpus> = listOf(
${render(operations)}
    )

    /** Bilingual keyword pairs no example exercises, so the German arm cannot silently cover nothing. */
    fun keywordsNoExampleLocalizes(): List<String> = listOf(${unused.collect(literal).join(', ')})
}
"""
}

def generateConditionCorpus = tasks.register('generateConditionCorpus') {
    description = 'Embeds the rulekit catalog\'s DSL examples, English and localized, for common tests.'
    inputs.file(catalogFile)
    outputs.file(generatedCorpus)
    doLast {
        generatedCorpus.parentFile.mkdirs()
        generatedCorpus.text = renderConditionCorpus(catalogFile)
    }
}
kotlin.sourceSets.commonTest.kotlin.srcDir(generatedCorpusDir)
tasks.named('compileTestKotlinJvm') { dependsOn generateConditionCorpus }
tasks.named('compileTestKotlinJs') { dependsOn generateConditionCorpus }

// ─────────────────────────────────────────────────────────────────────────────────────────────────────────
// The checker names its own build, so a consumer's receipt can cite the artifact it RESOLVED.
//
// dmtool's `model check --engine=portable` publishes which engine answered and which build of it. A constant
// on dmtool's side cannot carry that claim: it would state dmtool's expectation, and a dmtool linked against
// a different checker build would report the wrong one with no way to notice. So the identity is baked into
// THIS artifact from this module's own Gradle version — resolve a different checker and the reported version
// moves with it (PORTABLE-CONSISTENCY-IMPLEMENTATION-PLAN.md "F1 record").
//
// Generated rather than committed, like the workspace matrix and the condition corpus: derived from
// `project.version` on every build, so it cannot drift from the artifact it describes and needs no diff
// guard. A compiled constant rather than a jar-manifest attribute on purpose — the manifest is absent when
// the classes come from a directory rather than a jar (measured: the built `consistency-jvm` jar carries only
// `Manifest-Version`), and a version that silently reads null would make the receipt lie.
def generatedIdentityDir = layout.buildDirectory.dir('generated/checkerIdentity/commonMain/kotlin').get().asFile
def generatedIdentity = new File(generatedIdentityDir,
        'io/github/mbackschat/a12/dm/consistency/CheckerIdentity.kt')

def renderCheckerIdentity = { String version ->
    """\
// GENERATED from this module's Gradle version by :consistency:generateCheckerIdentity — never hand-edited.
package io.github.mbackschat.a12.dm.consistency

/**
 * The version of THIS checker build, baked in at build time from the module's own Gradle version.
 *
 * It exists so a consumer can name the checker artifact it actually resolved instead of a constant of its
 * own. `dmtool model check --engine=portable` publishes it as the portable engine's version, which is what
 * makes that receipt a statement about the resolved artifact rather than about dmtool's expectations.
 */
public const val CHECKER_VERSION: String = "${version}"
"""
}

def generateCheckerIdentity = tasks.register('generateCheckerIdentity') {
    description = "Bakes this module's Gradle version into the checker, so a consumer receipt can cite it."
    inputs.property('version', providers.provider { project.version.toString() })
    outputs.file(generatedIdentity)
    doLast {
        generatedIdentity.parentFile.mkdirs()
        generatedIdentity.text = renderCheckerIdentity(project.version.toString())
    }
}

kotlin.sourceSets.commonMain.kotlin.srcDir(generatedIdentityDir)
tasks.matching { it.name.startsWith('compileKotlin') || it.name.startsWith('compileCommonMainKotlinMetadata') }
        .configureEach { dependsOn generateCheckerIdentity }

// ─────────────────────────────────────────────────────────────────────────────────────────────────────────
// The Node consumer test: the first end-to-end proof that the checker is CONSUMABLE, not only correct.
//
// Everything else in this module tests the checker from inside Kotlin, where the code under test is on the
// compile classpath by construction. That says nothing about whether a Node developer can install and call
// it — and the two failed independently here: the JS target compiled green for the module's whole life while
// emitting nothing importable, because `binaries.library()` was missing. A test that imported a relative
// path into `build/` would not have caught it either. So this packs a real npm tarball, installs it into a
// fresh project, and imports BY PACKAGE NAME, which is the only arrangement that exercises the resolution a
// consumer actually performs.
//
// It is deliberately NOT on `check`, matching `:interpreter`'s own consumer tests: it needs node and npm,
// and a JVM lane that silently requires them would fail on machines where the rest of the build is fine.
// Run it by name. It never reaches the network — the packed package declares no runtime dependency, and the
// consumer project declares none either, so `npm install <tarball>` resolves entirely from disk.
def nodeConsumerSourceDir = file('consumer-tests/node')
def nodeConsumerBuildDir = layout.buildDirectory.dir('consumer-tests/node')
// The consumer cases BOTH packaged arms run, staged as a SIBLING of each arm so the relative import a
// committed file carries (`../shared/cases.ts`) means the same thing in the source tree and in the staged
// copy. Staging it inside one arm instead would make the committed path correct only after a copy.
def sharedConsumerSourceDir = file('consumer-tests/shared')
def sharedConsumerBuildDir = layout.buildDirectory.dir('consumer-tests/shared')
def consistencyNpmPackDir = layout.buildDirectory.dir('consumer-tests/pack')

// node, npm and pnpm are commonly installed per-user (nvm, or nvm's bundled corepack) rather than on the
// system PATH, so a bare `commandLine 'npm'` fails on a machine where Node is present and merely not
// exported. This resolves the executable once and fails with what to do about it, instead of a bare
// "command not found" from Exec.
def resolveNodeToolDir = { String tool ->
    def onPath = System.getenv('PATH')?.split(File.pathSeparator)?.find { new File(it, tool).canExecute() }
    if (onPath) {
        return new File(onPath)
    }
    def nvm = new File(System.getProperty('user.home'), '.nvm/versions/node')
    def newest = nvm.isDirectory() ? nvm.listFiles()?.findAll { new File(it, "bin/$tool").canExecute() }
            ?.toSorted { a, b -> a.name <=> b.name }?.last() : null
    if (newest) {
        return new File(newest, 'bin')
    }
    throw new GradleException("node and $tool are required for the consumer test and were found neither on " +
            'PATH nor under ~/.nvm/versions/node — install Node, or export its bin directory on PATH.')
}
def resolveNodeTool = { String tool -> new File(resolveNodeToolDir(tool), tool) }

// ─────────────────────────────────────────────────────────────────────────────────────────────────────────
// What SHIPS, staged deliberately rather than packed where the compiler happened to write it.
//
// Packing Kotlin's `productionLibrary` directory directly shipped whatever that directory contained, which
// is how the published package carried a `devDependencies: {typescript}` entry and NO licence at all — no
// `license` field and no LICENSE file, in an MIT project. A staged tree makes the shipped set a decision with
// an owner, and `verifyConsistencyShippedFiles` then closes the denominator over it.
//
// `package.json` is hand-written for the same reason `:interpreter`'s is: Kotlin's generated one describes a
// compiler output, where this one is a publication contract — identity, licence, entry points, and the empty
// dependency set H2's "ordinary npm consumption" rests on.
def consistencyNpmStageDir = layout.buildDirectory.dir('consumer-tests/npm-package')
def consistencyJsDistribution = layout.buildDirectory.dir('dist/js/productionLibrary')
def stageConsistencyNpmPackage = tasks.register('stageConsistencyNpmPackage', Sync) {
    group = 'build'
    description = 'Stage exactly what the npm package ships, with a hand-written publication contract.'
    // Both distribution tasks declare the shared productionLibrary directory, and a full build schedules
    // both, so every producer must precede this consumer under Gradle 9. The browser one became a producer
    // when `browser()` was declared (2026-09-17); missing it is a race, not a missing file.
    dependsOn tasks.named('jsNodeProductionLibraryDistribution')
    dependsOn tasks.named('jsBrowserProductionLibraryDistribution')
    from(consistencyJsDistribution) {
        include '*.mjs'
        include '*.mjs.map'
        include 'a12-consistency.d.ts'
    }
    from(file('README.md'))
    from(rootProject.file('LICENSE'))
    into(consistencyNpmStageDir)
    inputs.property('consistencyNpmIdentity', provider { "a12-consistency@${project.version}" })
    doLast {
        def packageJson = [
            name        : 'a12-consistency',
            version     : project.version.toString(),
            description : 'Kernel-free consistency checker for A12 DocumentModel rules and computations.',
            type        : 'module',
            main        : './a12-consistency.mjs',
            types       : './a12-consistency.d.ts',
            exports     : [
                '.': [
                    types  : './a12-consistency.d.ts',
                    import : './a12-consistency.mjs',
                    default: './a12-consistency.mjs',
                ],
            ],
            license     : 'MIT',
            author      : 'Martin Backschat',
            repository  : [type: 'git', url: 'git+https://github.com/mbackschat/a12-dmkits.git'],
            // Empty and asserted empty: H2 promises an ordinary npm install, and a checker that dragged in a
            // runtime dependency would make that a different promise.
            dependencies: [:],
        ]
        consistencyNpmStageDir.get().file('package.json').asFile.text =
                groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(packageJson)) + '\n'
    }
}

def packConsistencyNpmPackage = tasks.register('packConsistencyNpmPackage', Exec) {
    group = 'verification'
    description = 'Pack the staged package into a real npm tarball, as a consumer would receive it.'
    dependsOn stageConsistencyNpmPackage
    workingDir consistencyNpmStageDir
    doFirst {
        consistencyNpmPackDir.get().asFile.mkdirs()
        commandLine resolveNodeTool('npm').absolutePath, 'pack',
                '--pack-destination', consistencyNpmPackDir.get().asFile.absolutePath
    }
    outputs.upToDateWhen { false }
}

/**
 * The one packed tarball, or a refusal — shared, because every consumer of the pack has to agree on WHICH file
 * it got. Two tarballs means a stale one from an earlier version, and each caller would take whichever it named
 * first: a green run against code the current build did not produce.
 */
def resolvePackedConsistencyTarball = {
    def packDir = consistencyNpmPackDir.get().asFile
    def tarballs = packDir.listFiles()?.findAll { it.name.endsWith('.tgz') }
    if (!tarballs) {
        throw new GradleException("npm pack produced no tarball in $packDir")
    }
    if (tarballs.size() > 1) {
        throw new GradleException("several packed tarballs in $packDir: ${tarballs*.name.toSorted()} — " +
                'delete the directory and re-run')
    }
    return tarballs.first()
}

// The checker's delivery bar, ratified per-number by the owner on 2026-09-16 through IF137's six points
// (docs/PORTABLE-CONSISTENCY-IMPLEMENTATION-PLAN.md "H5 — the calibration ordering was overtaken by events").
// A byte count is the one checker quantity that can carry an ABSOLUTE bar, because it is machine-independent:
// unlike a latency it means the same thing on every runner, and re-packing the same revision is bit-identical
// (measured 2026-09-16, same sha256 across two packs). What it certifies is BOUNDED GROWTH, not smallness —
// the ceiling was set from the measured 634 443 bytes, so it says "not 1.65x bigger without a decision" and
// never "small enough". The cross-revision comparison stays informative and stays in its collector
// (scripts/interpreter-delivery-footprint.init.gradle); this is the bar, and it lives where the bytes are made.
def consistencyDeliveryCeilingBytes = 1_048_576L

tasks.register('verifyConsistencyDeliveryCeiling') {
    group = 'verification'
    description = 'Refuse a packed checker above the ratified 1 MiB ceiling — the only absolute checker bar.'
    dependsOn packConsistencyNpmPackage
    outputs.upToDateWhen { false }
    doLast {
        def tarball = resolvePackedConsistencyTarball()
        def bytes = tarball.length()
        logger.lifecycle(String.format(Locale.ROOT,
                '[checker-delivery] %s is %d bytes against a %d ceiling (%.2fx headroom)',
                tarball.name, bytes, consistencyDeliveryCeilingBytes,
                consistencyDeliveryCeilingBytes / (double) bytes))
        if (bytes > consistencyDeliveryCeilingBytes) {
            throw new GradleException("the packed checker is $bytes bytes, above the ratified " +
                    "$consistencyDeliveryCeilingBytes-byte delivery ceiling. A release bar is not raised to " +
                    'fit: find what entered the published package (`npm pack --dry-run` under ' +
                    'consistency/build/dist/js/productionLibrary lists every entry with its size), or take the ' +
                    "new number through IF137's six points if the growth is worth ratifying.")
        }
    }
}

/**
 * F1-c: the identity a consumer INSTALLS must be the identity the checker REPORTS — on both packagings.
 *
 * `CheckerIdentityTest` asserts the baked constant is a plausible version and says plainly that a test inside
 * the artifact cannot establish this — a constant agrees with itself. The failure this catches lives BETWEEN
 * build outputs, so every value it compares is read out of one: the npm name and version out of the packaged
 * `package.json` (written by the Kotlin/JS plugin), the version a JVM consumer resolves out of the jvm jar's
 * own file name, and `CHECKER_VERSION` out of that jar's compiled class by reflection. Reading the GENERATED
 * SOURCE instead would have been one step short of the artifact, which is the distinction that has already
 * cost this project a wrong claim — a catalog fact was committed and asserted as discoverable while the
 * launcher still served the old one.
 *
 * <p>What it therefore establishes, stated narrowly: all three projections of this module's Gradle version
 * still agree. It cannot say the version is the RIGHT one — no build-time oracle can — but a consumer who
 * installs `a12-consistency@X` and reads a receipt citing `Y` has one published id meaning two byte
 * contracts, which is the class the estate's release rule forbids, and that is what diverging projections
 * produce.
 *
 * <p>The NAME is pinned rather than derived for the same reason: it is what consumers depend on, so it may
 * not change as a side effect of a module rename.
 */
tasks.register('verifyCheckerArtifactIdentity') {
    group = 'verification'
    description = 'Refuse a published checker whose npm identity disagrees with the version baked into it.'
    dependsOn 'jsNodeProductionLibraryDistribution', 'jvmJar'
    outputs.upToDateWhen { false }
    def jvmArtifact = tasks.named('jvmJar').flatMap { it.archiveFile }
    doLast {
        def manifest = layout.buildDirectory.file('dist/js/productionLibrary/package.json').get().asFile
        if (!manifest.file) {
            throw new GradleException("no packaged manifest at $manifest — the JS distribution did not run")
        }
        def published = new groovy.json.JsonSlurper().parse(manifest)
        def jar = jvmArtifact.get().asFile
        // The version a JVM consumer RESOLVES, taken from the coordinate rather than from the project: this is
        // the file `:cli`'s `project(':consistency')` edge puts on its classpath, and its name is the coordinate.
        def resolved = (jar.name =~ /^consistency-jvm-(.+)\.jar$/)
        if (!resolved.find()) {
            throw new GradleException("the jvm artifact is named `$jar.name`, which no longer carries its " +
                    'version where this check reads it. A renamed artifact is a coordinate change.')
        }
        def resolvedVersion = resolved.group(1)
        // The constant as it exists IN that artifact, by reflection. The platform loader suffices — a file
        // holding one `const val` compiles to a static final with a ConstantValue attribute and needs no
        // Kotlin runtime to read, so this loads the shipped class without putting the build on its classpath.
        def bakedVersion = new URLClassLoader([jar.toURI().toURL()] as URL[], ClassLoader.platformClassLoader)
                .withCloseable { loader ->
                    loader.loadClass('io.github.mbackschat.a12.dm.consistency.CheckerIdentityKt')
                            .getField('CHECKER_VERSION').get(null)
                }
        logger.lifecycle("[checker-identity] ${published.name}@${published.version} · " +
                "$jar.name · CHECKER_VERSION $bakedVersion")
        if (published.name != 'a12-consistency') {
            throw new GradleException("the published package name is `${published.name}`, not `a12-consistency`. " +
                    'That name is what consumers depend on; changing it is a release decision, not a rename.')
        }
        if (published.version != bakedVersion) {
            throw new GradleException("the published package is version `${published.version}` while the " +
                    "checker it contains reports `$bakedVersion`. A consumer's receipt would then cite a build " +
                    'they did not install. Both derive from this module\'s Gradle version, so a difference means ' +
                    'one side stopped doing so.')
        }
        if (resolvedVersion != bakedVersion) {
            throw new GradleException("the jvm artifact resolves as version `$resolvedVersion` while the " +
                    "checker inside it reports `$bakedVersion`, so dmtool's portable-engine receipt would name " +
                    'a build other than the one on its classpath.')
        }
    }
}

// ─────────────────────────────────────────────────────────────────────────────────────────────────────────
// The shipped-file provenance enumeration — a CLOSED denominator over both published carriers.
//
// F's oracle for "standalone checking is interpreter-independent" asks for this by name, with the reason a
// closure guard cannot supply it: *"plus a shipped-file provenance enumeration over the published package —
// sources, type declarations and generated output — failing on any file the interpreter owns, because a
// copied file carries no dependency edge for a closure guard to see"*. `verifyConsistencyPurity` reads what
// classes LINK and `verifyConsistencyDependencies` reads what a consumer RESOLVES; neither can see a file
// that was copied in, because a copy declares nothing.
//
// So the test is CLOSED, not a required-set: every entry must be accounted for, and an unrecognised one is a
// failure. A required-set check answers "is what I expect present", which stays green while something else
// rides along — the shape `verifyInterpreterNpmPackage` has, which is why it is not the guard to copy.
// (`verifyInterpreterNpmPublication` IS closed, by exact text equality against committed
// `api/{npm,maven}-package-files.txt` manifests; measured 2026-09-17. Two instruments, two shapes, and the
// closed one is the one worth having.)
//
// Two carriers, because a claim measured on one is not measured on the other: the npm tarball a JS consumer
// installs, and the jvm jar a Maven consumer resolves. The jar is enumerated by PACKAGE rather than by file,
// since a class file per declaration is not a decision anyone makes.
def verifyConsistencyShippedFiles = tasks.register('verifyConsistencyShippedFiles') {
    group = 'verification'
    description = 'Close the denominator on every file the checker publishes, in both carriers.'
    dependsOn packConsistencyNpmPackage
    dependsOn tasks.named('jvmJar')
    outputs.upToDateWhen { false }
    doLast {
        // Kotlin's JS linker names a module file after the Gradle module it came from, so the OWNERS of the
        // shipped .mjs set are readable from the names. Anything else is a file nobody decided to ship.
        def permittedJsModules = [
            'a12-consistency',                                      // this module
            'a12-dmkits-predicates',                                // the one intra-repo edge (plan row 5a)
            'kotlin-kotlin-stdlib',                                 // Kotlin/JS runtime
            'kotlin_org_jetbrains_kotlin_kotlin_dom_api_compat',     // arrived with browser() on 2026-09-17
            'kotlinx-serialization-kotlinx-serialization-core',
            'kotlinx-serialization-kotlinx-serialization-json',
        ]
        def permittedOther = ['package/package.json', 'package/README.md', 'package/LICENSE',
                              'package/a12-consistency.d.ts'] as Set
        def tarball = resolvePackedConsistencyTarball()
        def archive = tarTree(tarball)
        def entries = [] as Set
        archive.visit { details ->
            if (!details.directory) {
                entries += details.relativePath.pathString
            }
        }
        def permittedEntries = permittedOther + permittedJsModules.collectMany {
            ["package/${it}.mjs".toString(), "package/${it}.mjs.map".toString()]
        }
        // The named claim goes FIRST, and the order is the whole reason it is reachable: the closed
        // enumeration below already refuses any interpreter-owned file, since no interpreter name is
        // permitted, so this check would be dead code behind it and would advertise an invariant nothing
        // could ever enforce. Ahead of it, it earns its place by naming WHICH invariant broke.
        def interpreterOwned = entries.findAll { it.toLowerCase().contains('interpreter') }
        if (interpreterOwned) {
            throw new GradleException("the published npm package ships interpreter-owned file(s) " +
                    "${interpreterOwned.toSorted()}. NFR #1 is that checking is interpreter-independent, and " +
                    'a copied file carries no dependency edge for a closure guard to see.')
        }
        def unaccounted = (entries - permittedEntries).toSorted()
        if (unaccounted) {
            throw new GradleException("the published npm package ships ${unaccounted}, which nothing in " +
                    'consistency/build.gradle decided to ship. Add it to the permitted set with its owner, ' +
                    'or stop staging it — a file with no owner is how a copied source arrives with no ' +
                    'dependency edge to detect it.')
        }
        def absent = (permittedEntries - entries).toSorted()
        if (absent) {
            throw new GradleException("the published npm package is missing ${absent}; the permitted set is " +
                    'the shipped set, so an entry listed there and not packed means the staging changed.')
        }

        // The publication contract, on the packed bytes rather than on the staging source: identity, licence
        // and the empty dependency set H2's "ordinary npm consumption" rests on. A `devDependencies` entry
        // shipped here for the module's whole life, which is what a closed enumeration over metadata catches.
        def packaged = new groovy.json.JsonSlurper().parse(
                archive.matching { include 'package/package.json' }.singleFile)
        if (packaged.license != 'MIT') {
            throw new GradleException("the published npm package declares license=${packaged.license}; an " +
                    'MIT project that publishes without one leaves a consumer unable to tell.')
        }
        if (packaged.dependencies != [:] || packaged.containsKey('devDependencies')) {
            throw new GradleException("unexpected npm dependency contract: dependencies=" +
                    "${packaged.dependencies} devDependencies=${packaged.devDependencies}")
        }
        if (packaged.types != './a12-consistency.d.ts' || packaged.main != './a12-consistency.mjs') {
            throw new GradleException("the published entry points moved: main=${packaged.main} " +
                    "types=${packaged.types}; a TypeScript consumer resolves both.")
        }

        // The jvm carrier, enumerated by package ROOT rather than by package: a subpackage of our own root is
        // ours by construction, where a package outside it is a shaded or copied dependency — which is the
        // thing with no POM entry for a resolution guard to find. `:predicates` publishes its own jar, so the
        // shared leaf is deliberately NOT expected here, and its arrival would be a bundling change.
        def permittedJarRoots = ['io/github/mbackschat/a12/dm/consistency/']
        def jar = tasks.named('jvmJar').get().archiveFile.get().asFile
        def jarPackages = [] as Set
        new java.util.zip.ZipFile(jar).withCloseable { zip ->
            zip.entries().each { entry ->
                if (!entry.directory && entry.name.endsWith('.class')) {
                    jarPackages += entry.name.substring(0, entry.name.lastIndexOf('/')) + '/'
                }
            }
        }
        def unaccountedPackages = jarPackages.findAll { pkg ->
            !permittedJarRoots.any { pkg.startsWith(it) }
        }.toSorted()
        if (unaccountedPackages) {
            throw new GradleException("the published jvm jar carries class package(s) " +
                    "${unaccountedPackages} outside ${permittedJarRoots}. A shaded or copied dependency " +
                    'arrives exactly this way, with no POM entry to resolve.')
        }
        if (jarPackages.isEmpty()) {
            throw new GradleException("no classes found in ${jar.name}; an empty denominator would make " +
                    'every absence above vacuous.')
        }
        logger.lifecycle("[shipped-files] npm ${entries.size()} entr(ies) · jvm ${jarPackages.size()} " +
                "package(s) · ${tarball.name}")
    }
}

// F asks for "the same corpus" through Node and browser, so the cases are one file both arms import rather
// than two files nothing compares. Staged by its own task because both arms depend on it and neither owns it.
def prepareSharedConsumerCases = tasks.register('prepareSharedConsumerCases', Sync) {
    group = 'verification'
    description = 'Stage the consumer cases both packaged arms run.'
    from sharedConsumerSourceDir
    into sharedConsumerBuildDir
    outputs.upToDateWhen { false }
}

def prepareNodeConsumer = tasks.register('prepareNodeConsumer', Sync) {
    group = 'verification'
    description = 'Stage a disposable copy of the Node consumer project, with no node_modules carried over.'
    from nodeConsumerSourceDir
    into nodeConsumerBuildDir
    outputs.upToDateWhen { false }
    doFirst {
        // A previous run leaves an installed tree; Sync would otherwise walk it, and a stale package would
        // let the test pass against code the current build did not produce.
        project.delete(nodeConsumerBuildDir)
    }
}

def installPackedConsistencyInNodeConsumer = tasks.register('installPackedConsistencyInNodeConsumer', Exec) {
    group = 'verification'
    description = 'Install the packed tarball into the staged consumer — a clean install, entirely from disk.'
    dependsOn packConsistencyNpmPackage, prepareNodeConsumer
    workingDir nodeConsumerBuildDir
    doFirst {
        commandLine resolveNodeTool('npm').absolutePath, 'install',
                '--no-audit', '--no-fund', resolvePackedConsistencyTarball().absolutePath
    }
    outputs.upToDateWhen { false }
}

tasks.register('nodeConsumerTest', Exec) {
    group = 'verification'
    description = 'Check a model end to end from a plain Node project against the packed npm package.'
    dependsOn installPackedConsistencyInNodeConsumer
    dependsOn prepareSharedConsumerCases
    workingDir nodeConsumerBuildDir
    doFirst {
        commandLine resolveNodeTool('npm').absolutePath, 'test'
    }
    outputs.upToDateWhen { false }
}

// Regenerate the three-arm parity corpus, from the PACKED package rather than from whatever is compiled.
//
// F's oracle for "JS matches JVM" asks for the full report contract compared across Java, packed Node and a
// real browser. That needs one committed answer all three read, and it must be produced by the artifact a
// consumer receives — so this reuses the Node consumer's install and writes into the shared tree. It is a
// SYNC task, never a gate: the gate is that each arm compares against what this wrote, and drift shows up as
// a failing comparison naming the file.
tasks.register('syncCheckerParityCorpus', Exec) {
    group = 'verification'
    description = 'Rewrite the shared three-arm parity corpus from the packed npm package.'
    dependsOn installPackedConsistencyInNodeConsumer
    dependsOn prepareSharedConsumerCases
    workingDir nodeConsumerBuildDir
    doFirst {
        commandLine resolveNodeTool('node').absolutePath, 'write-parity-corpus.mjs',
                sharedConsumerSourceDir.absolutePath
    }
    outputs.upToDateWhen { false }
}

// ─────────────────────────────────────────────────────────────────────────────────────────────────────────
// The BROWSER consumer test: F's third arm, and the one a JVM or Node lane cannot stand in for.
//
// H5 and F name the browser as a target, and F's acceptance asks for the same corpus "through Java, packed
// Node and browser". The first two arms exercise a CommonJS-free ES module under Node's loader; a browser
// adds a bundler, a document, `fetch`, and no `node:*` anything. None of that is observable from the other
// arms, and the module's own `jsBrowserTest` deliberately does not cover it either — Karma would test the
// COMPILER'S OUTPUT, where F's acceptance names the packed tarball (the measurement is on `browser()` above).
//
// So this is the Node arm's shape with a browser's spellings: pack a real tarball, install it into a fresh
// project, import it BY PACKAGE NAME, and run the SHARED cases — then bundle the result with Vite and replay
// it in a real system Chrome. It is not on `check` for the same reason the Node arm is not: it needs node,
// pnpm and a browser.
//
// pnpm rather than npm, matching `:interpreter`'s browser consumer: the dev tools install from a store this
// build owns, so a repeat run resolves from disk, and `pnpm add <tarball>` keeps the packed artifact the only
// thing that is ever installed from a file path.
def browserConsumerSourceDir = file('consumer-tests/browser')
def browserConsumerBuildDir = layout.buildDirectory.dir('consumer-tests/browser')
def browserConsumerStoreDir = layout.buildDirectory.dir('consumer-tests/browser-pnpm-store')

// Executable sources in this project are TypeScript, and the guard exists because the alternative is
// invisible: a stray `.js` beside a `.ts` compiles and runs, and nothing else would ever say which one the
// page loaded. `:interpreter` carries the same guard on its own browser consumer.
def verifyConsistencyBrowserTypeScriptSources = tasks.register('verifyConsistencyBrowserTypeScriptSources') {
    group = 'verification'
    description = 'Reject authored JavaScript in the TypeScript browser consumer.'
    inputs.dir(browserConsumerSourceDir)
            .withPropertyName('browserConsumerSources')
            .withPathSensitivity(org.gradle.api.tasks.PathSensitivity.RELATIVE)
    doLast {
        def authored = fileTree(browserConsumerSourceDir) {
            include '**/*.js'
            include '**/*.mjs'
            // `build/` and `node_modules/` are this project's own OUTPUT when it has been staged and run in
            // place; only authored sources are the subject.
            exclude 'build/**'
            exclude 'node_modules/**'
            exclude 'dist/**'
        }.files.toSorted { left, right -> left.path <=> right.path }
        if (!authored.isEmpty()) {
            def relative = authored.collect {
                browserConsumerSourceDir.toPath().relativize(it.toPath()).toString()
            }.join(', ')
            throw new GradleException("browser consumer executable sources must be TypeScript: $relative")
        }
    }
}

def prepareBrowserConsumer = tasks.register('prepareBrowserConsumer', Sync) {
    group = 'verification'
    description = 'Stage a disposable copy of the browser consumer project, with the shared fixture served.'
    from browserConsumerSourceDir
    // Vite serves `public/` at the site root, and the page fetches `models/storefront.dm.json`. The fixture is
    // copied from the SHARED tree rather than owned here, so the bytes the browser fetches are the bytes the
    // Node arm reads — "the same corpus" covering the input as well as the cases.
    from(new File(sharedConsumerSourceDir, 'models')) {
        into 'public/models'
    }
    // The parity corpus is DATA a browser must fetch, so it is served rather than imported. Same bytes as the
    // Node arm reads off disk, from the same committed tree — which is the whole point of comparing reports
    // across arms at all.
    from(new File(sharedConsumerSourceDir, 'parity')) {
        into 'public/parity'
    }
    into browserConsumerBuildDir
    outputs.upToDateWhen { false }
    doFirst {
        // A previous run leaves node_modules, dist and a build dir; Sync would walk them, and a stale install
        // would let the replay pass against a package this build did not produce.
        project.delete(browserConsumerBuildDir)
    }
}

def installBrowserConsumerDependencies = tasks.register('installBrowserConsumerDependencies', Exec) {
    group = 'verification'
    description = 'Resolve the browser consumer development tools (Vite, tsc, playwright-core).'
    dependsOn prepareBrowserConsumer
    workingDir browserConsumerBuildDir
    doFirst {
        def binDir = resolveNodeToolDir('pnpm')
        // pnpm's nvm/corepack shim is a node script, so node itself must be reachable from the child process.
        environment 'PATH', "${binDir.absolutePath}${File.pathSeparator}${System.getenv('PATH')}"
        commandLine new File(binDir, 'pnpm').absolutePath, 'install',
                '--config.confirmModulesPurge=false',
                '--frozen-lockfile=false',
                '--lockfile=false',
                '--store-dir', browserConsumerStoreDir.get().asFile.absolutePath
    }
    outputs.upToDateWhen { false }
}

def installPackedConsistencyInBrowserConsumer = tasks.register('installPackedConsistencyInBrowserConsumer', Exec) {
    group = 'verification'
    description = 'Install the packed tarball into the staged browser consumer, as a consumer would.'
    dependsOn packConsistencyNpmPackage, installBrowserConsumerDependencies
    workingDir browserConsumerBuildDir
    doFirst {
        def binDir = resolveNodeToolDir('pnpm')
        environment 'PATH', "${binDir.absolutePath}${File.pathSeparator}${System.getenv('PATH')}"
        commandLine new File(binDir, 'pnpm').absolutePath, 'add',
                '--save-exact',
                '--lockfile=false',
                '--store-dir', browserConsumerStoreDir.get().asFile.absolutePath,
                resolvePackedConsistencyTarball().absolutePath
    }
    outputs.upToDateWhen { false }
}

tasks.register('browserConsumerTest', Exec) {
    group = 'verification'
    description = 'Replay the shared consumer cases against the packed npm package in a real Chrome.'
    dependsOn verifyConsistencyBrowserTypeScriptSources
    dependsOn installPackedConsistencyInBrowserConsumer
    dependsOn prepareSharedConsumerCases
    workingDir browserConsumerBuildDir
    doFirst {
        def binDir = resolveNodeToolDir('pnpm')
        environment 'PATH', "${binDir.absolutePath}${File.pathSeparator}${System.getenv('PATH')}"
        commandLine new File(binDir, 'pnpm').absolutePath, 'run', 'verify'
    }
    outputs.upToDateWhen { false }
}
