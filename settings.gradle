// Our plugin repositories are declared FIRST, and that ordering is the point. A machine-global Gradle init
// script appends its own in `settingsEvaluated` — after this file — so ours are tried first and an injected
// private registry degrades to a fallback instead of deciding where our plugins come from. The committed
// `.no-global-gradle-repos` marker removes the injection entirely on a machine whose init script honours it.
// Together: a bare `./gradlew` resolves from public repositories. See docs/BUILD-ENVIRONMENT.md.
// Deliberately NOT mavenLocal(): no plugin here comes from it, and putting a mutable, unchecksummed local
// repository first in the plugin path would change resolution for every contributor and both CI jobs.
pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'a12-dmkits'

// The per-kit module cut (kernel-decoupling Stage 4, KERNEL-DECOUPLING-PROPOSAL §3a). Root's single source
// set split into four published, kernel-free kit modules — `core` (dm.core), `rulekit` (the dm.rulekit.*
// SCC + the operator catalog resource), `modelkit` (dm.modelkit), `edit` (dm.edit, the cross-kit top layer
// depending on BOTH siblings). Layering: core ← {rulekit, modelkit} ← edit. PACKAGES NEVER RENAMED — only
// files moved — so every FQCN test filter, the SEMANTICS-MAP simple-name cites, and reflection metadata are
// stable. Root `:` is now a pure aggregator + the cross-kit integration-test host (its src/test is unmoved;
// the tests span all four kits, so they run at root with testImplementation on the kits + :adapter oracle).
include 'core'
include 'rulekit'
include 'modelkit'
include 'edit'

// The `dm.modelkit ⊥ dm.rulekit` sibling boundary is now a BUILD-GRAPH fact (neither module depends on the
// other) — the strongest form, so the old import-sweep `SiblingBoundaryTest` graduated (retired). modelkit
// uses `dm.core`; the kernel lives behind the SPI ports (:adapter), never in a kit.

// The kernel-adapter (PROJECT-DESIGN D15/N8): an opt-in, Java-only module that consumes the kernel's
// a12internal *read* surface (parser/formatter/meta) — never part of the shipped, polyglot core.
// Build it with `:adapter:test`; `:test` keeps core free of the internal tier.
include 'adapter'

// The standalone CLI (PROJECT-DESIGN N10, docs/CLI-SPEC.md): the modeller/BA front-end — verbs + JSON I/O
// over the engine. `application` plugin so dev runs go through `:cli:run`/`:cli:installDist` (no
// jlink/jpackage in the inner loop). Depends on core now; +adapter when read/explain verbs land.
include 'cli'

// The :interpreter module (docs/INTERPRETER-SPEC.md): the kernel-free, native-safe runtime evaluator —
// Kotlin Multiplatform (jvm + js), the publishable standalone artifact + the native image's runtime engine.
include 'interpreter'

// The :interpreter-bridge module (KERNEL-DECOUPLING-PROPOSAL ruling 6): the kernel-free ConditionReadBack
// provider. The one module depending on both :rulekit and :interpreter — it maps the interpreter's AST onto
// rulekit's typed Condition, which is what lets rulekit's own checks run with no kernel present.
include 'interpreter-bridge'

// The :schemakit module (docs/SCHEMAKIT-SPEC.md): JSON Schema ⇄ Document Model import/export. JVM/Java,
// native-safe. Depends on root `:` (public-kernel-only) + later :interpreter — and MUST NOT touch the
// kernel beyond kernel-md-facade (owner constraint; held by verifySchemakitPurity over its compiled classes
// and by the root verifyPublishedClasspathsAreKernelFree over what its POM resolves). Spike under `.spike`.
include 'schemakit'
// The :consistency module (docs/PORTABLE-CONSISTENCY-PROPOSAL.md): the standalone Kernel-free consistency
// checker for rules and computations — Kotlin Multiplatform (jvm + js), the package published to
// TypeScript/Node consumers. Depends on neither the kernel (H1) nor :interpreter (NFR #1); its Kernel
// differentials live in :adapter so its own test source sets stay Kernel-free.
include 'consistency'

// The shared-predicate LEAF (PORTABLE-CONSISTENCY-IMPLEMENTATION-PLAN row 5a): one A12 law, one live
// statement, reachable from BOTH the Java kits and the multiplatform checker. It exists because those two
// could otherwise only share a law by restating it — the reserved-namespace law had three copies and had
// already drifted. Kotlin Multiplatform and dependency-free by contract; `verifyPredicatesPurity` fails on
// any resolved dependency at all, because a leaf that grows one stops being a leaf.
include 'predicates'


// The :consistency-gate module (PORTABLE-CONSISTENCY-PROPOSAL §7 F3): the integration façade that lets a
// published-dmkits caller ask the Kernel-free checker for a verdict in the shape it already consumes. It sits
// BESIDE both products rather than inside either, for :interpreter-bridge's reason — the `api project(…)`
// edge that folds an integration into a core's published POM works equally well in reverse, and §1 forbids
// exactly that for this façade. Kernel-free, held by its own verifyConsistencyGatePurity.
include 'consistency-gate'
