rootProject.name = 'a12-rulekit'

// The kernel-adapter (proposal D15/N8): an opt-in, Java-only module that consumes the kernel's
// a12internal *read* surface (parser/formatter/meta) — never part of the shipped, polyglot core.
// Build it with `:adapter:test`; `:test` keeps core free of the internal tier.
include 'adapter'

// The standalone CLI (proposal N10, docs/CLI-SPEC.md): the modeller/BA front-end — verbs + JSON I/O
// over the engine. `application` plugin so dev runs go through `:cli:run`/`:cli:installDist` (no
// jlink/jpackage in the inner loop). Depends on core now; +adapter when ingest/explain verbs land.
include 'cli'
