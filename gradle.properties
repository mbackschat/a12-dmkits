# The isolated Gradle home is shared by sibling checkouts and worktrees; reuse relocatable task outputs.
org.gradle.caching=true

# Cold dual-runtime + adapter compilation exceeds the Kotlin daemon's 512 MiB default.
kotlin.daemon.jvmargs=-Xmx1536m

# Kotlin INCREMENTAL compilation is off, and it costs nothing here — measured 2026-09-04, one-file edit,
# --no-build-cache, same edit both ways: `:adapter:testClasses` 16.15 s incremental against 12.87 s without,
# `:interpreter:compileKotlinJvm` 6.74 s against 5.75 s. The bookkeeping over 493 Kotlin sources is not free,
# and neither module is large enough for it to pay back.
#
# What it buys: every instance of the output-snapshot race in docs/BUILD-ENVIRONMENT.md passes through the
# incremental machinery — the classpath-snapshot directory, stale-output deletion, or the IC fallback — and
# clean or non-incremental compiles have never failed. This does not PROVE the race is gone: it is
# intermittent, so no run count available here settles it. It removes the machinery every observed failure
# went through, at negative cost.
#
# RE-OPEN on the next Kotlin or Gradle bump: re-run the pair above. If incremental wins by a margin that
# matters, and the race has not recurred, take the setting out.
kotlin.incremental=false
