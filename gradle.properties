# The isolated Gradle home is shared by sibling checkouts and worktrees; reuse relocatable task outputs.
org.gradle.caching=true

# Cold dual-runtime + adapter compilation exceeds the Kotlin daemon's 512 MiB default.
kotlin.daemon.jvmargs=-Xmx1536m

# The Node major the checker's PERFORMANCE lanes are pinned to (H5's per-number gate point 2, a pinned runtime).
# It lives here rather than in either consumer because BOTH must agree: the Gradle task resolves this major and
# `NodeIdentity` refuses anything else, so a single value is what keeps the pin from being unfalsifiably green —
# a task resolving one runtime while the lane demanded another would pass on a runtime nobody chose. 24 is not a
# number chosen here: `.github/workflows/ci.yml` provisions `node-version: '24.20.0'`, so this is the line the
# project's own CI already runs its JS lanes on, and it is also the line the TypeScript tooling contract needs
# (syntax supported by native type stripping, stable from Node 24).
# Functional consumer tasks deliberately do NOT read this and still take the newest installed Node, so a LOCAL
# functional run can exercise a newer major than CI does. That divergence is recorded as a gap rather than
# closed here; it is also what makes this pin load-bearing, since the machine that measured H5-f had Node 26
# installed and unpinned resolution would have timed it.
checkerNodeMajor=24
